function overviewKeyFigures(res, tt, badge){
  const avg = res.length ? Math.round(res.reduce((s,r)=>s+(r.total? r.score/r.total:0),0)/res.length*100) : null;
  const ttAcc = badge.avgAccuracy;
  const last = [...res.map(r=>r.submittedAt?.seconds||0), ...tt.map(a=>a.submittedAt?.seconds||0)].sort((a,b)=>b-a)[0]||0;
  const days = last ? Math.floor((Date.now()/1000-last)/86400) : null;
  return [
    { label:'Sets completed', num:String(res.length), sub:'' },
    { label:'Average score', num: avg==null?'—':avg+'%', sub:'across all sets' },
    { label:'Times tables', num:String(tt.length), sub:'sessions' },
    { label:'Timed accuracy', num: badge.total? ttAcc+'%' : '—', sub:'challenges only' },
    { label:'Last active', num: days==null?'—':(days<1?'Today':days===1?'Yesterday':days+'d'), sub: days==null?'never':'ago' },
  ];
}

function renderOverviewProfile(uid){
  const p=S.profiles[uid]||{};
  const name=p.displayName||uid;
  const first=String(name).split(/\s+/)[0];
  const res=(S.results||[]).filter(r=>r.uid===uid);
  const tt=(S.ttAttempts||[]).filter(a=>a.uid===uid);
  const badge=computeBadgeInfo(tt,p);
  const stats=computeSkillStats(res, S.weeks, (S.allSkillPracticeRecords||[]).filter(r=>r.uid===uid));
  const {strengths, weaknesses}=pickStrengthsAndWeaknesses(stats);
  const ttIns=computeTTInsights(tt);
  const wrap=el('<div></div>');

  wrap.appendChild(el(`<h3 style="margin:10px 0 2px;">${esc(name)}</h3>
    <div class="meta">Year ${studentYear(p)}${p.group? ' · '+esc(groupLabel(p.group)):''} · Times-tables rank: ${esc(badge.tier.label)}${badge.pinnedBy? ' (pinned)':''}</div>`));

  const figs=el('<div class="mmc-ov-figs"></div>');
  overviewKeyFigures(res,tt,badge).forEach(f=>figs.appendChild(el(
    `<div class="mmc-ov-fig"><div class="mmc-ov-figlabel">${esc(f.label)}</div><div class="mmc-ov-fignum">${esc(f.num)}</div><div class="mmc-ov-figsub">${esc(f.sub)}</div></div>`)));
  wrap.appendChild(figs);

  // Suggested focus first — it is the reason a teacher opened this page.
  wrap.appendChild(el('<div class="mmc-ov-h">Suggested focus</div>'));
  const actions=[];
  weaknesses.slice(0,2).forEach(w=>actions.push(
    `${first} is at ${Math.round(w.overallAccuracy*100)}% on ${w.title.toLowerCase()} across ${w.total} question${w.total===1?'':'s'}. Set a targeted practice session, or hold that question back next set and teach it first.`));
  ttIns.items.slice(0,1).forEach(it=>actions.push(ttInsightSentence(first,it)+
    (it.kind==='turnaround'? '' : ` They can drill this under "Pick your own" on the Training Ground.`)));
  if(!res.length && !tt.length) actions.push(`${first} has not completed anything yet — check they can sign in.`);
  if(!actions.length) actions.push(`Nothing is standing out for ${first} at the moment. Working solidly across the board.`);
  actions.forEach(a=>wrap.appendChild(el(`<div class="mmc-ov-action">${esc(a)}</div>`)));

  const cols=el('<div class="mmc-ov-cols"></div>');
  const mkList=(title, rows, emptyMsg)=>{
    const box=el('<div></div>');
    box.appendChild(el(`<div class="mmc-ov-h" style="margin-top:14px;">${esc(title)}</div>`));
    if(!rows.length){ box.appendChild(el(`<div class="meta">${esc(emptyMsg)}</div>`)); return box; }
    const t=el('<table class="mmc-ov-list"><tbody></tbody></table>');
    rows.forEach(r=>t.querySelector('tbody').appendChild(el(
      `<tr><td>${esc(r.title)}</td><td>${esc(r.right)}</td></tr>`)));
    box.appendChild(t); return box;
  };
  cols.appendChild(mkList('Strengths',
    strengths.map(x=>({title:x.title, right:Math.round(x.overallAccuracy*100)+'% of '+x.total})),
    'No clear strengths yet — needs a longer track record.'));
  cols.appendChild(mkList('Growth areas',
    weaknesses.map(x=>({title:x.title, right:Math.round(x.overallAccuracy*100)+'% of '+x.total})),
    'Nothing flagged.'));
  wrap.appendChild(cols);

  wrap.appendChild(el('<div class="mmc-ov-h">Times tables</div>'));
  const bestOf=(lvl)=>{ const at=tt.filter(a=>a.level===lvl); if(!at.length) return '—';
    const b=at.reduce((x,a)=>a.score>x.score?a:x, at[0]); return `${b.score}/${b.attempted} (${b.accuracy}%)`; };
  const ttT=el('<table class="mmc-ov-list"><tbody></tbody></table>');
  [['Best Easy',bestOf('easy')],['Best Medium',bestOf('medium')],['Best Hard',bestOf('hard')],
   ['Sessions',String(tt.length)],['Timed accuracy', badge.total? badge.avgAccuracy+'%':'—']]
   .forEach(([a,b])=>ttT.querySelector('tbody').appendChild(el(`<tr><td>${esc(a)}</td><td>${esc(b)}</td></tr>`)));
  wrap.appendChild(ttT);
  if(ttIns.items.length){
    const t2=el('<table class="mmc-ov-list" style="margin-top:8px;"><tbody></tbody></table>');
    ttIns.items.forEach(it=>t2.querySelector('tbody').appendChild(el(
      `<tr><td>${esc(it.kind==='turnaround'?'Turnarounds':it.kind==='wrong'?'Needs work':'Accurate but slow')}</td><td>${esc(ttInsightShort(it))}</td></tr>`)));
    wrap.appendChild(t2);
  }

  wrap.appendChild(el('<div class="mmc-ov-h">Recent activity</div>'));
  const feed=[]
    .concat(res.map(r=>({t:r.submittedAt?.seconds||0, what:(r.weekLabel||'Practice set'), detail:`${r.score}/${r.total}`})))
    .concat(tt.map(a=>({t:a.submittedAt?.seconds||0, what:`Times tables · ${a.level==='custom'?(a.customLabel||'custom'):a.level}${a.mode==='practice'?' (practice)':''}`, detail:`${a.score}/${a.attempted}`})))
    .sort((a,b)=>b.t-a.t).slice(0,8);
  if(!feed.length) wrap.appendChild(el('<div class="meta">Nothing recorded yet.</div>'));
  else {
    const ft=el('<table class="mmc-ov-list"><tbody></tbody></table>');
    feed.forEach(f=>ft.querySelector('tbody').appendChild(el(
      `<tr><td>${esc(f.what)}<span class="meta"> · ${f.t? new Date(f.t*1000).toLocaleDateString():'—'}</span></td><td>${esc(f.detail)}</td></tr>`)));
    wrap.appendChild(ft);
  }
  return wrap;
}

function renderTeacherActivity(){
  const wrap=el('<div></div>');
  const head=el('<div class="mmc-row" style="justify-content:flex-end;margin-bottom:12px;"></div>');
  head.appendChild(renderClassPicker());
  wrap.appendChild(head);
  const uids = classFilteredStudentUids();
  const inClass = (u)=>uids.indexOf(u)!==-1;
  const secs = (r)=> (r && r.submittedAt && r.submittedAt.seconds) ? r.submittedAt.seconds : 0;

  const feed = []
    .concat((S.ttAttempts||[]).filter(a=>inClass(a.uid)).map(a=>({
      uid:a.uid, t:secs(a), kind:'Times tables',
      detail:`${esc(a.level||'')} · ${a.score}/${a.attempted} · ${a.accuracy}%` })))
    .concat((S.results||[]).filter(r=>inClass(r.uid)).map(r=>({
      uid:r.uid, t:secs(r), kind:'Practice set',
      detail:`${esc(r.weekLabel||'')} · ${r.score}/${r.total}` })))
    .concat((S.allSkillPracticeRecords||[]).filter(r=>inClass(r.uid)).map(r=>({
      uid:r.uid, t:secs(r), kind:'Own practice',
      detail:`${r.score}/${r.total}` })))
    .filter(x=>x.t).sort((a,b)=>b.t-a.t);

  if(!uids.length){
    wrap.appendChild(el('<div class="mmc-empty">No students yet — add some from the Students tab.</div>'));
    return wrap;
  }

  const now=Date.now()/1000, DAY=86400;
  const active7=new Set(feed.filter(x=>now-x.t<=7*DAY).map(x=>x.uid));
  const afterHours=feed.filter(x=>{
    if(now-x.t>7*DAY) return false;
    const d=new Date(x.t*1000), h=d.getHours(), dy=d.getDay();
    return dy===0||dy===6||h<8||h>=16;
  });
  const quiet=uids.filter(u=>!active7.has(u));

  wrap.appendChild(el(`<div class="mmc-card">
    <div class="mmc-row" style="gap:0;align-items:stretch;">
      <div style="flex:1;min-width:120px;padding-right:20px;">
        <div class="meta" style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px;">Active this week</div>
        <div class="mmc-stat-num" style="font-size:27px;">${active7.size}<span style="font-size:16px;color:#8A8880;"> / ${uids.length}</span></div>
      </div>
      <div style="flex:1;min-width:120px;padding:0 20px;border-left:1px solid #EEECE7;">
        <div class="meta" style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px;">Practising at home</div>
        <div class="mmc-stat-num" style="font-size:27px;">${new Set(afterHours.map(x=>x.uid)).size}</div>
      </div>
      <div style="flex:1;min-width:120px;padding-left:20px;border-left:1px solid #EEECE7;">
        <div class="meta" style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px;">Quiet 7 days</div>
        <div class="mmc-stat-num" style="font-size:27px;">${quiet.length}</div>
      </div>
    </div>
  </div>`));

  const lastSeen = {};
  feed.forEach(x=>{ if(!lastSeen[x.uid] || x.t>lastSeen[x.uid]) lastSeen[x.uid]=x.t; });
  const ago=(t)=>{
    if(!t) return 'Never';
    const d=Math.floor((now-t)/DAY);
    return d<1?'Today':d===1?'Yesterday':`${d} days ago`;
  };
  const sorted=uids.slice().sort((a,b)=>(lastSeen[a]||0)-(lastSeen[b]||0));
  wrap.appendChild(el('<h3 style="margin:20px 0 8px;">Who\'s gone quiet</h3>'));
  const lw=el('<div class="mmc-ledger-wrap"></div>');
  const lt=el('<table class="mmc-ledger"><thead><tr><th>Student</th><th>Last seen</th><th>Activities</th><th>Outside school hours</th></tr></thead><tbody></tbody></table>');
  const lb=lt.querySelector('tbody');
  sorted.forEach(u=>{
    const mine=feed.filter(x=>x.uid===u);
    const oh=afterHours.filter(x=>x.uid===u).length;
    const stale=!lastSeen[u] || (now-lastSeen[u])>7*DAY;
    lb.appendChild(el(`<tr><td>${esc((S.profiles[u]&&S.profiles[u].displayName)||u)}</td>
      <td${stale?' style="color:#B3352F;font-weight:700;"':''}>${esc(ago(lastSeen[u]))}</td>
      <td>${mine.length}</td><td>${oh}</td></tr>`));
  });
  lw.appendChild(lt); wrap.appendChild(lw);

function exportTTCSV(studentUids){
  // Extended, not replaced: the best-score columns were already here and teachers may
  // rely on them. The focus columns are appended so an existing sheet still lines up.
  const header=['Student','Best Easy','Best Medium','Best Hard','Total attempts','Focus 1','Focus 2','Focus 3','Detail'];
  const rows=[header];
  studentUids.forEach(uid=>{
    const mine=S.ttAttempts.filter(a=>a.uid===uid);
    const bestOf=(lvl)=>{ const at=mine.filter(a=>a.level===lvl); if(!at.length) return '';
      const best=at.reduce((b,a)=>a.score>b.score?a:b, at[0]); return `${best.score}/${best.attempted} (${best.accuracy}%)`; };
    const name=S.profiles[uid].displayName||uid;
    const first=String(name).split(/\s+/)[0];
    const ins=computeTTInsights(mine);
    const f=[0,1,2].map(i=>ins.items[i]? ttInsightShort(ins.items[i]) : '');
    const detail=ins.items.map(it=>ttInsightSentence(first,it)).join(' ');
    rows.push([name, bestOf('easy'), bestOf('medium'), bestOf('hard'), mine.length, f[0], f[1], f[2], detail]);
  });
  const csv=rows.map(r=>r.map(c=>{ const s=String(c); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='timetable-challenge-results.csv';
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}

// ---------- Clear weekly results for a class ----------
// Deliberately narrow: it removes ONLY `results` (the weekly sets) and the
// in-progress `weekProgress` saves for students in one class. Times-table
// attempts are never touched — students earn ranks and unlocks from those, and
// wiping them would take away something they worked for. Self-directed skill
// practice is also left alone; it's their own work, not a stale set.
async function clearWeeklyResultsForClass(classId, btnEl){
  const cls = (S.classes||[]).find(c=>c.id===classId);
  const name = cls ? cls.name : 'this class';
  const uids = Object.keys(S.profiles||{}).filter(u=>{
    const p=S.profiles[u]; return p && p.username && p.classId===classId;
  });
  const doomed = (S.results||[]).filter(r=>uids.indexOf(r.uid)!==-1);
  // Targeted skill-practice sessions feed the SAME dashboard as the weekly sets,
  // so leaving them behind produced a confusing half-cleared state: the gradebook
  // was empty while the student still saw strengths and weaknesses.
  const doomedPractice = (S.allSkillPracticeRecords||[]).filter(r=>uids.indexOf(r.uid)!==-1);
  if(!doomed.length && !doomedPractice.length){ S.toast=`Nothing to clear for ${name}.`; render(); return; }
  const typed = prompt(
    `This permanently deletes skills data for ${uids.length} student${uids.length===1?'':'s'} in ${name}:\n\n`+
    `  • ${doomed.length} weekly set result${doomed.length===1?'':'s'}\n`+
    `  • ${doomedPractice.length} targeted practice session${doomedPractice.length===1?'':'s'}\n\n`+
    `Their dashboards will be empty afterwards.\n\n`+
    `Times-table attempts, ranks and unlocks are NOT affected.\n\n`+
    `This cannot be undone. Type CLEAR to confirm.`);
  if(typed!=='CLEAR'){ S.toast='Nothing was cleared.'; render(); return; }
  if(btnEl){ btnEl.disabled=true; btnEl.textContent='Clearing…'; }
  let done=0, failed=0;
  for(const r of doomed){
    try{ await deleteDoc(doc(db,'results',r.id)); done++; }
    catch(e){ failed++; }
  }
  for(const r of doomedPractice){
    try{ await deleteDoc(doc(db,'skillPractice',r.id)); done++; }
    catch(e){ failed++; }
  }
  // Half-finished attempts at now-deleted sets would otherwise linger.
  for(const u of uids){
    for(const w of (S.weeks||[])){
      try{ await deleteDoc(doc(db,'weekProgress', `${u}_${w.id}`)); }catch(e){}
    }
  }
  S.toast = failed
    ? `Cleared ${done} results, ${failed} could not be removed — try again.`
    : `Cleared ${done} skills records for ${name}. Times tables, ranks and unlocks untouched.`;
  if(btnEl){ btnEl.disabled=false; btnEl.textContent='Clear weekly results'; }
  render();
}

      panel.appendChild(el('<div class="meta" style="margin-top:10px;">No classes yet.</div>'));
    }
    S.classes.slice().sort((a,b)=>(a.name||'').localeCompare(b.name||'')).forEach(c=>{
      const count=Object.values(S.profiles||{}).filter(p=>p.username && p.classId===c.id).length;
      const r=el(`<div class="mmc-clsrow">
        <div class="mmc-stu-name">${esc(c.name)}</div>
        <code class="mmc-stu-user">Year ${classYear(c)}</code>
        <code class="mmc-stu-user">${count} student${count===1?'':'s'}</code>
        <div class="mmc-stu-actions">
          <button class="mmc-btn ghost sm" data-c="csv">Logins CSV</button>
          <button class="mmc-btn ghost sm" data-c="cards">Login cards</button>
          <button class="mmc-btn ghost sm" data-c="clear">Clear weekly results</button>
          <button class="mmc-btn ghost sm" data-c="rename">Rename</button>
          <button class="mmc-btn danger sm" data-c="del"${count?' disabled title="Move or delete its students first"':''}>Delete</button>
        </div>
      </div>`);
      const csvBtn=r.querySelector('[data-c="csv"]');
      if(csvBtn) csvBtn.onclick=()=>downloadLoginsCSV(loginRowsForClass(c.id), `${c.name.replace(/[^a-z0-9]+/gi,'-').toLowerCase()}-logins.csv`);
      const cardsBtn=r.querySelector('[data-c="cards"]');
      if(cardsBtn) cardsBtn.onclick=()=>{
        const rows=loginRowsForClass(c.id);
        if(!rows.length){ S.toast='No students in that class have a password set yet.'; render(); return; }
        generateLoginCardsPDF(rows, null, null, cardsBtn);
      };
      const clearBtn=r.querySelector('[data-c="clear"]');
      if(clearBtn) clearBtn.onclick=()=>clearWeeklyResultsForClass(c.id, clearBtn);
      r.querySelector('[data-c="rename"]').onclick=async ()=>{
        const name=prompt('New name for this class:', c.name||'');
        if(!name) return;
        const yr=prompt('Which year level? Enter 3, 4, 5 or 6.', String(classYear(c)));
        if(yr===null) return;
        await renameClass(c.id, name, yr);
      };
      const delBtn=r.querySelector('[data-c="del"]');
      if(!count) delBtn.onclick=async ()=>{
        if(!confirm(`Delete the class "${c.name}"? It has no students, so nothing else is affected. This can't be undone.`)) return;
        try{
          await deleteDoc(doc(db,'classes',c.id));
          // Don't leave the app pointing at a class that no longer exists.
          if(S.currentClassId===c.id){
            const left=(S.classes||[]).filter(x=>x.id!==c.id);
            S.currentClassId = left.length ? left[0].id : null;
            if(!left.length) S.showAllClasses=true;
          }
          render();
        }catch(e){ S.toast='Could not delete that class — check your connection.'; render(); }
      };
      panel.appendChild(r);
    });
    wrap.appendChild(panel);
  }

  if(S.resetPasswordResult){
    const r=S.resetPasswordResult;
    const banner=el(`
      <div class="mmc-card mmc-notice" style="margin-bottom:14px;">
        <h3>New password for ${esc(r.displayName)}</h3>
        <div class="meta">You can find this again anytime in Student Management below.</div>
        <div class="mmc-row" style="gap:16px;margin-top:6px;">
          <div><div class="label2">Username</div><code class="mmc-code">${esc(r.username)}</code></div>
          <div><div class="label2">New password</div><code class="mmc-code">${esc(r.password)}</code></div>
        </div>
        <div class="mmc-row" style="margin-top:10px;">
          <button class="mmc-btn gold sm" id="mmc-reset-pdf">Download Login Card PDF</button>
          <button class="mmc-btn ghost sm" id="mmc-reset-dismiss">Done</button>
        </div>
      </div>
    `);
    banner.querySelector('#mmc-reset-pdf').onclick=()=>generateLoginCardsPDF([
      { name:r.displayName, username:r.username, password:r.password, status:'ok' }
    ], 'mmc-reset-pdf', 'Download Login Card PDF');
    banner.querySelector('#mmc-reset-dismiss').onclick=()=>{ S.resetPasswordResult=null; render(); };
    wrap.appendChild(banner);
  }

  if(S.bulkResults){
    const card=el(`
      <div class="mmc-card">
        <h3>Accounts created ✓</h3>
        <div class="meta">You can find these again anytime in Student Management below.</div>
        <div class="mmc-ledger-wrap"><table class="mmc-ledger"><thead><tr><th>Name</th><th>Username</th><th>Password</th><th>Status</th></tr></thead>
          <tbody>${S.bulkResults.map(r=>`<tr><td>${esc(r.name)}</td><td><code class="mmc-code">${esc(r.username)}</code></td><td><code class="mmc-code">${esc(r.password||'—')}</code></td><td>${r.status==='ok'?'✓':'✗ '+esc(r.error||'failed')}</td></tr>`).join('')}</tbody>
        </table></div>
        <div class="mmc-row" style="margin-top:12px;">
          <button class="mmc-btn gold" id="mmc-bulk-csv">Download credentials CSV</button>
          <button class="mmc-btn gold" id="mmc-bulk-pdf">Download Login Cards PDF</button>
          <button class="mmc-btn ghost" id="mmc-bulk-done">Done</button>
        </div>
      </div>
    `);
    card.querySelector('#mmc-bulk-csv').onclick=()=>{
      const rows=[['Name','Username','Password'], ...S.bulkResults.filter(r=>r.status==='ok').map(r=>[r.name,r.username,r.password])];
      const csv=rows.map(r=>r.map(c=>{ const s=String(c); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(',')).join('\n');
      const blob=new Blob([csv],{type:'text/csv'}); const url=URL.createObjectURL(blob);
      const a=document.createElement('a'); a.href=url; a.download='student-logins.csv';
      document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    };
    card.querySelector('#mmc-bulk-pdf').onclick=()=>generateLoginCardsPDF(S.bulkResults);
    card.querySelector('#mmc-bulk-done').onclick=()=>{ S.bulkResults=null; S.bulkNamesText=''; render(); };
    wrap.appendChild(card);
    return wrap;
  }

  const form=el(`
    <div class="mmc-card">
      <h3>Add students from a class list</h3>
      <div class="meta">One name per line, e.g. "Susie Miller". Each student gets a unique username (like SusieM) and a random password (like donkey56) — shown once, right after you create them.</div>
      <div class="mmc-field"><label>Add them to</label>
        <div class="mmc-row" style="align-items:center;gap:8px;">
          <select id="mmc-bulk-class" style="font-weight:600;min-width:180px;">
            ${S.classes.map(c=>`<option value="${c.id}" ${!S.showAllClasses && c.id===S.currentClassId?'selected':''}>${esc(c.name)} · Year ${classYear(c)}</option>`).join('')}
            <option value="__new__">+ A new class…</option>
          </select>
          <span class="meta" style="margin:0;" id="mmc-bulk-classnote"></span>

Tom Nguyen
Aisha Patel">${esc(S.bulkNamesText)}</textarea></div>
      <div class="mmc-field"><label>Confirm your password</label>
        <div class="meta">Needed briefly to keep switching back to your teacher account while each student account is created.</div>
        <input type="password" id="mmc-bulk-pass" placeholder="Your password">
      </div>
      ${S.authError? `<div class="mmc-autherr">${esc(S.authError)}</div>` : ''}
      <button class="mmc-btn gold" id="mmc-bulk-go" ${S.bulkCreating?'disabled':''}>${S.bulkCreating? `Creating… (${S.bulkProgress||''})` : 'Create student accounts'}</button>
    </div>
  `);
  form.querySelector('#mmc-bulk-names').oninput=(e)=>{ S.bulkNamesText=e.target.value; };
  const bulkClassSel=form.querySelector('#mmc-bulk-class');
  const bulkNote=form.querySelector('#mmc-bulk-classnote');
  const syncBulkNote=()=>{
    if(bulkNote) bulkNote.textContent = (bulkClassSel && bulkClassSel.value==='__new__')
      ? "You'll be asked to name it." : '';
  };
  if(bulkClassSel){ bulkClassSel.onchange=syncBulkNote; syncBulkNote(); }
  form.querySelector('#mmc-bulk-go').onclick=async ()=>{
    // If they chose "+ A new class", create it first and make it current, so
    // every account created below lands in the right place.
    if(bulkClassSel && bulkClassSel.value==='__new__'){
      const nm=prompt('Name for the new class (e.g. "5B" or "Year 4 Green"):');
      if(!nm) return;
      const yr=prompt('Which year level? Enter 3, 4, 5 or 6.', String(DEFAULT_YEAR));
      if(yr===null) return;
      await createClass(nm, yr);
      S.showAllClasses=false;
    } else if(bulkClassSel){
      S.showAllClasses=false; S.currentClassId=bulkClassSel.value;
    }
    const namesText=form.querySelector('#mmc-bulk-names').value;
    const teacherPass=form.querySelector('#mmc-bulk-pass').value;
    const lines=namesText.split('\n').map(l=>l.trim()).filter(Boolean);
    if(lines.length===0){ S.authError='Paste at least one name.'; render(); return; }
    if(!teacherPass){ S.authError='Enter your password to continue.'; render(); return; }
    S.authError=null;
    const teacherEmail=S.user.email;
    // Local uniqueness guard only prevents obvious clashes within this batch / your
    // own class — usernames must be unique across every teacher's class too, and we
    // can't read other teachers' students (by design), so real collisions are caught
    // by Firebase itself and retried below with an incremented suffix.
    const taken=new Set(Object.values(S.profiles).map(p=>String(p.username||'').toLowerCase()).filter(Boolean));
    S.bulkCreating=true; S.bulkResults=[]; S.bulkProgress=`0/${lines.length}`; render();
    for(let i=0;i<lines.length;i++){
      const parts=lines[i].split(/\s+/); const first=parts[0]; const last=parts.slice(1).join(' ');
      const fullName=lines[i];
      // Which class these students land in, resolved once. A new student inherits that
      // class's year as a STARTING POINT only — it is stored on their own profile and can
      // be changed per student, which is what a composite class needs.
      const newClassId = (S.showAllClasses ? (S.classes[0] && S.classes[0].id) : S.currentClassId) || null;
      let attempt=0, done=false, lastErr=null;
      while(!done && attempt<25){
        attempt++;
        const username=genUsername(first,last,taken); const password=genPassword();
        const email=usernameToEmail(username);
        try{
          const cred=await createUserWithEmailAndPassword(auth,email,password);
          await updateProfile(cred.user,{displayName:fullName});
          await setDoc(doc(db,'profiles',cred.user.uid),{displayName:fullName, username, email, createdByTeacher:true, teacherUid:S.user.uid, currentPassword:password, classId: newClassId, yearLevel: classYear((S.classes||[]).find(c=>c.id===newClassId))});
          await signInWithEmailAndPassword(auth,teacherEmail,teacherPass);
          S.bulkResults.push({name:fullName, username, password, status:'ok'});
          done=true;
        }catch(e){
          lastErr=e;
          if(e.code==='auth/email-already-in-use'){ continue; } // taken set already advanced; retry with next suffix
          S.bulkResults.push({name:fullName, username, password:null, status:'error', error:friendlyAuthError(e.code)});
          try{ await signInWithEmailAndPassword(auth,teacherEmail,teacherPass); }catch(e2){}
          done=true;
        }
      }
      if(!done && lastErr){
        S.bulkResults.push({name:fullName, username:'—', password:null, status:'error', error:'Could not find a free username — try again.'});
      }
      S.bulkProgress=`${i+1}/${lines.length}`; render();
    }
    S.bulkCreating=false;
    await handleAuthChange(auth.currentUser);
    render();
  };
  if(sview==='add') wrap.appendChild(form);

  if(sview!=='list') return wrap;

  const existing = Object.entries(S.profiles).filter(([uid,p])=>p.username && (S.showAllClasses || !p.classId || p.classId===S.currentClassId));
  if(existing.length){
    const pickerRow=el('<div class="mmc-row" style="justify-content:flex-end;margin-bottom:10px;"></div>');
    // Sits directly above the roster it filters — in the tab bar it read as a

    pickerRow.appendChild(renderClassPicker());
    wrap.appendChild(pickerRow);
    const list=el('<div class="mmc-card"><h3>Student Management</h3><div class="meta">Passwords shown below reflect whatever is currently set — use "Reset Password" to issue a new one if needed.</div></div>');
    const withPasswords = existing.filter(([uid,p])=>p.currentPassword).map(([uid,p])=>({name:p.displayName, username:p.username, password:p.currentPassword, status:'ok'}));
    const missingCount = existing.length - withPasswords.length;
    const downloadRow=el(`<div class="mmc-row" style="margin-top:10px;">
      <button class="mmc-btn gold sm" id="mmc-manage-csv">Download logins CSV</button>
      <button class="mmc-btn gold sm" id="mmc-manage-pdf">Download Login Cards PDF</button>
      ${missingCount>0 ? `<span class="meta" style="align-self:center;">${missingCount} student${missingCount===1?'':'s'} with no password set yet won't be included — reset their password first.</span>` : ''}
    </div>`);
    downloadRow.querySelector('#mmc-manage-csv').onclick=()=>downloadLoginsCSV(withPasswords,'student-logins.csv');
    downloadRow.querySelector('#mmc-manage-pdf').onclick=()=>{
      if(!withPasswords.length){ S.toast='No students with a set password yet.'; render(); return; }
      generateLoginCardsPDF(withPasswords, 'mmc-manage-pdf', 'Download Login Cards PDF');
    };
    list.appendChild(downloadRow);
    list.appendChild(el(`<div class="mmc-stu-head">
      <span>Student</span>
      <span>Username</span>
      <span>Password</span>
      <span>${S.classes.length>1?'Class':''}</span>
      <span>Year</span>
      <span>Group</span>
      <span></span>
    </div>`));
    const ul=el('<div></div>');
    existing.sort((a,b)=>(a[1].displayName||'').localeCompare(b[1].displayName||'')).forEach(([uid,p])=>{
      const row=el(`<div class="mmc-stu">
        <div class="mmc-stu-name">${esc(p.displayName)}</div>
        <code class="mmc-stu-user">${esc(p.username)}</code>
        <code class="mmc-stu-pass${p.currentPassword?'':' none'}">${p.currentPassword ? esc(p.currentPassword) : 'not set'}</code>
        ${S.classes.length>1 ? `<select data-act="class">
          ${S.classes.map(c=>`<option value="${c.id}" ${p.classId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}
        </select>` : '<span></span>'}
        <select data-act="year" title="Year level. Set per student so a composite class can hold more than one year. Controls which times-tables ladder they get.">
          ${YEAR_LEVELS.map(y=>`<option value="${y}" ${studentYear(p)===y?'selected':''}>Year ${y}</option>`).join('')}
        </select>
        <select data-act="group">
          <option value="">Unassigned</option>
          ${STUDENT_GROUPS.map(g=>`<option value="${g.key}" ${p.group===g.key?'selected':''}>${esc(g.label)}</option>`).join('')}
        </select>
        <div class="mmc-stu-actions">
          <button class="mmc-btn ghost sm" data-act="more" title="More options">⋯</button>
        </div>
        ${S.stuExpandedUid===uid ? `<div class="mmc-stu-more">
          <span class="mmc-stu-morelabel">Pin rank</span>
          <select data-act="rank" title="Pin a rank for a student working hard without the numbers moving. A pinned rank can only lift, never demote.">
            <option value="">Earned</option>
            <option value="upandcomer" ${p.rankOverride==='upandcomer'?'selected':''}>Up and Comer</option>
            <option value="expert" ${p.rankOverride==='expert'?'selected':''}>Expert</option>
          </select>
          <button class="mmc-btn ghost sm" data-act="preview">Student view</button>
          <button class="mmc-btn ghost sm" data-act="reset">Reset password</button>
          <button class="mmc-btn danger sm" data-act="delete">Delete student</button>
        </div>` : ''}
      </div>`);
      row.querySelector('[data-act="more"]').onclick=()=>{
        S.stuExpandedUid = (S.stuExpandedUid===uid ? null : uid); render();
      };
      // Everything below the ⋯ toggle only exists while that row is expanded, so every

      const previewBtn=row.querySelector('[data-act="preview"]');
      if(previewBtn) previewBtn.onclick=()=>startStudentPreview(uid);
      const rankSel=row.querySelector('[data-act="rank"]');
      if(rankSel) rankSel.onchange=async (e)=>{
        const v=e.target.value||null;
        try{ await updateDoc(doc(db,'profiles',uid), {rankOverride:v});
          S.toast = v ? `${p.displayName} is pinned at ${v==='expert'?'Expert':'Up and Comer'}.`
                      : `${p.displayName} is back to their earned rank.`;

      const yearSel=row.querySelector('[data-act="year"]');
      if(yearSel) yearSel.onchange=async (e)=>{
        try{ await updateDoc(doc(db,'profiles',uid), {yearLevel:+e.target.value});
          S.toast=`${p.displayName} is now Year ${e.target.value}.`;
        }catch(err){ S.toast='Could not update year — check your connection.'; }
        render();
      };
      const classSel=row.querySelector('[data-act="class"]');
      if(classSel) classSel.onchange=async (e)=>{
        try{ await updateDoc(doc(db,'profiles',uid), {classId:e.target.value}); }
        catch(err){ S.toast='Could not move student — check your connection.'; render(); }
      };
      const groupSel=row.querySelector('[data-act="group"]');
      if(groupSel) groupSel.onchange=async (e)=>{
        const val=e.target.value||null;
        try{ await updateDoc(doc(db,'profiles',uid), {group:val}); }
        catch(err){ S.toast='Could not update group — check your connection.'; render(); }
      };
      const resetBtn=row.querySelector('[data-act="reset"]');
      if(resetBtn) resetBtn.onclick=()=>resetStudentPassword(uid, p.displayName, resetBtn);
      const delBtn=row.querySelector('[data-act="delete"]');
      if(delBtn) delBtn.onclick=()=>deleteStudentAccount(uid, p.displayName, delBtn);
      ul.appendChild(row);
    });
    list.appendChild(ul);
    wrap.appendChild(list);
  }
  return wrap;
}

// ================= STUDENT =================
function renderStudent(){
  if(S.activeWeekId){ const week=S.weeks.find(w=>w.id===S.activeWeekId); if(week) return renderQuizTaking(week); S.activeWeekId=null; }
  if(S.skillSession) return renderSkillPracticeSession();
  if(S.tt && S.tt.active) return renderTTChallenge();
  syncMyLiveSession();
  if(S.myLive && S.myLive.answering) return renderMyLiveSession();
  const wrap=el('<div></div>');
  const tabs=el(`<div class="mmc-tabs"><button class="mmc-tab" data-st="dashboard">My Dashboard</button><button class="mmc-tab" data-st="weekly">Skills Practice</button><button class="mmc-tab" data-st="timetable">Times Table Training Ground</button><button class="mmc-tab" data-st="live">🐎 Racing Ground</button><button class="mmc-tab" data-st="settings">⚙️ Settings</button></div>`);
  tabs.querySelectorAll('.mmc-tab').forEach(b=>{ if(b.dataset.st===S.studentTab) b.classList.add('active');
    b.onclick=()=>{ S.studentTab=b.dataset.st; render(); }; });
  wrap.appendChild(tabs);
  wrap.appendChild(
    S.studentTab==='dashboard' ? renderStudentDashboard() :
    S.studentTab==='weekly' ? renderWeeklyPassport() :
    S.studentTab==='timetable' ? renderTimetableTab() :
    S.studentTab==='live' ? renderStudentLiveGame() : renderSettingsTab()
  );
  return wrap;
}

function initQuizState(week){
  S.activeWeekId=week.id; S.quiz={};
  // Hidden questions never enter the student's quiz state, so they can't be
  // rendered, answered, or counted in the total.
  visibleQuestions(week).forEach(q=> S.quiz[q.id]= q.inputType==='order'
    ? {given:'', pool:shuffleArr(q.items||[]), placed:[], checked:false, correct:false}
    : q.inputType==='classify'
    ? {given:new Array((q.items||[]).length).fill(''), checked:false, correct:false}
    : q.inputType==='parts'
    ? {given:new Array((q.parts||[]).length).fill(''), checked:false, correct:false}
    : q.inputType==='mixed'
    ? {given:{whole:'',num:'',den:''}, checked:false, correct:false}
    : q.inputType==='multi'
    ? {given:[], checked:false, correct:false}
    : {given: q.inputType==='coins' ? [] : '', checked:false, correct:false});
}
function progressMatchesWeek(progress, week){
  if(!progress || !progress.quiz) return false;
  // Compared against the VISIBLE set — if a teacher hides a question after a
  // student has started, the saved progress no longer matches and is discarded
  // rather than leaving a half-answered question they can no longer see.
  return visibleQuestions(week).every(q => progress.quiz[q.id] !== undefined);
}
async function saveWeekProgress(week){
  if(!S.user) return;
  try{
    await setDoc(doc(db,'weekProgress', `${S.user.uid}_${week.id}`), {
      uid:S.user.uid, weekId:week.id, teacherUid: S.profile? S.profile.teacherUid : null,
      quiz:S.quiz, updatedAt:serverTimestamp()
    });
  }catch(e){ /* auto-save is best-effort — don't interrupt the student over it */ }
}
async function deleteWeekProgress(weekId){
  if(!S.user) return;
  try{ await deleteDoc(doc(db,'weekProgress', `${S.user.uid}_${weekId}`)); }catch(e){}
}
function studentEffectiveGroup(){ return (S.profile && S.profile.group) || 'mainstream'; }
function weekVisibleToMe(week){
  if(week.classIds && week.classIds.length>0 && S.profile && S.profile.classId && !week.classIds.includes(S.profile.classId)) return false;
  if(!week.targetGroups || week.targetGroups.length===0) return true;
  return week.targetGroups.includes(studentEffectiveGroup());
}
function renderWeeklyPassport(){
  const wrap=el('<div></div>');
  const myWeeks = S.weeks.filter(weekVisibleToMe);
  if(myWeeks.length===0){
    wrap.appendChild(el('<div class="mmc-empty"><div class="mmc-empty-icon">📭</div>No quizzes published yet — check back soon!</div>'));
    return wrap;
  }
  wrap.appendChild(el('<h3 style="font-family:Fredoka,sans-serif;margin:4px 0 12px;">Your maths passport</h3>'));
  myWeeks.slice().sort((a,b)=> (b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)).forEach(week=>{
    const rec = S.results.find(r=>r.weekId===week.id);
    const card=el(`
      <div class="mmc-card mmc-row" style="justify-content:space-between;">
        <div><h3>${esc(week.label)}</h3><div class="meta">${visibleQuestions(week).length} questions · ${esc(week.difficulty)}</div></div>
        <div></div>
      </div>
    `);
    const right=card.querySelector('div:last-child');
    if(rec){
      right.style.cssText='display:flex;flex-direction:column;align-items:flex-end;gap:8px;';
      right.innerHTML=stampHTML(rec.score, rec.total);
      const retakeBtn=el('<button class="mmc-btn ghost sm">↻ Retake</button>');
      retakeBtn.onclick=()=>{
        if(!confirm(`Retaking will replace your current score of ${rec.score}/${rec.total} for "${week.label}". Continue?`)) return;
        initQuizState(week); render();
      };
      right.appendChild(retakeBtn);
    } else {
      const progress = S.weekProgress.find(p=>p.weekId===week.id);
      if(progress && progressMatchesWeek(progress, week)){
        const answeredCount = visibleQuestions(week).filter(q=>progress.quiz[q.id] && progress.quiz[q.id].checked).length;
        right.style.cssText='display:flex;flex-direction:column;align-items:flex-end;gap:6px;';
        right.appendChild(el(`<div class="meta" style="margin:0;">${answeredCount}/${(week.questions||[]).length} answered so far</div>`));
        const continueBtn=el('<button class="mmc-btn gold">Continue ▶</button>');
        continueBtn.onclick=()=>{ S.activeWeekId=week.id; S.quiz=progress.quiz; render(); };
        right.appendChild(continueBtn);
      } else {
        if(progress) deleteWeekProgress(week.id); // stale (week was regenerated since) — clean it up
        const startBtn=el('<button class="mmc-btn gold">Start ▶</button>');
        startBtn.onclick=()=>{ initQuizState(week); render(); };
        right.appendChild(startBtn);
      }
    }
    wrap.appendChild(card);
  });
  return wrap;
}

function bestTTScore(level){
  const attempts=S.ttAttempts.filter(a=>a.level===level);
  if(attempts.length===0) return null;
  return attempts.reduce((best,a)=> a.score>best.score? a : best, attempts[0]);
}

    tablesRow.appendChild(chip(`${n}×`, c.tables.indexOf(n)!==-1, ()=>{

      if(i===-1) c.tables.push(n); else c.tables.splice(i,1);

  opsRow.appendChild(chip('× Times', c.mult, ()=>{ c.mult=!c.mult; render(); }));
  opsRow.appendChild(chip('÷ Divide', c.div, ()=>{ c.div=!c.div; render(); }));

  const ready=ttCustomValid(c);
  const mk=(label,cls,fn)=>{
    const b=el(`<button class="mmc-btn ${cls} sm" ${ready?'':'disabled'}>${label}</button>`);
    if(ready) b.onclick=fn;
    return b;
  };
  // Config is copied, not passed by reference — otherwise changing a chip mid-session
  // would silently change the questions being generated.
  const snapshot=()=>({ tables:c.tables.slice(), mult:!!c.mult, div:!!c.div });
  goRow.appendChild(mk('🐢 Practice','ghost',()=>startTTPractice('custom', snapshot())));

function startTTChallenge(level, custom){
  S.tt = { mode:'challenge', active:true, finished:false, level, custom:custom||null, year:studentYear(S.profile), timeLeft:300,
           score:0, attempted:0, qIndex:0, currentQ:null, lastResult:null, typedValue:'',
           facts:{}, questionStartedAt:Date.now() };
  S.tt.currentQ = ttQuestionFor(S.tt, 0);
  S.tt.questionStartedAt = Date.now();
  render();
  startTTTimer();
}
// Practice: no clock, a fixed 30 questions, and the answer shown when wrong. Deliberately
// shares S.tt and submitTTAnswer with the timed challenge so the two can't drift apart —
// `mode` is the only difference, and it is checked rather than duplicated.
function startTTPractice(level, custom){
  S.tt = { mode:'practice', active:true, finished:false, level, custom:custom||null, year:studentYear(S.profile), timeLeft:null,
           score:0, attempted:0, qIndex:0, currentQ:null, lastResult:null, reveal:null, typedValue:'',
           facts:{}, questionStartedAt:Date.now() };
  S.tt.currentQ = ttQuestionFor(S.tt, 0);
  S.tt.questionStartedAt = Date.now();
  render();
}
function startTTTimer(){
  if(S.tt.timerHandle) clearInterval(S.tt.timerHandle);
  S.tt.timerHandle=setInterval(()=>{
    if(!S.tt || !S.tt.active) return;
    S.tt.timeLeft--;
    const timerEl=document.getElementById('mmc-tt-timer');
    if(timerEl) timerEl.textContent=formatMMSS(S.tt.timeLeft);
    if(S.tt.timeLeft<=0){ clearInterval(S.tt.timerHandle); finishTTChallenge(); }
  },1000);
}
function submitTTAnswer(given){
  if(!S.tt || !S.tt.active) return;
  // While a practice answer is on screen the question is already scored. The reveal panel
  // replaces the input so this shouldn't be reachable, but the rule belongs in the logic
  // rather than depending on the UI — otherwise a future shortcut key could double-count.
  if(S.tt.mode==='practice' && S.tt.reveal) return;
  const q = S.tt.currentQ;
  const correct = sameNumber(given, q.answer) || normalize(given)===normalize(String(q.answer));
  ttRecordFact(S.tt, q, correct, Date.now() - (S.tt.questionStartedAt||Date.now()));
  S.tt.attempted++;
  if(correct) S.tt.score++;
  if(S.tt.mode==='practice'){
    // Hold on this question. The child reads the result, then moves on when ready —
    // no clock, so there is nothing to be lost by looking at it properly.
    S.tt.reveal = { correct, prompt:q.prompt, answer:String(q.answer), given:String(given||'') };
    S.tt.typedValue='';
    render();
    return;
  }
  flashResult('tt', correct);
  S.tt.qIndex++;
  S.tt.currentQ=ttQuestionFor(S.tt, S.tt.qIndex);
  S.tt.questionStartedAt=Date.now();
  render();
}
// Practice only: advance past the revealed answer, or finish after the 30th.
function nextTTPracticeQuestion(){
  if(!S.tt || S.tt.mode!=='practice') return;
  S.tt.reveal=null;
  if(S.tt.attempted >= TT_PRACTICE_TOTAL){ finishTTChallenge(); return; }
  S.tt.qIndex++;
  S.tt.currentQ=ttQuestionFor(S.tt, S.tt.qIndex);
  S.tt.typedValue='';
  // Timed from when the question APPEARS, not from when the previous one was answered —
  // otherwise the seconds spent reading the correction get charged to the next fact.
  S.tt.questionStartedAt=Date.now();
  render();
}
async function finishTTChallenge(){
  const {level, score, attempted} = S.tt;
  const mode = S.tt.mode==='practice' ? 'practice' : 'challenge';
  const accuracy = attempted? Math.round((score/attempted)*100) : 0;
  if(S.tt.timerHandle) clearInterval(S.tt.timerHandle);
  S.tt.active=false; S.tt.finished=true; S.tt.reveal=null; S.tt.lastResult={level,score,attempted,accuracy,mode};
  try{
    // `mode` is what computeBadgeInfo reads to keep practice out of the accuracy gates.
    // Older records have no mode field and are treated as timed — that is deliberate.
    const rec = { uid:S.user.uid, teacherUid:S.profile?S.profile.teacherUid:null, level, score, attempted, accuracy, mode, submittedAt:serverTimestamp() };
    // Only on custom sessions, so an attempt history row can say "6, 7 ×" rather than
    // an anonymous "custom" that means nothing to a teacher reading it later.
    if(level==='custom' && S.tt.custom) rec.customLabel = ttCustomLabel(S.tt.custom);
    if(S.tt.facts && Object.keys(S.tt.facts).length) rec.facts = S.tt.facts;
    await addDoc(collection(db,'ttAttempts'), rec);
  }catch(e){ S.toast='Could not save this attempt — check your connection.'; }
  render();
}
function abortTTChallenge(){
  if(!S.tt) return;
  if(!confirm(S.tt.mode==='practice' ? "Stop practising? This session won't be saved." : "Quit this challenge? Your progress won't be saved.")) return;
  if(S.tt.timerHandle) clearInterval(S.tt.timerHandle);
  S.tt=null;
  render();
}
function renderTTChallenge(){
  const wrap=el('<div></div>');
  const t=S.tt;

        ${t.mode==='practice'
          ? `<div style="font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:700;color:var(--sky-deep);">${Math.min(t.attempted+1,TT_PRACTICE_TOTAL)} of ${TT_PRACTICE_TOTAL}</div>`
          : `<div id="mmc-tt-timer" style="font-family:'IBM Plex Mono',monospace;font-size:28px;font-weight:700;color:var(--sky-deep);">${formatMMSS(t.timeLeft)}</div>`}
      </div>

  const qbox=el(`

        <button class="mmc-btn gold" id="mmc-tt-submit">Go</button>
      </div>

  `);
  // While a practice answer is revealed, the input and keypad are replaced by the result
  // panel. Swapping rather than disabling means there is no half-live field to tab into
  // and no way to submit the same question twice.
  if(t.mode==='practice' && t.reveal){
    const r=t.reveal;
    qbox.innerHTML='';
    qbox.appendChild(el(`
      <div style="text-align:center;">
        <div style="font-family:'Fredoka',sans-serif;font-size:30px;font-weight:700;margin-bottom:10px;">${esc(r.prompt)} = ${esc(r.answer)}</div>
        <div style="font-size:20px;font-weight:800;color:${r.correct?'var(--correct)':'var(--incorrect)'};margin-bottom:6px;">
          ${r.correct ? '✓ Correct!' : '✗ Not quite'}
        </div>
        ${r.correct ? '' : `<div class="meta" style="margin-bottom:4px;">You put ${esc(r.given||'nothing')}.</div>`}
      </div>
    `));
    const nextBtn=el(`<button class="mmc-btn gold" style="margin-top:12px;width:100%;max-width:300px;font-size:20px;padding:14px;">${t.attempted>=TT_PRACTICE_TOTAL?'See how you went':'Next question'}</button>`);
    nextBtn.onclick=nextTTPracticeQuestion;
    const holder=el('<div style="text-align:center;"></div>');
    holder.appendChild(nextBtn);
    qbox.appendChild(holder);
    wrap.appendChild(qbox);
    return wrap;
  }
  const input=qbox.querySelector('#mmc-tt-input');
  // The typed value used to live only in the DOM. Any background snapshot (a profile,
  // week or live-game update) triggers a full re-render, which rebuilt this field empty
  // and silently wiped a half-typed answer mid-race. Keeping it in state fixes that,
  // and is also what lets the keypad survive a redraw.
  input.oninput=(e)=>{ S.tt.typedValue=e.target.value; };
  const go=()=>{ const v=input.value; input.value=''; S.tt.typedValue=''; submitTTAnswer(v); };
  qbox.querySelector('#mmc-tt-submit').onclick=go;
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
  wrap.appendChild(qbox);
  if(IS_TOUCH){
    qbox.appendChild(buildKeypad(k=>{
      if(k==='go'){ go(); return; }
      if(k==='del') input.value=input.value.slice(0,-1);
      else if(input.value.length<6) input.value+=k;
      S.tt.typedValue=input.value;
    }));
  }
  return wrap;
}

// ---------- Live Game (shared helpers) ----------
// The 'ended' status is only ever written by whoever happens to have the room open — the
// teacher's screen, or a student host's. Close the tab and nobody writes it, so the room
// sits 'active' forever. Because it is the ONLY room students can see, that one stuck room
// blocks the entire Racing Ground for the whole class: no race to finish, no way to start
// another. Treat an expired clock as finished regardless of what the document says; the
// status write becomes a tidy-up rather than something the interface depends on.
function isRaceOver(room){
  if(!room) return true;
  if(room.status==='ended') return true;
  return room.status==='active' && liveTimeLeft(room) <= 0;
}
function liveTimeLeft(room){
  if(!room.startedAt || !room.startedAt.seconds) return room.durationSec||300;
  const elapsed = (Date.now()/1000) - room.startedAt.seconds;
  return Math.max(0, Math.round((room.durationSec||300) - elapsed));
}
function renderLiveLeaderboardCard(title, room, isFinal){
  const card=el(`<div class="mmc-card"><h3>${esc(title)}</h3></div>`);
  const sorted=S.liveParticipants.slice().sort((a,b)=>(b.score||0)-(a.score||0));
  if(sorted.length===0){ card.appendChild(el('<div class="meta">No players yet.</div>')); return card; }
  const medal=(i)=> i===0?'🥇':i===1?'🥈':i===2?'🥉':`${i+1}.`;
  sorted.forEach((p,i)=>{
    card.appendChild(el(`
      <div class="mmc-row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--paper-line);">
        <div>${medal(i)} ${esc(p.name)}</div>
        <div class="mmc-cellscore">${p.score||0} correct</div>
      </div>
    `));
  });
  return card;
}
function renderRaceTrack(myUid, capNearFinish){
  const participants=S.liveParticipants.slice().sort((a,b)=>(a.joinedAt?.seconds||0)-(b.joinedAt?.seconds||0));
  const outer=el('<div class="mmc-race-scene"></div>');
  if(participants.length===0){ outer.appendChild(el('<div class="meta">No players yet.</div>')); return outer; }
  const laneH=46, topPad=14;
  const track=el(`<div class="mmc-race-track" style="height:${participants.length*laneH+topPad*2}px;"></div>`);
  track.appendChild(el('<div class="mmc-race-finish"></div>'));
  participants.forEach((p,i)=>{
    let pos=Math.max(0,Math.min(100,p.position||0));
    if(capNearFinish) pos=Math.min(pos,96); // the line is only actually crossed once time runs out
    const isMe = myUid && p.id===myUid;
    const label = p.nickname || p.username || p.name;
    const colorFilter = HORSE_COLOR_FILTERS[p.horseColor] || 'none';
    const meGlow = isMe ? ' drop-shadow(0 0 5px var(--purple))' : '';
    const combinedFilter = ((colorFilter==='none'?'':colorFilter) + meGlow).trim() || 'none';
    const hatEmoji = HORSE_HAT_EMOJI[p.horseHat] || '';
    const lane=el(`<div class="mmc-race-lane" style="top:${topPad+i*laneH}px;"><div class="mmc-race-track-line"></div></div>`);
    const horse=el(`
      <div class="mmc-race-horse${isMe?' me':''}" style="left:calc(${pos}% - 18px);">
        <span class="mmc-race-horse-wrap">
          ${hatEmoji? `<span class="mmc-race-hat">${hatEmoji}</span>` : ''}
          <span class="mmc-race-emoji" style="filter:${combinedFilter};">🐎</span>
        </span>
        <span class="mmc-race-name">${esc(label)}${isMe?' (you)':''}</span>
      </div>
    `);
    lane.appendChild(horse);
    track.appendChild(lane);
  });
  outer.appendChild(track);
  return outer;
}
function renderChaseCallout(myUid){
  const sorted=S.liveParticipants.slice().sort((a,b)=>(b.position||0)-(a.position||0));
  const myIdx=sorted.findIndex(p=>p.id===myUid);
  if(myIdx===-1) return null;
  if(myIdx===0){
    return el(`<div class="mmc-card" style="text-align:center;background:var(--slime);"><h3 style="margin:0;">🏆 You're in the lead — don't let up!</h3></div>`);
  }
  const ahead=sorted[myIdx-1];
  const gap=Math.max(0.1, (ahead.position||0)-(sorted[myIdx].position||0));
  return el(`<div class="mmc-card" style="text-align:center;"><h3 style="margin:0;">🎯 Chasing ${esc(ahead.name)}</h3><div class="meta" style="margin:2px 0 0;">${gap.toFixed(1)} points ahead of you — answer fast to catch up!</div></div>`);
}

let teacherLiveTimerHandle=null, teacherLiveTimerRoomId=null;
function startLiveTeacherTimer(room){
  if(teacherLiveTimerRoomId===room.id && teacherLiveTimerHandle) return;
  if(teacherLiveTimerHandle) clearInterval(teacherLiveTimerHandle);
  teacherLiveTimerRoomId=room.id;
  teacherLiveTimerHandle=setInterval(async ()=>{
    const r=currentLiveRoom();
    if(!r || r.id!==room.id || r.status!=='active'){ clearInterval(teacherLiveTimerHandle); teacherLiveTimerHandle=null; return; }
    const left=liveTimeLeft(r);
    const timerEl=document.getElementById('mmc-live-timer');
    if(timerEl) timerEl.textContent=formatMMSS(left);
    if(left<=0){
      clearInterval(teacherLiveTimerHandle); teacherLiveTimerHandle=null;
      try{ await updateDoc(doc(db,'liveGames',r.id), {status:'ended'}); }
      catch(e){ S.toast='Could not auto-end the game: '+e.message; render(); }
    }
  },1000);
}
// Runs off the data subscription itself (not the UI), so the 5-minute
// auto-end fires reliably even if the teacher is looking at a different tab.
function ensureTeacherLiveTimer(){
  const room=currentLiveRoom();
  if(room && room.status==='active'){ startLiveTeacherTimer(room); }
  else if(teacherLiveTimerHandle){ clearInterval(teacherLiveTimerHandle); teacherLiveTimerHandle=null; teacherLiveTimerRoomId=null; }
}

// ---------- Live Game (student) ----------
function syncMyLiveSession(){
  const room=currentLiveRoom();
  if(!room){ if(S.myLive){ if(S.myLive.timerHandle) clearInterval(S.myLive.timerHandle); S.myLive=null; } return; }
  if(room.status==='ended'){
    if(S.myLive && S.myLive.gameId===room.id){ if(S.myLive.timerHandle) clearInterval(S.myLive.timerHandle); S.myLive=null; }
    return;
  }
  if(room.status==='lobby') return;
  if(room.status==='active'){
    const joined = S.liveParticipants.some(p=>p.id===S.user.uid);
    if(!joined) return;
    if(S.myLive && S.myLive.gameId===room.id) return;
    if(S.myLive && S.myLive.timerHandle) clearInterval(S.myLive.timerHandle);
    const myLevel = studentRaceLevel(S.profile, room.level);
    S.myLive = { gameId:room.id, level:myLevel, answering:true, qIndex:0, currentQ:genTTQuestion(myLevel,0,studentYear(S.profile)),
      score:0, attempted:0, position:0, questionStartedAt:Date.now(), timerHandle:null, typedValue:'' };
    startMyLiveTimer();
  }
}
function startMyLiveTimer(){
  S.myLive.timerHandle=setInterval(()=>{
    const r=currentLiveRoom();
    if(!r || r.id!==S.myLive.gameId){ clearInterval(S.myLive.timerHandle); return; }
    const left=liveTimeLeft(r);
    const timerEl=document.getElementById('mmc-live-my-timer');
    if(timerEl) timerEl.textContent=formatMMSS(left);
    // If this player is the host, their screen is the only thing that can close the room.
    endMyHostedRaceIfDue(r);
    if(left<=0){ clearInterval(S.myLive.timerHandle); S.myLive.answering=false; render(); }
  },1000);
}
async function submitMyLiveAnswer(given){
  if(!S.myLive || !S.myLive.answering) return;
  const correct = normalize(given)===normalize(String(S.myLive.currentQ.answer));
  S.myLive.attempted++; if(correct) S.myLive.score++;
  flashResult('live', correct);
  const elapsedSec = (Date.now()-S.myLive.questionStartedAt)/1000;
  const allPositions = S.liveParticipants.map(p=>p.position||0);
  const rubberBand = raceRubberBandMultiplier(S.myLive.position, allPositions.length? allPositions : [S.myLive.position]);
  if(correct){
    const boost = raceBoostAmount(S.myLive.currentQ.level, S.myLive.currentQ.isDivision, elapsedSec) * rubberBand;
    S.myLive.position = Math.min(100, S.myLive.position + boost);
  } else {
    S.myLive.position = Math.max(0, S.myLive.position - 0.8);
  }
  S.myLive.qIndex++; S.myLive.currentQ=genTTQuestion(S.myLive.level, S.myLive.qIndex, studentYear(S.profile)); S.myLive.questionStartedAt=Date.now();
  render();
  try{ await updateDoc(doc(db,'liveGames',S.myLive.gameId,'participants',S.user.uid), {score:S.myLive.score, attempted:S.myLive.attempted, position:S.myLive.position}); }
  catch(e){ S.toast='Score sync error: '+e.message; render(); }
}
// Host-side auto-end. Only the TEACHER's screen runs the five-minute clock that closes a
// room, so a student-hosted race with no teacher present would sit 'active' forever and
// block the next race from appearing. Guarded three ways: only the host's device, only
// once, and only when the clock has genuinely run out.
let studentHostEndedRoom=null;
async function endMyHostedRaceIfDue(room){
  if(!room || room.status!=='active') return;
  if(room.hostUid !== S.user.uid) return;
  if(studentHostEndedRoom===room.id) return;
  if(liveTimeLeft(room) > 0) return;
  studentHostEndedRoom=room.id;
  try{ await updateDoc(doc(db,'liveGames',room.id), {status:'ended'}); }
  catch(e){ studentHostEndedRoom=null; }   // let it retry next tick
}

function renderMyLiveSession(){
  const wrap=el('<div></div>');
  const room=currentLiveRoom();
  const head=el(`
    <div class="mmc-card">

  `);
  const input=qbox.querySelector('#mmc-live-input');
  // The race track re-renders every time ANY player in the room answers a question (their
  // score/position updates trigger a fresh snapshot for everyone). A raw <input> only keeps
  // its typed value in the DOM, so without this it gets wiped mid-keystroke every time someone

  input.oninput=(e)=>{ S.myLive.typedValue=e.target.value; };

  if(IS_TOUCH){

      if(k==='del') input.value=input.value.slice(0,-1);

// A student hosting their own race. Deliberately scoped to their OWN teacher's students:
// teacherUid is copied from their profile and the rules refuse anything else, so a race
// can never reach a child in another teacher's class. hostUid marks who may start it.
const STUDENT_RACE_SECONDS = 60;
async function hostStudentRace(){
  if(!S.profile || !S.profile.teacherUid){ S.toast='You need to be in a class to start a race.'; render(); return; }
  try{
    const ref = await addDoc(collection(db,'liveGames'), {
      teacherUid: S.profile.teacherUid,
      hostUid: S.user.uid,
      hostName: S.profile.displayName || '',
      level: studentRaceLevel(S.profile, 'medium'),   // only a fallback; each racer uses their own
      // A student challenge is a quick duel between friends, not the class event — one
      // minute, so it can be run again and again at lunchtime without eating the hour.
      // The teacher's own races stay at five minutes.
      status: 'lobby', createdAt: serverTimestamp(), durationSec: STUDENT_RACE_SECONDS,
      classId: S.profile.classId || null
    });
    await joinLiveGame(ref.id);
  }catch(e){ S.toast='Could not start the race — check your connection.'; render(); }
}

          </div>
        `));
        if(iAmHost){
          const go=el('<button class="mmc-btn gold" style="width:100%;font-size:16px;padding:12px;">🏁 Start the race</button>');
          go.onclick=async ()=>{
            go.disabled=true; go.textContent='Starting…';
            try{ await updateDoc(doc(db,'liveGames',room.id), {status:'active', startedAt:serverTimestamp()}); }
            catch(e){ S.toast='Could not start the race — check your connection.'; go.disabled=false; go.textContent='🏁 Start the race'; render(); }
          };
          wrap.appendChild(go);
        }
      } else {
        wrap.appendChild(el(`<div class="mmc-card"><h3>You're in! ✓</h3><div class="meta">Customize your horse before the race starts.</div></div>`));
        wrap.appendChild(renderHorseCustomizeCard());
        const readyBtn=el('<button class="mmc-btn gold" style="width:100%;font-size:16px;padding:12px;">I\'m Ready! 🏁</button>');
        readyBtn.onclick=async ()=>{ await syncParticipantCustomization(room.id); S.lobbyReadyForRoom=room.id; render(); };
        wrap.appendChild(readyBtn);
      }
    }
    return wrap;
  }
  if(room.status==='active' && !isRaceOver(room)){
    if(!joined){
      wrap.appendChild(el('<div class="mmc-empty"><div class="mmc-empty-icon">🐎</div>This race already started — you can watch, or start your own.</div>'));
      wrap.appendChild(renderStartRaceCard('That race is already running. Start your own one-minute race and your classmates can join yours instead.'));
      wrap.appendChild(renderLiveLeaderboardCard('Live leaderboard', room, false));
      return wrap;
    }
    if(S.myLive && S.myLive.gameId===room.id && !S.myLive.answering){
      wrap.appendChild(el(`<div class="mmc-card"><h3>⏱ Time's up!</h3><div class="meta">Waiting for the final leaderboard…</div></div>`));
      wrap.appendChild(renderLiveLeaderboardCard('Live leaderboard', room, false));
      return wrap;
    }
    wrap.appendChild(el('<div class="mmc-empty">Loading your game…</div>'));
    return wrap;
  }
  if(room.status==='ended'){
    const mine = S.liveParticipants.find(p=>p.id===S.user.uid);
    wrap.appendChild(el(`<div class="mmc-card"><h3>Game over!</h3><div class="meta">${mine? `You scored ${mine.score} correct.` : 'Final results are in.'}</div></div>`));
    wrap.appendChild(renderRaceTrack(S.user.uid));
    wrap.appendChild(renderLiveLeaderboardCard('Final leaderboard', room, true));
    return wrap;
  }
  return wrap;
}

// ---------- Skill Practice sessions (launched from the Student Dashboard) ----------
function startSkillPractice(slot){
  const difficulty='medium';
  const questions=[]; for(let i=0;i<6;i++) questions.push(buildQuestion(slot-1, difficulty));
  const quiz={};
  questions.forEach(q=> quiz[q.id]= q.inputType==='order'
    ? {given:'', pool:shuffleArr(q.items||[]), placed:[], checked:false, correct:false}
    : q.inputType==='classify'
    ? {given:new Array((q.items||[]).length).fill(''), checked:false, correct:false}
    : q.inputType==='parts'
    ? {given:new Array((q.parts||[]).length).fill(''), checked:false, correct:false}
    : q.inputType==='mixed'
    ? {given:{whole:'',num:'',den:''}, checked:false, correct:false}
    : q.inputType==='multi'
    ? {given:[], checked:false, correct:false}
    : {given: q.inputType==='coins' ? [] : '', checked:false, correct:false});
  const myList = slotsForYear(studentYear(S.profile));
  S.skillSession={ slot, title: (myList[slot-1]||SLOTS[slot-1]||{}).title || `Skill ${slot}`, difficulty, questions, quiz, index:0, finished:false };
  render();
}
async function finishSkillPractice(){
  const sess=S.skillSession;
  const score=sess.questions.filter(q=>sess.quiz[q.id].correct).length;
  const answers=sess.questions.map(q=>({ qId:q.id, correct:sess.quiz[q.id].correct }));
  try{
    await addDoc(collection(db,'skillPractice'), {
      uid:S.user.uid, teacherUid:S.profile?S.profile.teacherUid:null, slot:sess.slot,
      score, total:sess.questions.length, answers, submittedAt:serverTimestamp()
    });
  }catch(e){ S.toast='Could not save your practice session — check your connection.'; }
  sess.finished=true; render();
}
function renderSkillPracticeSession(){
  const sess=S.skillSession;
  const wrap=el('<div></div>');
  const back=el('<a href="#" style="color:var(--sky-deep);font-size:13px;">← back to dashboard</a>');
  back.onclick=(e)=>{ e.preventDefault(); S.skillSession=null; render(); };
  wrap.appendChild(back);
  wrap.appendChild(el(`<h3 style="font-family:Fredoka,sans-serif;margin:10px 0 14px;">🎯 Practice: ${esc(sess.title)}</h3>`));

  if(sess.finished){
    const score=sess.questions.filter(q=>sess.quiz[q.id].correct).length;
    const pct=Math.round((score/sess.questions.length)*100);
    wrap.appendChild(el(`
      <div class="mmc-card" style="text-align:center;">
        <div style="font-size:40px;">${pct>=80?'🌟':pct>=50?'👍':'💪'}</div>
        <h3>You scored ${score}/${sess.questions.length}</h3>
        <div class="meta">${pct>=80? "Awesome work — that's really paying off!" : "Nice effort — every bit of practice helps this stick."}</div>
      </div>
    `));
    const row=el('<div class="mmc-row" style="margin-top:10px;"></div>');
    const again=el('<button class="mmc-btn gold">Practice again</button>');
    again.onclick=()=>startSkillPractice(sess.slot);
    const done=el('<button class="mmc-btn ghost">Back to dashboard</button>');
    done.onclick=()=>{ S.skillSession=null; render(); };
    row.appendChild(again); row.appendChild(done);
    wrap.appendChild(row);
    return wrap;
  }

  wrap.appendChild(el(`<div class="meta" style="margin-bottom:8px;">Question ${sess.index+1} of ${sess.questions.length}</div>`));
  const q=sess.questions[sess.index];
  const st=sess.quiz[q.id];
  const qbox=renderQuestionBody(q, st, ()=>{}, '');
  wrap.appendChild(qbox);

  if(st.checked){
    const isLast = sess.index>=sess.questions.length-1;
    const nextBtn=el(`<button class="mmc-btn gold">${isLast?'Finish practice ✓':'Next question →'}</button>`);
    nextBtn.onclick=()=>{ if(isLast){ finishSkillPractice(); } else { sess.index++; render(); } };
    wrap.appendChild(nextBtn);
  }
  return wrap;
}
// Renders one question's input UI (all input types) + Check button + feedback-once-checked.
// Shared by both the Weekly Quiz and the new Skill Practice sessions, so every question type
// only has one place its interaction logic lives — onCheck lets the caller decide what happens
// after grading (save weekly progress, advance a practice session, etc) without duplicating
// any of the input-handling code itself.
function renderQuestionBody(q, st, onCheck, headerHTML){
  const qbox=el(`
    <div class="mmc-quiz-q">
      ${headerHTML}
      ${q.svg ? `<div class="mmc-qsvg">${q.svg}</div>` : ''}
      <div class="qtext">${esc(q.prompt)}</div>
      ${q.hint? `<div class="mmc-hint">${esc(q.hint)}</div>` : ''}
      ${fracPromptHTML(q)}
    </div>
  `);
  function doCheck(){ if(st.checked) return; st.checked=true; st.correct=gradeQuestion(q, st.given);
    st.flags=answerFlags(q, st.given); render(); onCheck(); }

  if(q.inputType==='choice'){
    if(q.renderFractionChoices && q.givenNum!=null){
      const givenRow=el(`<div class="mmc-frac-eq" style="margin-bottom:14px;">${fracHTML(q.givenNum, q.givenDen)}</div>`);
      qbox.appendChild(givenRow);
    }
    const choiceRow=el('<div class="mmc-choices"></div>');
    (q.choices||[]).forEach(c=>{
      const label = q.choiceSymbols && q.choiceSymbols[c]
        ? `<span class="mmc-symbtn"><span class="sym">${esc(q.choiceSymbols[c])}</span><span class="wrd">${esc(c)}</span></span>`
        : (q.renderFractionChoices ? fracChoiceHTML(c) : esc(c));
      const b=el(`<button type="button" class="mmc-choice-btn ${st.given===c?'selected':''}" ${st.checked?'disabled':''}>${label}</button>`);
      b.onclick=()=>{ if(st.checked) return; st.given=c; render(); };
      choiceRow.appendChild(b);
    });
    qbox.appendChild(choiceRow);
    const checkBtn=el(`<button class="mmc-btn ${st.checked?'ghost':'gold'} sm" ${st.checked||!st.given?'disabled':''}>${st.checked?'Checked':'Check'}</button>`);
    checkBtn.onclick=doCheck;
    qbox.appendChild(checkBtn);
  } else if(q.inputType==='mixed'){
    // Whole-number box (optional) plus numerator/denominator stacked to its right.
    // Also used for plain fractions by setting wantWhole:false.
    const wantWhole = q.wantWhole!==false;
    const g=st.given||{};
    const shownVal = (q.showFracNum!=null)
      ? mixedHTML(q.showWhole, q.showFracNum, q.showFracDen)
      : (q.mixedLead ? `<span style="font-family:'IBM Plex Mono',monospace;">${esc(q.mixedLead)}</span>` : '');
    const row=el(`<div class="mmc-frac-eq" style="margin:14px 0 16px;">
      ${shownVal ? shownVal+'<span>=</span>' : ''}
      <span class="mmc-mixed">
        ${wantWhole ? (q.lockWhole!=null
          ? `<span class="whole">${esc(q.lockWhole)}</span>`
          : `<input type="text" class="wholebox" data-f="whole" inputmode="numeric" value="${esc(g.whole||'')}" ${st.checked?'disabled':''}>`) : ''}
        <span class="mmc-frac">
          <input type="text" data-f="num" inputmode="numeric" value="${esc(g.num||'')}" ${st.checked?'disabled':''}>
          <span class="line"></span>
          ${q.lockDen!=null
            ? `<span class="den">${esc(q.lockDen)}</span>`
            : `<input type="text" data-f="den" inputmode="numeric" value="${esc(g.den||'')}" ${st.checked?'disabled':''}>`}
        </span>
      </span>
    </div>`);
    row.querySelectorAll('[data-f]').forEach(inp=>{
      inp.oninput=(e)=>{ st.given=Object.assign({}, st.given, {[e.target.dataset.f]: e.target.value}); };
    });
    qbox.appendChild(row);
    const ready=()=> String((st.given||{}).num||'').trim()!=='' && (q.lockDen!=null || String((st.given||{}).den||'').trim()!=='');
    const mb=el(`<button class="mmc-btn ${st.checked?'ghost':'gold'} sm" ${st.checked?'disabled':''}>${st.checked?'Checked':'Check'}</button>`);
    mb.onclick=()=>{ if(!ready()) return; doCheck(); };
    qbox.appendChild(mb);
  } else if(q.inputType==='parts'){
    // Inline answer boxes rendered in the shape of the question itself, so a
    // partitioning question looks like  823 = [ ] + [ ] + [ ]  rather than one
    // long text field the student has to format by hand.
    const row=el('<div class="mmc-partsrow"></div>');
    if(q.partsLead) row.appendChild(el(`<span class="mmc-partslead">${esc(q.partsLead)}</span>`));
    (q.parts||[]).forEach((pt,i)=>{
      if(i>0 && q.partsJoin) row.appendChild(el(`<span class="mmc-partsjoin">${esc(q.partsJoin)}</span>`));
      const cell=el('<span class="mmc-partscell"></span>');
      if(pt.label) cell.appendChild(el(`<span class="mmc-partslabel">${esc(pt.label)}</span>`));
      const inp=el(`<input type="text" class="mmc-partsbox" value="${esc(st.given[i]||'')}" ${st.checked?'disabled':''} inputmode="decimal">`);
      inp.oninput=(e)=>{ st.given[i]=e.target.value; };
      cell.appendChild(inp);
      row.appendChild(cell);
    });
    if(q.partsTail) row.appendChild(el(`<span class="mmc-partslead">${esc(q.partsTail)}</span>`));
    qbox.appendChild(row);
    const allFilled=()=> (q.parts||[]).every((_,i)=>String(st.given[i]||'').trim()!=='');
    const pb=el(`<button class="mmc-btn ${st.checked?'ghost':'gold'} sm" ${st.checked?'disabled':''}>${st.checked?'Checked':'Check'}</button>`);
    pb.onclick=()=>{ if(!allFilled()) return; doCheck(); };
    qbox.appendChild(pb);
  } else if(q.inputType==='multi'){
    const choiceRow=el('<div class="mmc-choices"></div>');
    (q.choices||[]).forEach(c=>{
      const on=(st.given||[]).indexOf(c)!==-1;
      const b=el(`<button type="button" class="mmc-choice-btn ${on?'selected':''}" ${st.checked?'disabled':''}>${esc(c)}</button>`);
      b.onclick=()=>{ if(st.checked) return;
        const arr=st.given||[]; const i=arr.indexOf(c);
        if(i===-1) arr.push(c); else arr.splice(i,1);
        st.given=arr; render(); };
      choiceRow.appendChild(b);
    });
    qbox.appendChild(el('<div class="meta" style="margin-bottom:6px;">Select all that apply.</div>'));
    qbox.appendChild(choiceRow);
    const mb=el(`<button class="mmc-btn ${st.checked?'ghost':'gold'} sm" ${st.checked||!(st.given||[]).length?'disabled':''}>${st.checked?'Checked':'Check'}</button>`);
    mb.onclick=doCheck;
    qbox.appendChild(mb);
  } else if(q.inputType==='classify'){
    const rows=el('<div></div>');
    (q.items||[]).forEach((it,i)=>{
      const row=el(`
        <div class="mmc-row" style="justify-content:space-between;align-items:center;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--paper-line);">
          <div style="font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:700;min-width:70px;">${it.deg}°</div>
          <div class="mmc-choices" style="margin-bottom:0;"></div>
        </div>
      `);
      const choiceRow=row.querySelector('.mmc-choices');
      ['acute','right','obtuse','straight','reflex'].forEach(label=>{
        const selected = st.given[i]===label;
        const b=el(`<button type="button" class="mmc-choice-btn${selected?' selected':''}" ${st.checked?'disabled':''}>${label[0].toUpperCase()+label.slice(1)}</button>`);
        b.onclick=()=>{ if(st.checked) return; st.given[i]=label; render(); };
        choiceRow.appendChild(b);
      });
      rows.appendChild(row);
    });
    qbox.appendChild(rows);
    const allAnswered = st.given.every(g=>g);
    const classifyCheckBtn=el(`<button class="mmc-btn ${st.checked?'ghost':'gold'} sm" ${st.checked||!allAnswered?'disabled':''}>${st.checked?'Checked':'Check'}</button>`);
    classifyCheckBtn.onclick=doCheck;
    qbox.appendChild(classifyCheckBtn);
  } else if(q.inputType==='fracEasy'){
    const row=el(`
      <div class="mmc-frac-eq">
        ${fracHTML(q.givenNum, q.givenDen)}
        <span>=</span>
        <span class="mmc-frac"><input type="text" id="mmc-frac-in" autocomplete="off" value="${esc(st.given)}" ${st.checked?'disabled':''}><span class="line"></span><span class="den">${esc(q.targetDen)}</span></span>
      </div>
    `);
    const input=row.querySelector('#mmc-frac-in');
    input.oninput=(e)=>{ st.given=e.target.value; };
    input.addEventListener('keydown', e=>{ if(e.key==='Enter' && !st.checked) doCheck(); });
    qbox.appendChild(row);
    const checkBtn=el(`<button class="mmc-btn ${st.checked?'ghost':'gold'} sm" style="margin-top:10px;" ${st.checked?'disabled':''}>${st.checked?'Checked':'Check'}</button>`);
    checkBtn.onclick=doCheck;
    qbox.appendChild(checkBtn);
  } else if(q.inputType==='fracHard'){
    const parts=String(st.given||'').split('/');
    const row=el(`
      <div class="mmc-frac-eq">
        ${fracHTML(q.givenNum, q.givenDen)}
        <span>=</span>
        <span class="mmc-frac">
          <input type="text" id="mmc-frac-num" autocomplete="off" value="${esc(parts[0]||'')}" ${st.checked?'disabled':''}>
          <span class="line"></span>
          <input type="text" id="mmc-frac-den" autocomplete="off" value="${esc(parts[1]||'')}" ${st.checked?'disabled':''}>
        </span>
      </div>
    `);
    const numIn=row.querySelector('#mmc-frac-num'), denIn=row.querySelector('#mmc-frac-den');
    const sync=()=>{ st.given=`${numIn.value.trim()}/${denIn.value.trim()}`; };
    numIn.oninput=sync; denIn.oninput=sync;
    [numIn,denIn].forEach(inp=>inp.addEventListener('keydown', e=>{ if(e.key==='Enter' && !st.checked){ sync(); doCheck(); } }));
    qbox.appendChild(row);
    const checkBtn=el(`<button class="mmc-btn ${st.checked?'ghost':'gold'} sm" style="margin-top:10px;" ${st.checked?'disabled':''}>${st.checked?'Checked':'Check'}</button>`);
    checkBtn.onclick=()=>{ sync(); doCheck(); };
    qbox.appendChild(checkBtn);
  } else if(q.inputType==='coins'){
    // Real coin graphics, scattered on a "table" rather than sorted into a row,
    // so students identify coins by sight the way they would in a shop.
    const tray=el('<div class="mmc-cointray"></div>');
    (q.coins||[]).forEach(c=>{
      const sel=st.given.includes(c.id);
      const b=el(`<button type="button" class="mmc-coin ${sel?'selected':''}" ${st.checked?'disabled':''}
        style="transform:translate(${c.dx||0}px,${c.dy||0}px) rotate(${c.rot||0}deg);" aria-label="${esc(c.l)}">${coinSVG(c.v)}</button>`);
      b.onclick=()=>{ if(st.checked) return; st.given = sel ? st.given.filter(id=>id!==c.id) : [...st.given, c.id]; render(); };
      tray.appendChild(b);
    });
    qbox.appendChild(tray);
    const chosen=(q.coins||[]).filter(c=>st.given.includes(c.id));
    const runTotal=chosen.reduce((t,c)=>t+c.v,0);
    if(q.showRunningTotal){
      const cls = runTotal===q.targetCents ? ' hit' : '';
      qbox.appendChild(el(`<div class="mmc-cointotal${cls}">Total so far: <b>${fmtCents(runTotal)}</b>
        <span class="tgt">Target ${fmtCents(q.targetCents)}</span></div>`));
    } else {
      qbox.appendChild(el(`<div class="meta" style="margin-top:6px;">${chosen.length} coin${chosen.length===1?'':'s'} selected.</div>`));
    }
    const checkBtn=el(`<button class="mmc-btn ${st.checked?'ghost':'gold'} sm" ${st.checked||st.given.length===0?'disabled':''}>${st.checked?'Checked':'Check'}</button>`);
    checkBtn.onclick=doCheck;
    qbox.appendChild(checkBtn);
  } else if(q.inputType==='order'){
    const slotsRow=el('<div class="mmc-choices" style="min-height:44px;"></div>');
    for(let s=0;s<(q.items||[]).length;s++){
      const val=st.placed[s];
      if(val===undefined){
        slotsRow.appendChild(el(`<div class="mmc-order-slot"></div>`));
      } else {
        const b=el(`<button type="button" class="mmc-choice-btn selected" ${st.checked?'disabled':''}>${esc(val)}</button>`);
        b.onclick=()=>{ if(st.checked) return; st.placed=st.placed.filter((_,idx)=>idx!==s); st.pool.push(val); render(); };
        slotsRow.appendChild(b);
      }
    }
    qbox.appendChild(el('<div class="meta" style="margin-bottom:4px;">Your order:</div>'));
    qbox.appendChild(slotsRow);
    qbox.appendChild(el('<div class="meta" style="margin:10px 0 4px;">Tap to add:</div>'));
    const poolRow=el('<div class="mmc-choices"></div>');
    st.pool.forEach(val=>{
      const b=el(`<button type="button" class="mmc-choice-btn" ${st.checked?'disabled':''}>${esc(val)}</button>`);
      b.onclick=()=>{ if(st.checked) return; st.pool=st.pool.filter(v=>v!==val); st.placed.push(val); render(); };
      poolRow.appendChild(b);
    });
    qbox.appendChild(poolRow);
    const btnRow=el('<div class="mmc-row" style="margin-top:8px;"></div>');
    const resetBtn=el(`<button class="mmc-btn ghost sm" ${st.checked?'disabled':''}>Reset</button>`);
    resetBtn.onclick=()=>{ if(st.checked) return; st.pool=shuffleArr(q.items||[]); st.placed=[]; render(); };
    const allPlaced = st.placed.length===(q.items||[]).length;
    const checkBtn=el(`<button class="mmc-btn ${st.checked?'ghost':'gold'} sm" ${st.checked||!allPlaced?'disabled':''}>${st.checked?'Checked':'Check'}</button>`);
    checkBtn.onclick=()=>{ if(!allPlaced) return; st.given=st.placed.join(','); doCheck(); };
    btnRow.appendChild(resetBtn); btnRow.appendChild(checkBtn);
    qbox.appendChild(btnRow);
  } else {
    const row=el(`
      <div class="answer-row">
        <input type="text" value="${esc(st.given)}" ${st.checked?'disabled':''} placeholder="Your answer">
        <button class="mmc-btn ${st.checked?'ghost':'gold'} sm" ${st.checked?'disabled':''}>${st.checked?'Checked':'Check'}</button>
      </div>
    `);
    const input=row.querySelector('input'); const btn=row.querySelector('button');
    input.oninput=(e)=>{ st.given=e.target.value; };
    input.addEventListener('keydown', e=>{ if(e.key==='Enter' && !st.checked) doCheck(); });
    btn.onclick=doCheck;
    qbox.appendChild(row);
  }

  if(st.checked){
    const correctText = q.inputType==='coins' ? `Try a different combination adding up to ${fmtCents(q.targetCents)}.`
      : q.inputType==='classify' ? `The answers were: ${(q.items||[]).map(it=>`${it.deg}° = ${it.correct}`).join(', ')}.`
      : `The answer was ${esc(q.answer)}.`;
    const nudge = (st.correct && (st.flags||[]).indexOf('could_simplify')!==-1) ? nudgeText(q, st.given) : '';
    const fb=el(`<div class="mmc-feedback ${st.correct?'ok':'no'}">${st.correct? '✓ Correct!' : `✗ Not quite. ${correctText}`}${q.explanation? ' — '+esc(q.explanation):''}${nudge? `<div class="mmc-nudge">${esc(nudge)}</div>`:''}</div>`);
    qbox.appendChild(fb);
  }
  return qbox;
}
function renderQuizTaking(week){
  const wrap=el('<div></div>');
  const back=el('<a href="#" style="color:var(--sky-deep);font-size:13px;">← back to The Arena</a>');
  back.onclick=(e)=>{ e.preventDefault(); S.activeWeekId=null; render(); };
  wrap.appendChild(back);
  wrap.appendChild(el(`<h3 style="font-family:Fredoka,sans-serif;margin:10px 0 14px;">${esc(week.label)}</h3>`));
  const qs = visibleQuestions(week);
  qs.forEach((q,i)=>{
    const st=S.quiz[q.id];
    const header=`<div class="qnum">Question ${i+1} of ${qs.length} — ${esc(q.title||'')}${q.strategyLabel?` (${esc(q.strategyLabel)})`:''}</div>`;
    const qbox=renderQuestionBody(q, st, ()=>saveWeekProgress(week), header);
    wrap.appendChild(qbox);
  });
  const allChecked=qs.every(q=>S.quiz[q.id] && S.quiz[q.id].checked);
  const finishBtn=el(`<button class="mmc-btn gold" ${allChecked?'':'disabled'} style="margin-top:6px;">Finish week ✓</button>`);
  if(!allChecked) wrap.appendChild(el('<div class="meta" style="margin-bottom:8px;">Check every question to finish.</div>'));
  finishBtn.onclick=async ()=>{
    const score=week.questions.filter(q=>S.quiz[q.id].correct).length;
    const total=week.questions.length;
    const answers=visibleQuestions(week).map(q=>({ qId:q.id, given:S.quiz[q.id].given, correct:S.quiz[q.id].correct, flags:S.quiz[q.id].flags||[] }));
    try{
      await setDoc(doc(db,'results', `${S.user.uid}_${week.id}`), {
        uid:S.user.uid, studentName:S.profile? S.profile.displayName : S.user.email, studentEmail:S.user.email,
        teacherUid: S.profile ? S.profile.teacherUid : null,
        weekId:week.id, weekLabel:week.label, score, total, answers, submittedAt:serverTimestamp()
      });
    }catch(e){ S.toast='Could not save your result — check your connection and try again.'; render(); return; }
    deleteWeekProgress(week.id);
    S.activeWeekId=null; render();
  };
  wrap.appendChild(finishBtn);
  return wrap;
}

render();
</script>
</body>
</html>
