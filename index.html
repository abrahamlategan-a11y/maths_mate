// ---------- Classes (a teacher who runs more than one group of students) ----------
let ensuringDefaultClass=false;
async function ensureDefaultClass(){
  if(S.classesEnsured || ensuringDefaultClass) return;
  if(S.classes.length>0){ S.classesEnsured=true; return; }
  ensuringDefaultClass=true;
  try{
    // This is a MIGRATION, not a setup step. It exists to give a home to students who were
    // created before classes did. A brand-new teacher has no such students, and handing her
    // a "Class 1" at Year 4 that she never asked for. And now cannot re-year, because the
    // year is fixed at creation. Is worse than giving her nothing. So: look first, and
    // only create a class if there is actually something to rescue.
    const existingStudents = await getDocs(query(collection(db,'profiles'), where('teacherUid','==',S.user.uid)));
    const orphans = existingStudents.docs.filter(d=>{ const x=d.data(); return x.username && !x.classId; });
    if(!orphans.length){ S.classesEnsured=true; ensuringDefaultClass=false; return; }
    const ref=await addDoc(collection(db,'classes'), { name:'Class 1', teacherUid:S.user.uid, createdAt:serverTimestamp(), yearLevel:DEFAULT_YEAR });
    for(const d of orphans){
      try{ await updateDoc(doc(db,'profiles',d.id), {classId:ref.id}); }catch(e){}
    }
    S.currentClassId=ref.id;
  }catch(e){ /* if this failed, S.classes is still empty next time and we'll retry */ }
  S.classesEnsured=true;
  ensuringDefaultClass=false;
  render();
}
// Year level is stored per class so question generation can eventually scale
// difficulty by year (3–6) rather than assuming Year 4. Existing classes have
// no yearLevel and fall back to DEFAULT_YEAR until the teacher sets one.
// Pre-Primary is stored as 0. It has to be a number so it sorts and compares with the
// rest, and 0 sits naturally below Year 1. Never render it with "Year" in front; use
// yearLabel(). DEFAULT_YEAR stays 4, so every existing student is untouched.
const YEAR_LEVELS=[0,1,2,3,4,5,6];
const DEFAULT_YEAR=4;
const FAST_FACT_YEARS=[0,1,2,3];
function yearLabel(y){ return (+y===0) ? 'Pre-Primary' : 'Year '+(+y); }
function classYear(cls){
  const y=cls && cls.yearLevel;
  // Same trap as studentYear: a null class gives `+null === 0`, which is now Pre-Primary.
  // Every class created before year levels existed would have become Pre-Primary.
  if(y===null || y===undefined || y==='') return DEFAULT_YEAR;
  return (YEAR_LEVELS.indexOf(+y)!==-1) ? +y : DEFAULT_YEAR;
}
// Creating a class was two typed prompts, so the year levels were never actually LISTED. // a teacher had to know that 0 meant Pre-Primary and guess the rest. A real form with a
// dropdown shows every option, and makes the "you cannot change this later" warning

// School portals export "Smith, Jasmine" and often "Smith, Jasmine (Jazz)". Neither reads
// well as a display name, and retyping thirty of them is the kind of tedium that stops a
// teacher trying the app at all.
// Which class the last batch actually went into. Named on the results card because a
// batch landing in the wrong class is otherwise invisible until somebody notices weeks
// later that a Year 1 is doing Year 4 work.
function bulkResultClassName(){
  const c=(S.classes||[]).find(x=>x.id===S.bulkResultClassId);
  return c ? `${c.name} · Year Level: ${classYear(c)===0?'Pre-Primary':classYear(c)}` : 'your class';
}
function normaliseStudentName(line, swap){
  let t=String(line||'').trim();
  // A preferred name in brackets wins. "Smith, Jasmine (Jazz)" is Jazz to everyone who
  // knows her, and that is the name she should see on her own screen.
  let preferred=null;
  const br=t.match(/[\(\[]([^\)\]]+)[\)\]]/);
  if(br){ preferred=br[1].trim(); t=t.replace(br[0],' ').trim(); }
  if(t.includes(',')){
    // A comma always means "surname first". Nobody writes "Smith, Jasmine" meaning
    // Smith is the given name, so this does not wait for the toggle.
    const [a,b]=t.split(',',2).map(x=>x.trim());
    t = `${b} ${a}`;
  } else if(swap){
    const parts=t.split(/\s+/);
    if(parts.length>1) t = parts.slice(1).join(' ') + ' ' + parts[0];
  }
  t=t.replace(/\s+/g,' ').trim();
  if(preferred){
    const rest=t.split(/\s+/).slice(1).join(' ');
    t = rest ? `${preferred} ${rest}` : preferred;
  }
  return t;
}

async function createClass(name, yearLevel){
  name=(name||'').trim();
  if(!name) return;
  const year=(YEAR_LEVELS.indexOf(+yearLevel)!==-1)? +yearLevel : DEFAULT_YEAR;
  try{
    const ref=await addDoc(collection(db,'classes'), { name, yearLevel:year, teacherUid:S.user.uid, createdAt:serverTimestamp() });
    S.currentClassId=ref.id;
    // Returned so a caller adding students in the same breath does not have to wait for
    // the classes listener to catch up. That race put a whole class of students into no
    // class at all: they existed, but belonged nowhere.
    return ref;
  }catch(e){ S.toast='Could not create class. Check your connection.'; render(); }
  return null;
}
// Renaming changes the NAME only. The year level is fixed when the class is created and
// cannot be edited afterwards. Every set, every result and every student's question
// history was built against it, so changing it later would silently reinterpret work that
// has already happened. To change year, delete the class and make a new one.
async function renameClass(classId, name){
  name=(name||'').trim();
  if(!name) return;
  try{ await updateDoc(doc(db,'classes',classId), {name}); }
  catch(e){ S.toast='Could not rename class. Check your connection.'; render(); }
}
// A CLASS IS ONE YEAR LEVEL. A composite room is two classes. That decision keeps
// everything else simple: one set per class, one audience, no ambiguity about who a
// generated paper is for.
//
// The year still has to sit on each profile, because students cannot read the `classes`
// collection and their own profile is the only thing they can see. So the profile carries
// a COPY, and the app maintains it. The teacher never sets it per student. Whenever a
// class's year changes, or a student moves class, the copy is brought back into line.
async function syncClassYearToStudents(classId, year){
  const uids=Object.keys(S.profiles||{}).filter(u=>{
    const p=S.profiles[u]; return p && p.username && p.classId===classId && studentYear(p)!==+year;
  });
  if(!uids.length) return;
  let done=0;
  for(const uid of uids){

  }
  if(done) S.toast=`${done} student${done===1?'':'s'} moved to ${yearLabel(year)}.`;
  render();
}

// ---------- Login card PDF layout (pure math. Testable without the PDF/QR libraries themselves) ----------
function computeCardLayout(n, opts){
  opts = opts || {};
  const pageW=opts.pageW||210, pageH=opts.pageH||297; // A4 in mm
  const cardW=opts.cardW||85, cardH=opts.cardH||54; // close to a standard business card
  const marginX=opts.marginX||12, marginY=opts.marginY||12;
  const gapX=opts.gapX||6, gapY=opts.gapY||6;
  const cols=Math.max(1, Math.floor((pageW-marginX*2+gapX)/(cardW+gapX)));
  const rows=Math.max(1, Math.floor((pageH-marginY*2+gapY)/(cardH+gapY)));
  const positions=[];
  let col=0, row=0, page=0;
  for(let i=0;i<n;i++){
    if(row>=rows){ row=0; col=0; page++; }
    const x=marginX+col*(cardW+gapX), y=marginY+row*(cardH+gapY);
    positions.push({x,y,page,cardW,cardH});
    col++;
    if(col>=cols){ col=0; row++; }
  }
  return {positions, cols, rows, cardW, cardH, pageW, pageH};
}
// Cache the PROMISE, not just the tag. The old version resolved straight away if a
// <script> with that src already existed. But an existing tag doesn't mean the
// script has finished executing. A second call while the first was still loading
// resolved immediately and the caller then used a library that wasn't defined yet,
// which is why the login-card PDF failed on the first click and worked on the
// second. Returning the same pending promise makes every caller wait properly.
const _scriptPromises = {};
function loadScriptOnce(url){
  if(_scriptPromises[url]) return _scriptPromises[url];
  _scriptPromises[url] = new Promise((resolve,reject)=>{
    // Always append a fresh tag. Reusing an existing one meant attaching a
    // 'load' listener to a script that had ALREADY loaded. The event never
    // fires again and the promise hangs forever. A duplicate tag is harmless;
    // the browser serves it from cache and the library simply re-registers.
    const s=document.createElement('script');
    s.src=url; s.async=true;
    // A school proxy that HOLDS the connection open rather than refusing it never
    // fires an error event, so without this the promise waits forever and the
    // button sits on "Preparing…" indefinitely. Fail loudly after 12 seconds.
    const timer = setTimeout(()=>{
      delete _scriptPromises[url];
      reject(new Error('Timed out loading '+url+'the network may be blocking it'));
    }, 12000);
    s.addEventListener('load', ()=>{ clearTimeout(timer); resolve(); });
    s.addEventListener('error', ()=>{
      clearTimeout(timer);
      delete _scriptPromises[url];   // allow a retry on the next click
      reject(new Error('Failed to load '+url));
    });
    document.head.appendChild(s);
  });
  return _scriptPromises[url];
}
function waitForGlobal(name, timeoutMs){
  const limit = Date.now() + (timeoutMs||8000);
  return new Promise((resolve,reject)=>{
    (function poll(){
      if(window[name]) return resolve(window[name]);
      if(Date.now()>limit) return reject(new Error(name+' did not become available'));
      setTimeout(poll, 60);
    })();
  });
}
async function generateLoginCardsPDF(students, btnId, idleLabel, btnEl){
  // Accepts either an element id or the element itself. The per-class buttons in
  // Edit classes are generated in a loop and have no stable ids.
  const btn = btnEl || document.getElementById(btnId || 'mmc-bulk-pdf');
  idleLabel = idleLabel || (btnEl ? btnEl.textContent : 'Download Login Cards PDF');
  const setBtnState=(text,disabled)=>{ if(btn){ btn.textContent=text; btn.disabled=disabled; } };
  setBtnState('Preparing…', true);
  // jsPDF is REQUIRED. Without it there are no cards at all.
  try{
    if(!window.jspdf) await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    await waitForGlobal('jspdf');
  }catch(e){
    // Surface the real reason. A blocked CDN on a school network and a plain
    // offline error need different responses from the teacher.
    console.error('PDF tools failed to load:', e);
    S.toast='Could not load the PDF tool ('+(e && e.message ? e.message : 'unknown error')+'). If your school network blocks cdnjs.cloudflare.com, use Download logins CSV instead.';
    setBtnState(idleLabel, false); render(); return;
  }
  // Printed on every card, so it must be the address we want people typing. // not whatever local or GitHub URL the teacher happened to be on.
  const siteUrl = 'https://mathmentum.com.au';
  const siteLabel = 'mathmentum.com.au';
  // The QR code is a convenience, not a requirement. The web address is printed
  // on every card either way. jsdelivr is blocked on some school networks, so we
  // try a couple of mirrors and simply carry on without a QR if none load.
  let qrDataUrl = null;
  if(!window.QRCode){
    const mirrors = [
      'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js',
      'https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js',
      'https://unpkg.com/qrcode@1.5.3/build/qrcode.min.js',
    ];
    for(const m of mirrors){
      try{ await loadScriptOnce(m); await waitForGlobal('QRCode', 3000); break; }
      catch(e){ console.warn('QR mirror unavailable:', m); }
    }
  }
  if(window.QRCode && typeof window.QRCode.toDataURL === 'function'){
    try{ qrDataUrl = await window.QRCode.toDataURL(siteUrl, {width:300, margin:1}); }
    catch(e){ console.warn('QR code generation failed. Continuing without it:', e); }
  }

  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:'mm', format:'a4'});
    const usable = students.filter(s=>s.status==='ok');
    const { positions, cardW, cardH } = computeCardLayout(usable.length);
    let currentPage=0;
    usable.forEach((s,i)=>{
      const pos=positions[i];
      if(pos.page>currentPage){ doc.addPage(); currentPage=pos.page; }
      const {x,y}=pos;
      doc.setDrawColor(190); doc.setLineWidth(0.3); doc.rect(x,y,cardW,cardH);
      doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(30,30,30);
      doc.text('Mathmentum Login', x+5, y+8);
      doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(20,20,20);
      doc.text(String(s.name).slice(0,26), x+5, y+16);
      doc.setFontSize(9);
      doc.setTextColor(110,110,110); doc.text('Username:', x+5, y+25);
      doc.setTextColor(20,20,20); doc.setFont('helvetica','bold'); doc.text(String(s.username), x+28, y+25);
      doc.setFont('helvetica','normal'); doc.setTextColor(110,110,110); doc.text('Password:', x+5, y+32);
      doc.setTextColor(20,20,20); doc.setFont('helvetica','bold'); doc.text(String(s.password), x+28, y+32);
      // The web address is printed whether or not the QR renders. A card with a
      // failed QR and no URL leaves a student with no way to reach the site.
      doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(40,40,40);
      doc.text(siteLabel, x+5, y+cardH-7);
      if(qrDataUrl){
        doc.setFont('helvetica','normal'); doc.setFontSize(6.5); doc.setTextColor(130,130,130);
        doc.text('or scan to open', x+5, y+cardH-2.5);
        doc.addImage(qrDataUrl, 'PNG', x+cardW-24, y+cardH-24, 19, 19);
      }
    });
    doc.save('mathmentum-login-cards.pdf');
  }catch(e){
    S.toast='Something went wrong building the PDF. Check the browser console for details.';
  }
  setBtnState(idleLabel, false); render();
}

function currentLiveRoom(){
  if(!S.liveGames || !S.liveGames.length) return null;
  // Keep races scoped to whichever class is relevant right now. A teacher sees only the
  // room for their currently-selected class (or everything, if "All classes" is active);
  // a student sees only rooms for their own class. Rooms with no classId (created before
  // this feature existed) stay visible to everyone as a safe fallback.
  const myClassId = S.isTeacher ? (S.showAllClasses ? null : S.currentClassId) : (S.profile && S.profile.classId);
  const visible = S.liveGames.filter(g => !g.classId || !myClassId || g.classId===myClassId);
  // isRaceOver covers BOTH a room marked ended and one still marked active whose clock ran
  // out. The second kind was landing in this list and staying there forever, because the
  // expiry below only ever looked at rooms marked ended. That is why a finished race sat
  // on the Racing Ground for the best part of an hour.
  //
  // A lobby nobody ever started is dead too. It is not "ended" and its clock never began,
  // so nothing retired it. After LOBBY_MAX_AGE_SEC it stops being offered.
  const nowSec = Date.now()/1000;
  const active = visible.filter(g=>{
    if(g.status!=='lobby' && g.status!=='active') return false;
    if(isRaceOver(g)) return false;
    if(g.status==='lobby'){
      const opened = (g.createdAt && g.createdAt.seconds) || 0;
      if(opened && (nowSec-opened) > LOBBY_MAX_AGE_SEC) return false;
    }
    return true;
  });
  // A race joined by PIN is a deliberate choice, so it beats anything the class happens
  // to have open. Including the teacher's. Walking into a lesson would otherwise silently
  // pull a child out of the race they just joined with their sister.
  // THE RACE YOU JOINED wins, always. Every other rule here is a guess at what someone
  // probably wants; this one is a fact. Children could not tell whose race they were in
  // because the app kept choosing for them, and kept choosing differently as rooms opened
  // and closed around them.
  if(S.joinedRoomId){
    const mine = active.find(g=>g.id===S.joinedRoomId)
      || (S.externalRoom && S.externalRoom.id===S.joinedRoomId && !isRaceOver(S.externalRoom) ? S.externalRoom : null);
    if(mine) return mine;
  }
  if(S.externalRoom && !isRaceOver(S.externalRoom)) return S.externalRoom;
  if(active.length){
    const newest = active.slice().sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
    // A CLASS race outranks everything. When a teacher starts one it is a whole-class
    // event, and children hunting through competing lobbies is exactly the confusion it
    // is meant to replace. A teacher room has no hostUid; while one is open, every
    // student-hosted race is hidden and nobody can start another.
    const classRace = newest.find(g=>!g.hostUid);
    if(classRace) return classRace;
    // Otherwise a room YOU host wins, so two children can host at once and each stays in
    // their own lobby instead of being pulled into whichever started most recently.
    const mine = newest.find(g=>g.hostUid && S.user && g.hostUid===S.user.uid);
    return mine || newest[0];
  }
  // A finished race stayed on screen forever, so the Racing Ground always opened on a
  // stale leaderboard from some race nobody remembered. Results are worth seeing straight
  // afterwards and worth nothing an hour later, so they expire.
  const now = nowSec;
  const ended = visible.filter(g=>isRaceOver(g) && !((S.raceSeen||{})[g.id])
      && raceEndedSecondsAgo(g, now) <= RACE_RESULT_WINDOW_SEC)
    .slice().sort((a,b)=>(raceEndedAtSeconds(b)||0)-(raceEndedAtSeconds(a)||0));
  return ended[0] || null;
}
// How long a finished race stays on screen. Long enough to look at the result together,
// short enough that the Racing Ground is clear by the next lesson.
const RACE_RESULT_WINDOW_SEC = 15*60;
// A lobby that was never started. Nothing marks it ended and its clock never ran, so
// without this it is offered forever.
const LOBBY_MAX_AGE_SEC = 30*60;

// ---------- Joining a race by PIN ----------
// Four digits, because a six-year-old has to read it aloud across a kitchen table. The
// trade is that 10,000 is a small space, so it is narrowed in every other direction: a PIN
// only points at a race while that race is open, it is retired the moment the race ends,
// and the lookup can be read one at a time but never listed, so the codes cannot be swept.
async function generateRacePin(){
  // Unique among races that are currently open. 10,000 codes sounds ample until you
  // remember the birthday problem. With a hundred open races, a blind pick collides
  // surprisingly often.
  for(let i=0;i<25;i++){
    const pin=String(randInt(1000,9999));
    try{
      const snap=await getDoc(doc(db,'racePins',pin));
      if(!snap.exists()) return pin;
      const d=snap.data()||{};
      // A stale pointer to a race that has finished is free to reuse.
      if(d.expiresAt && d.expiresAt < Date.now()) return pin;
    }catch(e){ return pin; }   // cannot check: take it rather than block the race
  }
  return String(randInt(1000,9999));
}

// Joining someone else's race. The room is outside this student's teacher, so it is not in
// S.liveGames and never will be. It gets its own listener, and currentLiveRoom prefers it.
async function joinRaceByPin(pin){
  pin=String(pin||'').trim();
  if(!/^\d{4}$/.test(pin)){ S.toast='A race PIN is 4 numbers.'; render(); return; }
  S.pinBusy=true; render();
  try{
    const snap=await getDoc(doc(db,'racePins',pin));
    if(!snap.exists()){ S.toast='No race with that PIN. Check the numbers and try again.'; S.pinBusy=false; render(); return; }
    const info=snap.data()||{};
    if(info.expiresAt && info.expiresAt < Date.now()){
      S.toast='That race has finished.'; S.pinBusy=false; render(); return;
    }
    await setDoc(doc(db,'liveGames',info.gameId,'participants',S.user.uid), {
      uid:S.user.uid,
      name:(S.profile&&S.profile.displayName)||(S.profile&&S.profile.username)||'Player',
      score:0, position:0, joinedAt:serverTimestamp(),
      horseColor:equippedHorseColor(),
      horseHat:equippedHorseHat()
    });
    S.externalRoomId = info.gameId;
    S.joinedRoomId = info.gameId;
    subscribeExternalRoom(info.gameId);
    ensureParticipantsSub(info.gameId);   // same reason: do not wait for a render
    S.raceLeft=null;
    S.toast=`You've joined ${info.hostName? info.hostName+"'s" : 'the'} race!`;
  }catch(e){
    // Naming one likely cause was wrong: this fired for every failure, so a real bug in
    // the rules read as "a teacher turned it off" and hid itself for a week. Say what is
    // known, and put the actual reason where it can be found.
    const msg=String((e&&e.message)||'');
    S.toast = /permission|insufficient/i.test(msg)
      ? 'Could not join that race. Either the teacher has switched off racing between classes, or the race has finished.'
      : 'Could not join that race. Check your connection and try again.';
    try{ console.warn('Mathmentum joinRaceByPin failed:', e); }catch(_){}
  }
  S.pinBusy=false; render();
}
let externalRoomUnsub=null;
function subscribeExternalRoom(gameId){
  if(externalRoomUnsub){ externalRoomUnsub(); externalRoomUnsub=null; }
  if(!gameId){ S.externalRoom=null; return; }
  externalRoomUnsub = onSnapshot(doc(db,'liveGames',gameId), snap=>{
    S.externalRoom = snap.exists() ? {id:snap.id, ...snap.data()} : null;
    if(S.externalRoom && isRaceOver(S.externalRoom) &&
       raceEndedSecondsAgo(S.externalRoom) > RACE_RESULT_WINDOW_SEC){
      // Let go of it once the result has expired, so a child is not stuck looking at
      // someone else's finished race instead of their own class's next one.
      S.externalRoomId=null; S.externalRoom=null;
      if(externalRoomUnsub){ externalRoomUnsub(); externalRoomUnsub=null; }
    }
    ensureParticipantsSub(currentLiveRoom()?.id||null, true);
    if(S.myLive && S.myLive.answering) return;
    render();
  }, ()=>{ S.externalRoom=null; render(); });
}
// When a race actually finished. New rooms record endedAt; older ones do not, so fall
// back to when it would have run out. Which is right for a race that timed out, and
// close enough for one that was cancelled.
function raceEndedAtSeconds(g){
  if(!g) return 0;
  if(g.endedAt && g.endedAt.seconds) return g.endedAt.seconds;
  const created = (g.createdAt && g.createdAt.seconds) || 0;
  if(!created) return 0;
  return created + (Number(g.durationSec) || 300);
}
function raceEndedSecondsAgo(g, nowSec){
  const at = raceEndedAtSeconds(g);
  if(!at) return Infinity;                 // no timestamp at all: treat as ancient
  return (nowSec || Date.now()/1000) - at;
}
let liveParticipantsGen = 0;
// `keepIfUnknown` is the difference between "there is definitely no race" and "I cannot
// see one at this instant". The three callers that pass it fire from snapshots, where the
// room list is momentarily behind, and tearing the listener down there killed the one
// attached when the race was created. The room resolved a second later and nothing was
// watching it, which is why a lobby stayed empty until a refresh rebuilt everything.
// A quiet trace of what this listener is doing. Silent failures here have cost several
// lessons, and one line in the console is cheaper than another guess.
function ensureParticipantsSub(gameId, keepIfUnknown){
  // On by default while this is being chased. Cheap, and it turns a silent failure into
  // a line anyone can read back to me.
  try{ console.log('[race] sub ->', gameId, '| was', liveParticipantsRoomId, '| keep', !!keepIfUnknown); }catch(e){}
  if(!gameId){
    if(keepIfUnknown) return;   // transient, not a decision
    if(liveParticipantsUnsub){ liveParticipantsUnsub(); liveParticipantsUnsub=null; }
    liveParticipantsRoomId=null; S.liveParticipants=[]; liveParticipantsGen++; return;
  }
  // Same room: nothing to do. Crucially this does NOT clear the list, so a re-render
  // while a race is live never empties the lobby.
  if(liveParticipantsRoomId===gameId) return;
  if(liveParticipantsUnsub) liveParticipantsUnsub();
  liveParticipantsRoomId=gameId;
  const myGen = ++liveParticipantsGen;
  liveParticipantsUnsub = onSnapshot(collection(db,'liveGames',gameId,'participants'), snap=>{
    if(myGen!==liveParticipantsGen){
      try{ console.log('[race] IGNORED a snapshot for', gameId, '- superseded'); }catch(e){}
      return; // this listener has been superseded
    }
    try{ console.log('[race] got', snap.docs.length, 'players for', gameId); }catch(e){}
    S.liveParticipants=snap.docs.map(d=>({id:d.id,...d.data()}));
    // In a busy race, other students submit answers constantly. With a full class racing,
    // that can mean several updates per second hitting every screen. A student who is
    // actively typing their own answer must NOT have their whole screen rebuilt every time
    // someone else answers, or typing becomes impossible no matter how well the typed value
    // itself is preserved across renders. Their own race position still updates the instant
    // THEY submit an answer (which re-renders normally); this just skips the re-renders that
    // would otherwise land mid-keystroke from everyone else's activity.
    if(S.myLive && S.myLive.answering) return;
    render();
  }, (err)=>{
    if(myGen!==liveParticipantsGen) return; // stale/superseded listener erroring after being replaced. Ignore
    // A permission error here is almost always transient: the listener attached a
    // fraction of a second before the join was written, or it is pointed at a race in
    // another class that this student has not entered. Neither is something a child can
    // act on, and "Missing or insufficient permissions" in red is alarming and useless.
    // Clear the list, let the next render re-point it, and stay quiet.
    if(/permission|insufficient/i.test(err.message||'')){
      S.liveParticipants=[]; render(); return;
    }
    S.toast='Leaderboard error: '+err.message; render();
  });
}

function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// A week is "live" (visible to students) if it's explicitly published, OR it's still a
// draft but has a scheduled activation time that has now passed.
function isWeekLive(week){
  if(week.status==='published') return true;
  if(week.status==='draft' && week.scheduledAt){
    const ms = week.scheduledAt.seconds!=null ? week.scheduledAt.seconds*1000 : (week.scheduledAt instanceof Date ? week.scheduledAt.getTime() : null);
    return ms!=null && Date.now()>=ms;
  }
  return false;
}
function formatScheduledAt(ts){
  if(!ts) return '';
  const ms = ts.seconds!=null ? ts.seconds*1000 : (ts instanceof Date ? ts.getTime() : null);
  if(ms==null) return '';
  return new Date(ms).toLocaleString(undefined, {weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit'});
}
// Renders any fraction that belongs to the QUESTION rather than the answer, so
// students always see a proper stacked fraction instead of "3/4" as plain text.
// A correct answer can still be a teaching moment. When simplification isn't the
// assessed skill we mark the answer right, but tell the student what they could
// have done. And record a flag so the feedback page can spot a pattern of it.
function answerFlags(q, given){
  const flags=[];
  // Area and perimeter are ONE mark, but the feedback page needs to know which
  // half went wrong. A student who always nails area and fumbles perimeter has
  // a specific gap that a single red mark completely hides.
  if(q.apArea!=null && Array.isArray(given)){
    const aOk = Number(given[0])===Number(q.apArea);
    const pOk = Number(given[1])===Number(q.apPerim);
    if(aOk && !pOk) flags.push('perimeter_wrong');
    else if(!aOk && pOk) flags.push('area_wrong');
    else if(!aOk && !pOk) flags.push('area_and_perimeter_wrong');
    else flags.push('area_and_perimeter_correct');
  }
  if(q.inputType==='mixed' && given && !q.requireSimplest){
    const n=Number(given.num), d=Number(given.den);
    if(isFinite(n)&&isFinite(d)&&d!==0&&n!==0&&!isSimplest(n,d)) flags.push('could_simplify');
  }
  return flags;
}
function nudgeText(q, given){
  if(!given) return '';
  const n=Number(given.num), d=Number(given.den);
  if(!isFinite(n)||!isFinite(d)||d===0) return '';
  const [sn,sd]=simplifyFrac(n,d);
  return `Remember to simplify · ${n}/${d} can be written as ${sn}/${sd}.`;
}
function fracPromptHTML(q){
  // A row of fractions and operators: [{n,d}, '+', {n,d}, '=', '?']. Written once here so
  // every fraction question on the paper looks like a fraction rather than "2/9 + 3/9".
  if(Array.isArray(q.fracEq) && q.fracEq.length){
    return `<div class="mmc-frac-eq" style="margin-top:10px;gap:12px;">${
      q.fracEq.map(x=> (x && typeof x==='object')
        ? fracHTML(x.n, x.d)
        : `<span style="font-size:24px;font-weight:700;">${esc(x)}</span>`).join('')}</div>`;
  }
  if(q.compareLead && q.leftNum!=null){
    return `<div class="mmc-frac-eq" style="margin-top:10px;gap:18px;">${fracHTML(q.leftNum,q.leftDen)}
      <span class="mmc-cmpgap">?</span>${fracHTML(q.rightNum,q.rightDen)}</div>`;
  }
  if(q.fracOfLead && q.fracNum!=null){
    return `<div class="mmc-frac-eq" style="margin-top:10px;">${fracHTML(q.fracNum,q.fracDen)}
      <span>of ${esc(q.ofTotal)}?</span></div>`;
  }
  // Question shows a value and the answer is typed elsewhere (e.g. fraction -> decimal).
  if(q.showFracNum!=null && q.inputType!=='mixed'){
    return `<div class="mmc-frac-eq" style="margin-top:10px;">${mixedHTML(q.showWhole, q.showFracNum, q.showFracDen)}</div>`;
  }
  return '';
}
function fracHTML(num,den){ return `<span class="mmc-frac"><span class="num">${esc(num)}</span><span class="line"></span><span class="den">${esc(den)}</span></span>`; }
// Mixed number for display: whole part left of a stacked fraction. Omitting the
// whole part falls back to a plain fraction, so one helper serves both.
function mixedHTML(whole,num,den){
  if(whole==null || whole==='' ) return fracHTML(num,den);
  return `<span class="mmc-mixed"><span class="whole">${esc(whole)}</span>${fracHTML(num,den)}</span>`;
}
// Shared fraction maths used across Q10/Q11/Q12/Q17/Q22/Q23.
function gcd2(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ const t=b; b=a%b; a=t; } return a||1; }
function simplifyFrac(n,d){ const g=gcd2(n,d); return [n/g, d/g]; }
function isSimplest(n,d){ return gcd2(n,d)===1; }
// True when the student's fraction equals the target, simplified or not.
function fracEquivalent(givenNum,givenDen,wantNum,wantDen){
  const a=Number(givenNum), b=Number(givenDen), c=Number(wantNum), d=Number(wantDen);
  if(!isFinite(a)||!isFinite(b)||!isFinite(c)||!isFinite(d)||b===0||d===0) return false;
  return a*d === c*b;
}
function fracChoiceHTML(c){
  const m=String(c).match(/^(-?\d+)\/(-?\d+)$/);
  return m ? fracHTML(m[1],m[2]) : esc(c);
}
function tierFor(score,total){ const pct = total? score/total : 0;
  if(pct>=0.9) return {tone:'gold', msg:'Brilliant!'};
  if(pct>=0.7) return {tone:'green', msg:'Great job!'};
  if(pct>=0.5) return {tone:'blue', msg:'Good try!'};
  return {tone:'amber', msg:'Keep practising!'}; }
function stampHTML(score,total){ const t=tierFor(score,total);
  return `<div class="mmc-stamp ${t.tone}"><span class="score">${score}/${total}</span><span class="msg">${esc(t.msg)}</span></div>`; }
function friendlyAuthError(code){
  const map={ 'auth/email-already-in-use':'That username is already taken. Try logging in instead.',
    'auth/invalid-email':'That doesn\'t look like a valid username or email.',
    'auth/weak-password':'Password should be at least 6 characters.',
    'auth/user-not-found':'Incorrect username/email or password.', 'auth/wrong-password':'Incorrect username/email or password.',
    'auth/invalid-credential':'Incorrect username/email or password.', 'auth/missing-password':'Please enter a password.' };
  return map[code] || 'Something went wrong. Please try again.';
}

async function handleAuthChange(user){
  clearSubs();
  S.user=user; S.authError=null;
  if(user){
    try{
      const teachersSnap = await getDoc(doc(db,'config','teachers'));
      S.teacherEmails = teachersSnap.exists() ? (teachersSnap.data().emails||[]) : [];
      S.isTeacher = S.teacherEmails.map(e=>String(e).toLowerCase()).includes((user.email||'').toLowerCase());
      if(S.isTeacher && S.pendingDeepLinkTab){
        S.teacherTab = S.pendingDeepLinkTab;
        S.pendingDeepLinkTab = null;
        // Clear it from the address bar so a later refresh doesn't yank them back.
        try{ history.replaceState(null,"", window.location.pathname); }catch(e){}
      }
      const profSnap = await getDoc(doc(db,'profiles',user.uid));
      S.profile = profSnap.exists() ? profSnap.data() : { displayName:user.displayName||user.email, email:user.email };
    }catch(e){ S.error='Could not load your account details.'; }
    subscribeData();
  } else {
    S.isTeacher=false; S.profile=null; S.weeks=[]; S.results=[]; S.profiles={};
  }
  S.loading=false; render();
}

if(!configured){

    unsubs.push(onSnapshot(query(collection(db,'skillPractice'), where('teacherUid','==',S.user.uid)), snap=>{ S.allSkillPracticeRecords=snap.docs.map(d=>({id:d.id,...d.data()})); render(); }, (err)=>{ S.toast='Skill practice data error: '+err.message; render(); }));
    unsubs.push(onSnapshot(query(collection(db,'classes'), where('teacherUid','==',S.user.uid)), snap=>{
      S.classes=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.createdAt?.seconds||0)-(b.createdAt?.seconds||0));

    unsubs.push(onSnapshot(doc(db,'config','teachers'), snap=>{

    // Both of these are admin-only per firestore.rules. A non-admin teacher's listener

    }, (err)=>{ /* not admin. Silent */ }));
    unsubs.push(onSnapshot(query(collection(db,'liveGames'), where('teacherUid','==',S.user.uid)), snap=>{
      S.liveGames=snap.docs.map(d=>({id:d.id,...d.data()})); ensureParticipantsSub(currentLiveRoom()?.id||null, true); ensureTeacherLiveTimer(); render();

    unsubs.push(onSnapshot(query(collection(db,'results'), where('uid','==',S.user.uid)), snap=>{

    }, (err)=>{ S.toast='Saved progress error: '+err.message; render(); }));
    unsubs.push(onSnapshot(query(collection(db,'ttAttempts'), where('uid','==',S.user.uid)), snap=>{
      S.ttAttempts=snap.docs.map(d=>({id:d.id,...d.data()})); render();
    }, (err)=>{ S.toast='Timetable data error: '+err.message; render(); }));
    unsubs.push(onSnapshot(query(collection(db,'skillPractice'), where('uid','==',S.user.uid)), snap=>{

    unsubs.push(onSnapshot(query(collection(db,'liveGames'), where('teacherUid','==',(S.profile&&S.profile.teacherUid)||'__none__')), snap=>{
      S.liveGames=snap.docs.map(d=>({id:d.id,...d.data()})); ensureParticipantsSub(currentLiveRoom()?.id||null, true);

    }, (err)=>{ S.toast='Racing Ground error: '+err.message; render(); }));
  }
}

// ---------- Root render ----------
let toastTimer=null, toastTimerValue=null;
function scheduleToastClear(){
  if(S.toast && S.toast!==toastTimerValue){
    if(toastTimer) clearTimeout(toastTimer);
    toastTimerValue=S.toast;
    toastTimer=setTimeout(()=>{ S.toast=null; toastTimerValue=null; toastTimer=null; render(); }, 7000);
  } else if(!S.toast){
    if(toastTimer){ clearTimeout(toastTimer); toastTimer=null; }
    toastTimerValue=null;
  }
}
function render(){
  // Keep the player-list listener pointed at whatever room is actually on screen. It used
  // to be re-pointed only when the set of rooms changed, so joining a race, or a PIN room
  // arriving, left it watching the wrong room. That is the refreshing.
  try{
    if(S.user && !S.previewStudentUid){
      const r = currentLiveRoom();
      const mineToRead = !!r && (
        S.isTeacher
          ? (r.teacherUid===S.user.uid)
          : (r.teacherUid===(S.profile&&S.profile.teacherUid) || r.id===S.joinedRoomId)
      );
      // ONLY ever re-point at a real room. Passing null tears the listener down and wipes
      // the player list, and currentLiveRoom() returns null for a moment on any number of
      // ordinary events: a snapshot arriving, a stale race expiring, a room changing
      // status. A host watched her whole lobby empty itself, assumed it had failed, and
      // started a second race while still hosting the first.
      //
      // A list for a race that has genuinely gone is cleared by the room's own listener,
      // not by this. Showing a slightly stale list for one render is harmless; showing an
      // empty one is not.
      if(mineToRead) ensureParticipantsSub(r.id);
    }
  }catch(e){}
  window.__mmcRenderCount = (window.__mmcRenderCount||0)+1;
  const root=document.getElementById('mmc');
  applyTheme();
  // Teacher-side facelift: a single scope class swaps the whole teacher UI into the
  // quieter "pro" styling. Students never get this class, so their playful styling is
  // untouched. See the .mmc-pro block at the bottom of <style>.
  root.classList.toggle('mmc-pro', !!(S.user && S.isTeacher));
  root.innerHTML='';
  // Logged out. And while a teacher waits for approval. The pitch card IS the
  // header. A teacher mid-signup shouldn't be shown THE ARENA; that's the
  // students' side of the product and it reads as though they've landed in the
  // wrong place.
  if(S.user && !isAwaitingApproval()) root.appendChild(renderHead());
  const body=el('<div class="mmc-body"></div>');
  if(S.toast){
    scheduleToastClear();
    // Every message used to be red, so "Class created" and "Could not save" looked
    // identical. Which teaches a teacher to flinch at their own successes and, worse,
    // to stop reading the ones that matter. Three tones: something broke, something
    // needs doing differently, something worked.
    const toastEl=el(`<div class="mmc-toast ${toastTone(S.toast)}">${esc(S.toast)}<button type="button" class="mmc-toast-close">✕</button></div>`);
    toastEl.querySelector('.mmc-toast-close').onclick=()=>{ S.toast=null; S.toastTone=null; if(toastTimer){clearTimeout(toastTimer); toastTimer=null;} toastTimerValue=null; render(); };
    body.appendChild(toastEl);
  }
  if(S.error) body.appendChild(el(`<div class="mmc-toast">${esc(S.error)}</div>`));
  if(S.loading){ body.appendChild(el('<div class="mmc-empty">Loading…</div>')); }
  else if(!configured){ /* error already shown above */ }
  else if(!S.user){ body.appendChild(renderAuth()); }
  else if(S.previewStudentUid){ body.appendChild(renderStudentPreview()); }
  else if(S.isTeacher){ body.appendChild(renderTeacher()); }
  else if(isAwaitingApproval()){ body.appendChild(renderAwaitingApproval()); }
  else { body.appendChild(renderStudent()); }
  // Shown to students too, not just teachers. Testing a student-side change meant having
  // no way to tell which build the student screen was actually running. Which turned a
  // simple "is this deployed yet" question into guesswork.
  if(S.user){
    body.appendChild(el(`<div class="mmc-buildstamp">${S.isTeacher? '<a href="privacy.html" style="color:inherit;">Privacy</a> · ' : ''}Mathmentum build ${esc(BUILD)}</div>`));
  }
  root.appendChild(body);
  // Every password field on screen gets a show/hide eye, wherever it appears.
  root.querySelectorAll('input[type="password"]').forEach(attachPasswordEye);
  // Read-aloud lives in renderQuestionBody, which is the weekly quiz. Fast Facts draws its
  // own question, so it never had one, and it is the part a Pre-Primary uses most.
  const speakSlot=document.getElementById('mmc-tt-speak');
  if(speakSlot && !speakSlot.childElementCount && S.tt && S.tt.currentQ){
    const b=renderSpeakButton(S.tt.currentQ);
    if(b) speakSlot.appendChild(b);
  }
  // Bring the question back into view after each one. The feedback screen is taller than
  // the question, so answering pushed the next question below the fold and a child had to
  // scroll down for every single one.
  if(S.tt && S.tt.active && S.tt.__scrollTop){
    S.tt.__scrollTop=false;
    const box=document.querySelector('.mmc-quiz-q, .mmc-card');
    try{
      if(box && box.scrollIntoView) box.scrollIntoView({block:'start', behavior:'smooth'});
      else window.scrollTo({top:0, behavior:'smooth'});
    }catch(e){ window.scrollTo(0,0); }
  }
  // Keep the race caller alive whenever sound is on and a race exists. It used to start
  // only when the pill was tapped, so switching it on before the race began left it
  // pointing at nothing and the beeps never came.
  try{
    if(S.raceSound && S.isTeacher && currentLiveRoom()){ if(!raceCallTimer) raceCallerStart(); }
    else if(!S.raceSound && raceCallTimer) raceCallerStop();
  }catch(e){}
  const ttInput=document.getElementById('mmc-tt-input');
  if(ttInput){
    // Focus WITH the caret put back at the end. A bare focus() drops the caret at position
    // zero in several browsers, so a child typing 2 then 4 gets "42". The clock ticks every
    // second and each tick re-renders, so this fired constantly mid-answer. The race screen
    // was fixed for exactly this; the Training Ground was not.
    const keep=ttInput.value.length;
    ttInput.focus();
    try{ ttInput.setSelectionRange(keep, keep); }catch(e){}
  }
  // Note: the Live Game race screen (renderMyLiveSession) manages its own focus and cursor
  // position deliberately. An unconditional, unpositioned .focus() call here on every single
  // render was fighting against that and is the real reason multi-digit answers were
  // collapsing down to just the last digit typed (an unpositioned focus can reset or select
  // the field's existing text in some browsers, so the next keystroke overwrites it).
}

function renderHead(){
  const name = S.profile? S.profile.displayName : (S.user? S.user.email : '');
  const initials = (name||'').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
  const teacherStats = (S.user && S.isTeacher) ? {
    students: Object.keys(S.profiles||{}).length,
    sets: (S.weeks||[]).filter(w=>w.status!=='archived').length,
    completions: (S.results||[]).length,
    avgPct: (S.results||[]).length ? Math.round((S.results.reduce((s,r)=>s+(r.total? r.score/r.total : 0),0)/S.results.length)*100) : null,

        <div class="mmc-brandmark"><span class="bm-a">Math</span><span class="bm-b">mentum</span></div>
        <div class="mmc-arena">
          <span class="mmc-arena-the">the</span>

      `}
      ${S.user ? `

              <div class="mmc-welcome-name">${S.isTeacher ? `${(h=>h<12?'Morning':h<17?'Afternoon':'Evening')(new Date().getHours())}, ${esc((name||'').trim().split(/\s+/)[0])}` : `Welcome back, ${esc(name)}! 👋`}</div>

            <div class="mmc-stat-card"><div class="mmc-stat-icon" style="background:#22C55E;">🏆</div><div><div class="mmc-stat-label">Completions</div><div class="mmc-stat-num">${teacherStats.completions}</div></div></div>

function renderAuth(){
  const wrap=el('<div></div>');
  const isSignup = S.showSignup;

  if(isSignup){
    if(S.teacherRequestSubmitted){
      const done=el(`
        <div class="mmc-card">
          <h3>Account created</h3>
          <div class="meta">Your account is ready and your request is with the admin. Once it's approved you can sign in with the email and password you just chose. Nothing else to do, and no email to wait for.</div>
          <a href="#" id="mmc-req-back" style="display:inline-block;margin-top:10px;font-size:12.5px;color:var(--ink-soft);">← back to log in</a>
        </div>
      `);
      done.querySelector('#mmc-req-back').onclick=(e)=>{ e.preventDefault(); S.showSignup=false; S.teacherRequestSubmitted=false; render(); };
      wrap.appendChild(done);
      return wrap;
    }
    // Teachers choose their own password up front. Every previous flow depended on
    // an email arriving. And across the first handful of real invitations, one was
    // quarantined by a school filter, one by Hotmail, and Outlook mangled the link
    // in a third. Nothing in this flow needs email to work.
    const card=el(`
      <div class="mmc-card">
        <h3>Sign up as a teacher</h3>
        ${S.authError? `<div class="mmc-autherr">${esc(S.authError)}</div>` : ''}
        <div class="meta">Choose your own password now. An admin approves new teachers, usually quickly. Then you just sign in. No email needed.</div>
        <div class="mmc-field"><label>Your name</label><input type="text" id="mmc-a-name" placeholder="e.g. Priya Nair"></div>
        <div class="mmc-field"><label>Your email</label><input type="email" id="mmc-a-email" placeholder="you@example.com" autocomplete="username"></div>
        <div class="mmc-field"><label>Choose a password</label><input type="password" id="mmc-a-pw" autocomplete="new-password" placeholder="At least 6 characters"></div>
        <div class="mmc-field"><label>Confirm password</label><input type="password" id="mmc-a-pw2" autocomplete="new-password"></div>
        <button class="mmc-btn gold" id="mmc-a-go">Create my account</button>
      </div>
    `);
    card.querySelector('#mmc-a-go').onclick=async ()=>{
      const name=card.querySelector('#mmc-a-name').value.trim();
      const email=card.querySelector('#mmc-a-email').value.trim();
      const pw=card.querySelector('#mmc-a-pw').value;
      const pw2=card.querySelector('#mmc-a-pw2').value;
      if(!name || !email || !email.includes('@')){ S.authError='Please fill in your name and a valid email.'; render(); return; }
      if(pw.length<6){ S.authError='Your password needs at least 6 characters.'; render(); return; }
      if(pw!==pw2){ S.authError="The two passwords don't match."; render(); return; }
      const btn=card.querySelector('#mmc-a-go'); btn.disabled=true; btn.textContent='Creating…';
      try{
        // Create the sign-in account first, then lodge the request. The account
        // exists but has no teacher permissions until an admin approves it, so
        // signing in before then shows a "waiting for approval" screen.
        try{
          await createUserWithEmailAndPassword(auth, email, pw);
        }catch(e){
          if(e && e.code==='auth/email-already-in-use'){
            // They may have signed up before, or been invited. Signing in proves
            // it's them and still lodges the request.
            await signInWithEmailAndPassword(auth, email, pw);
          } else { throw e; }
        }
        const call = httpsCallable(functions, 'requestTeacherAccess');
        await call({ name, email, referredBy: S.referredBy || null });
        S.authError=null; S.teacherRequestSubmitted=true;
      }catch(e){
        const code=(e && e.code)||'';
        S.authError =
          code.includes('email-already-in-use') ? 'There is already an account for that email. Try signing in, or use "Forgot your password?".'
          : code.includes('wrong-password') || code.includes('invalid-credential') ? 'There is already an account for that email and that password is not right. Try "Forgot your password?".'
          : code.includes('weak-password') ? 'That password is too weak. Try a longer one.'
          : code.includes('invalid-email') ? 'That email address does not look right.'
          : (e.message || 'Could not create your account. Check your connection.');
      }
      btn.disabled=false; btn.textContent='Create my account';
      render();
    };
    wrap.appendChild(card);
    const toggle=el(`<a href="#" style="display:inline-block;margin-top:4px;font-size:12.5px;color:var(--ink-soft);">← back to log in</a>`);
    toggle.onclick=(e)=>{ e.preventDefault(); S.showSignup=false; S.authError=null; render(); };
    wrap.appendChild(toggle);
    return wrap;
  }

  // The front door is seen by teachers, students and anyone a teacher shares the
  // link with, so it has to say what the product IS before asking for a password.
  wrap.appendChild(el(`
    <div class="mmc-pitch">
      <div class="mmc-pitch-mark"><span>Math</span><span class="o">mentum</span></div>
      <p class="mmc-pitch-line">Weekly maths practice for primary classrooms. Quick to set, marks itself, and shows you exactly who's getting it and who isn't.</p>
      <div class="mmc-pitch-grid">
        <div class="pp pp1"><b>Key skills</b><span>Tests understanding right across the year level.</span></div>
        <div class="pp pp2"><b>Fast facts fluency</b><span>Builds automaticity with the operations that matter.</span></div>
        <div class="pp pp3"><b>Differentiated</b><span>Every student practises at their own level.</span></div>
        <div class="pp pp4"><b>Feedback that tells you something</b><span>Strengths, gaps and progress. Not just a percentage.</span></div>
      </div>
    </div>
  `));

  const card=el(`
    <div class="mmc-card">
      <h3>Log in</h3>
      ${S.authError? `<div class="mmc-autherr">${esc(S.authError)}</div>` : ''}
      <div class="mmc-field"><label>Username (or teacher email)</label>
        <input type="text" id="mmc-a-email" placeholder="e.g. SusieM"></div>
      <div class="mmc-field"><label>Password</label><input type="password" id="mmc-a-pass" placeholder="Your password"></div>
      <button class="mmc-btn gold" id="mmc-a-go">Log in</button>
      <a href="#" id="mmc-a-forgot" class="mmc-forgot">Forgot your password?</a>
    </div>
  `);
  card.querySelector('#mmc-a-forgot').onclick=async (e)=>{
    e.preventDefault();
    const raw=card.querySelector('#mmc-a-email').value.trim();
    if(!raw || !raw.includes('@')){
      S.authError='Type your teacher email above first, then click again. Students should ask their teacher for a new password.';
      render(); return;
    }
    try{
      await sendPasswordResetEmail(auth, raw, { url:'https://mathmentum.com.au', handleCodeInApp:false });
      S.authError=null; S.toast='If that address has an account, a reset email is on its way.';
    }catch(err){
      // Deliberately vague: confirming which addresses exist would leak your roster.
      S.toast='If that address has an account, a reset email is on its way.';
    }
    render();
  };
  card.querySelector('#mmc-a-go').onclick=async ()=>{
    const raw=card.querySelector('#mmc-a-email').value.trim();
    const pass=card.querySelector('#mmc-a-pass').value;
    if(!raw || !pass){ S.authError='Please fill in every field.'; render(); return; }
    try{
      const email = raw.includes('@') ? raw : usernameToEmail(raw);
      await signInWithEmailAndPassword(auth,email,pass);
    }catch(e){ S.authError=friendlyAuthError(e.code); render(); }
  };
  wrap.appendChild(card);

  const panels=el(`
    <div class="mmc-entrypanels">
      <div class="ep ep-teacher">
        <b>New teacher?</b>
        <span>Sign up, choose a password, and you'll be approved shortly.</span>
        <button class="mmc-btn ghost sm" id="mmc-req-go">Sign up as a teacher</button>
      </div>
      <div class="ep ep-student">
        <b>Students</b>
        <span>Use the username and password on your login card. Your teacher can reset it if you're stuck.</span>
      </div>
    </div>
  `);
  panels.querySelector('#mmc-req-go').onclick=(e)=>{ e.preventDefault(); S.showSignup=true; S.authError=null; render(); };
  wrap.appendChild(panels);
  // A school or parent looks for this BEFORE signing up, so it has to be on the
  // signed-out page. privacy.html is a separate, dependency-free file. It loads on a
  // locked-down school network even if every CDN is blocked.
  wrap.appendChild(el(`<div style="text-align:center;margin-top:22px;font-size:13px;">
    <a href="privacy.html" style="color:var(--ink-soft);text-decoration:underline;">Privacy. What we hold and where</a>
  </div>`));
  return wrap;
}

// ================= TEACHER =================
// A guided tour with spotlights and arrows breaks the moment a screen is narrow, an
// element moves, or a teacher wanders off mid-way. A checklist that reads the real state
// survives all three: she can leave, come back tomorrow, and it still knows where she got
// to. Because it is not remembering, it is looking.
function renderGetStartedCard(){
  const classes=(S.classes||[]).length;
  const students=Object.values(S.profiles||{}).filter(p=>p&&p.username).length;
  const sets=(S.weeks||[]).filter(w=>w.status==='published').length;
  const done=[classes>0, students>0, sets>0];
  if(done.every(Boolean)) return null;              // set up: it disappears on its own
  if(S.hideGetStarted) return null;

  const steps=[
    { done:done[0], title:'Make your first class',
      body:'A class is one year level. Pick the year as you create it. If you teach a composite room, make two classes.',
      cta:'Make a class', go:()=>{ S.teacherTab='students'; S.studentsView='list'; S.newClass={name:'',year:DEFAULT_YEAR}; } },
    { done:done[1], title:'Add your students',
      body:'Paste your class list, one name per line. Everyone gets a username and password, shown once. Print them straight away.',
      cta:'Add students', go:()=>{ S.teacherTab='students'; S.studentsView='add'; } },
    { done:done[2], title:'Give them something to do',
      body:'Generate a practice set for the class, check the questions, and publish. Or send them to the Fast Facts Training Ground, which needs no setup at all.',
      cta:'Create a set', go:()=>{ S.teacherTab='weeks'; S.weeksView='create'; } },
  ];
  const nextIdx = steps.findIndex(x=>!x.done);
  const card=el(`<div class="mmc-card mmc-getstarted">
    <div class="mmc-worth-head">
      <span class="mmc-worth-title">Getting started</span>
      <span class="mmc-worth-count">${done.filter(Boolean).length} of 3 done</span>
    </div>
  </div>`);
  steps.forEach((st,i)=>{
    const isNext = i===nextIdx;
    const row=el(`<div class="mmc-gs-step ${st.done?'done':isNext?'next':'later'}">
      <div class="mmc-gs-mark">${st.done?'✓':i+1}</div>
      <div class="mmc-gs-body">
        <div class="mmc-gs-title">${esc(st.title)}</div>
        ${isNext?`<div class="mmc-gs-text">${esc(st.body)}</div>`:''}
      </div>
    </div>`);
    if(isNext){
      const b=el(`<button class="mmc-btn gold sm" style="margin:8px 0 2px 44px;">${esc(st.cta)} →</button>`);
      b.onclick=()=>{ st.go(); render(); };
      row.appendChild(b);
    }
    card.appendChild(row);
  });
  const skip=el('<button class="mmc-btn ghost sm" style="margin-top:12px;">I\'ll find my own way</button>');
  skip.onclick=()=>{ S.hideGetStarted=true; render(); };
  card.appendChild(skip);
  return card;
}

function renderTeacherHome(){
  const wrap=el('<div></div>');
  const gs=renderGetStartedCard();
  if(gs) wrap.appendChild(gs);
  const ts = (r)=> (r && r.submittedAt && r.submittedAt.seconds) ? r.submittedAt.seconds*1000 : null;
  // Home deliberately ignores the class switcher. It's the whole-teaching-load view.
  const roster = Object.keys(S.profiles||{});
  const results = (S.results||[]);
  const tt = (S.ttAttempts||[]);
  const practice = (S.allSkillPracticeRecords||[]);
  const everything = results.concat(tt, practice);

  const now=Date.now(), DAY=86400000;
  const since=(ms)=>everything.filter(r=>{const t=ts(r); return t && (now-t)<=ms;});
  const last24 = since(DAY), last7 = since(7*DAY), prev7 = everything.filter(r=>{
    const t=ts(r); return t && (now-t)>7*DAY && (now-t)<=14*DAY;
  });

  const activeUids = new Set(last7.map(r=>r.uid));
  const doneRecent = results.filter(r=>{const t=ts(r); return t && (now-t)<=DAY;}).length;
  const scored = results.filter(r=>r.total);
  const avgPct = scored.length ? Math.round(scored.reduce((s,r)=>s+r.score/r.total,0)/scored.length*100) : null;

  // "After school" = anything submitted outside 8am–4pm on a weekday, or any weekend activity.
  const afterHours = last7.filter(r=>{
    const t=ts(r); if(!t) return false;
    const d=new Date(t), h=d.getHours(), day=d.getDay();
    return day===0 || day===6 || h<8 || h>=16;
  });
  const afterHoursNames = [...new Set(afterHours.map(r=>r.uid))]
    .map(u=>(S.profiles[u]&&S.profiles[u].displayName)||'').filter(Boolean);

  const greet = (h=>h<12?'Morning':h<17?'Afternoon':'Evening')(new Date().getHours());
  const first = ((S.profile&&S.profile.displayName)||'').trim().split(/\s+/)[0] || 'there';
  const nClasses = (S.classes||[]).length;
  const className = nClasses>1 ? `${nClasses} classes` : (((S.classes||[])[0]||{}).name || '');
  const dateStr = new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});

  let lead;
  if(!roster.length) lead = `No students yet. Add your class list and this page starts filling up.`;
  else if(!last24.length && !last7.length) lead = `It's been quiet. Nothing recorded in the past week. Setting a fresh task usually gets things moving again.`;
  else if(!last24.length) lead = `Nothing since yesterday, though ${activeUids.size} student${activeUids.size===1?'':'s'} practised earlier this week.`;
  else lead = `Your students have been busy · ${last24.length} thing${last24.length===1?'':'s'} finished in the last 24 hours.`;

  const card=el(`<div class="mmc-card">
    <div class="meta" style="letter-spacing:.09em;text-transform:uppercase;font-size:11px;font-weight:700;">${esc(dateStr)}${className?' · '+esc(className):''}</div>
    <h3 style="font-size:24px;margin-bottom:6px;">${esc(greet)}, ${esc(first)}</h3>
    <div class="meta" style="font-size:16px;margin-bottom:0;">${esc(lead)}</div>
  </div>`);
  wrap.appendChild(card);

  if(roster.length){
    const prev24 = everything.filter(r=>{const t=ts(r); return t && (now-t)>DAY && (now-t)<=2*DAY;});
    const delta = last24.length - prev24.length;
    const stats=el(`<div class="mmc-card">
      <div class="mmc-row" style="gap:0;align-items:stretch;">
        <div style="flex:1;min-width:120px;padding-right:20px;">
          <div class="meta" style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px;">Finished today</div>
          <div class="mmc-stat-num" style="font-size:27px;">${last24.length}</div>
          ${delta!==0?`<div class="meta" style="font-size:12px;margin:2px 0 0;color:${delta>0?'#2E7D4F':'#8A6008'};font-weight:600;">${delta>0?'+':''}${delta} on yesterday</div>`:''}
        </div>
        <div style="flex:1;min-width:120px;padding:0 20px;border-left:1px solid #EEECE7;">
          <div class="meta" style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px;">Active this week</div>
          <div class="mmc-stat-num" style="font-size:27px;">${activeUids.size}<span style="font-size:16px;color:#8A8880;"> / ${roster.length}</span></div>
        </div>
        <div style="flex:1;min-width:120px;padding-left:20px;border-left:1px solid #EEECE7;">
          <div class="meta" style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px;">Average score</div>
          <div class="mmc-stat-num" style="font-size:27px;">${avgPct==null?'-':avgPct+'%'}</div>
        </div>
      </div>
    </div>`);
    wrap.appendChild(stats);
  }

  // ---- Insight engine -------------------------------------------------
  // Deliberately reuses computeSkillStats / pickStrengthsAndWeaknesses. The same
  // engine behind the student dashboard. Rather than recalculating alongside it.
  // That means insights here include self-directed skillPractice (not just set
  // results), and inherit the tuned thresholds that avoid false positives on
  // small samples. Everything is measured against the student's own history,
  // never ranked against classmates.
  const notes=[];
  const nameOf=(u)=>(S.profiles[u]&&S.profiles[u].displayName)||'';
  const practiceFor=(u)=>(S.allSkillPracticeRecords||[]).filter(r=>r.uid===u);

  roster.forEach(uid=>{
    const nm=nameOf(uid); if(!nm) return;
    const mine=results.filter(r=>r.uid===uid);
    if(!mine.length) return;
    let stats;
    try { stats=computeSkillStats(mine, S.weeks, practiceFor(uid)); } catch(e){ return; }

    // Something they used to get wrong and now reliably get right. Note the
    // thresholds account for recentAccuracy being a fixed 5-attempt window. // a genuine turnaround still carries older misses inside that window, so
    // demanding near-perfect recent accuracy would suppress the very insight
    // this is here to surface.
    const turned=stats.filter(sk=>sk.total>=4 && sk.trend==='improving'
        && sk.recentAccuracy>=0.6 && sk.overallAccuracy<0.7)
      .sort((a,b)=>(b.recentAccuracy-b.overallAccuracy)-(a.recentAccuracy-a.overallAccuracy))[0];
    if(turned){
      const mastered = turned.recentAccuracy>=0.85;
      notes.push({score: mastered?130:110, k: mastered?'Finally clicked':'Turning a corner', good:true,
        t: mastered
          ? nm+' has cracked '+turned.title.toLowerCase()+''+Math.round(turned.recentAccuracy*100)+'% lately.'
          : nm+' is getting '+turned.title.toLowerCase()+' right at last, after a long run of misses.'});
    }

    // Broader upward movement, when there's no single breakthrough to report.
    const rising=stats.filter(sk=>sk.total>=4 && sk.trend==='improving');
    if(rising.length>=2) notes.push({score:70, k:'On the up', good:true,
      t:nm+' is improving across '+rising.length+' skills.'});

    // A skill slipping for someone who is otherwise engaged.
    const slipping=stats.filter(sk=>sk.total>=4 && sk.trend==='declining' && sk.recentAccuracy<0.6)
      .sort((a,b)=>b.concernScore-a.concernScore)[0];
    if(slipping) notes.push({score:75, k:'Slipping', good:false,
      t:nm+' has gone backwards on '+slipping.title.toLowerCase()+''+Math.round(slipping.recentAccuracy*100)+'% lately.'});
  });

  // Class-wide weak spot, using the same weakness rules as the student view.
  try {
    const classStats=computeSkillStats(results, S.weeks, practice);
    const cw=pickStrengthsAndWeaknesses(classStats).weaknesses[0];
    if(cw && cw.total>=Math.max(4,roster.length)) notes.push({score:90, k:'Sticking point', good:false,
      t:cw.title+'the class is at '+Math.round(cw.recentAccuracy*100)+'% and it is the weakest topic going.'});
  } catch(e){}

  // Repeated unsimplified-but-correct answers. The marks look fine and the habit
  // is invisible in the gradebook, so it only surfaces via these flags.
  const simplifyCounts={};
  results.forEach(r=>{
    (r.answers||[]).forEach(a=>{
      if((a.flags||[]).indexOf('could_simplify')!==-1) simplifyCounts[r.uid]=(simplifyCounts[r.uid]||0)+1;
    });
  });
  // Area vs perimeter: one is often solid while the other isn't, and the single
  // combined mark hides which.
  const apCounts={};
  results.forEach(r=>{ (r.answers||[]).forEach(a=>{
    (a.flags||[]).forEach(f=>{
      if(f==='perimeter_wrong'||f==='area_wrong'){
        apCounts[r.uid]=apCounts[r.uid]||{perimeter_wrong:0,area_wrong:0};
        apCounts[r.uid][f]++;
      }
    });
  }); });
  Object.keys(apCounts).forEach(u=>{
    const c=apCounts[u], nm=nameOf(u); if(!nm) return;
    if(c.perimeter_wrong>=3 && c.perimeter_wrong>c.area_wrong*2)
      notes.push({score:62, k:'Specific gap', good:false, t:`${nm} gets area right but keeps missing perimeter.`});
    else if(c.area_wrong>=3 && c.area_wrong>c.perimeter_wrong*2)
      notes.push({score:62, k:'Specific gap', good:false, t:`${nm} gets perimeter right but keeps missing area.`});
  });

  const simplifyKids=Object.keys(simplifyCounts).filter(u=>simplifyCounts[u]>=3);
  if(simplifyKids.length){
    const names=simplifyKids.map(nameOf).filter(Boolean);
    notes.push({score:58, k:'Worth a reminder', good:false,
      t: (simplifyKids.length===1 && names.length) ? `${names[0]} keeps leaving fractions unsimplified.`
        : `${simplifyKids.length} students keep leaving fractions unsimplified.`});
  }

  if(afterHoursNames.length){
    notes.push({score:55+afterHoursNames.length, k:'Nobody asked them to', good:true,
      t:afterHoursNames.length===1 ? afterHoursNames[0]+' practised after hours this week.'
        : afterHoursNames.length+' students practised after hours this week.',
      detail:afterHoursNames.slice()});
  }

  const quiet = roster.filter(u=>!activeUids.has(u));
  if(quiet.length && roster.length){
    const names = quiet.map(nameOf).filter(Boolean);
    notes.push({score:60+quiet.length, k:'Gone quiet', good:false,
      t: (quiet.length===1 && names.length) ? names[0]+'nothing all week.'
        : quiet.length+" students haven't touched it this week.",
      detail:names.slice()});
  }

  if(!notes.length && scored.length>=3){
    const best=[...scored].sort((a,b)=>(b.score/b.total)-(a.score/a.total))[0];
    const nm=nameOf(best.uid);
    if(nm) notes.push({score:10, k:'Best this week', good:true, t:nm+''+best.score+' out of '+best.total+'.'});
  }

  // Additional observations, so the panel is rarely thin. Each is still only
  // added when it's actually true. The list shortens rather than inventing.
  try {
    const classStats=computeSkillStats(results, S.weeks, practice);
    const sw=pickStrengthsAndWeaknesses(classStats);
    const strong=sw.strengths[0];
    if(strong) notes.push({score:35, k:'Nailed it', good:true,
      t:'The class is at '+Math.round(strong.overallAccuracy*100)+'% on '+strong.title.toLowerCase()+'safe to move on.'});
    const untouched=classStats.filter(sk=>sk.total===0).length;
    if(untouched>0 && untouched<20) notes.push({score:15, k:'Not covered yet', good:false,
      t:untouched+' of the 20 topics have not been attempted at all yet.'});
  } catch(e){}

  // Best scorer, even when other insights exist (lower priority).
  if(scored.length>=3 && !notes.some(n=>n.k==='Best this week')){
    const best=[...scored].sort((a,b)=>(b.score/b.total)-(a.score/a.total))[0];
    const nm=nameOf(best.uid);
    if(nm) notes.push({score:25, k:'Best result', good:true,
      t:nm+''+best.score+' out of '+best.total+' on '+(best.weekLabel||'their latest set')+'.'});
  }

  // Busiest student by volume of activity this week.
  if(last7.length>=5){
    const tally={};
    last7.forEach(r=>{ tally[r.uid]=(tally[r.uid]||0)+1; });
    const topUid=Object.keys(tally).sort((a,b)=>tally[b]-tally[a])[0];
    const nm=nameOf(topUid);
    if(nm && tally[topUid]>=3) notes.push({score:30, k:'Putting the work in', good:true,
      t:nm+' has done '+tally[topUid]+' activities this week. More than anyone.'});
  }

  // Whole-class momentum, week on week.
  if(prev7.length>0 && last7.length>0){
    const pct=Math.round((last7.length-prev7.length)/prev7.length*100);
    if(Math.abs(pct)>=20) notes.push({score:45, k: pct>0?'Picking up':'Easing off', good: pct>0,
      t:'Activity is '+(pct>0?'up':'down')+' '+Math.abs(pct)+'% on last week.'});
  }

  // Students with no results at all yet. Different from having gone quiet.
  const never = roster.filter(u=>!everything.some(r=>r.uid===u));
  if(never.length){
    const names=never.map(nameOf).filter(Boolean);
    notes.push({score:65, k:'Never started', good:false,
      t: never.length===1 && names.length ? names[0]+' has never used it.'
        : never.length+' students have never used it.',
      detail:names.slice()});
  }

  // How the most recent published set is landing. Counted against the students the set was
  // actually AIMED AT, not the whole roster. A Year 3 set for one child was reporting
  // "23 of 23 haven't done it yet", naming 22 students who were never given it.
  const published=(S.weeks||[]).filter(w=>w.status!=='archived' && w.status!=='draft');
  if(published.length && roster.length){
    const latest=published.slice().sort((a,b)=>
      ((b.createdAt&&b.createdAt.seconds)||0)-((a.createdAt&&a.createdAt.seconds)||0))[0];
    const aimedAt=weekAudienceUids(latest, roster);
    if(aimedAt.length){
      const doneSet=new Set(results.filter(r=>r.weekId===latest.id).map(r=>r.uid));
      const did=aimedAt.filter(u=>doneSet.has(u)).length;
      if(did<aimedAt.length) notes.push({score:80, k:'Still outstanding', good:false,
        t:(aimedAt.length-did)+' of '+aimedAt.length+" haven't done "+(latest.label||'the latest set')+' yet.',
        detail:aimedAt.filter(u=>!doneSet.has(u)).map(nameOf).filter(Boolean)});
      else notes.push({score:50, k:'All in', good:true,
        t:'Every student has finished '+(latest.label||'the latest set')+'.'});
    }
  }

  // Keep one of each kind so the panel doesn't fill with five near-identical
  // per-student notes, then show the strongest five.
  const seen={};
  // ---- Fast facts: the sharpest signals available, and they were not feeding this panel
  // at all. "Five students can't divide by 6" is Monday's lesson; "17 of 17 haven't done
  // Week 2" is an administrative reminder. Both matter, but the first is the one a teacher
  // opens this page for, so it scores above the admin notes.
  try{
    const clsIns = computeTTClassInsights(S.ttAttempts, roster);
    clsIns.slice(0,2).forEach(g=>{
      const kind = (g.kinds.wrong||0) >= (g.kinds.slow||0) ? 'getting wrong' : 'slow on';
      notes.push({ score:90+g.count, k:'Whole-class gap', good:false,
        t:`${g.count} students are ${kind} ${ttGroupLabel(g.op,g.table)}.`,
        detail:g.students.map(u=>(S.profiles[u]&&S.profiles[u].displayName)||'').filter(Boolean) });
    });
    // A real win, named. The panel had almost nothing positive that was about LEARNING
    // rather than effort, and a teacher deserves to be told what is working.
    let bestWin=null;
    roster.forEach(uid=>{
      const strong=ttStrongGroups((S.ttAttempts||[]).filter(a=>a.uid===uid));
      strong.forEach(g=>{ if(g.seen>=10 && (!bestWin || g.seen>bestWin.g.seen)) bestWin={uid,g}; });
    });
    if(bestWin){
      const nm=((S.profiles[bestWin.uid]&&S.profiles[bestWin.uid].displayName)||'').split(/\s+/)[0];
      notes.push({ score:70, k:'Nailed it', good:true,
        t:`${nm} has ${ttGroupLabel(bestWin.g.op,bestWin.g.table)} cold · ${bestWin.g.accuracy}% across ${bestWin.g.seen} attempts.` });
    }
    // Someone who has genuinely turned a corner.
    roster.forEach(uid=>{
      const ins=computeTTInsights((S.ttAttempts||[]).filter(a=>a.uid===uid));
      const turn=ins.items.find(x=>x.kind==='turnaround');
      if(turn){
        const nm=((S.profiles[uid]&&S.profiles[uid].displayName)||'').split(/\s+/)[0];
        notes.push({ score:66, k:'Same answer, both ways', good:false,
          t:`${nm} knows ${turn.strong} but not ${turn.weak}. Worth two minutes on turnarounds.` });
      }
    });
  }catch(e){ /* insights must never take the home page down */ }

  const show = notes.sort((a,b)=>b.score-a.score)
    .filter(n=>{ if(seen[n.k]) return false; seen[n.k]=1; return true; })
    .slice(0,5);
  if(show.length){
    // This is the one part of the home page a teacher should read every morning, and it
    // looked like every other card. Given its own heading, a heavier frame and a count, so
    // it reads as a briefing rather than another panel.
    // "8 students practised after hours" is the headline; WHICH eight is the useful part.
    // Anything with names behind it opens on click. The summary stays short, and the
    // detail is one tap away rather than crammed into the sentence.
    const nc=el(`<div class="mmc-card mmc-worth">
      <div class="mmc-worth-head">
        <span class="mmc-worth-title">Worth knowing</span>
        <span class="mmc-worth-count">${show.length} thing${show.length===1?'':'s'} to look at</span>
      </div>
    </div>`);
    show.forEach((n,i)=>{
      const has = Array.isArray(n.detail) && n.detail.length>1;
      const open = S.worthOpen===i;
      const item=el(`<div class="mmc-worth-item ${n.good?'good':'flag'}${has?' has-detail':''}">
        <div class="mmc-worth-k">${esc(n.k)}</div>
        <div class="mmc-worth-t">${esc(n.t)}${has?`<span class="mmc-worth-more">${open?'hide':'who?'}</span>`:''}</div>
        ${open&&has?`<div class="mmc-worth-names">${n.detail.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`:''}
      </div>`);
      if(has){
        item.onclick=()=>{ S.worthOpen = open ? null : i; render(); };
      }
      nc.appendChild(item);
    });
    wrap.appendChild(nc);
  }

  const acts=el(`<div class="mmc-row" style="margin-top:4px;">
    <button class="mmc-btn gold" data-go="${roster.length?'ledger':'students'}">${roster.length?'Open gradebook':'Add students'}</button>
    <button class="mmc-btn ghost" data-go="weeks">Set a new week</button>
  </div>`);
  acts.querySelectorAll('[data-go]').forEach(b=>{ b.onclick=()=>{ S.teacherTab=b.dataset.go; render(); }; });
  wrap.appendChild(acts);
  return wrap;
}


// ---------- Preview as a student ----------
// Lets a teacher walk through exactly what a given child sees. The same sets,
// the same difficulty, their own dashboard. Every Firestore write is blocked by
// the guard at the top of this file, so nothing they do here touches the child's
// record. The teacher's own identity is untouched; only what's rendered changes.
function startStudentPreview(uid){
  S.previewStudentUid = uid;
  S.previewSaved = {
    profile: S.profile,
    skillPracticeRecords: S.skillPracticeRecords,
    ttAttempts: S.ttAttempts,
    results: S.results,
    weekProgress: S.weekProgress,
    activeWeekId: S.activeWeekId,
    quiz: S.quiz,
    studentTab: S.studentTab,
  };
  // Borrow the student's profile so difficulty targeting, groups and theme all
  // behave exactly as they do for them.
  S.profile = Object.assign({}, S.profiles[uid] || {});
  // AND their records. For a teacher these arrays hold the WHOLE CLASS, and the student
  // views read them directly. So previewing a child showed them their classmates' work
  // added to their own: 162 attempts and an Expert badge for a student with 6 attempts.
  // Only skillPracticeRecords was being narrowed, which is why it went unnoticed.
  S.ttAttempts = (S.ttAttempts||[]).filter(a=>a.uid===uid);
  S.results = (S.results||[]).filter(r=>r.uid===uid);
  S.weekProgress = (S.weekProgress||[]).filter(w=>w.uid===uid);
  S.skillPracticeRecords = (S.allSkillPracticeRecords||[]).filter(r=>r.uid===uid);
  S.activeWeekId = null; S.quiz = {}; S.studentTab = 'dashboard';
  render();
}
function endStudentPreview(){
  const saved = S.previewSaved || {};
  S.previewStudentUid = null;
  S.profile = saved.profile || S.profile;
  S.skillPracticeRecords = saved.skillPracticeRecords || [];
  // Put the full class-wide arrays back, or the teacher's own gradebook would show
  // nothing but the child they just previewed until the next snapshot arrived.
  S.ttAttempts = saved.ttAttempts || S.ttAttempts;
  S.results = saved.results || S.results;
  S.weekProgress = saved.weekProgress || S.weekProgress;
  S.activeWeekId = saved.activeWeekId || null;
  S.quiz = saved.quiz || {};
  S.studentTab = saved.studentTab || 'dashboard';
  S.previewSaved = null;
  render();
}

// Sets a colleague's password directly, for when a setup link can't get through.
// The password is shown once here and never stored. The admin passes it on and
// the teacher changes it themselves afterwards.
async function setTeacherPasswordFlow(email, name, btnEl){
  const suggestion = pick(PASSWORD_WORDS)+randInt(100,999);
  const pw = prompt(
    `Set a password for ${name||email}.\n\n`+
    `They can change it once they're signed in. Tell them in person or by text -\n`+
    `don't email it alongside their username.\n\n`+
    `At least 6 characters:`, suggestion);
  if(pw===null) return;
  if(String(pw).length<6){ S.toast='Password must be at least 6 characters.'; render(); return; }
  const original = btnEl ? btnEl.textContent : '';
  if(btnEl){ btnEl.disabled=true; btnEl.textContent='Setting…'; }
  try{
    const call = httpsCallable(functions, 'setTeacherPassword');
    await call({ email, password: pw });
    S.setTeacherPwResult = { email, name, password: pw };
  }catch(e){
    S.toast = 'Could not set the password: '+(e.message||'unknown error');
  }
  if(btnEl){ btnEl.disabled=false; btnEl.textContent=original; }
  render();
}
function renderTeacherPwCard(){
  const r = S.setTeacherPwResult;
  if(!r) return null;
  const card=el(`<div class="mmc-card mmc-notice" style="margin-bottom:14px;">
    <h3>Password set for ${esc(r.name||r.email)}</h3>
    <div class="meta">Shown once. It isn't stored anywhere. Pass it on in person, by text or on Teams, and ask them to change it after signing in.</div>
    <div class="mmc-row" style="align-items:center;gap:10px;margin-top:10px;">
      <code class="mmc-code" style="font-size:18px;padding:8px 14px;">${esc(r.password)}</code>
      <button class="mmc-btn gold sm" id="mmc-pw-copy">Copy password</button>
      <button class="mmc-btn ghost sm" id="mmc-pw-done">Done</button>
    </div>
    <div class="meta" style="margin-top:8px;">They sign in at <b>mathmentum.com.au</b> with <b>${esc(r.email)}</b>.</div>
  </div>`);
  card.querySelector('#mmc-pw-copy').onclick=async ()=>{
    try{ await navigator.clipboard.writeText(r.password); }catch(e){}
    S.toast='Password copied.'; render();
  };
  card.querySelector('#mmc-pw-done').onclick=()=>{ S.setTeacherPwResult=null; render(); };
  return card;
}


// ---------- Change your own password ----------
// Firebase requires a recent sign-in before it will change a password, so the
// current one is verified by re-authenticating rather than simply trusted. That
// also stops someone changing the password on a machine left signed in.
function renderChangePasswordCard(){
  const card=el(`<div class="mmc-card">
    <h3>Change your password</h3>
    <div class="meta">Signed in as ${esc((S.user&&S.user.email)||'')}. Use at least 6 characters.</div>
    ${S.pwChangeMsg ? `<div class="mmc-autherr" style="${S.pwChangeOk?'background:#E7F9EE;border-color:#2E9E4F;color:#1E6B37;':''}">${esc(S.pwChangeMsg)}</div>` : ''}
    <div class="mmc-field"><label>Current password</label><input type="password" id="mmc-pw-old" autocomplete="current-password"></div>
    <div class="mmc-field"><label>New password</label><input type="password" id="mmc-pw-new" autocomplete="new-password"></div>
    <div class="mmc-field"><label>Confirm new password</label><input type="password" id="mmc-pw-new2" autocomplete="new-password"></div>
    <button class="mmc-btn gold" id="mmc-pw-save">Change password</button>
  </div>`);
  const btn=card.querySelector('#mmc-pw-save');
  btn.onclick=async ()=>{
    const oldPw=card.querySelector('#mmc-pw-old').value;
    const a=card.querySelector('#mmc-pw-new').value;
    const b=card.querySelector('#mmc-pw-new2').value;
    S.pwChangeOk=false;
    if(!oldPw){ S.pwChangeMsg='Enter your current password.'; render(); return; }
    if(a.length<6){ S.pwChangeMsg='Your new password needs at least 6 characters.'; render(); return; }
    if(a!==b){ S.pwChangeMsg="The two new passwords don't match."; render(); return; }
    if(a===oldPw){ S.pwChangeMsg='That is already your password. Choose a different one.'; render(); return; }
    btn.disabled=true; btn.textContent='Changing…';
    try{
      const cred = EmailAuthProvider.credential(S.user.email, oldPw);
      await reauthenticateWithCredential(auth.currentUser, cred);
      await updatePassword(auth.currentUser, a);
      S.pwChangeOk=true;
      S.pwChangeMsg='Password changed. Use the new one next time you sign in.';
    }catch(e){
      const code = (e && e.code) || '';
      S.pwChangeMsg =
        code.includes('wrong-password') || code.includes('invalid-credential')
          ? 'That current password is not right.'
        : code.includes('weak-password') ? 'That password is too weak. Try a longer one.'
        : code.includes('too-many-requests') ? 'Too many attempts. Wait a few minutes and try again.'
        : 'Could not change your password: '+(e.message||'unknown error');
    }
    btn.disabled=false; btn.textContent='Change password';
    render();
  };
  return card;
}


// Signed in, but not yet approved as a teacher. Without this they'd fall through

// Students are excluded by their address: they use the internal students domain,
