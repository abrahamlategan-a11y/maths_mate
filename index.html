<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maths Mate</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap');

  html,body{ margin:0; padding:0; background:#F5F2E8; }
  body{ padding:24px 12px; }

  #mmc {
    --ink: #17181C; --ink-soft: #5C5A56;
    --paper: #FFFFFF; --paper-line: #E9E4D6; --bg: #F5F2E8;
    --slime: #B7E600; --slime-deep: #8FB800;
    --orange: #FF7A1A; --orange-deep: #E85C0A;
    --magenta: #FF3D8A; --magenta-deep: #D91F6B;
    --purple: #8B5CF6; --purple-deep: #6D28D9;
    --yellow: #FFD23F; --yellow-deep: #E6B400;
    --correct: #2E9E4F; --incorrect: #E23B3B;
    /* legacy aliases so nothing else needs renaming */
    --green-deep: var(--ink); --green: var(--ink);
    --mustard: var(--orange); --mustard-deep: var(--orange-deep);
    --sky: var(--purple); --sky-deep: var(--purple-deep);
    --gold: var(--orange); --chalk: #FFFFFF;

    font-family: 'Nunito Sans', sans-serif; color: var(--ink); background: var(--paper);
    border-radius: 22px; overflow: hidden; max-width: 900px; margin: 0 auto;
    border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink);
  }
  #mmc * { box-sizing: border-box; }
  #mmc button { font-family: inherit; cursor: pointer; }
  #mmc input, #mmc select, #mmc textarea { font-family: inherit; }

  .mmc-head {
    background: linear-gradient(115deg, var(--orange) 0%, var(--slime) 100%);
    color: var(--ink); padding: 30px 28px 24px; position: relative; overflow: hidden;
    border-bottom: 4px solid var(--ink);
  }
  .mmc-head::before {
    content:""; position:absolute; top:-40px; right:-40px; width:140px; height:140px;
    background: var(--purple); opacity:.25; border-radius: 62% 38% 55% 45% / 45% 55% 45% 55%;
  }
  .mmc-head::after {
    content:""; position:absolute; bottom:-30px; left:-20px; width:100px; height:100px;
    background: var(--yellow); opacity:.3; border-radius: 40% 60% 55% 45% / 55% 45% 60% 40%;
  }
  .mmc-title {
    font-family:'Baloo 2',sans-serif; font-weight:800; font-size:clamp(24px,4.2vw,32px);
    margin:0 0 4px; position:relative; letter-spacing:.2px;
    text-shadow: 2px 2px 0 rgba(255,255,255,0.35);
  }
  .mmc-sub { font-size:14px; color:#17181C; opacity:.75; margin:0; position:relative; font-weight:600; }
  .mmc-userrow { display:flex; justify-content:space-between; align-items:center; margin-top:18px; font-size:13px; color:var(--ink); position:relative; font-weight:700; }
  .mmc-userrow button { background:var(--paper); border:2.5px solid var(--ink); color:var(--ink); border-radius:10px; padding:7px 14px; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:12.5px; box-shadow:2px 2px 0 var(--ink); transition:transform .12s ease; }
  .mmc-userrow button:hover { transform:translate(-1px,-1px); box-shadow:3px 3px 0 var(--ink); }

  .mmc-body { padding:26px 28px 32px; background:
    radial-gradient(var(--paper-line) 1px, transparent 1.5px) 0 0/16px 16px,
    var(--paper); }
  .mmc-empty { text-align:center; padding:40px 20px; color:var(--ink-soft); font-weight:600; }
  .mmc-empty-icon { font-size:36px; margin-bottom:8px; }
  .mmc-toast { position:sticky; top:8px; z-index:20; background:var(--incorrect); color:#fff; padding:10px 14px; border-radius:10px; border:2.5px solid var(--ink); font-size:13px; font-weight:700; margin-bottom:14px; box-shadow:3px 3px 0 var(--ink); display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .mmc-toast-close { background:none; border:none; color:#fff; font-weight:800; font-size:14px; cursor:pointer; padding:0 2px; flex-shrink:0; }

  .mmc-btn { font-family:'Baloo 2',sans-serif; font-weight:700; font-size:14px; padding:10px 18px;
    border-radius:12px; border:2.5px solid var(--ink); background:var(--purple); color:#fff;
    box-shadow:3px 3px 0 var(--ink); transition:transform .1s ease, box-shadow .1s ease; }
  .mmc-btn:hover { transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--ink); }
  .mmc-btn:active { transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }
  .mmc-btn.gold { background:var(--orange); color:var(--ink); }
  .mmc-btn.gold:hover { background:var(--orange-deep); }
  .mmc-btn.ghost { background:var(--paper); border:2.5px solid var(--ink); color:var(--ink); box-shadow:3px 3px 0 var(--ink); }
  .mmc-btn.ghost:hover { background:var(--bg); }
  .mmc-btn.danger { background:#fff; color:var(--incorrect); border:2.5px solid var(--incorrect); box-shadow:3px 3px 0 var(--incorrect); }
  .mmc-btn.danger:hover { background:#FFF3F2; }
  .mmc-btn:disabled { opacity:.45; cursor:not-allowed; transform:none !important; }
  .mmc-btn.sm { padding:6px 12px; font-size:12.5px; border-radius:9px; box-shadow:2px 2px 0 var(--ink); }

  .mmc-card { background:var(--paper); border:2.5px solid var(--ink); border-radius:18px; padding:18px 20px; margin-bottom:16px;
    box-shadow:5px 5px 0 var(--ink); transition:transform .12s ease, box-shadow .12s ease; }
  .mmc-card h3 { font-family:'Baloo 2',sans-serif; font-weight:700; margin:0 0 4px; font-size:17px; }
  .mmc-card .meta { font-size:12.5px; color:var(--ink-soft); margin-bottom:10px; font-weight:600; }
  .mmc-row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .mmc-field { margin-bottom:12px; }
  .mmc-field label { display:block; font-size:12.5px; font-weight:800; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; margin-bottom:5px; }
  .mmc-field input[type=text], .mmc-field input[type=email], .mmc-field input[type=password], .mmc-field input[type=number], .mmc-field select {
    width:100%; padding:9px 11px; border-radius:10px; border:2px solid var(--paper-line); background:var(--paper); font-size:14.5px; color:var(--ink); font-weight:600;
  }
  .mmc-field input:focus, .mmc-field select:focus { outline:none; border-color:var(--purple); box-shadow:0 0 0 3px rgba(139,92,246,0.25); }

  .mmc-tabs { display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap; }
  .mmc-tab { background:var(--paper); border:2.5px solid var(--ink); padding:9px 14px; font-weight:700; font-family:'Baloo 2',sans-serif; font-size:13.5px; color:var(--ink-soft); border-radius:11px; box-shadow:2px 2px 0 var(--ink); transition:transform .1s ease; }
  .mmc-tab:hover { transform:translate(-1px,-1px); }
  .mmc-tab.active { color:var(--ink); background:var(--slime); }

  .mmc-qedit { border:2px dashed var(--ink-soft); border-radius:12px; padding:12px; margin-bottom:10px; background:var(--bg); }
  .mmc-qedit .idx { font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); margin-bottom:6px; font-weight:700; }
  .mmc-qedit textarea, .mmc-qedit input { width:100%; border:2px solid var(--paper-line); border-radius:9px; padding:7px 9px; font-size:13.5px; margin-bottom:6px; background:#fff; }
  .mmc-qedit .label2 { font-size:11px; color:var(--ink-soft); font-weight:800; text-transform:uppercase; letter-spacing:.03em; }

  .mmc-quiz-q { border:2.5px solid var(--ink); border-radius:16px; padding:16px; margin-bottom:12px; background:#fff; box-shadow:4px 4px 0 var(--ink); }
  .mmc-quiz-q .qnum { font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); margin-bottom:6px; font-weight:700; }
  .mmc-quiz-q .qtext { font-size:16px; font-weight:800; margin-bottom:10px; }
  .mmc-quiz-q .answer-row { display:flex; gap:8px; }
  .mmc-quiz-q input[type=text] { flex:1; padding:9px 11px; border-radius:10px; border:2px solid var(--paper-line); font-size:15px; font-weight:700; }
  .mmc-feedback { margin-top:10px; padding:10px 12px; border-radius:10px; font-size:13.5px; font-weight:700; border:2px solid; }
  .mmc-feedback.ok { background:#EEFBF1; color:var(--correct); border-color:var(--correct); }
  .mmc-feedback.no { background:#FEF1F0; color:var(--incorrect); border-color:var(--incorrect); }
  .mmc-qsvg { margin-bottom:10px; }
  .mmc-choices { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .mmc-choice-btn { padding:8px 14px; border-radius:20px; border:2.5px solid var(--ink); background:#fff; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:13.5px; color:var(--ink); box-shadow:2px 2px 0 var(--ink); }
  .mmc-choice-btn.selected { background:var(--purple); color:#fff; }
  .mmc-order-slot { width:64px; height:38px; border:2px dashed var(--paper-line); border-radius:20px; }
  .mmc-choice-btn:disabled { opacity:.7; }
  .mmc-coin-chip { padding:10px 16px; border-radius:14px; border:2.5px solid var(--ink); background:#fff; font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:14px; color:var(--ink); box-shadow:2px 2px 0 var(--ink); }
  .mmc-coin-chip.selected { background:var(--yellow); }
  .mmc-coin-chip:disabled { opacity:.7; }
  .mmc-coin-total { font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--ink-soft); margin-bottom:8px; font-weight:700; }
  .mmc-race-scene { overflow-x:auto; margin-bottom:16px; }
  .mmc-race-track { position:relative; min-width:320px; background:repeating-linear-gradient(180deg,#F5F2E8 0 40px, #ECE6D6 40px 42px);
    border:2.5px solid var(--ink); border-radius:14px; box-shadow:4px 4px 0 var(--ink); }
  .mmc-race-lane { position:absolute; left:8px; right:14px; height:2px; }
  .mmc-race-track-line { position:absolute; left:0; right:0; top:20px; height:2px; background:var(--paper-line); }
  .mmc-race-horse { position:absolute; top:-9px; display:flex; align-items:center; gap:4px;
    transition:left 0.7s cubic-bezier(.34,1.4,.64,1); animation:mmcTrot 0.5s infinite alternate; z-index:1; }
  .mmc-race-horse.me { z-index:2; }
  /* "me" glow is applied inline alongside the colour filter, combined in JS — see renderRaceTrack */
  .mmc-race-horse.me .mmc-race-name { background:var(--purple); color:#fff; border-color:var(--purple-deep); }
  .mmc-race-emoji { font-size:22px; display:inline-block; transform:scaleX(-1); }
  .mmc-race-horse-wrap { position:relative; display:inline-block; }
  .mmc-race-hat { position:absolute; top:-13px; left:50%; transform:translateX(-50%) scaleX(-1); font-size:14px; z-index:1; }
  .mmc-race-name { font-family:'Baloo 2',sans-serif; font-size:10.5px; font-weight:700; background:#fff; border:1.5px solid var(--ink); border-radius:8px; padding:1px 6px; white-space:nowrap; }
  .mmc-race-finish { position:absolute; right:10px; top:4px; bottom:4px; width:9px; border-radius:3px;
    background:repeating-linear-gradient(45deg,#17181C 0 6px, #fff 6px 12px); border:1.5px solid var(--ink); }
  @keyframes mmcTrot { from{ transform:translateY(0); } to{ transform:translateY(-3px); } }
  .mmc-frac-eq { display:inline-flex; align-items:center; gap:10px; font-size:22px; font-weight:700; flex-wrap:wrap; justify-content:center; }
  .mmc-frac { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; font-family:'IBM Plex Mono',monospace; font-weight:700; }
  .mmc-frac .num, .mmc-frac .den { padding:2px 8px; line-height:1.25; }
  .mmc-frac .line { width:100%; height:0; border-top:2.5px solid var(--ink); margin:1px 0; }
  .mmc-frac input { width:48px; text-align:center; font-size:18px; padding:5px 2px; border-radius:7px; border:2px solid var(--paper-line); font-family:'IBM Plex Mono',monospace; font-weight:700; }
  .mmc-frac input:focus { outline:none; border-color:var(--purple); }
  .mmc-choice-btn .mmc-frac { font-size:15px; }
  .mmc-choice-btn .mmc-frac .num, .mmc-choice-btn .mmc-frac .den { padding:1px 4px; }

  .mmc-stamp { display:inline-flex; flex-direction:column; align-items:center; justify-content:center; min-width:92px; padding:10px 14px;
    border-radius:14px; border:3px solid var(--ink); transform:rotate(-3deg); font-family:'Baloo 2',sans-serif; box-shadow:3px 3px 0 var(--ink); }
  .mmc-stamp .score { font-family:'IBM Plex Mono',monospace; font-size:18px; font-weight:700; }
  .mmc-stamp .msg { font-size:11px; font-weight:800; margin-top:2px; text-align:center; }
  .mmc-stamp.gold { background:var(--yellow); color:var(--ink); }
  .mmc-stamp.green { background:var(--slime); color:var(--ink); }
  .mmc-stamp.blue { background:#fff; color:var(--purple-deep); border-color:var(--purple); }
  .mmc-stamp.amber { background:#fff; color:var(--orange-deep); border-color:var(--orange); }

  .mmc-ledger-wrap { overflow-x:auto; border:2.5px solid var(--ink); border-radius:14px; }
  table.mmc-ledger { border-collapse:collapse; width:100%; font-size:13px; background:#fff; }
  table.mmc-ledger th, table.mmc-ledger td { padding:9px 12px; text-align:center; border-bottom:1.5px solid var(--paper-line); white-space:nowrap; }
  table.mmc-ledger th { background:var(--bg); font-family:'Baloo 2',sans-serif; font-weight:700; font-size:12.5px; color:var(--ink-soft); }
  table.mmc-ledger td:first-child, table.mmc-ledger th:first-child { text-align:left; font-weight:700; position:sticky; left:0; background:#fff; }
  .mmc-cellscore { font-family:'IBM Plex Mono',monospace; font-weight:700; }
  .mmc-cellscore.good { color:var(--correct); }
  .mmc-cellscore.mid { color:var(--orange-deep); }
  .mmc-cellscore.low { color:var(--incorrect); }
  code.mmc-code { font-family:'IBM Plex Mono',monospace; background:var(--bg); border:1.5px solid var(--paper-line); padding:2px 6px; border-radius:6px; }
  .mmc-autherr { color:var(--incorrect); font-size:13px; font-weight:700; margin-bottom:10px; }
  @media (max-width:520px){ .mmc-head, .mmc-body { padding-left:16px; padding-right:16px; } }
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";

  getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc,
  getDoc, getDocs, onSnapshot, query, where, serverTimestamp, increment
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

// ===== PASTE YOUR FIREBASE CONFIG HERE (see SETUP-INSTRUCTIONS.md) =====

const configured = firebaseConfig.apiKey !== "PASTE_ME";
let app, auth, db;
if (configured) {
  app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = getFirestore(app);
}

function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function pick(arr){ return arr[randInt(0,arr.length-1)]; }
function uid(p){ return p+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ [a,b]=[b,a%b]; } return a||1; }
function simplify(n,d){ const g=gcd(n,d)||1; return [n/g, d/g]; }
function fracStr(n,d){ const [sn,sd]=simplify(n,d); return sd===1 ? String(sn) : (sn+'/'+sd); }
function formatGrouped(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
function shuffleArr(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=randInt(0,i); [a[i],a[j]]=[a[j],a[i]]; } return a; }

// ---------- SVG diagram helpers ----------
function svgWrap(inner, w, h){
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:260px;height:auto;background:#fff;border:1px solid var(--paper-line);border-radius:8px;display:block;">${inner}</svg>`;
}
function drawShadedGrid(rows, cols, n){
  const cell = Math.max(12, Math.min(22, Math.floor(220/Math.max(rows,cols))));
  let cells='';
  const total=rows*cols;
  for(let i=0;i<total;i++){
    const r=Math.floor(i/cols), c=i%cols;
    const fill = i<n ? '#3F7A57' : '#ffffff';
    cells+=`<rect x="${c*cell}" y="${r*cell}" width="${cell}" height="${cell}" fill="${fill}" stroke="#E4DCC8"/>`;
  }
  return svgWrap(cells, cols*cell, rows*cell);
}
function drawRectShape(w,h){
  const cell=26, pad=1, gridW=w+pad*2, gridH=h+pad*2;
  let lines='';
  for(let x=0;x<=gridW;x++) lines+=`<line x1="${x*cell}" y1="0" x2="${x*cell}" y2="${gridH*cell}" stroke="#E4DCC8"/>`;
  for(let y=0;y<=gridH;y++) lines+=`<line x1="0" y1="${y*cell}" x2="${gridW*cell}" y2="${y*cell}" stroke="#E4DCC8"/>`;
  const rect=`<rect x="${pad*cell}" y="${pad*cell}" width="${w*cell}" height="${h*cell}" fill="#4C7A96" fill-opacity="0.45" stroke="#395E76" stroke-width="2"/>`;
  return svgWrap(lines+rect, gridW*cell, gridH*cell);
}
function lShapePoints(s, cell, offsetX, offsetY){
  return [
    [offsetX, offsetY],
    [offsetX+(s.W-s.nw)*cell, offsetY],
    [offsetX+(s.W-s.nw)*cell, offsetY+s.nh*cell],
    [offsetX+s.W*cell, offsetY+s.nh*cell],
    [offsetX+s.W*cell, offsetY+s.H*cell],
    [offsetX, offsetY+s.H*cell],
  ];
}
function gridLines(W,H,cell,offsetX,offsetY){
  let l='';
  for(let x=0;x<=W;x++) l+=`<line x1="${offsetX+x*cell}" y1="${offsetY}" x2="${offsetX+x*cell}" y2="${offsetY+H*cell}" stroke="#E4DCC8"/>`;
  for(let y=0;y<=H;y++) l+=`<line x1="${offsetX}" y1="${offsetY+y*cell}" x2="${offsetX+W*cell}" y2="${offsetY+y*cell}" stroke="#E4DCC8"/>`;
  return l;
}
function drawLShape(s){
  const cell=24, pad=1;
  const ox=pad*cell, oy=pad*cell;
  const lines=gridLines(s.W,s.H,cell,ox,oy);
  const poly=lShapePoints(s,cell,ox,oy).map(p=>p.join(',')).join(' ');
  const shape=`<polygon points="${poly}" fill="#4C7A96" fill-opacity="0.45" stroke="#395E76" stroke-width="2"/>`;
  return svgWrap(lines+shape, (s.W+pad*2)*cell, (s.H+pad*2)*cell);
}
function drawShapePair(s1,s2){
  const cell=20, gap=30, topPad=22;
  const w1=s1.W*cell, w2=s2.W*cell, maxH=Math.max(s1.H,s2.H)*cell;
  const offset2=w1+gap;
  let inner='';
  inner+=gridLines(s1.W,s1.H,cell,0,0);
  inner+=`<polygon points="${lShapePoints(s1,cell,0,0).map(p=>p.join(',')).join(' ')}" fill="#4C7A96" fill-opacity="0.45" stroke="#395E76" stroke-width="2"/>`;
  inner+=`<text x="${w1/2}" y="-6" font-size="14" text-anchor="middle" fill="#2B2620" font-family="IBM Plex Mono, monospace" font-weight="600">A</text>`;
  inner+=gridLines(s2.W,s2.H,cell,offset2,0);
  inner+=`<polygon points="${lShapePoints(s2,cell,offset2,0).map(p=>p.join(',')).join(' ')}" fill="#FF7A1A" fill-opacity="0.4" stroke="#E85C0A" stroke-width="2"/>`;
  inner+=`<text x="${offset2+w2/2}" y="-6" font-size="14" text-anchor="middle" fill="#2B2620" font-family="IBM Plex Mono, monospace" font-weight="600">B</text>`;
  return svgWrap(`<g transform="translate(4,${topPad})">${inner}</g>`, w1+gap+w2+8, maxH+topPad+8);
}
function drawClock(hour,minute){
  const cx=100, cy=100, r=90;
  const minuteAngle = minute*6, hourAngle=(hour%12)*30 + minute*0.5;
  function pt(deg,len){ const rad=(deg-90)*Math.PI/180; return [cx+len*Math.cos(rad), cy+len*Math.sin(rad)]; }
  const [hx,hy]=pt(hourAngle,48), [mx,my]=pt(minuteAngle,74);
  let ticks='';
  for(let i=0;i<12;i++){ const [x1,y1]=pt(i*30,80), [x2,y2]=pt(i*30,88);
    ticks+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#2B2620" stroke-width="2"/>`; }
  return svgWrap(`<circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff" stroke="#2B2620" stroke-width="3"/>${ticks}
    <line x1="${cx}" y1="${cy}" x2="${hx}" y2="${hy}" stroke="#2B2620" stroke-width="5" stroke-linecap="round"/>
    <line x1="${cx}" y1="${cy}" x2="${mx}" y2="${my}" stroke="#2B2620" stroke-width="3" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="4" fill="#2B2620"/>`, 200,200);
}
function drawAngle(deg){
  const cx=115, cy=150, r=110, arcR=32;
  function pt(a,len){ const rad=a*Math.PI/180; return [cx+len*Math.cos(rad), cy-len*Math.sin(rad)]; }
  const [x1,y1]=pt(0,r), [x2,y2]=pt(deg,r), [ax1,ay1]=pt(0,arcR), [ax2,ay2]=pt(deg,arcR);
  const largeArc = deg>180?1:0;
  return svgWrap(`<line x1="${cx}" y1="${cy}" x2="${x1}" y2="${y1}" stroke="#2B2620" stroke-width="3"/>

const GRID_SIZES = [ {rows:2,cols:5},{rows:4,cols:5},{rows:5,cols:6},{rows:5,cols:8},{rows:5,cols:10},{rows:6,cols:10},{rows:8,cols:10},{rows:10,cols:10} ];
function genShadedGrid(diff){
  if(diff==='easy'){

  }
  if(diff==='medium'){
    const size=pick(GRID_SIZES); const total=size.rows*size.cols;
    let n=randInt(2,total-2);
    if(gcd(n,total)<2){ n = total%2===0 ? total-2 : total-3; } // ensure it's reducible, so there's a real unsimplified form to offer as a decoy
    const correct=fracStr(n,total);
    const raw=`${n}/${total}`;
    const seen=new Set([correct]); const decoys=[];
    if(raw!==correct){ seen.add(raw); decoys.push(raw); } // the obvious unsimplified answer — kept as an option, but wrong
    const candidates=[total-n, n+size.cols, n-size.cols, n+1, n-1, n+size.rows, n-size.rows].filter(x=>x>0&&x<total&&x!==n);
    for(const c of shuffleArr(candidates)){ const f=fracStr(c,total); if(!seen.has(f)){ seen.add(f); decoys.push(f); if(decoys.length>=3) break; } }
    while(decoys.length<3){ const c=randInt(1,total-1); const f=fracStr(c,total); if(!seen.has(f)){ seen.add(f); decoys.push(f); } }
    const choices=shuffleArr([correct,...decoys.slice(0,3)]);
    return { prompt:`What fraction of the grid is shaded? Give your answer in simplest form.`, answer:correct, inputType:'choice', choices,
      explanation:`${n} out of ${total} squares are shaded — ${n}/${total} simplifies to ${correct}.`, svg:drawShadedGrid(size.rows,size.cols,n) };
  }

  let n=randInt(2,total-2);

  if(raw!==correct){ seen.add(raw); decoys.push(raw); }
  const candidates=[total-n, n+size.cols, n-size.cols, n+2, n-2].filter(x=>x>0&&x<total&&x!==n);
  for(const c of shuffleArr(candidates)){ const f=fracStr(c,total); if(!seen.has(f)){ seen.add(f); decoys.push(f); if(decoys.length>=3) break; } }
  while(decoys.length<3){ const c=randInt(1,total-1); const f=fracStr(c,total); if(!seen.has(f)){ seen.add(f); decoys.push(f); } }
  const choices=shuffleArr([correct, ...decoys.slice(0,3)]);
  return { prompt:`What fraction of the grid is shaded? Give your answer in simplest form.`, answer:correct, inputType:'choice', choices,
    explanation:`${n} out of ${total} squares are shaded — ${n}/${total} simplifies to ${correct}.`, svg:drawShadedGrid(size.rows,size.cols,n) };

const DENOMS=[{v:5,l:'5c'},{v:10,l:'10c'},{v:20,l:'20c'},{v:50,l:'50c'},{v:100,l:'$1'},{v:200,l:'$2'},{v:500,l:'$5'},{v:1000,l:'$10'},{v:2000,l:'$20'}];
function fmtCents(c){ return c>=100 ? '$'+(c/100).toFixed(2) : c+'c'; }
function buildCoinsQuestion(target, promptText, explanationText, requireMinimal){
  let remaining=target; const solution=[];
  for(let i=DENOMS.length-1;i>=0;i--){ while(remaining>=DENOMS[i].v){ solution.push(DENOMS[i]); remaining-=DENOMS[i].v; } }
  const decoyCount = solution.length>=8 ? randInt(1,2) : randInt(2,4);
  const decoys=[]; for(let i=0;i<decoyCount;i++) decoys.push(pick(DENOMS));
  const coins=[...solution,...decoys].map((c,i)=>({v:c.v,l:c.l,id:'c'+i}));
  for(let i=coins.length-1;i>0;i--){ const j=randInt(0,i); [coins[i],coins[j]]=[coins[j],coins[i]]; }
  const q={ prompt:promptText, inputType:'coins', targetCents:target, coins, explanation:explanationText };
  if(requireMinimal) q.minCoins=solution.length;
  return q;
}
function joinWithAnd(parts){

  return `${parts.slice(0,-1).join(', ')} and ${parts[parts.length-1]}`;
}
const PURCHASE_ITEMS=[

  const itemCount=pick([2,3]);

function genLShapeDims(lo,hi){

function lShapeArea(s){ return s.W*s.H - s.nw*s.nh; }
function fmtAP(area, perim, unit){ return `Area = ${area} ${unit}², Perimeter = ${perim} ${unit}`; }
function buildAPChoices(area, perim, unit){
  const correct=fmtAP(area,perim,unit);
  const seen=new Set([correct]); const decoys=[];
  const candidates=[
    fmtAP(perim, area, unit),
    fmtAP(area, Math.max(1,Math.round(perim/2)), unit),
    fmtAP(Math.max(1,Math.round(area/2)), perim, unit),
    fmtAP(area+randInt(2,10), perim, unit),

  for(const c of shuffleArr(candidates)){ if(!seen.has(c)){ seen.add(c); decoys.push(c); if(decoys.length>=3) break; } }
  while(decoys.length<3){
    const c=fmtAP(Math.max(1,area+randInt(-8,8)), Math.max(1,perim+randInt(-6,6)), unit);
    if(!seen.has(c)){ seen.add(c); decoys.push(c); }

  return { correct, choices: shuffleArr([correct, ...decoys.slice(0,3)]) };
}

const CONVERSIONS=[{from:'kg',to:'g',factor:1000},{from:'km',to:'m',factor:1000},{from:'L',to:'mL',factor:1000},{from:'m',to:'cm',factor:100},{from:'cm',to:'mm',factor:10}];
function zeroVariants(n){
  const variants=new Set();
  if(n%10===0) variants.add(String(n/10));
  variants.add(String(n*10));
  if(n%100===0) variants.add(String(n/100));
  variants.add(String(n*100));
  const s=String(n);
  if(s.includes('0')){
    const idx=s.indexOf('0');
    const removed=s.slice(0,idx)+s.slice(idx+1);
    if(removed!=='' && !removed.startsWith('0')) variants.add(removed);
  }
  if(s.length>=1){
    const inserted=s[0]+'0'+s.slice(1);
    variants.add(inserted);
  }
  return [...variants].filter(v=>v!==String(n) && v!=='' && Number(v)>0 && !v.startsWith('0'));
}

}

    ])();

          explanation:`The only multiple of ${m} between ${L} and ${H} is ${target}.` }; },

        digitSum=Math.floor(target/10)+(target%10); const matches=[];

        explanation:`The only even number between ${X} and ${Y} whose digits add to ${digitSum} is ${target}.` }; },
    ()=>{ let target,X,Y,digitSum,ok=false,tries=0;

        digitSum=Math.floor(target/10)+(target%10); const matches=[];
        for(let n=X+1;n<Y;n++){ if(n%2===0 && (Math.floor(n/10)+(n%10))===digitSum) matches.push(n); }
        if(matches.length===1 && matches[0]===target) ok=true; }

        explanation:`The only even number between ${X} and ${Y} whose digits add to ${digitSum} is ${target}.` }; },
  ])();

  const q = entry.gen(diff);
  q.strategyKey = entry.key; q.strategyLabel = entry.label;
  return q;
}

function normalize(s){ return String(s==null?'':s).trim().toLowerCase().replace(/\s+/g,''); }
function isNumeric(s){ return s!=='' && !isNaN(Number(s)); }
function parseFrac(s){ const m=String(s).match(/^(-?\d+)\/(\d+)$/); if(!m) return null; return [parseInt(m[1],10), parseInt(m[2],10)]; }
function parseNumList(s){ return String(s).split(/[^\-\d.]+/).filter(Boolean).map(Number).filter(n=>!isNaN(n)); }
function checkAnswer(given, answer){
  const g=normalize(given), a=normalize(answer);
  if(g==='') return false;
  const gf=parseFrac(g), af=parseFrac(a);
  if(gf && af) return gf[0]*af[1] === af[0]*gf[1];
  if(gf && isNumeric(a)) return gf[0] === Number(a)*gf[1];
  if(af && isNumeric(g)) return af[0] === Number(g)*af[1];
  if(isNumeric(g) && isNumeric(a)) return Number(g)===Number(a);
  return g===a;
}
function normTime(s){ const m=String(s).trim().match(/^(\d{1,2}):(\d{1,2})$/); if(!m) return null;
  return `${parseInt(m[1],10)}:${String(parseInt(m[2],10)).padStart(2,'0')}`; }
function gradeQuestion(q, given){
  if(q.inputType==='coins'){
    const sel = Array.isArray(given) ? given : [];
    const sum = (q.coins||[]).filter(c=>sel.includes(c.id)).reduce((s,c)=>s+c.v,0);
    if(sel.length===0 || sum!==q.targetCents) return false;
    if(q.minCoins!=null) return sel.length===q.minCoins;
    return true;
  }
  if(q.checkType==='time'){ const g=normTime(given), a=normTime(q.answer); return g!==null && g===a; }
  if(q.checkType==='numlist'){ const gi=parseNumList(given), an=parseNumList(q.answer);
    return gi.length===an.length && gi.every((v,i)=>v===an[i]); }
  if(q.checkType==='numset'){ const gi=new Set(parseNumList(given)), an=new Set(parseNumList(q.answer));
    if(gi.size!==an.size) return false; for(const v of an) if(!gi.has(v)) return false; return true; }
  if(q.inputType==='choice'){ return normalize(given)===normalize(q.answer); }
  if(q.inputType==='fracHard'){
    const gm=String(given).match(/^\s*(-?\d+)\s*\/\s*(-?\d+)\s*$/);
    if(!gm) return false;
    const am=String(q.answer).match(/^(-?\d+)\/(-?\d+)$/);
    return !!am && gm[1]===am[1] && gm[2]===am[2];
  }
  return checkAnswer(given, q.answer);
}

const BADGE_TIERS = {
  rookie: { key:'rookie', label:'Rookie', emoji:'🐴', colors:['default'], hats:['none'], nickname:false },
  upandcomer: { key:'upandcomer', label:'Up and Comer', emoji:'🌟', colors:['default','black','white'], hats:['none','cap'], nickname:false },
  expert: { key:'expert', label:'Expert', emoji:'🏆', colors:['default','black','white','purple','gold'], hats:['none','cap','crown','party','wizard'], nickname:true },
};
// Badge is computed live from actual practice history — not a stored counter — so it's
// always an honest reflection of recent effort, and naturally decays if practice stops.
function computeBadgeInfo(attempts){
  attempts = attempts || [];
  const total = attempts.length;
  const totalCorrect = attempts.reduce((s,a)=>s+(a.score||0),0);
  const totalAttempted = attempts.reduce((s,a)=>s+(a.attempted||0),0);
  const avgAccuracy = totalAttempted ? Math.round((totalCorrect/totalAttempted)*100) : 0;
  const hardAttempts = attempts.filter(a=>a.level==='hard');
  const hardCorrect = hardAttempts.reduce((s,a)=>s+(a.score||0),0);
  const hardAttempted = hardAttempts.reduce((s,a)=>s+(a.attempted||0),0);
  const hardAccuracy = hardAttempted ? Math.round((hardCorrect/hardAttempted)*100) : 0;

  const meetsExpertStats = total>=30 && hardAttempts.length>=10 && hardAccuracy>=60;
  const meetsUpAndComerStats = total>=15 && avgAccuracy>=50;

  const mostRecent = attempts.slice().sort((a,b)=>(b.submittedAt?.seconds||0)-(a.submittedAt?.seconds||0))[0];
  const daysSince = (mostRecent && mostRecent.submittedAt && mostRecent.submittedAt.seconds)
    ? (Date.now()/1000 - mostRecent.submittedAt.seconds)/86400 : Infinity;

  let tierKey='rookie';
  if(meetsExpertStats && daysSince<=3) tierKey='expert';
  else if((meetsExpertStats || meetsUpAndComerStats) && daysSince<=14) tierKey='upandcomer';

  return { tier:BADGE_TIERS[tierKey], total, avgAccuracy, hardCount:hardAttempts.length, hardAccuracy,
    daysSince, meetsExpertStats, meetsUpAndComerStats,
    decayedFromExpert: meetsExpertStats && daysSince>3 };
}

const TT_RANGES = { easy:[1,10], medium:[1,12], hard:[4,15] };
function genTTQuestion(level, idx){
  const [lo,hi] = TT_RANGES[level];
  const isDivision = level!=='easy' && idx%2===1;
  if(!isDivision){
    const a=randInt(lo,hi), b=randInt(lo,hi);
    return { prompt:`${a} × ${b}`, answer:a*b, isDivision:false, level };
  }
  const divisor=randInt(lo,hi), quotient=randInt(lo,hi); const dividend=divisor*quotient;
  return { prompt:`${dividend} ÷ ${divisor}`, answer:quotient, isDivision:true, level };
}
function formatMMSS(s){ const m=Math.floor(Math.max(0,s)/60), sec=Math.max(0,s)%60; return `${m}:${String(sec).padStart(2,'0')}`; }
function raceBoostAmount(level, isDivision, elapsedSec){
  const base = { easy:1.0, medium:1.3, hard:1.7 }[level] + (isDivision?0.3:0);
  const speedFactor = Math.max(0.3, 1 - elapsedSec/12);
  return base * speedFactor;
}
function raceRubberBandMultiplier(myPos, allPositions){
  if(allPositions.length<2) return 1;
  const maxPos=Math.max(...allPositions), minPos=Math.min(...allPositions);
  const spread=maxPos-minPos;
  if(spread<5) return 1;
  const behindRatio=(maxPos-myPos)/spread; // 0 = leader, 1 = last place
  return 0.7 + behindRatio*0.8; // leader gets 0.7x, last place gets up to 1.5x
}

function genUsername(first,last,taken){
  const firstClean=String(first||'').replace(/[^a-zA-Z]/g,'');
  const lastInitial=String(last||'').replace(/[^a-zA-Z]/g,'').charAt(0).toUpperCase();
  const base=(firstClean.charAt(0).toUpperCase()+firstClean.slice(1)) + lastInitial;
  let candidate=base, n=2;
  while(taken.has(candidate.toLowerCase())){ candidate=base+n; n++; }
  taken.add(candidate.toLowerCase());
  return candidate;
}

function currentLiveRoom(){

function ensureParticipantsSub(gameId){
  if(!gameId){
    if(liveParticipantsUnsub){ liveParticipantsUnsub(); liveParticipantsUnsub=null; }
    liveParticipantsRoomId=null; S.liveParticipants=[]; liveParticipantsGen++; return;
  }
  if(liveParticipantsRoomId===gameId) return;

  liveParticipantsRoomId=gameId;

  liveParticipantsUnsub = onSnapshot(collection(db,'liveGames',gameId,'participants'), snap=>{

    S.liveParticipants=snap.docs.map(d=>({id:d.id,...d.data()})); render();

function renderQuestionEditor(week){

          <div class="meta" style="margin-bottom:8px;">${esc((q.answer||'').split(',').join(' → '))} — use Regenerate for different numbers.</div>
        ` : q.inputType==='fracEasy' ? `
          <div class="label2">Fraction</div>
          <div class="meta" style="margin-bottom:8px;">${esc(q.givenNum)}/${esc(q.givenDen)} = ?/${esc(q.targetDen)} · answer: ${esc(q.answer)} — use Regenerate for different numbers.</div>
        ` : q.inputType==='fracHard' ? `

        ` : `
          <div class="label2">Answer</div>
          <input type="text" data-f="answer" value="${esc(q.answer)}">
        `}

        <div class="mmc-row" style="margin-top:6px;">

    row.querySelector('[data-f="prompt"]').onchange=(e)=>{ q.prompt=e.target.value; saveQuestions(); };
    const answerEl=row.querySelector('[data-f="answer"]');

    row.querySelector('[data-f="explanation"]').onchange=(e)=>{ q.explanation=e.target.value; saveQuestions(); };

function formatGivenAnswer(ans, q){
  if(!ans) return '(no answer recorded)';
  const given=ans.given;
  if(q.inputType==='coins'){
    if(!Array.isArray(given)) return String(given==null?'':given);
    const labels=(q.coins||[]).filter(c=>given.includes(c.id)).map(c=>c.l);
    return labels.length? labels.join(' + ') : '(no coins selected)';
  }
  if(q.inputType==='order'){
    return given? String(given).split(',').join(' → ') : '(not completed)';
  }
  return given==null || given==='' ? '(left blank)' : String(given);
}
function formatCorrectAnswer(q){
  if(q.inputType==='coins') return `${fmtCents(q.targetCents)}${q.minCoins!=null?` in exactly ${q.minCoins} piece${q.minCoins===1?'':'s'}`:''}`;
  if(q.inputType==='order') return (q.answer||'').split(',').join(' → ');
  return q.answer;
}

function renderLedgerByQuestion(){

  if(detail && S.gradebookDetail && S.gradebookDetail.type==='question') wrap.appendChild(detail);

  pubWeeks.forEach(w=>{ const m={}; (w.questions||[]).forEach(q=>{ m[q.id]=q.slot; }); qidToSlotByWeek[w.id]=m; });

  const studentUids = Object.keys(S.profiles).sort((a,b)=>(S.profiles[a].displayName||'').localeCompare(S.profiles[b].displayName||''));
  if(studentUids.length===0){ wrap.appendChild(el('<div class="mmc-empty">No students yet.</div>')); return wrap; }

  table.appendChild(thead);

  studentUids.forEach(uid=>{
    const tr=el('<tr></tr>');

      let correctCount=0, total=0;
      myResults.forEach(rec=>{
        const map=qidToSlotByWeek[rec.weekId]; if(!map) return;
        (rec.answers||[]).forEach(a=>{ if(map[a.qId]===s){ total++; if(a.correct) correctCount++; } });
      });

      else {
        const pct=Math.round((correctCount/total)*100);
        const emoji = pct>=80?'🟩':(pct>=50?'🟧':'🟥');

      }
    }
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  tableWrap.appendChild(table);
  wrap.appendChild(tableWrap);
  return wrap;
}


function exportCSV(pubWeeks, studentUids){
  const header=['Student name','Email', ...pubWeeks.map(w=>w.label), 'Average %'];
  const rows=[header];
  studentUids.forEach(uid=>{
    const row=[S.profiles[uid].displayName||'', S.profiles[uid].email||''];
    let sum=0, cnt=0;
    pubWeeks.forEach(w=>{ const rec=S.results.find(r=>r.uid===uid && r.weekId===w.id);
      if(rec){ row.push(`${rec.score}/${rec.total}`); sum+= rec.total? rec.score/rec.total:0; cnt++; } else row.push(''); });
    row.push(cnt? Math.round((sum/cnt)*100) : '');
    rows.push(row);
  });
  const csv=rows.map(r=>r.map(c=>{ const s=String(c); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'}); const url=URL.createObjectURL(blob);

Tom Nguyen
Aisha Patel">${esc(S.bulkNamesText)}</textarea></div>

    </div>
  `);
  form.querySelector('#mmc-bulk-names').oninput=(e)=>{ S.bulkNamesText=e.target.value; };
  form.querySelector('#mmc-bulk-go').onclick=async ()=>{
    const namesText=form.querySelector('#mmc-bulk-names').value;
    const teacherPass=form.querySelector('#mmc-bulk-pass').value;
    const lines=namesText.split('\n').map(l=>l.trim()).filter(Boolean);
    if(lines.length===0){ S.authError='Paste at least one name.'; render(); return; }
    if(!teacherPass){ S.authError='Enter your password to continue.'; render(); return; }
    S.authError=null;
    const teacherEmail=S.user.email;
    // Local uniqueness guard only prevents obvious clashes within this batch / your
    // own class — usernames must be unique across every teacher's class too, and we
    // can't read other teachers' students (by design), so real collisions are caught
    // by Firebase itself and retried below with an incremented suffix.
    const taken=new Set(Object.values(S.profiles).map(p=>String(p.username||'').toLowerCase()).filter(Boolean));

          await signInWithEmailAndPassword(auth,teacherEmail,teacherPass);
          S.bulkResults.push({name:fullName, username, password, status:'ok'});
          done=true;
        }catch(e){
          lastErr=e;
          if(e.code==='auth/email-already-in-use'){ continue; } // taken set already advanced; retry with next suffix
          S.bulkResults.push({name:fullName, username, password:null, status:'error', error:friendlyAuthError(e.code)});
          try{ await signInWithEmailAndPassword(auth,teacherEmail,teacherPass); }catch(e2){}
          done=true;
        }
      }
      if(!done && lastErr){
        S.bulkResults.push({name:fullName, username:'—', password:null, status:'error', error:'Could not find a free username — try again.'});
      }
      S.bulkProgress=`${i+1}/${lines.length}`; render();
    }
    S.bulkCreating=false;
    await handleAuthChange(auth.currentUser);
    render();
  };
  wrap.appendChild(form);

  const existing = Object.entries(S.profiles).filter(([uid,p])=>p.username);
  if(existing.length){
    const list=el('<div class="mmc-card"><h3>Existing student logins</h3><div class="meta">Passwords can\'t be shown again — if one\'s lost, re-run that name through the form above to issue a fresh login.</div></div>');

    });
    list.appendChild(ul);
    wrap.appendChild(list);
  }
  return wrap;
}

function initQuizState(week){
  S.activeWeekId=week.id; S.quiz={};
  (week.questions||[]).forEach(q=> S.quiz[q.id]= q.inputType==='order'
    ? {given:'', pool:shuffleArr(q.items||[]), placed:[], checked:false, correct:false}
    : {given: q.inputType==='coins' ? [] : '', checked:false, correct:false});
}
function progressMatchesWeek(progress, week){
  if(!progress || !progress.quiz) return false;
  return (week.questions||[]).every(q => progress.quiz[q.id] !== undefined);
}
async function saveWeekProgress(week){
  if(!S.user) return;
  try{
    await setDoc(doc(db,'weekProgress', `${S.user.uid}_${week.id}`), {
      uid:S.user.uid, weekId:week.id, teacherUid: S.profile? S.profile.teacherUid : null,
      quiz:S.quiz, updatedAt:serverTimestamp()
    });
  }catch(e){ /* auto-save is best-effort — don't interrupt the student over it */ }
}
async function deleteWeekProgress(weekId){
  if(!S.user) return;
  try{ await deleteDoc(doc(db,'weekProgress', `${S.user.uid}_${weekId}`)); }catch(e){}
}
function renderWeeklyPassport(){
  const wrap=el('<div></div>');
  if(S.weeks.length===0){
    wrap.appendChild(el('<div class="mmc-empty"><div class="mmc-empty-icon">📭</div>No quizzes published yet — check back soon!</div>'));
    return wrap;
  }
  wrap.appendChild(el('<h3 style="font-family:Fredoka,sans-serif;margin:4px 0 12px;">Your maths passport</h3>'));
  S.weeks.slice().sort((a,b)=> (b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)).forEach(week=>{
    const rec = S.results.find(r=>r.weekId===week.id);
    const card=el(`
      <div class="mmc-card mmc-row" style="justify-content:space-between;">
        <div><h3>${esc(week.label)}</h3><div class="meta">${(week.questions||[]).length} questions · ${esc(week.difficulty)}</div></div>
        <div></div>
      </div>
    `);
    const right=card.querySelector('div:last-child');
    if(rec){
      right.style.cssText='display:flex;flex-direction:column;align-items:flex-end;gap:8px;';
      right.innerHTML=stampHTML(rec.score, rec.total);
      const retakeBtn=el('<button class="mmc-btn ghost sm">↻ Retake</button>');
      retakeBtn.onclick=()=>{
        if(!confirm(`Retaking will replace your current score of ${rec.score}/${rec.total} for "${week.label}". Continue?`)) return;
        initQuizState(week); render();
      };
      right.appendChild(retakeBtn);
    } else {
      const progress = S.weekProgress.find(p=>p.weekId===week.id);
      if(progress && progressMatchesWeek(progress, week)){
        const answeredCount = (week.questions||[]).filter(q=>progress.quiz[q.id] && progress.quiz[q.id].checked).length;
        right.style.cssText='display:flex;flex-direction:column;align-items:flex-end;gap:6px;';
        right.appendChild(el(`<div class="meta" style="margin:0;">${answeredCount}/${(week.questions||[]).length} answered so far</div>`));
        const continueBtn=el('<button class="mmc-btn gold">Continue ▶</button>');
        continueBtn.onclick=()=>{ S.activeWeekId=week.id; S.quiz=progress.quiz; render(); };
        right.appendChild(continueBtn);
      } else {
        if(progress) deleteWeekProgress(week.id); // stale (week was regenerated since) — clean it up
        const startBtn=el('<button class="mmc-btn gold">Start ▶</button>');
        startBtn.onclick=()=>{ initQuizState(week); render(); };
        right.appendChild(startBtn);
      }
    }
    wrap.appendChild(card);
  });
  return wrap;
}

function startTTTimer(){
  if(S.tt.timerHandle) clearInterval(S.tt.timerHandle);
  S.tt.timerHandle=setInterval(()=>{
    if(!S.tt || !S.tt.active) return;
    S.tt.timeLeft--;
    const timerEl=document.getElementById('mmc-tt-timer');
    if(timerEl) timerEl.textContent=formatMMSS(S.tt.timeLeft);
    if(S.tt.timeLeft<=0){ clearInterval(S.tt.timerHandle); finishTTChallenge(); }
  },1000);
}
function submitTTAnswer(given){
  if(!S.tt || !S.tt.active) return;
  const correct = normalize(given)===normalize(String(S.tt.currentQ.answer));
  S.tt.attempted++;
  if(correct) S.tt.score++;
  S.tt.qIndex++;
  S.tt.currentQ=genTTQuestion(S.tt.level, S.tt.qIndex);
  render();
}
async function finishTTChallenge(){
  const {level, score, attempted} = S.tt;
  const accuracy = attempted? Math.round((score/attempted)*100) : 0;
  S.tt.active=false; S.tt.finished=true; S.tt.lastResult={level,score,attempted,accuracy};
  try{
    await addDoc(collection(db,'ttAttempts'), { uid:S.user.uid, teacherUid:S.profile?S.profile.teacherUid:null, level, score, attempted, accuracy, submittedAt:serverTimestamp() });
  }catch(e){ S.toast='Could not save this attempt — check your connection.'; }
  render();
}
function abortTTChallenge(){
  if(!S.tt) return;
  if(!confirm("Quit this challenge? Your progress won't be saved.")) return;
  if(S.tt.timerHandle) clearInterval(S.tt.timerHandle);
  S.tt=null;
  render();
}
function renderTTChallenge(){
  const wrap=el('<div></div>');
  const t=S.tt;
  const head=el(`
    <div class="mmc-card">
      <div class="mmc-row" style="justify-content:space-between;">
        <div><h3 style="text-transform:capitalize;">${esc(t.level)} challenge</h3><div class="meta">Score: ${t.score} / ${t.attempted}</div></div>
        <div id="mmc-tt-timer" style="font-family:'IBM Plex Mono',monospace;font-size:28px;font-weight:700;color:var(--sky-deep);">${formatMMSS(t.timeLeft)}</div>
      </div>
      <button class="mmc-btn danger sm" id="mmc-tt-quit" style="margin-top:8px;">✕ Quit</button>
    </div>
  `);
  head.querySelector('#mmc-tt-quit').onclick=abortTTChallenge;
  wrap.appendChild(head);
  const qbox=el(`
    <div class="mmc-card" style="text-align:center;">
      <div style="font-family:'Fredoka',sans-serif;font-size:36px;font-weight:700;margin-bottom:16px;">${esc(t.currentQ.prompt)} = ?</div>
      <div class="mmc-row" style="justify-content:center;">
        <input type="text" id="mmc-tt-input" autocomplete="off" style="width:120px;text-align:center;font-size:22px;padding:10px;border-radius:8px;border:1.5px solid var(--paper-line);">
        <button class="mmc-btn gold" id="mmc-tt-submit">Go</button>
      </div>
    </div>
  `);
  const input=qbox.querySelector('#mmc-tt-input');
  const go=()=>{ const v=input.value; input.value=''; submitTTAnswer(v); };
  qbox.querySelector('#mmc-tt-submit').onclick=go;
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
  wrap.appendChild(qbox);
  return wrap;
}

// ---------- Live Game (shared helpers) ----------
function liveTimeLeft(room){
  if(!room.startedAt || !room.startedAt.seconds) return room.durationSec||300;
  const elapsed = (Date.now()/1000) - room.startedAt.seconds;
  return Math.max(0, Math.round((room.durationSec||300) - elapsed));
}
function renderLiveLeaderboardCard(title, room, isFinal){
  const card=el(`<div class="mmc-card"><h3>${esc(title)}</h3></div>`);
  const sorted=S.liveParticipants.slice().sort((a,b)=>(b.score||0)-(a.score||0));
  if(sorted.length===0){ card.appendChild(el('<div class="meta">No players yet.</div>')); return card; }
  const medal=(i)=> i===0?'🥇':i===1?'🥈':i===2?'🥉':`${i+1}.`;
  sorted.forEach((p,i)=>{
    card.appendChild(el(`
      <div class="mmc-row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--paper-line);">
        <div>${medal(i)} ${esc(p.name)}</div>
        <div class="mmc-cellscore">${p.score||0} correct</div>
      </div>
    `));
  });
  return card;
}
function renderRaceTrack(myUid, capNearFinish){
  const participants=S.liveParticipants.slice().sort((a,b)=>(a.joinedAt?.seconds||0)-(b.joinedAt?.seconds||0));
  const outer=el('<div class="mmc-race-scene"></div>');
  if(participants.length===0){ outer.appendChild(el('<div class="meta">No players yet.</div>')); return outer; }
  const laneH=46, topPad=14;
  const track=el(`<div class="mmc-race-track" style="height:${participants.length*laneH+topPad*2}px;"></div>`);
  track.appendChild(el('<div class="mmc-race-finish"></div>'));
  participants.forEach((p,i)=>{
    let pos=Math.max(0,Math.min(100,p.position||0));
    if(capNearFinish) pos=Math.min(pos,96); // the line is only actually crossed once time runs out
    const isMe = myUid && p.id===myUid;
    const label = p.nickname || p.username || p.name;
    const colorFilter = HORSE_COLOR_FILTERS[p.horseColor] || 'none';
    const meGlow = isMe ? ' drop-shadow(0 0 5px var(--purple))' : '';
    const combinedFilter = ((colorFilter==='none'?'':colorFilter) + meGlow).trim() || 'none';
    const hatEmoji = HORSE_HAT_EMOJI[p.horseHat] || '';
    const lane=el(`<div class="mmc-race-lane" style="top:${topPad+i*laneH}px;"><div class="mmc-race-track-line"></div></div>`);
    const horse=el(`
      <div class="mmc-race-horse${isMe?' me':''}" style="left:calc(${pos}% - 18px);">
        <span class="mmc-race-horse-wrap">
          ${hatEmoji? `<span class="mmc-race-hat">${hatEmoji}</span>` : ''}
          <span class="mmc-race-emoji" style="filter:${combinedFilter};">🐎</span>
        </span>
        <span class="mmc-race-name">${esc(label)}${isMe?' (you)':''}</span>
      </div>
    `);
    lane.appendChild(horse);
    track.appendChild(lane);
  });
  outer.appendChild(track);
  return outer;
}
function renderChaseCallout(myUid){
  const sorted=S.liveParticipants.slice().sort((a,b)=>(b.position||0)-(a.position||0));
  const myIdx=sorted.findIndex(p=>p.id===myUid);
  if(myIdx===-1) return null;
  if(myIdx===0){
    return el(`<div class="mmc-card" style="text-align:center;background:var(--slime);"><h3 style="margin:0;">🏆 You're in the lead — don't let up!</h3></div>`);
  }
  const ahead=sorted[myIdx-1];
  const gap=Math.max(0.1, (ahead.position||0)-(sorted[myIdx].position||0));
  return el(`<div class="mmc-card" style="text-align:center;"><h3 style="margin:0;">🎯 Chasing ${esc(ahead.name)}</h3><div class="meta" style="margin:2px 0 0;">${gap.toFixed(1)} points ahead of you — answer fast to catch up!</div></div>`);
}

// ---------- Live Game (teacher) ----------
let teacherLiveTimerHandle=null, teacherLiveTimerRoomId=null;
function startLiveTeacherTimer(room){
  if(teacherLiveTimerRoomId===room.id && teacherLiveTimerHandle) return;
  if(teacherLiveTimerHandle) clearInterval(teacherLiveTimerHandle);
  teacherLiveTimerRoomId=room.id;
  teacherLiveTimerHandle=setInterval(async ()=>{
    const r=currentLiveRoom();
    if(!r || r.id!==room.id || r.status!=='active'){ clearInterval(teacherLiveTimerHandle); teacherLiveTimerHandle=null; return; }
    const left=liveTimeLeft(r);
    const timerEl=document.getElementById('mmc-live-timer');
    if(timerEl) timerEl.textContent=formatMMSS(left);
    if(left<=0){
      clearInterval(teacherLiveTimerHandle); teacherLiveTimerHandle=null;
      try{ await updateDoc(doc(db,'liveGames',r.id), {status:'ended'}); }
      catch(e){ S.toast='Could not auto-end the game: '+e.message; render(); }
    }
  },1000);
}
// Runs off the data subscription itself (not the UI), so the 5-minute
// auto-end fires reliably even if the teacher is looking at a different tab.
function ensureTeacherLiveTimer(){
  const room=currentLiveRoom();
  if(room && room.status==='active'){ startLiveTeacherTimer(room); }
  else if(teacherLiveTimerHandle){ clearInterval(teacherLiveTimerHandle); teacherLiveTimerHandle=null; teacherLiveTimerRoomId=null; }
}

// ---------- Live Game (student) ----------
function syncMyLiveSession(){
  const room=currentLiveRoom();
  if(!room){ if(S.myLive){ if(S.myLive.timerHandle) clearInterval(S.myLive.timerHandle); S.myLive=null; } return; }
  if(room.status==='ended'){
    if(S.myLive && S.myLive.gameId===room.id){ if(S.myLive.timerHandle) clearInterval(S.myLive.timerHandle); S.myLive=null; }
    return;
  }
  if(room.status==='lobby') return;
  if(room.status==='active'){
    const joined = S.liveParticipants.some(p=>p.id===S.user.uid);
    if(!joined) return;
    if(S.myLive && S.myLive.gameId===room.id) return;
    if(S.myLive && S.myLive.timerHandle) clearInterval(S.myLive.timerHandle);
    S.myLive = { gameId:room.id, level:room.level, answering:true, qIndex:0, currentQ:genTTQuestion(room.level,0),
      score:0, attempted:0, position:0, questionStartedAt:Date.now(), timerHandle:null };
    startMyLiveTimer();
  }
}
function startMyLiveTimer(){
  S.myLive.timerHandle=setInterval(()=>{
    const r=currentLiveRoom();
    if(!r || r.id!==S.myLive.gameId){ clearInterval(S.myLive.timerHandle); return; }
    const left=liveTimeLeft(r);
    const timerEl=document.getElementById('mmc-live-my-timer');
    if(timerEl) timerEl.textContent=formatMMSS(left);
    if(left<=0){ clearInterval(S.myLive.timerHandle); S.myLive.answering=false; render(); }
  },1000);
}
async function submitMyLiveAnswer(given){
  if(!S.myLive || !S.myLive.answering) return;
  const correct = normalize(given)===normalize(String(S.myLive.currentQ.answer));
  S.myLive.attempted++; if(correct) S.myLive.score++;
  const elapsedSec = (Date.now()-S.myLive.questionStartedAt)/1000;
  const allPositions = S.liveParticipants.map(p=>p.position||0);
  const rubberBand = raceRubberBandMultiplier(S.myLive.position, allPositions.length? allPositions : [S.myLive.position]);
  if(correct){
    const boost = raceBoostAmount(S.myLive.currentQ.level, S.myLive.currentQ.isDivision, elapsedSec) * rubberBand;
    S.myLive.position = Math.min(100, S.myLive.position + boost);
  } else {
    S.myLive.position = Math.max(0, S.myLive.position - 0.8);
  }
  S.myLive.qIndex++; S.myLive.currentQ=genTTQuestion(S.myLive.level, S.myLive.qIndex); S.myLive.questionStartedAt=Date.now();
  render();
  try{ await updateDoc(doc(db,'liveGames',S.myLive.gameId,'participants',S.user.uid), {score:S.myLive.score, attempted:S.myLive.attempted, position:S.myLive.position}); }
  catch(e){ S.toast='Score sync error: '+e.message; render(); }
}

  const room=currentLiveRoom();
  const head=el(`

        <input type="text" id="mmc-live-input" autocomplete="off" style="width:120px;text-align:center;font-size:22px;padding:10px;border-radius:10px;border:2px solid var(--paper-line);">

function renderStudentLiveGame(){
  const wrap=el('<div></div>');
  const room=currentLiveRoom();
  if(!room){
    wrap.appendChild(el('<div class="mmc-empty"><div class="mmc-empty-icon">🔴</div>No live game right now — ask your teacher to start one!</div>'));
    return wrap;
  }
  const joined = S.liveParticipants.some(p=>p.id===S.user.uid);
  if(room.status==='lobby'){
    if(!joined){
      const card=el(`
        <div class="mmc-card">
          <h3>🔴 ${esc(room.level)} game starting soon!</h3>
          <div class="meta">${S.liveParticipants.length} player${S.liveParticipants.length===1?'':'s'} waiting · Room: <code class="mmc-code">${esc(room.id.slice(0,6))}</code></div>
          <button class="mmc-btn gold" id="mmc-live-join">Join ▶</button>
        </div>
      `);
      card.querySelector('#mmc-live-join').onclick=()=>joinLiveGame(room.id);
      wrap.appendChild(card);
    } else {
      if(S.lobbyReadyForRoom === room.id){
        wrap.appendChild(el(`
          <div class="mmc-card">
            <h3>You're in! ✓</h3>
            <div class="meta">Waiting for your teacher to start… ${S.liveParticipants.length} player${S.liveParticipants.length===1?'':'s'} ready.</div>
          </div>
        `));
      } else {
        wrap.appendChild(el(`<div class="mmc-card"><h3>You're in! ✓</h3><div class="meta">Customize your horse before the race starts.</div></div>`));
        wrap.appendChild(renderHorseCustomizeCard());
        const readyBtn=el('<button class="mmc-btn gold" style="width:100%;font-size:16px;padding:12px;">I\'m Ready! 🏁</button>');
        readyBtn.onclick=async ()=>{ await syncParticipantCustomization(room.id); S.lobbyReadyForRoom=room.id; render(); };
        wrap.appendChild(readyBtn);
      }
    }
    return wrap;
  }
  if(room.status==='active'){
    if(!joined){
      wrap.appendChild(el('<div class="mmc-empty"><div class="mmc-empty-icon">🔴</div>This game already started — catch the next one!</div>'));
      wrap.appendChild(renderLiveLeaderboardCard('Live leaderboard', room, false));
      return wrap;
    }
    if(S.myLive && S.myLive.gameId===room.id && !S.myLive.answering){
      wrap.appendChild(el(`<div class="mmc-card"><h3>⏱ Time's up!</h3><div class="meta">Waiting for the final leaderboard…</div></div>`));
      wrap.appendChild(renderLiveLeaderboardCard('Live leaderboard', room, false));
      return wrap;
    }
    wrap.appendChild(el('<div class="mmc-empty">Loading your game…</div>'));
    return wrap;
  }
  if(room.status==='ended'){
    const mine = S.liveParticipants.find(p=>p.id===S.user.uid);
    wrap.appendChild(el(`<div class="mmc-card"><h3>Game over!</h3><div class="meta">${mine? `You scored ${mine.score} correct.` : 'Final results are in.'}</div></div>`));
    wrap.appendChild(renderRaceTrack(S.user.uid));
    wrap.appendChild(renderLiveLeaderboardCard('Final leaderboard', room, true));
    return wrap;
  }
  return wrap;
}

      uid:S.user.uid, name:S.profile? S.profile.displayName : S.user.email,
      username: S.profile && S.profile.username ? S.profile.username : null,

function renderQuizTaking(week){
  const wrap=el('<div></div>');
  const back=el('<a href="#" style="color:var(--sky-deep);font-size:13px;">← back to passport</a>');
  back.onclick=(e)=>{ e.preventDefault(); S.activeWeekId=null; render(); };
  wrap.appendChild(back);
  wrap.appendChild(el(`<h3 style="font-family:Fredoka,sans-serif;margin:10px 0 14px;">${esc(week.label)}</h3>`));
  (week.questions||[]).forEach((q,i)=>{
    const st=S.quiz[q.id];
    const qbox=el(`
      <div class="mmc-quiz-q">
        <div class="qnum">Question ${i+1} of ${week.questions.length} — ${esc(q.title||'')}${q.strategyLabel?` (${esc(q.strategyLabel)})`:''}</div>
        ${q.svg ? `<div class="mmc-qsvg">${q.svg}</div>` : ''}
        <div class="qtext">${esc(q.prompt)}</div>
      </div>
    `);
    function doCheck(){ if(st.checked) return; st.checked=true; st.correct=gradeQuestion(q, st.given); render(); saveWeekProgress(week); }

    if(q.inputType==='choice'){
      if(q.renderFractionChoices && q.givenNum!=null){
        const givenRow=el(`<div class="mmc-frac-eq" style="margin-bottom:14px;">${fracHTML(q.givenNum, q.givenDen)}</div>`);
        qbox.appendChild(givenRow);
      }
      const choiceRow=el('<div class="mmc-choices"></div>');
      (q.choices||[]).forEach(c=>{
        const label = q.renderFractionChoices ? fracChoiceHTML(c) : esc(c);
        const b=el(`<button type="button" class="mmc-choice-btn ${st.given===c?'selected':''}" ${st.checked?'disabled':''}>${label}</button>`);
        b.onclick=()=>{ if(st.checked) return; st.given=c; render(); };
        choiceRow.appendChild(b);
      });
      qbox.appendChild(choiceRow);
      const checkBtn=el(`<button class="mmc-btn ${st.checked?'ghost':'gold'} sm" ${st.checked||!st.given?'disabled':''}>${st.checked?'Checked':'Check'}</button>`);
      checkBtn.onclick=doCheck;
      qbox.appendChild(checkBtn);
    } else if(q.inputType==='fracEasy'){
      const row=el(`
        <div class="mmc-frac-eq">
          ${fracHTML(q.givenNum, q.givenDen)}
          <span>=</span>
          <span class="mmc-frac"><input type="text" id="mmc-frac-in" autocomplete="off" value="${esc(st.given)}" ${st.checked?'disabled':''}><span class="line"></span><span class="den">${esc(q.targetDen)}</span></span>
        </div>
      `);
      const input=row.querySelector('#mmc-frac-in');
      input.oninput=(e)=>{ st.given=e.target.value; };
      input.addEventListener('keydown', e=>{ if(e.key==='Enter' && !st.checked) doCheck(); });
      qbox.appendChild(row);
      const checkBtn=el(`<button class="mmc-btn ${st.checked?'ghost':'gold'} sm" style="margin-top:10px;" ${st.checked?'disabled':''}>${st.checked?'Checked':'Check'}</button>`);
      checkBtn.onclick=doCheck;
      qbox.appendChild(checkBtn);
    } else if(q.inputType==='fracHard'){
      const parts=String(st.given||'').split('/');
      const row=el(`
        <div class="mmc-frac-eq">
          ${fracHTML(q.givenNum, q.givenDen)}
          <span>=</span>
          <span class="mmc-frac">
            <input type="text" id="mmc-frac-num" autocomplete="off" value="${esc(parts[0]||'')}" ${st.checked?'disabled':''}>
            <span class="line"></span>
            <input type="text" id="mmc-frac-den" autocomplete="off" value="${esc(parts[1]||'')}" ${st.checked?'disabled':''}>
          </span>
        </div>
      `);
      const numIn=row.querySelector('#mmc-frac-num'), denIn=row.querySelector('#mmc-frac-den');
      const sync=()=>{ st.given=`${numIn.value.trim()}/${denIn.value.trim()}`; };
      numIn.oninput=sync; denIn.oninput=sync;
      [numIn,denIn].forEach(inp=>inp.addEventListener('keydown', e=>{ if(e.key==='Enter' && !st.checked){ sync(); doCheck(); } }));
      qbox.appendChild(row);
      const checkBtn=el(`<button class="mmc-btn ${st.checked?'ghost':'gold'} sm" style="margin-top:10px;" ${st.checked?'disabled':''}>${st.checked?'Checked':'Check'}</button>`);
      checkBtn.onclick=()=>{ sync(); doCheck(); };
      qbox.appendChild(checkBtn);
    } else if(q.inputType==='coins'){
      const coinRow=el('<div class="mmc-choices"></div>');
      (q.coins||[]).forEach(c=>{
        const sel=st.given.includes(c.id);
        const b=el(`<button type="button" class="mmc-coin-chip ${sel?'selected':''}" ${st.checked?'disabled':''}>${esc(c.l)}</button>`);
        b.onclick=()=>{ if(st.checked) return; st.given = sel ? st.given.filter(id=>id!==c.id) : [...st.given, c.id]; render(); };
        coinRow.appendChild(b);
      });
      qbox.appendChild(coinRow);
      const checkBtn=el(`<button class="mmc-btn ${st.checked?'ghost':'gold'} sm" ${st.checked||st.given.length===0?'disabled':''}>${st.checked?'Checked':'Check'}</button>`);
      checkBtn.onclick=doCheck;
      qbox.appendChild(checkBtn);
    } else if(q.inputType==='order'){
      const slotsRow=el('<div class="mmc-choices" style="min-height:44px;"></div>');
      for(let s=0;s<(q.items||[]).length;s++){
        const val=st.placed[s];
        if(val===undefined){
          slotsRow.appendChild(el(`<div class="mmc-order-slot"></div>`));
        } else {
          const b=el(`<button type="button" class="mmc-choice-btn selected" ${st.checked?'disabled':''}>${esc(val)}</button>`);
          b.onclick=()=>{ if(st.checked) return; st.placed=st.placed.filter((_,idx)=>idx!==s); st.pool.push(val); render(); };
          slotsRow.appendChild(b);
        }
      }
      qbox.appendChild(el('<div class="meta" style="margin-bottom:4px;">Your order:</div>'));
      qbox.appendChild(slotsRow);
      qbox.appendChild(el('<div class="meta" style="margin:10px 0 4px;">Tap to add:</div>'));
      const poolRow=el('<div class="mmc-choices"></div>');
      st.pool.forEach(val=>{
        const b=el(`<button type="button" class="mmc-choice-btn" ${st.checked?'disabled':''}>${esc(val)}</button>`);
        b.onclick=()=>{ if(st.checked) return; st.pool=st.pool.filter(v=>v!==val); st.placed.push(val); render(); };
        poolRow.appendChild(b);
      });
      qbox.appendChild(poolRow);
      const btnRow=el('<div class="mmc-row" style="margin-top:8px;"></div>');
      const resetBtn=el(`<button class="mmc-btn ghost sm" ${st.checked?'disabled':''}>Reset</button>`);
      resetBtn.onclick=()=>{ if(st.checked) return; st.pool=shuffleArr(q.items||[]); st.placed=[]; render(); };
      const allPlaced = st.placed.length===(q.items||[]).length;
      const checkBtn=el(`<button class="mmc-btn ${st.checked?'ghost':'gold'} sm" ${st.checked||!allPlaced?'disabled':''}>${st.checked?'Checked':'Check'}</button>`);
      checkBtn.onclick=()=>{ if(!allPlaced) return; st.given=st.placed.join(','); doCheck(); };
      btnRow.appendChild(resetBtn); btnRow.appendChild(checkBtn);
      qbox.appendChild(btnRow);
    } else {
      const row=el(`
        <div class="answer-row">
          <input type="text" value="${esc(st.given)}" ${st.checked?'disabled':''} placeholder="Your answer">
          <button class="mmc-btn ${st.checked?'ghost':'gold'} sm" ${st.checked?'disabled':''}>${st.checked?'Checked':'Check'}</button>
        </div>
      `);
      const input=row.querySelector('input'); const btn=row.querySelector('button');
      input.oninput=(e)=>{ st.given=e.target.value; };
      input.addEventListener('keydown', e=>{ if(e.key==='Enter' && !st.checked) doCheck(); });
      btn.onclick=doCheck;
      qbox.appendChild(row);
    }

    if(st.checked){
      const correctText = q.inputType==='coins' ? `Try a different combination adding up to ${fmtCents(q.targetCents)}.` : `The answer was ${esc(q.answer)}.`;
      const fb=el(`<div class="mmc-feedback ${st.correct?'ok':'no'}">${st.correct? '✓ Correct!' : `✗ Not quite. ${correctText}`}${q.explanation? ' — '+esc(q.explanation):''}</div>`);
      qbox.appendChild(fb);
    }
    wrap.appendChild(qbox);
  });
  const allChecked=(week.questions||[]).every(q=>S.quiz[q.id].checked);
  const finishBtn=el(`<button class="mmc-btn gold" ${allChecked?'':'disabled'} style="margin-top:6px;">Finish week ✓</button>`);
  if(!allChecked) wrap.appendChild(el('<div class="meta" style="margin-bottom:8px;">Check every question to finish.</div>'));
  finishBtn.onclick=async ()=>{
    const score=week.questions.filter(q=>S.quiz[q.id].correct).length;
    const total=week.questions.length;
    const answers=week.questions.map(q=>({ qId:q.id, given:S.quiz[q.id].given, correct:S.quiz[q.id].correct }));
    try{
      await setDoc(doc(db,'results', `${S.user.uid}_${week.id}`), {
        uid:S.user.uid, studentName:S.profile? S.profile.displayName : S.user.email, studentEmail:S.user.email,
        teacherUid: S.profile ? S.profile.teacherUid : null,
        weekId:week.id, weekLabel:week.label, score, total, answers, submittedAt:serverTimestamp()
      });
    }catch(e){ S.toast='Could not save your result — check your connection and try again.'; render(); return; }
    deleteWeekProgress(week.id);
    S.activeWeekId=null; render();
  };
  wrap.appendChild(finishBtn);
  return wrap;
}

render();
</script>
</body>
</html>
