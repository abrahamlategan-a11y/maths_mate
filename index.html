<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maths Mate</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap');

  html,body{ margin:0; padding:0; background:#F5F2E8; }
  body{ padding:24px 12px; }

  #mmc {
    --ink: #17181C; --ink-soft: #5C5A56;
    --paper: #FFFFFF; --paper-line: #E9E4D6; --bg: #F5F2E8;
    --slime: #B7E600; --slime-deep: #8FB800;
    --orange: #FF7A1A; --orange-deep: #E85C0A;
    --magenta: #FF3D8A; --magenta-deep: #D91F6B;
    --purple: #8B5CF6; --purple-deep: #6D28D9;
    --yellow: #FFD23F; --yellow-deep: #E6B400;
    --correct: #2E9E4F; --incorrect: #E23B3B;
    /* legacy aliases so nothing else needs renaming */
    --green-deep: var(--ink); --green: var(--ink);
    --mustard: var(--orange); --mustard-deep: var(--orange-deep);
    --sky: var(--purple); --sky-deep: var(--purple-deep);
    --gold: var(--orange); --chalk: #FFFFFF;

    font-family: 'Nunito Sans', sans-serif; color: var(--ink); background: var(--paper);
    border-radius: 22px; overflow: hidden; max-width: 900px; margin: 0 auto;
    border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink);
  }
  #mmc * { box-sizing: border-box; }
  #mmc button { font-family: inherit; cursor: pointer; }
  #mmc input, #mmc select, #mmc textarea { font-family: inherit; }

  .mmc-head {
    background: linear-gradient(115deg, var(--orange) 0%, var(--slime) 100%);
    color: var(--ink); padding: 30px 28px 24px; position: relative; overflow: hidden;
    border-bottom: 4px solid var(--ink);
  }
  .mmc-head::before {
    content:""; position:absolute; top:-40px; right:-40px; width:140px; height:140px;
    background: var(--purple); opacity:.25; border-radius: 62% 38% 55% 45% / 45% 55% 45% 55%;
  }
  .mmc-head::after {
    content:""; position:absolute; bottom:-30px; left:-20px; width:100px; height:100px;
    background: var(--yellow); opacity:.3; border-radius: 40% 60% 55% 45% / 55% 45% 60% 40%;
  }
  .mmc-title {
    font-family:'Baloo 2',sans-serif; font-weight:800; font-size:clamp(24px,4.2vw,32px);
    margin:0 0 4px; position:relative; letter-spacing:.2px;
    text-shadow: 2px 2px 0 rgba(255,255,255,0.35);
  }
  .mmc-sub { font-size:14px; color:#17181C; opacity:.75; margin:0; position:relative; font-weight:600; }
  .mmc-userrow { display:flex; justify-content:space-between; align-items:center; margin-top:18px; font-size:13px; color:var(--ink); position:relative; font-weight:700; }
  .mmc-userrow button { background:var(--paper); border:2.5px solid var(--ink); color:var(--ink); border-radius:10px; padding:7px 14px; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:12.5px; box-shadow:2px 2px 0 var(--ink); transition:transform .12s ease; }
  .mmc-userrow button:hover { transform:translate(-1px,-1px); box-shadow:3px 3px 0 var(--ink); }

  .mmc-body { padding:26px 28px 32px; background:
    radial-gradient(var(--paper-line) 1px, transparent 1.5px) 0 0/16px 16px,
    var(--paper); }
  .mmc-empty { text-align:center; padding:40px 20px; color:var(--ink-soft); font-weight:600; }
  .mmc-empty-icon { font-size:36px; margin-bottom:8px; }
  .mmc-toast { position:sticky; top:8px; z-index:20; background:var(--incorrect); color:#fff; padding:10px 14px; border-radius:10px; border:2.5px solid var(--ink); font-size:13px; font-weight:700; margin-bottom:14px; box-shadow:3px 3px 0 var(--ink); }

  .mmc-btn { font-family:'Baloo 2',sans-serif; font-weight:700; font-size:14px; padding:10px 18px;
    border-radius:12px; border:2.5px solid var(--ink); background:var(--purple); color:#fff;
    box-shadow:3px 3px 0 var(--ink); transition:transform .1s ease, box-shadow .1s ease; }
  .mmc-btn:hover { transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--ink); }
  .mmc-btn:active { transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }
  .mmc-btn.gold { background:var(--orange); color:var(--ink); }
  .mmc-btn.gold:hover { background:var(--orange-deep); }
  .mmc-btn.ghost { background:var(--paper); border:2.5px solid var(--ink); color:var(--ink); box-shadow:3px 3px 0 var(--ink); }
  .mmc-btn.ghost:hover { background:var(--bg); }
  .mmc-btn.danger { background:#fff; color:var(--incorrect); border:2.5px solid var(--incorrect); box-shadow:3px 3px 0 var(--incorrect); }
  .mmc-btn.danger:hover { background:#FFF3F2; }
  .mmc-btn:disabled { opacity:.45; cursor:not-allowed; transform:none !important; }
  .mmc-btn.sm { padding:6px 12px; font-size:12.5px; border-radius:9px; box-shadow:2px 2px 0 var(--ink); }

  .mmc-card { background:var(--paper); border:2.5px solid var(--ink); border-radius:18px; padding:18px 20px; margin-bottom:16px;
    box-shadow:5px 5px 0 var(--ink); transition:transform .12s ease, box-shadow .12s ease; }
  .mmc-card h3 { font-family:'Baloo 2',sans-serif; font-weight:700; margin:0 0 4px; font-size:17px; }
  .mmc-card .meta { font-size:12.5px; color:var(--ink-soft); margin-bottom:10px; font-weight:600; }
  .mmc-row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .mmc-field { margin-bottom:12px; }
  .mmc-field label { display:block; font-size:12.5px; font-weight:800; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; margin-bottom:5px; }
  .mmc-field input[type=text], .mmc-field input[type=email], .mmc-field input[type=password], .mmc-field input[type=number], .mmc-field select {
    width:100%; padding:9px 11px; border-radius:10px; border:2px solid var(--paper-line); background:var(--paper); font-size:14.5px; color:var(--ink); font-weight:600;
  }
  .mmc-field input:focus, .mmc-field select:focus { outline:none; border-color:var(--purple); box-shadow:0 0 0 3px rgba(139,92,246,0.25); }

  .mmc-tabs { display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap; }
  .mmc-tab { background:var(--paper); border:2.5px solid var(--ink); padding:9px 14px; font-weight:700; font-family:'Baloo 2',sans-serif; font-size:13.5px; color:var(--ink-soft); border-radius:11px; box-shadow:2px 2px 0 var(--ink); transition:transform .1s ease; }
  .mmc-tab:hover { transform:translate(-1px,-1px); }
  .mmc-tab.active { color:var(--ink); background:var(--slime); }

  .mmc-qedit { border:2px dashed var(--ink-soft); border-radius:12px; padding:12px; margin-bottom:10px; background:var(--bg); }
  .mmc-qedit .idx { font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); margin-bottom:6px; font-weight:700; }
  .mmc-qedit textarea, .mmc-qedit input { width:100%; border:2px solid var(--paper-line); border-radius:9px; padding:7px 9px; font-size:13.5px; margin-bottom:6px; background:#fff; }
  .mmc-qedit .label2 { font-size:11px; color:var(--ink-soft); font-weight:800; text-transform:uppercase; letter-spacing:.03em; }

  .mmc-quiz-q { border:2.5px solid var(--ink); border-radius:16px; padding:16px; margin-bottom:12px; background:#fff; box-shadow:4px 4px 0 var(--ink); }
  .mmc-quiz-q .qnum { font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); margin-bottom:6px; font-weight:700; }
  .mmc-quiz-q .qtext { font-size:16px; font-weight:800; margin-bottom:10px; }
  .mmc-quiz-q .answer-row { display:flex; gap:8px; }
  .mmc-quiz-q input[type=text] { flex:1; padding:9px 11px; border-radius:10px; border:2px solid var(--paper-line); font-size:15px; font-weight:700; }
  .mmc-feedback { margin-top:10px; padding:10px 12px; border-radius:10px; font-size:13.5px; font-weight:700; border:2px solid; }
  .mmc-feedback.ok { background:#EEFBF1; color:var(--correct); border-color:var(--correct); }
  .mmc-feedback.no { background:#FEF1F0; color:var(--incorrect); border-color:var(--incorrect); }
  .mmc-qsvg { margin-bottom:10px; }
  .mmc-choices { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .mmc-choice-btn { padding:8px 14px; border-radius:20px; border:2.5px solid var(--ink); background:#fff; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:13.5px; color:var(--ink); box-shadow:2px 2px 0 var(--ink); }
  .mmc-choice-btn.selected { background:var(--purple); color:#fff; }
  .mmc-choice-btn:disabled { opacity:.7; }
  .mmc-coin-chip { padding:10px 16px; border-radius:14px; border:2.5px solid var(--ink); background:#fff; font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:14px; color:var(--ink); box-shadow:2px 2px 0 var(--ink); }
  .mmc-coin-chip.selected { background:var(--yellow); }
  .mmc-coin-chip:disabled { opacity:.7; }
  .mmc-coin-total { font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--ink-soft); margin-bottom:8px; font-weight:700; }

  .mmc-stamp { display:inline-flex; flex-direction:column; align-items:center; justify-content:center; min-width:92px; padding:10px 14px;
    border-radius:14px; border:3px solid var(--ink); transform:rotate(-3deg); font-family:'Baloo 2',sans-serif; box-shadow:3px 3px 0 var(--ink); }
  .mmc-stamp .score { font-family:'IBM Plex Mono',monospace; font-size:18px; font-weight:700; }
  .mmc-stamp .msg { font-size:11px; font-weight:800; margin-top:2px; text-align:center; }
  .mmc-stamp.gold { background:var(--yellow); color:var(--ink); }
  .mmc-stamp.green { background:var(--slime); color:var(--ink); }
  .mmc-stamp.blue { background:#fff; color:var(--purple-deep); border-color:var(--purple); }
  .mmc-stamp.amber { background:#fff; color:var(--orange-deep); border-color:var(--orange); }

  .mmc-ledger-wrap { overflow-x:auto; border:2.5px solid var(--ink); border-radius:14px; }
  table.mmc-ledger { border-collapse:collapse; width:100%; font-size:13px; background:#fff; }
  table.mmc-ledger th, table.mmc-ledger td { padding:9px 12px; text-align:center; border-bottom:1.5px solid var(--paper-line); white-space:nowrap; }
  table.mmc-ledger th { background:var(--bg); font-family:'Baloo 2',sans-serif; font-weight:700; font-size:12.5px; color:var(--ink-soft); }
  table.mmc-ledger td:first-child, table.mmc-ledger th:first-child { text-align:left; font-weight:700; position:sticky; left:0; background:#fff; }
  .mmc-cellscore { font-family:'IBM Plex Mono',monospace; font-weight:700; }
  .mmc-cellscore.good { color:var(--correct); }
  .mmc-cellscore.mid { color:var(--orange-deep); }
  .mmc-cellscore.low { color:var(--incorrect); }
  code.mmc-code { font-family:'IBM Plex Mono',monospace; background:var(--bg); border:1.5px solid var(--paper-line); padding:2px 6px; border-radius:6px; }
  .mmc-autherr { color:var(--incorrect); font-size:13px; font-weight:700; margin-bottom:10px; }
  @media (max-width:520px){ .mmc-head, .mmc-body { padding-left:16px; padding-right:16px; } }
</style>
</head>
<body>
<div id="mmc"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  onAuthStateChanged, signOut, updateProfile
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
import {
  getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc,
  getDoc, getDocs, onSnapshot, query, where, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

// ===== PASTE YOUR FIREBASE CONFIG HERE (see SETUP-INSTRUCTIONS.md) =====
const firebaseConfig = {
  apiKey: "AIzaSyCUZ2RBknvGQg8jqUOWSbQ5EYHBifPa3ts",
  authDomain: "maths-mate.firebaseapp.com",
  projectId: "maths-mate",
  storageBucket: "maths-mate.firebasestorage.app",
  messagingSenderId: "892177890885",
  appId: "1:892177890885:web:760a6d2b8d517d3fde3874"
};
// =========================================================================

const configured = firebaseConfig.apiKey !== "PASTE_ME";
let app, auth, db;
if (configured) {
  app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = getFirestore(app);
}

function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function pick(arr){ return arr[randInt(0,arr.length-1)]; }
function uid(p){ return p+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ [a,b]=[b,a%b]; } return a||1; }
function simplify(n,d){ const g=gcd(n,d)||1; return [n/g, d/g]; }
function fracStr(n,d){ const [sn,sd]=simplify(n,d); return sd===1 ? String(sn) : (sn+'/'+sd); }
function formatGrouped(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }

// ---------- SVG diagram helpers ----------
function svgWrap(inner, w, h){
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:260px;height:auto;background:#fff;border:1px solid var(--paper-line);border-radius:8px;display:block;">${inner}</svg>`;
}
function drawShadedGrid(n){
  let cells='';
  for(let i=0;i<100;i++){
    const r=Math.floor(i/10), c=i%10;
    const fill = i<n ? '#3F7A57' : '#ffffff';
    cells+=`<rect x="${c*22}" y="${r*22}" width="22" height="22" fill="${fill}" stroke="#E4DCC8"/>`;
  }
  return svgWrap(cells,220,220);
}
function drawRectShape(w,h){
  const cell=26, pad=1, gridW=w+pad*2, gridH=h+pad*2;
  let lines='';
  for(let x=0;x<=gridW;x++) lines+=`<line x1="${x*cell}" y1="0" x2="${x*cell}" y2="${gridH*cell}" stroke="#E4DCC8"/>`;
  for(let y=0;y<=gridH;y++) lines+=`<line x1="0" y1="${y*cell}" x2="${gridW*cell}" y2="${y*cell}" stroke="#E4DCC8"/>`;
  const rect=`<rect x="${pad*cell}" y="${pad*cell}" width="${w*cell}" height="${h*cell}" fill="#4C7A96" fill-opacity="0.45" stroke="#395E76" stroke-width="2"/>`;
  return svgWrap(lines+rect, gridW*cell, gridH*cell);
}
function drawClock(hour,minute){
  const cx=100, cy=100, r=90;
  const minuteAngle = minute*6, hourAngle=(hour%12)*30 + minute*0.5;
  function pt(deg,len){ const rad=(deg-90)*Math.PI/180; return [cx+len*Math.cos(rad), cy+len*Math.sin(rad)]; }
  const [hx,hy]=pt(hourAngle,48), [mx,my]=pt(minuteAngle,74);
  let ticks='';
  for(let i=0;i<12;i++){ const [x1,y1]=pt(i*30,80), [x2,y2]=pt(i*30,88);
    ticks+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#2B2620" stroke-width="2"/>`; }
  return svgWrap(`<circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff" stroke="#2B2620" stroke-width="3"/>${ticks}
    <line x1="${cx}" y1="${cy}" x2="${hx}" y2="${hy}" stroke="#2B2620" stroke-width="5" stroke-linecap="round"/>
    <line x1="${cx}" y1="${cy}" x2="${mx}" y2="${my}" stroke="#2B2620" stroke-width="3" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="4" fill="#2B2620"/>`, 200,200);
}
function drawAngle(deg){
  const cx=115, cy=150, r=110, arcR=32;
  function pt(a,len){ const rad=a*Math.PI/180; return [cx+len*Math.cos(rad), cy-len*Math.sin(rad)]; }
  const [x1,y1]=pt(0,r), [x2,y2]=pt(deg,r), [ax1,ay1]=pt(0,arcR), [ax2,ay2]=pt(deg,arcR);
  const largeArc = deg>180?1:0;
  return svgWrap(`<line x1="${cx}" y1="${cy}" x2="${x1}" y2="${y1}" stroke="#2B2620" stroke-width="3"/>
    <line x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}" stroke="#2B2620" stroke-width="3"/>
    <path d="M ${ax1} ${ay1} A ${arcR} ${arcR} 0 ${largeArc} 0 ${ax2} ${ay2}" fill="none" stroke="#C4801F" stroke-width="2.5"/>
    <circle cx="${cx}" cy="${cy}" r="3" fill="#2B2620"/>`, 240,190);
}
function drawLayers(layers,rows,cols){
  const cell=18, gap=10; let inner=''; let y=8;
  for(let L=0;L<layers;L++){
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++)
      inner+=`<rect x="${c*cell+8}" y="${y+r*cell}" width="${cell-2}" height="${cell-2}" fill="#E8A33D" stroke="#C4801F"/>`;
    y+=rows*cell+gap;
  }
  return svgWrap(inner, cols*cell+16, y);
}

// ---------- Question generators (20 fixed curriculum slots) ----------
const OPR = {
  easy:   { addMax:999,   mulA:[2,9],  mulB:[2,9],  divDivisor:[2,9],  divQuotient:[2,9] },
  medium: { addMax:9999,  mulA:[2,12], mulB:[2,12], divDivisor:[2,12], divQuotient:[2,12] },
  hard:   { addMax:99999, mulA:[10,20],mulB:[2,12], divDivisor:[2,15], divQuotient:[10,30] }
};
const PLACES=['ones','tens','hundreds','thousands','ten-thousands','hundred-thousands'];

function genPlaceValue(diff){
  const L = diff==='easy'?4: diff==='medium'?5:6;
  let digits=[randInt(1,9)]; for(let i=1;i<L;i++) digits.push(randInt(0,9));
  const num=parseInt(digits.join(''),10);
  const placeIdx=randInt(0,L-1); const placeName=PLACES[placeIdx]; const digit=digits[L-1-placeIdx];
  return { prompt:`Which digit is in the ${placeName} place in the number ${formatGrouped(num)}?`, answer:String(digit),
    explanation:`In ${formatGrouped(num)}, the ${placeName} digit is ${digit}.` };
}
function genSequence(diff){
  const step = diff==='easy'? randInt(1,5) : diff==='medium'? pick([5,10,20,25]) : pick([50,100,200,250]);
  const start = randInt(1,40)*step;
  const terms=[]; for(let i=0;i<5;i++) terms.push(start+i*step);
  const blankIdx=randInt(1,3); const answer=terms[blankIdx];
  const display=terms.map((t,i)=> i===blankIdx? '?' : String(t)).join(', ');
  return { prompt:`Fill in the missing number: ${display}`, answer:String(answer),
    explanation:`The pattern increases by ${step} each time, so the missing number is ${answer}.` };
}
function genRounding(diff){
  const range = diff==='easy'?[100,999]: diff==='medium'?[1000,9999]:[10000,99999];
  const num=randInt(range[0],range[1]);
  const toOptions = diff==='easy'? [10,100] : diff==='medium'? [100,1000] : [1000,10000];
  const roundTo=pick(toOptions); const rounded=Math.round(num/roundTo)*roundTo;
  return { prompt:`Round ${formatGrouped(num)} to the nearest ${formatGrouped(roundTo)}.`, answer:String(rounded),
    explanation:`${formatGrouped(num)} rounds to ${formatGrouped(rounded)} (nearest ${formatGrouped(roundTo)}).` };
}
function genOrdering(diff){
  const range = diff==='easy'?[10,999]: diff==='medium'?[1000,99999]:[10000,999999];
  let s=new Set(); while(s.size<4) s.add(randInt(range[0],range[1]));
  const arr=[...s]; const sorted=[...arr].sort((a,b)=>a-b);
  return { prompt:`Arrange these numbers in ascending order: ${arr.map(formatGrouped).join(', ')}`, answer:sorted.join(','),
    explanation:`Ascending order: ${sorted.map(formatGrouped).join(', ')}`, checkType:'numlist' };
}
function genFactors(diff){
  const range= diff==='easy'?[12,30]: diff==='medium'?[20,60]:[40,100];
  const num=randInt(range[0],range[1]);
  const factors=[]; for(let i=1;i<=num;i++) if(num%i===0) factors.push(i);
  return { prompt:`List all the factors of ${num} (separate with commas).`, answer:factors.join(','),
    explanation:`The factors of ${num} are: ${factors.join(', ')}.`, checkType:'numset' };
}
function genAddition(diff){ const r=OPR[diff]; const a=randInt(100,r.addMax), b=randInt(100,r.addMax);
  return { prompt:`${formatGrouped(a)} + ${formatGrouped(b)} = ?`, answer:String(a+b), explanation:`${formatGrouped(a)} + ${formatGrouped(b)} = ${formatGrouped(a+b)}` }; }
function genSubtraction(diff){ const r=OPR[diff]; const a=randInt(100,r.addMax), b=randInt(0,a);
  return { prompt:`${formatGrouped(a)} − ${formatGrouped(b)} = ?`, answer:String(a-b), explanation:`${formatGrouped(a)} − ${formatGrouped(b)} = ${formatGrouped(a-b)}` }; }
function genMultiplication(diff){ const r=OPR[diff]; const a=randInt(r.mulA[0],r.mulA[1]), b=randInt(r.mulB[0],r.mulB[1]);
  return { prompt:`${a} × ${b} = ?`, answer:String(a*b), explanation:`${a} × ${b} = ${a*b}` }; }
function genDivision(diff){ const r=OPR[diff]; const divisor=randInt(r.divDivisor[0],r.divDivisor[1]), quotient=randInt(r.divQuotient[0],r.divQuotient[1]); const a=divisor*quotient;
  return { prompt:`${formatGrouped(a)} ÷ ${divisor} = ?`, answer:String(quotient), explanation:`${formatGrouped(a)} ÷ ${divisor} = ${quotient}` }; }
function genFracHalf(diff){
  const denoms = diff==='easy'?[3,4,5,6,8,10]: diff==='medium'?[3,4,5,6,7,8,9,10,12]:[3,5,6,7,8,9,10,11,12,13];
  const d=pick(denoms); const n=randInt(1,d-1); const left=n*2, right=d;
  const sign= left<right?'less than': left>right?'more than':'equal to';
  return { prompt:`Is ${n}/${d} less than, more than, or equal to 1/2?`, answer:sign, inputType:'choice', choices:['less than','more than','equal to'],
    explanation:`${n}/${d} compared to 1/2: ${n}×2=${left} vs ${d}, so it is ${sign} 1/2.` };
}
function genShadedGrid(diff){
  const shaded = diff==='easy'? randInt(1,9)*10 : diff==='medium'? randInt(5,95) : randInt(1,99);
  return { prompt:`What fraction is shaded? Answer in hundredths (e.g. 45/100).`, answer:`${shaded}/100`,
    explanation:`${shaded} out of 100 squares are shaded, so the fraction is ${shaded}/100.`, svg:drawShadedGrid(shaded) };
}
function genDecimalPlace(diff){
  const decDigits= diff==='easy'?1:2;
  const whole=randInt(1, diff==='hard'?999:99);
  let dec=''; for(let i=0;i<decDigits;i++) dec+=randInt(0,9);
  const numStr=`${whole}.${dec}`;
  const decPlaces=['tenths','hundredths']; const placeIdx=randInt(0,decDigits-1);
  const placeName=decPlaces[placeIdx]; const digit=dec[placeIdx];
  return { prompt:`Which digit is in the ${placeName} place in ${numStr}?`, answer:digit,
    explanation:`In ${numStr}, the ${placeName} digit is ${digit}.` };
}
function genOrderDecimals(diff){
  const decDigits= diff==='easy'?1:2; let s=new Set();
  while(s.size<4){ const whole=randInt(1,9); let dec=''; for(let i=0;i<decDigits;i++) dec+=randInt(0,9); s.add(parseFloat(`${whole}.${dec}`)); }
  const arr=[...s]; const sorted=[...arr].sort((a,b)=>a-b);
  return { prompt:`Arrange these decimals in ascending order: ${arr.join(', ')}`, answer:sorted.join(','),
    explanation:`Ascending order: ${sorted.join(', ')}`, checkType:'numlist' };
}
const DENOMS=[{v:5,l:'5c'},{v:10,l:'10c'},{v:20,l:'20c'},{v:50,l:'50c'},{v:100,l:'$1'},{v:200,l:'$2'}];
function fmtCents(c){ return c>=100 ? '$'+(c/100).toFixed(2) : c+'c'; }
function genCoins(diff){
  const range = diff==='easy'?[100,300]: diff==='medium'?[200,600]:[500,1500];
  let target=Math.round(randInt(range[0],range[1])/5)*5;
  let remaining=target; const solution=[];
  for(let i=DENOMS.length-1;i>=0;i--){ while(remaining>=DENOMS[i].v){ solution.push(DENOMS[i]); remaining-=DENOMS[i].v; } }
  const decoyCount = solution.length>=8 ? randInt(1,2) : randInt(2,4);
  const decoys=[]; for(let i=0;i<decoyCount;i++) decoys.push(pick(DENOMS));
  const coins=[...solution,...decoys].map((c,i)=>({v:c.v,l:c.l,id:'c'+i}));
  for(let i=coins.length-1;i>0;i--){ const j=randInt(0,i); [coins[i],coins[j]]=[coins[j],coins[i]]; }
  return { prompt:`Select coins that add up to exactly ${fmtCents(target)}.`, inputType:'coins', targetCents:target, coins,
    explanation:`Any combination of the coins shown that adds up to ${fmtCents(target)} is correct.` };
}
function genArea(diff){
  const range= diff==='easy'?[2,6]: diff==='medium'?[3,9]:[4,12];
  const w=randInt(range[0],range[1]), h=randInt(range[0],range[1]);
  return { prompt:`Find the area of this shape (each square = 1 cm²).`, answer:String(w*h),

}
function genClock(diff){
  const hour=randInt(1,12);
  const minuteOptions = diff==='easy'? [0,15,30,45] : [0,5,10,15,20,25,30,35,40,45,50,55];
  const minute=pick(minuteOptions); const mm=String(minute).padStart(2,'0');

    explanation:`The clock shows ${hour}:${mm}.`, svg:drawClock(hour,minute) };

const UNIT_SCENARIOS=[

function genUnitChoice(diff){ const s=pick(UNIT_SCENARIOS);

const CONVERSIONS=[{from:'kg',to:'g',factor:1000},{from:'km',to:'m',factor:1000},{from:'L',to:'mL',factor:1000},{from:'m',to:'cm',factor:100},{from:'cm',to:'mm',factor:10}];
function genConversion(diff){ const c=pick(CONVERSIONS);
  const range= diff==='easy'?[1,20]: diff==='medium'?[1,100]:[1,999];
  const val=randInt(range[0],range[1]); const result=val*c.factor;
  return { prompt:`Complete the conversion: ${val} ${c.from} = ___ ${c.to}`, answer:String(result),

function genAngle(diff){
  const bucket=pick(['acute','right','obtuse','straight','reflex']);

  if(bucket==='acute') deg=randInt(15,80); else if(bucket==='right') deg=90;

  return { prompt:`What type of angle is shown?`, answer:bucket, inputType:'choice', choices:['acute','right','obtuse','straight','reflex'],
    explanation:`This angle measures about ${deg}°, which makes it a ${bucket} angle.`, svg:drawAngle(deg) };
}
function genVolume(diff){

function buildQuestion(slotIdx, diff){
  const slot=SLOTS[slotIdx]; const q=slot.gen(diff);
  return { id:uid('q'), slot:slotIdx+1, title:slot.title, prompt:q.prompt,
    answer:q.answer!=null?String(q.answer):null, explanation:q.explanation||'',
    inputType:q.inputType||'text', choices:q.choices||null, svg:q.svg||null,
    checkType:q.checkType||null, targetCents:q.targetCents!=null?q.targetCents:null, coins:q.coins||null };
}
function generateWeekQuestions(diff){ return SLOTS.map((s,i)=>buildQuestion(i,diff)); }

function normalize(s){ return String(s==null?'':s).trim().toLowerCase().replace(/\s+/g,''); }
function isNumeric(s){ return s!=='' && !isNaN(Number(s)); }
function parseFrac(s){ const m=String(s).match(/^(-?\d+)\/(\d+)$/); if(!m) return null; return [parseInt(m[1],10), parseInt(m[2],10)]; }
function parseNumList(s){ return String(s).split(/[^\-\d.]+/).filter(Boolean).map(Number).filter(n=>!isNaN(n)); }
function checkAnswer(given, answer){
  const g=normalize(given), a=normalize(answer);
  if(g==='') return false;
  const gf=parseFrac(g), af=parseFrac(a);
  if(gf && af) return gf[0]*af[1] === af[0]*gf[1];
  if(gf && isNumeric(a)) return gf[0] === Number(a)*gf[1];
  if(af && isNumeric(g)) return af[0] === Number(g)*af[1];
  if(isNumeric(g) && isNumeric(a)) return Number(g)===Number(a);
  return g===a;
}
function normTime(s){ const m=String(s).trim().match(/^(\d{1,2}):(\d{1,2})$/); if(!m) return null;
  return `${parseInt(m[1],10)}:${String(parseInt(m[2],10)).padStart(2,'0')}`; }
function gradeQuestion(q, given){
  if(q.inputType==='coins'){
    const sel = Array.isArray(given) ? given : [];
    const sum = (q.coins||[]).filter(c=>sel.includes(c.id)).reduce((s,c)=>s+c.v,0);
    return sel.length>0 && sum===q.targetCents;
  }
  if(q.checkType==='time'){ const g=normTime(given), a=normTime(q.answer); return g!==null && g===a; }
  if(q.checkType==='numlist'){ const gi=parseNumList(given), an=parseNumList(q.answer);
    return gi.length===an.length && gi.every((v,i)=>v===an[i]); }
  if(q.checkType==='numset'){ const gi=new Set(parseNumList(given)), an=new Set(parseNumList(q.answer));
    if(gi.size!==an.size) return false; for(const v of an) if(!gi.has(v)) return false; return true; }
  if(q.inputType==='choice'){ return normalize(given)===normalize(q.answer); }
  return checkAnswer(given, q.answer);
}

const TT_RANGES = { easy:[1,10], medium:[1,12], hard:[4,15] };
function genTTQuestion(level, idx){
  const [lo,hi] = TT_RANGES[level];
  const isDivision = level!=='easy' && idx%2===1;
  if(!isDivision){
    const a=randInt(lo,hi), b=randInt(lo,hi);
    return { prompt:`${a} × ${b}`, answer:a*b };
  }
  const divisor=randInt(lo,hi), quotient=randInt(lo,hi); const dividend=divisor*quotient;
  return { prompt:`${dividend} ÷ ${divisor}`, answer:quotient };
}
function formatMMSS(s){ const m=Math.floor(Math.max(0,s)/60), sec=Math.max(0,s)%60; return `${m}:${String(sec).padStart(2,'0')}`; }

function genUsername(first,last,taken){
  const firstClean=String(first||'').replace(/[^a-zA-Z]/g,'');
  const lastInitial=String(last||'').replace(/[^a-zA-Z]/g,'').charAt(0).toUpperCase();
  const base=(firstClean.charAt(0).toUpperCase()+firstClean.slice(1)) + lastInitial;
  let candidate=base, n=2;
  while(taken.has(candidate.toLowerCase())){ candidate=base+n; n++; }
  taken.add(candidate.toLowerCase());
  return candidate;
}

async function handleAuthChange(user){
  clearSubs();

  if(user){
    try{
      const teachersSnap = await getDoc(doc(db,'config','teachers'));
      S.teacherEmails = teachersSnap.exists() ? (teachersSnap.data().emails||[]) : [];
      S.isTeacher = S.teacherEmails.map(e=>String(e).toLowerCase()).includes((user.email||'').toLowerCase());
      const profSnap = await getDoc(doc(db,'profiles',user.uid));
      S.profile = profSnap.exists() ? profSnap.data() : { displayName:user.displayName||user.email, email:user.email };

function renderQuestionEditor(week){

  (week.questions||[]).forEach((q,i)=>{

    const row=el(`

        ${q.inputType==='choice' ? `

        ` : q.inputType==='coins' ? `

        ` : `

          <input type="text" data-f="answer" value="${esc(q.answer)}">
        `}

        <input type="text" data-f="explanation" value="${esc(q.explanation||'')}">
        <div class="mmc-row" style="margin-top:6px;">
          <button class="mmc-btn ghost sm" data-act="regen">↻ Regenerate</button>
          <button class="mmc-btn danger sm" data-act="rm">Remove question</button>
        </div>
      </div>
    `);
    row.querySelector('[data-f="prompt"]').onchange=(e)=>{ q.prompt=e.target.value; saveQuestions(); };
    const answerEl=row.querySelector('[data-f="answer"]');
    if(answerEl) answerEl.onchange=(e)=>{ q.answer=e.target.value; saveQuestions(); };
    row.querySelector('[data-f="explanation"]').onchange=(e)=>{ q.explanation=e.target.value; saveQuestions(); };
    row.querySelector('[data-act="rm"]').onclick=()=>{ week.questions=week.questions.filter(x=>x.id!==q.id); saveQuestions(); render(); };
    row.querySelector('[data-act="regen"]').onclick=()=>{
      const fresh = q.slot ? buildQuestion(q.slot-1, week.difficulty) : q;
      Object.assign(q, fresh, {id:q.id});
      saveQuestions(); render();
    };
    box.appendChild(row);
  });
  return box;
}

function renderLedger(){
  const wrap=el('<div></div>');

  }
  const tableWrap=el('<div class="mmc-ledger-wrap"></div>');

    pubWeeks.forEach(w=>{
      const rec = S.results.find(r=>r.uid===uid && r.weekId===w.id);
      if(rec){ const pct = rec.total? rec.score/rec.total : 0; const cls = pct>=0.7?'good':(pct>=0.5?'mid':'low');
        sum+=pct; cnt++; tr.appendChild(el(`<td class="mmc-cellscore ${cls}">${rec.score}/${rec.total}</td>`)); }

    });

function exportCSV(pubWeeks, studentUids){
  const header=['Student name','Email', ...pubWeeks.map(w=>w.label), 'Average %'];
  const rows=[header];
  studentUids.forEach(uid=>{
    const row=[S.profiles[uid].displayName||'', S.profiles[uid].email||''];
    let sum=0, cnt=0;
    pubWeeks.forEach(w=>{ const rec=S.results.find(r=>r.uid===uid && r.weekId===w.id);
      if(rec){ row.push(`${rec.score}/${rec.total}`); sum+= rec.total? rec.score/rec.total:0; cnt++; } else row.push(''); });
    row.push(cnt? Math.round((sum/cnt)*100) : '');
    rows.push(row);
  });
  const csv=rows.map(r=>r.map(c=>{ const s=String(c); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='weekly-maths-club-results.csv';
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}

Tom Nguyen
Aisha Patel">${esc(S.bulkNamesText)}</textarea></div>

    </div>
  `);
  form.querySelector('#mmc-bulk-names').oninput=(e)=>{ S.bulkNamesText=e.target.value; };
  form.querySelector('#mmc-bulk-go').onclick=async ()=>{
    const namesText=form.querySelector('#mmc-bulk-names').value;
    const teacherPass=form.querySelector('#mmc-bulk-pass').value;
    const lines=namesText.split('\n').map(l=>l.trim()).filter(Boolean);
    if(lines.length===0){ S.authError='Paste at least one name.'; render(); return; }
    if(!teacherPass){ S.authError='Enter your password to continue.'; render(); return; }
    S.authError=null;
    const teacherEmail=S.user.email;
    // Local uniqueness guard only prevents obvious clashes within this batch / your
    // own class — usernames must be unique across every teacher's class too, and we
    // can't read other teachers' students (by design), so real collisions are caught
    // by Firebase itself and retried below with an incremented suffix.
    const taken=new Set(Object.values(S.profiles).map(p=>String(p.username||'').toLowerCase()).filter(Boolean));
    S.bulkCreating=true; S.bulkResults=[]; S.bulkProgress=`0/${lines.length}`; render();

        const username=genUsername(first,last,taken); const password=genPassword();

          const cred=await createUserWithEmailAndPassword(auth,email,password);

          await signInWithEmailAndPassword(auth,teacherEmail,teacherPass);
          S.bulkResults.push({name:fullName, username, password, status:'ok'});
          done=true;
        }catch(e){
          lastErr=e;
          if(e.code==='auth/email-already-in-use'){ continue; } // taken set already advanced; retry with next suffix
          S.bulkResults.push({name:fullName, username, password:null, status:'error', error:friendlyAuthError(e.code)});
          try{ await signInWithEmailAndPassword(auth,teacherEmail,teacherPass); }catch(e2){}
          done=true;
        }
      }
      if(!done && lastErr){
        S.bulkResults.push({name:fullName, username:'—', password:null, status:'error', error:'Could not find a free username — try again.'});
      }
      S.bulkProgress=`${i+1}/${lines.length}`; render();
    }
    S.bulkCreating=false;
    await handleAuthChange(auth.currentUser);
    render();
  };
  wrap.appendChild(form);

  const existing = Object.entries(S.profiles).filter(([uid,p])=>p.username);
  if(existing.length){
    const list=el('<div class="mmc-card"><h3>Existing student logins</h3><div class="meta">Passwords can\'t be shown again — if one\'s lost, re-run that name through the form above to issue a fresh login.</div></div>');

    });
    list.appendChild(ul);
    wrap.appendChild(list);
  }
  return wrap;
}

    const tbody=table.querySelector('tbody');
    S.ttAttempts.slice().sort((a,b)=>(b.submittedAt?.seconds||0)-(a.submittedAt?.seconds||0)).slice(0,25).forEach(a=>{
      const date=a.submittedAt?.seconds? new Date(a.submittedAt.seconds*1000).toLocaleDateString() : '—';
      tbody.appendChild(el(`<tr><td>${esc(date)}</td><td>${esc(a.level)}</td><td>${a.score}/${a.attempted}</td><td>${a.accuracy}%</td></tr>`));
    });
    tableWrap.appendChild(table);
    wrap.appendChild(tableWrap);
  }
  return wrap;
}

function startTTChallenge(level){
  S.tt = { active:true, finished:false, level, timeLeft:300, score:0, attempted:0, qIndex:0, currentQ:genTTQuestion(level,0), lastResult:null };
  render();
  startTTTimer();
}
function startTTTimer(){
  if(S.tt.timerHandle) clearInterval(S.tt.timerHandle);
  S.tt.timerHandle=setInterval(()=>{
    if(!S.tt || !S.tt.active) return;
    S.tt.timeLeft--;
    const timerEl=document.getElementById('mmc-tt-timer');
    if(timerEl) timerEl.textContent=formatMMSS(S.tt.timeLeft);
    if(S.tt.timeLeft<=0){ clearInterval(S.tt.timerHandle); finishTTChallenge(); }
  },1000);
}
function submitTTAnswer(given){
  if(!S.tt || !S.tt.active) return;
  const correct = normalize(given)===normalize(String(S.tt.currentQ.answer));
  S.tt.attempted++;
  if(correct) S.tt.score++;
  S.tt.qIndex++;
  S.tt.currentQ=genTTQuestion(S.tt.level, S.tt.qIndex);
  render();
}
async function finishTTChallenge(){
  const {level, score, attempted} = S.tt;
  const accuracy = attempted? Math.round((score/attempted)*100) : 0;
  S.tt.active=false; S.tt.finished=true; S.tt.lastResult={level,score,attempted,accuracy};
  try{
    await addDoc(collection(db,'ttAttempts'), { uid:S.user.uid, teacherUid:S.profile?S.profile.teacherUid:null, level, score, attempted, accuracy, submittedAt:serverTimestamp() });
  }catch(e){ S.toast='Could not save this attempt — check your connection.'; }
  render();
}
function renderTTChallenge(){
  const wrap=el('<div></div>');
  const t=S.tt;
  const head=el(`
    <div class="mmc-card">
      <div class="mmc-row" style="justify-content:space-between;">
        <div><h3 style="text-transform:capitalize;">${esc(t.level)} challenge</h3><div class="meta">Score: ${t.score} / ${t.attempted}</div></div>
        <div id="mmc-tt-timer" style="font-family:'IBM Plex Mono',monospace;font-size:28px;font-weight:700;color:var(--sky-deep);">${formatMMSS(t.timeLeft)}</div>
      </div>
    </div>
  `);
  wrap.appendChild(head);
  const qbox=el(`
    <div class="mmc-card" style="text-align:center;">
      <div style="font-family:'Fredoka',sans-serif;font-size:36px;font-weight:700;margin-bottom:16px;">${esc(t.currentQ.prompt)} = ?</div>
      <div class="mmc-row" style="justify-content:center;">
        <input type="text" id="mmc-tt-input" autocomplete="off" style="width:120px;text-align:center;font-size:22px;padding:10px;border-radius:8px;border:1.5px solid var(--paper-line);">
        <button class="mmc-btn gold" id="mmc-tt-submit">Go</button>
      </div>
    </div>
  `);
  const input=qbox.querySelector('#mmc-tt-input');
  const go=()=>{ const v=input.value; input.value=''; submitTTAnswer(v); };
  qbox.querySelector('#mmc-tt-submit').onclick=go;
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
  wrap.appendChild(qbox);
  return wrap;
}

function renderQuizTaking(week){
  const wrap=el('<div></div>');
  const back=el('<a href="#" style="color:var(--sky-deep);font-size:13px;">← back to passport</a>');
  back.onclick=(e)=>{ e.preventDefault(); S.activeWeekId=null; render(); };
  wrap.appendChild(back);
  wrap.appendChild(el(`<h3 style="font-family:Fredoka,sans-serif;margin:10px 0 14px;">${esc(week.label)}</h3>`));
  (week.questions||[]).forEach((q,i)=>{
    const st=S.quiz[q.id];
    const qbox=el(`
      <div class="mmc-quiz-q">
        <div class="qnum">Question ${i+1} of ${week.questions.length} — ${esc(q.title||'')}</div>
        ${q.svg ? `<div class="mmc-qsvg">${q.svg}</div>` : ''}
        <div class="qtext">${esc(q.prompt)}</div>
      </div>
    `);
    function doCheck(){ if(st.checked) return; st.checked=true; st.correct=gradeQuestion(q, st.given); render(); }

    if(q.inputType==='choice'){
      const choiceRow=el('<div class="mmc-choices"></div>');
      (q.choices||[]).forEach(c=>{
        const b=el(`<button type="button" class="mmc-choice-btn ${st.given===c?'selected':''}" ${st.checked?'disabled':''}>${esc(c)}</button>`);
        b.onclick=()=>{ if(st.checked) return; st.given=c; render(); };
        choiceRow.appendChild(b);
      });
      qbox.appendChild(choiceRow);
      const checkBtn=el(`<button class="mmc-btn ${st.checked?'ghost':'gold'} sm" ${st.checked||!st.given?'disabled':''}>${st.checked?'Checked':'Check'}</button>`);
      checkBtn.onclick=doCheck;
      qbox.appendChild(checkBtn);
    } else if(q.inputType==='coins'){
      const total=(q.coins||[]).filter(c=>st.given.includes(c.id)).reduce((s,c)=>s+c.v,0);
      qbox.appendChild(el(`<div class="mmc-coin-total">Selected: ${fmtCents(total)}</div>`));
      const coinRow=el('<div class="mmc-choices"></div>');
      (q.coins||[]).forEach(c=>{
        const sel=st.given.includes(c.id);
        const b=el(`<button type="button" class="mmc-coin-chip ${sel?'selected':''}" ${st.checked?'disabled':''}>${esc(c.l)}</button>`);
        b.onclick=()=>{ if(st.checked) return; st.given = sel ? st.given.filter(id=>id!==c.id) : [...st.given, c.id]; render(); };
        coinRow.appendChild(b);
      });
      qbox.appendChild(coinRow);
      const checkBtn=el(`<button class="mmc-btn ${st.checked?'ghost':'gold'} sm" ${st.checked||st.given.length===0?'disabled':''}>${st.checked?'Checked':'Check'}</button>`);
      checkBtn.onclick=doCheck;
      qbox.appendChild(checkBtn);
    } else {
      const row=el(`
        <div class="answer-row">
          <input type="text" value="${esc(st.given)}" ${st.checked?'disabled':''} placeholder="Your answer">
          <button class="mmc-btn ${st.checked?'ghost':'gold'} sm" ${st.checked?'disabled':''}>${st.checked?'Checked':'Check'}</button>
        </div>
      `);
      const input=row.querySelector('input'); const btn=row.querySelector('button');
      input.oninput=(e)=>{ st.given=e.target.value; };
      input.addEventListener('keydown', e=>{ if(e.key==='Enter' && !st.checked) doCheck(); });
      btn.onclick=doCheck;
      qbox.appendChild(row);
    }

    if(st.checked){
      const correctText = q.inputType==='coins' ? `Try a different combination adding up to ${fmtCents(q.targetCents)}.` : `The answer was ${esc(q.answer)}.`;
      const fb=el(`<div class="mmc-feedback ${st.correct?'ok':'no'}">${st.correct? '✓ Correct!' : `✗ Not quite. ${correctText}`}${q.explanation? ' — '+esc(q.explanation):''}</div>`);
      qbox.appendChild(fb);
    }
    wrap.appendChild(qbox);
  });
  const allChecked=(week.questions||[]).every(q=>S.quiz[q.id].checked);
  const finishBtn=el(`<button class="mmc-btn gold" ${allChecked?'':'disabled'} style="margin-top:6px;">Finish week ✓</button>`);
  if(!allChecked) wrap.appendChild(el('<div class="meta" style="margin-bottom:8px;">Check every question to finish.</div>'));
  finishBtn.onclick=async ()=>{
    const score=week.questions.filter(q=>S.quiz[q.id].correct).length;
    const total=week.questions.length;
    const answers=week.questions.map(q=>({ qId:q.id, given:S.quiz[q.id].given, correct:S.quiz[q.id].correct }));
    try{
      await setDoc(doc(db,'results', `${S.user.uid}_${week.id}`), {
        uid:S.user.uid, studentName:S.profile? S.profile.displayName : S.user.email, studentEmail:S.user.email,
        teacherUid: S.profile ? S.profile.teacherUid : null,
        weekId:week.id, weekLabel:week.label, score, total, answers, submittedAt:serverTimestamp()
      });
    }catch(e){ S.toast='Could not save your result — check your connection and try again.'; render(); return; }
    S.activeWeekId=null; render();
  };
  wrap.appendChild(finishBtn);
  return wrap;
}

render();
</script>
