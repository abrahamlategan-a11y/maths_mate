<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mathmentum</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap');

  html,body{ margin:0; padding:0; background:#F5F2E8; }
  body{ padding:24px 12px; }

  #mmc {
    --ink: #17181C; --ink-soft: #5C5A56;
    --paper: #FFFFFF; --paper-line: #E9E4D6; --bg: #F5F2E8;
    --slime: #B7E600; --slime-deep: #8FB800;
    --orange: #FF7A1A; --orange-deep: #E85C0A;
    --magenta: #FF3D8A; --magenta-deep: #D91F6B;
    --purple: #8B5CF6; --purple-deep: #6D28D9;
    --yellow: #FFD23F; --yellow-deep: #E6B400;
    --correct: #2E9E4F; --incorrect: #E23B3B;
    /* legacy aliases so nothing else needs renaming */
    --green-deep: var(--ink); --green: var(--ink);
    --mustard: var(--orange); --mustard-deep: var(--orange-deep);
    --sky: var(--purple); --sky-deep: var(--purple-deep);
    --gold: var(--orange); --chalk: #FFFFFF;

    font-family: 'Nunito Sans', sans-serif; color: var(--ink); background: var(--paper);
    border-radius: 22px; overflow: hidden; max-width: 900px; margin: 0 auto;
    border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink);
  }
  #mmc * { box-sizing: border-box; }
  #mmc button { font-family: inherit; cursor: pointer; }
  #mmc input, #mmc select, #mmc textarea { font-family: inherit; }

  .mmc-head {
    background: linear-gradient(120deg, var(--purple-deep) 0%, var(--purple) 40%, var(--slime) 100%);
    color: var(--ink); padding: 34px 28px 26px; position: relative; overflow: hidden;
    border-bottom: 4px solid var(--ink);
  }
  .mmc-head::before {
    content:""; position:absolute; top:-40px; right:-40px; width:140px; height:140px;
    background: var(--purple); opacity:.25; border-radius: 62% 38% 55% 45% / 45% 55% 45% 55%;
  }
  .mmc-head::after {
    content:""; position:absolute; bottom:-30px; left:-20px; width:100px; height:100px;
    background: var(--yellow); opacity:.3; border-radius: 40% 60% 55% 45% / 55% 45% 60% 40%;
  }
  .mmc-head-deco { position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
  .mmc-head-deco span { position:absolute; color:#fff; opacity:.16; font-weight:800; font-family:'Baloo 2',sans-serif; }
  .mmc-signout-pill {
    position:absolute; top:20px; right:20px; z-index:2; background:#fff; border:none; border-radius:999px;
    padding:9px 18px; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:13px; color:var(--ink);
    box-shadow:0 2px 8px rgba(0,0,0,0.18); display:inline-flex; align-items:center; gap:6px; cursor:pointer;
    transition:transform .12s ease;
  }
  .mmc-signout-pill:hover { transform:translateY(-1px); }
  .mmc-title {
    font-family:'Baloo 2',sans-serif; font-weight:800; font-size:clamp(38px,8vw,68px);
    margin:6px 0 2px; position:relative; z-index:1; letter-spacing:.2px; line-height:1;
    text-align:center;
  }
  .mmc-title-plain { color:#fff; text-shadow:2px 3px 0 rgba(0,0,0,0.15); }
  .mmc-title-rainbow {
    background: linear-gradient(90deg, var(--slime) 0%, var(--yellow) 35%, #4FB6E8 65%, var(--purple) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent; text-shadow:none;
  }
  /* ---- Student-side branding: small Mathmentum wordmark, big ARENA ---- */
  /* ---- Logged-out landing: says what this IS before asking for a password ---- */
  #mmc:not(:has(.mmc-head)) .mmc-body { padding-top:22px; }
  .mmc-pitch {
    background:var(--paper); border:2.5px solid var(--ink); border-radius:16px;
    box-shadow:5px 5px 0 var(--ink); padding:22px 24px; margin-bottom:16px;
  }
  .mmc-pitch-mark {
    font-family:'Baloo 2',sans-serif; font-weight:800; font-size:clamp(26px,6vw,34px);
    letter-spacing:-.035em; line-height:1; color:var(--ink);
  }
  .mmc-pitch-mark .o { color:var(--orange); }
  .mmc-pitch-line {
    font-family:'Nunito Sans',sans-serif; font-size:16px; color:var(--ink-soft);
    margin:11px 0 0; max-width:56ch; line-height:1.55; font-weight:600;
  }
  .mmc-pitch-grid {
    display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
    gap:13px; margin-top:18px;
  }
  .mmc-pitch-grid .pp { border-left:3px solid var(--paper-line); padding-left:12px; }
  .mmc-pitch-grid .pp1 { border-left-color:var(--slime); }
  .mmc-pitch-grid .pp2 { border-left-color:var(--orange); }
  .mmc-pitch-grid .pp3 { border-left-color:var(--purple); }
  .mmc-pitch-grid .pp4 { border-left-color:var(--yellow); }
  .mmc-pitch-grid b {
    display:block; font-family:'Baloo 2',sans-serif; font-weight:800; font-size:15px; color:var(--ink);
  }
  .mmc-pitch-grid span {
    display:block; font-family:'Nunito Sans',sans-serif; font-size:13.5px;
    color:var(--ink-soft); line-height:1.5; font-weight:600;
  }
  .mmc-qedit.hidden-q { opacity:.55; border-style:dashed; }
  .hidetag {
    display:inline-block; margin-left:8px; font-size:10px; font-weight:800; letter-spacing:.08em;
    background:var(--ink); color:#fff; border-radius:20px; padding:1px 8px; vertical-align:2px;
  }
  .mmc-previewbar {
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    background:var(--yellow); border:2.5px solid var(--ink); border-radius:12px;
    box-shadow:3px 3px 0 var(--ink); padding:10px 14px; margin-bottom:14px;
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:14px; color:var(--ink);
  }
  /* On-screen keypad. Shown only on touch devices, where the OS keyboard covers the
     screen and (on iPad) opens as a full QWERTY even for a numbers-only answer. */
  /* Instant right/wrong feedback for the two SPEED games. A ring only — no answer, no
     pause — so the race is untouched. It sits on the answer box because that is where a
     child's eyes already are when they tap Go. */
  @keyframes mmc-ringpop { 0%{ box-shadow:0 0 0 0 var(--mmc-ring); } 100%{ box-shadow:0 0 0 7px transparent; } }
  .mmc-flash-ok, .mmc-flash-no { animation:mmc-ringpop .55s ease-out; border-radius:10px; }
  .mmc-flash-ok { --mmc-ring:var(--correct); border-color:var(--correct) !important; }
  .mmc-flash-no { --mmc-ring:var(--incorrect); border-color:var(--incorrect) !important; }
  @media (prefers-reduced-motion:reduce){
    .mmc-flash-ok, .mmc-flash-no { animation:none; }
  }
  .mmc-keypad {
    display:grid; grid-template-columns:repeat(3,1fr); gap:10px;
    max-width:300px; margin:16px auto 0;
  }
  .mmc-keypad button {
    font-family:'Fredoka',sans-serif; font-size:26px; font-weight:700;
    padding:14px 0; border-radius:12px; cursor:pointer;
    background:var(--paper); color:var(--ink);
    border:2px solid var(--ink); box-shadow:0 3px 0 var(--ink);
    -webkit-tap-highlight-color:transparent; touch-action:manipulation;
    user-select:none;
  }
  .mmc-keypad button:active { transform:translateY(3px); box-shadow:none; }
  .mmc-keypad button.kp-go { background:var(--gold); }
  .mmc-keypad button.kp-del { font-size:22px; }
  .mmc-buildstamp {
    margin-top:26px; padding-top:12px; border-top:1px solid var(--paper-line);
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft);
    opacity:.65; text-align:right; letter-spacing:.02em;
  }
  .mmc-req { color:var(--incorrect); font-weight:800; }
  .mmc-forgot {
    display:inline-block; margin-left:14px; font-size:13px; font-weight:700;
    color:var(--ink-soft); text-decoration:underline;
  }
  .mmc-entrypanels { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:12px; margin-top:14px; }
  .mmc-entrypanels .ep {
    background:var(--paper); border:1px solid var(--paper-line); border-radius:0 12px 12px 0;
    padding:16px 18px;
  }
  .mmc-entrypanels .ep-teacher { border-left:3px solid var(--slime); }
  .mmc-entrypanels .ep-student { border-left:3px solid var(--purple); }
  .mmc-entrypanels b {
    display:block; font-family:'Baloo 2',sans-serif; font-weight:800; font-size:16px; margin-bottom:4px;
  }
  .mmc-entrypanels span {
    display:block; font-family:'Nunito Sans',sans-serif; font-size:14px; color:var(--ink-soft);
    line-height:1.55; font-weight:600; margin-bottom:10px;
  }
  .mmc-palgrid {
    display:grid; grid-template-columns:repeat(auto-fill,minmax(132px,1fr));
    gap:8px; margin-top:12px;
  }
  .mmc-palbtn {
    display:flex; align-items:center; gap:8px; position:relative;
    background:var(--paper); border:2.5px solid var(--ink); border-radius:12px;
    box-shadow:2px 2px 0 var(--ink); padding:8px 10px; cursor:pointer;
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:13px; color:var(--ink);
    transition:transform .1s ease;
  }
  .mmc-palbtn:hover:not(:disabled){ transform:translate(-1px,-1px); box-shadow:3px 3px 0 var(--ink); }
  .mmc-palbtn.selected { background:var(--slime); }
  /* Locked schemes stay visible — seeing what's coming is the point of a reward. */
  .mmc-palbtn.locked { opacity:.45; cursor:not-allowed; box-shadow:none; border-style:dashed; }
  .mmc-palswatch { display:inline-flex; gap:2px; flex-shrink:0; }
  .mmc-palswatch span { width:13px; height:13px; border-radius:50%; border:1.5px solid var(--ink); display:inline-block; }
  .mmc-palbtn .lbl { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mmc-palbtn .lock { margin-left:auto; font-size:11px; }
  .mmc-arena-wrap { position:relative; z-index:1; padding:2px 0 6px; }
  .mmc-brandmark {
    position:absolute; left:0; top:2px;
    font-family:'Baloo 2',sans-serif; font-weight:800; font-size:clamp(15px,2.6vw,19px);
    letter-spacing:-.02em; line-height:1; white-space:nowrap;
  }
  /* Fixed brand orange, not var(--orange) — the wordmark is the parent brand
     and shouldn't repaint itself when a student picks a theme. */
  .mmc-brandmark { -webkit-text-stroke:2.5px var(--ink); paint-order:stroke fill; }
  .mmc-brandmark .bm-a { color:#fff; }
  .mmc-brandmark .bm-b { color:#FF7A1A; }
  .mmc-arena { text-align:center; padding-top:26px; }
  /* Students can pick their own theme colours, so the banner must stay legible
     against ANY background. Everything here uses fixed ink/white rather than
     theme variables, and the lettering carries a dark outline on all sides so
     it survives a pale yellow header as readily as a dark purple one. */
  .mmc-arena-the {
    display:block; font-family:'Baloo 2',sans-serif; font-weight:700;
    font-size:clamp(14px,2.4vw,19px); color:#fff;
    letter-spacing:.32em; text-transform:lowercase; margin-bottom:-2px;
    -webkit-text-stroke:3px var(--ink); paint-order:stroke fill;
    text-shadow:0 2px 0 rgba(0,0,0,.35);
  }
  .mmc-arena-word {
    display:block; font-family:'Baloo 2',sans-serif; font-weight:800;
    font-size:clamp(46px,11vw,86px); line-height:1; letter-spacing:.02em;
    color:#fff;
    /* Outline first, fill on top — legible on any colour the student chooses.
       The stacked ink shadow underneath gives the stadium-sign depth. */
    -webkit-text-stroke:7px var(--ink); paint-order:stroke fill;
    text-shadow:
      0 3px 0 var(--ink),
      0 6px 0 var(--ink),
      0 11px 20px rgba(0,0,0,.35);
    transform:rotate(-1.2deg);
  }
  @supports not (paint-order: stroke) {
    /* Older engines ignore paint-order and would stroke over the letterforms,
       so fall back to a plain heavy shadow rather than an unreadable blob. */
    .mmc-arena-the, .mmc-arena-word { -webkit-text-stroke:0; }
    .mmc-arena-word { text-shadow:2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink),0 3px 0 var(--ink),0 6px 0 var(--ink); }
  }
  @media (max-width:520px){
    .mmc-brandmark { position:static; text-align:center; margin-bottom:2px; }
    .mmc-arena { padding-top:2px; }
  }
  .mmc-sparkle { position:relative; z-index:1; font-size:20px; display:inline-block; margin-left:4px; }
  .mmc-tagline {
    position:relative; z-index:1; color:#fff; font-family:'Baloo 2',sans-serif; font-weight:700;
    font-size:clamp(15px,2.4vw,20px); margin:2px 0 8px; text-align:center;
  }
  .mmc-tagline .dot { color:var(--slime); }
  .mmc-tagline .dot.d2 { color:var(--yellow); }
  .mmc-tagline .dot.d3 { color:#fff; }
  .mmc-sub { font-size:14px; color:#fff; opacity:.85; margin:0; position:relative; z-index:1; font-weight:600; }
  .mmc-head-bottom { position:relative; z-index:1; display:flex; gap:12px; flex-wrap:wrap; margin-top:18px; align-items:stretch; }
  .mmc-welcome-card {
    background:rgba(0,0,0,0.28); border-radius:16px; padding:12px 18px; display:flex; align-items:center;
    gap:12px; flex:1; min-width:220px;
  }
  .mmc-avatar {
    width:42px; height:42px; border-radius:50%; background:rgba(255,255,255,0.25); display:flex;
    align-items:center; justify-content:center; font-family:'Baloo 2',sans-serif; font-weight:800;
    color:#fff; font-size:15px; flex-shrink:0;
  }
  .mmc-welcome-name { color:#fff; font-weight:700; font-size:14px; }
  .mmc-welcome-role { color:rgba(255,255,255,0.75); font-size:12px; font-weight:600; }
  .mmc-welcome-role b { color:#fff; }
  .mmc-stat-card {
    background:rgba(255,255,255,0.18); border-radius:16px; padding:10px 16px; display:flex;
    align-items:center; gap:10px; min-width:130px;
  }
  .mmc-stat-icon {
    width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    font-size:16px; flex-shrink:0;
  }
  .mmc-stat-label { color:rgba(255,255,255,0.85); font-size:11px; font-weight:700; }
  .mmc-stat-num { color:#fff; font-family:'Baloo 2',sans-serif; font-weight:800; font-size:20px; }

  .mmc-body { padding:26px 28px 32px; background:
    radial-gradient(var(--paper-line) 1px, transparent 1.5px) 0 0/16px 16px,
    var(--paper); }
  .mmc-empty { text-align:center; padding:40px 20px; color:var(--ink-soft); font-weight:600; }
  .mmc-empty-icon { font-size:36px; margin-bottom:8px; }
  .mmc-toast { position:sticky; top:8px; z-index:20; background:var(--incorrect); color:#fff; padding:10px 14px; border-radius:10px; border:2.5px solid var(--ink); font-size:13px; font-weight:700; margin-bottom:14px; box-shadow:3px 3px 0 var(--ink); display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .mmc-toast-close { background:none; border:none; color:#fff; font-weight:800; font-size:14px; cursor:pointer; padding:0 2px; flex-shrink:0; }

  .mmc-btn { font-family:'Baloo 2',sans-serif; font-weight:700; font-size:14px; padding:10px 18px;
    border-radius:12px; border:2.5px solid var(--ink); background:var(--purple); color:#fff;
    box-shadow:3px 3px 0 var(--ink); transition:transform .1s ease, box-shadow .1s ease; }
  .mmc-btn:hover { transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--ink); }
  .mmc-btn:active { transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }
  .mmc-btn.gold { background:var(--orange); color:var(--ink); }
  .mmc-btn.gold:hover { background:var(--orange-deep); }
  .mmc-btn.ghost { background:var(--paper); border:2.5px solid var(--ink); color:var(--ink); box-shadow:3px 3px 0 var(--ink); }
  .mmc-btn.ghost:hover { background:var(--bg); }
  .mmc-btn.danger { background:#fff; color:var(--incorrect); border:2.5px solid var(--incorrect); box-shadow:3px 3px 0 var(--incorrect); }
  .mmc-btn.danger:hover { background:#FFF3F2; }
  .mmc-btn:disabled { opacity:.45; cursor:not-allowed; transform:none !important; }
  .mmc-btn.sm { padding:6px 12px; font-size:12.5px; border-radius:9px; box-shadow:2px 2px 0 var(--ink); }

  .mmc-card { background:var(--paper); border:2.5px solid var(--ink); border-radius:18px; padding:18px 20px; margin-bottom:16px;
    box-shadow:5px 5px 0 var(--ink); transition:transform .12s ease, box-shadow .12s ease; }
  .mmc-card h3 { font-family:'Baloo 2',sans-serif; font-weight:700; margin:0 0 4px; font-size:17px; }
  .mmc-card .meta { font-size:12.5px; color:var(--ink-soft); margin-bottom:10px; font-weight:600; }
  .mmc-row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .mmc-field { margin-bottom:12px; }
  .mmc-field label { display:block; font-size:12.5px; font-weight:800; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; margin-bottom:5px; }
  .mmc-field input[type=text], .mmc-field input[type=email], .mmc-field input[type=password], .mmc-field input[type=number], .mmc-field select {
    width:100%; padding:9px 11px; border-radius:10px; border:2px solid var(--paper-line); background:var(--paper); font-size:14.5px; color:var(--ink); font-weight:600;
  }
  .mmc-field input:focus, .mmc-field select:focus { outline:none; border-color:var(--purple); box-shadow:0 0 0 3px rgba(139,92,246,0.25); }

  .mmc-tabs { display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap; }
  .mmc-tab { background:var(--paper); border:2.5px solid var(--ink); padding:9px 14px; font-weight:700; font-family:'Baloo 2',sans-serif; font-size:13.5px; color:var(--ink-soft); border-radius:11px; box-shadow:2px 2px 0 var(--ink); transition:transform .1s ease; }
  .mmc-tab:hover { transform:translate(-1px,-1px); }
  .mmc-tab.active { color:var(--ink); background:var(--slime); }

  .mmc-qedit { border:2px dashed var(--ink-soft); border-radius:12px; padding:12px; margin-bottom:10px; background:var(--bg); }
  .mmc-qedit .idx { font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); margin-bottom:6px; font-weight:700; }
  .mmc-qedit textarea, .mmc-qedit input { width:100%; border:2px solid var(--paper-line); border-radius:9px; padding:7px 9px; font-size:13.5px; margin-bottom:6px; background:#fff; }
  .mmc-qedit .label2 { font-size:11px; color:var(--ink-soft); font-weight:800; text-transform:uppercase; letter-spacing:.03em; }

  .mmc-quiz-q { border:2.5px solid var(--ink); border-radius:16px; padding:16px; margin-bottom:12px; background:#fff; box-shadow:4px 4px 0 var(--ink); }
  .mmc-quiz-q .qnum { font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); margin-bottom:6px; font-weight:700; }
  .mmc-quiz-q .qtext { font-size:16px; font-weight:800; margin-bottom:10px; }
  .mmc-quiz-q .answer-row { display:flex; gap:8px; }
  .mmc-quiz-q input[type=text] { flex:1; padding:9px 11px; border-radius:10px; border:2px solid var(--paper-line); font-size:15px; font-weight:700; }
  .mmc-feedback { margin-top:10px; padding:10px 12px; border-radius:10px; font-size:13.5px; font-weight:700; border:2px solid; }
  .mmc-feedback.ok { background:#EEFBF1; color:var(--correct); border-color:var(--correct); }
  .mmc-feedback.no { background:#FEF1F0; color:var(--incorrect); border-color:var(--incorrect); }
  .mmc-qsvg { margin-bottom:10px; }
  .mmc-choices { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .mmc-choice-btn { padding:8px 14px; border-radius:20px; border:2.5px solid var(--ink); background:#fff; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:13.5px; color:var(--ink); box-shadow:2px 2px 0 var(--ink); }
  .mmc-choice-btn.selected { background:var(--purple); color:#fff; }
  .mmc-order-slot { width:64px; height:38px; border:2px dashed var(--paper-line); border-radius:20px; }
  .mmc-choice-btn:disabled { opacity:.7; }
  .mmc-coin-chip { padding:10px 16px; border-radius:14px; border:2.5px solid var(--ink); background:#fff; font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:14px; color:var(--ink); box-shadow:2px 2px 0 var(--ink); }
  .mmc-coin-chip.selected { background:var(--yellow); }
  .mmc-coin-chip:disabled { opacity:.7; }
  .mmc-coin-total { font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--ink-soft); margin-bottom:8px; font-weight:700; }
  .mmc-race-scene { overflow-x:auto; margin-bottom:16px; }
  .mmc-race-track { position:relative; min-width:320px; background:repeating-linear-gradient(180deg,#F5F2E8 0 40px, #ECE6D6 40px 42px);
    border:2.5px solid var(--ink); border-radius:14px; box-shadow:4px 4px 0 var(--ink); }
  .mmc-race-lane { position:absolute; left:8px; right:14px; height:2px; }
  .mmc-race-track-line { position:absolute; left:0; right:0; top:20px; height:2px; background:var(--paper-line); }
  .mmc-race-horse { position:absolute; top:-9px; display:flex; align-items:center; gap:4px;
    transition:left 0.7s cubic-bezier(.34,1.4,.64,1); animation:mmcTrot 0.5s infinite alternate; z-index:1; }
  .mmc-race-horse.me { z-index:2; }
  /* "me" glow is applied inline alongside the colour filter, combined in JS — see renderRaceTrack */
  .mmc-race-horse.me .mmc-race-name { background:var(--purple); color:#fff; border-color:var(--purple-deep); }
  .mmc-race-emoji { font-size:22px; display:inline-block; transform:scaleX(-1); }
  .mmc-race-horse-wrap { position:relative; display:inline-block; }

  /* Teacher-facing profile. Deliberately plain: the .mmc-pro palette, no coloured fills,

     dashboard is the place for trophies. */
  .mmc-ov-figs { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:0; border:1px solid var(--paper-line); border-radius:8px; overflow:hidden; margin:12px 0 18px; }

  .mmc-ov-figsub { font-size:12px; color:var(--ink-soft); }
  .mmc-ov-cols { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:18px; }
  .mmc-ov-h { font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin:18px 0 6px; }
  .mmc-ov-list { width:100%; border-collapse:collapse; font-size:14px; }

function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }

function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ [a,b]=[b,a%b]; } return a||1; }
function simplify(n,d){ const g=gcd(n,d)||1; return [n/g, d/g]; }

// ---------- SVG diagram helpers ----------
function svgWrap(inner, w, h){
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:260px;height:auto;background:#fff;border:1px solid var(--paper-line);border-radius:8px;display:block;">${inner}</svg>`;
}
function drawShadedGrid(rows, cols, n){
  const cell = Math.max(12, Math.min(22, Math.floor(220/Math.max(rows,cols))));
  let cells='';
  const total=rows*cols;
  for(let i=0;i<total;i++){
    const r=Math.floor(i/cols), c=i%cols;
    const fill = i<n ? '#3F7A57' : '#ffffff';
    cells+=`<rect x="${c*cell}" y="${r*cell}" width="${cell}" height="${cell}" fill="${fill}" stroke="#E4DCC8"/>`;
  }
  return svgWrap(cells, cols*cell, rows*cell);
}
function drawRectShape(w,h){
  const cell=26, pad=1, gridW=w+pad*2, gridH=h+pad*2;

  for(let x=0;x<=gridW;x++) lines+=`<line x1="${x*cell}" y1="0" x2="${x*cell}" y2="${gridH*cell}" stroke="#E4DCC8"/>`;
  for(let y=0;y<=gridH;y++) lines+=`<line x1="0" y1="${y*cell}" x2="${gridW*cell}" y2="${y*cell}" stroke="#E4DCC8"/>`;
  const rect=`<rect x="${pad*cell}" y="${pad*cell}" width="${w*cell}" height="${h*cell}" fill="#4C7A96" fill-opacity="0.45" stroke="#395E76" stroke-width="2"/>`;
  return svgWrap(lines+rect, gridW*cell, gridH*cell);
}
function lShapePoints(s, cell, offsetX, offsetY){

}

}

}

function drawClock(hour,minute,minorTicks){
  const cx=100, cy=100, r=90;
  const minuteAngle = minute*6, hourAngle=(hour%12)*30 + minute*0.5;
  function pt(deg,len){ const rad=(deg-90)*Math.PI/180; return [cx+len*Math.cos(rad), cy+len*Math.sin(rad)]; }

  const pts=[[120,20],[20,170],[220,170]];
  const poly=pts.map(p=>p.join(',')).join(' ');
  const labelPos=[[120,48],[58,148],[182,148]];

function drawLayers(layers,rows,cols){

// ---------- Question generators (20 fixed curriculum slots) ----------
const OPR = {
  easy:   { addMax:999,   mulA:[2,9],  mulB:[2,9],  divDivisor:[2,9],  divQuotient:[2,9] },
  medium: { addMax:9999,  mulA:[2,12], mulB:[2,12], divDivisor:[2,12], divQuotient:[2,12] },
  hard:   { addMax:99999, mulA:[10,20],mulB:[2,12], divDivisor:[2,15], divQuotient:[10,30] }
};
const PLACES=['ones','tens','hundreds','thousands','ten-thousands','hundred-thousands'];

function genPlaceValue(diff){
  const L = diff==='easy'?4: diff==='medium'?5:6;
  let digits=[randInt(1,9)]; for(let i=1;i<L;i++) digits.push(randInt(0,9));
  const num=parseInt(digits.join(''),10);
  const placeIdx=randInt(0,L-1); const placeName=PLACES[placeIdx]; const digit=digits[L-1-placeIdx];
  return { prompt:`Which digit is in the ${placeName} place in the number ${formatGrouped(num)}?`, answer:String(digit),
    explanation:`In ${formatGrouped(num)}, the ${placeName} digit is ${digit}.` };
}
function genSequence(diff){
  const step = diff==='easy'? randInt(1,5) : diff==='medium'? pick([5,10,20,25]) : pick([50,100,200,250]);
  const start = randInt(1,40)*step;
  const terms=[]; for(let i=0;i<5;i++) terms.push(start+i*step);
  const blankIdx=randInt(1,3); const answer=terms[blankIdx];
  const display=terms.map((t,i)=> i===blankIdx? '?' : String(t)).join(', ');
  return { prompt:`Fill in the missing number: ${display}`, answer:String(answer),
    explanation:`The pattern increases by ${step} each time, so the missing number is ${answer}.` };
}
function genRounding(diff){
  const range = diff==='easy'?[100,999]: diff==='medium'?[1000,9999]:[10000,99999];
  const num=randInt(range[0],range[1]);
  const toOptions = diff==='easy'? [10,100] : diff==='medium'? [100,1000] : [1000,10000];
  const roundTo=pick(toOptions); const rounded=Math.round(num/roundTo)*roundTo;
  return { prompt:`Round ${formatGrouped(num)} to the nearest ${formatGrouped(roundTo)}.`, answer:String(rounded),
    explanation:`${formatGrouped(num)} rounds to ${formatGrouped(rounded)} (nearest ${formatGrouped(roundTo)}).` };
}
function genOrdering(diff){
  const range = diff==='easy'?[10,999]: diff==='medium'?[1000,99999]:[10000,999999];
  let s=new Set(); while(s.size<4) s.add(randInt(range[0],range[1]));
  const arr=shuffleArr([...s]); const sorted=[...s].sort((a,b)=>a-b);
  return { prompt:`Tap the numbers in ascending order (smallest first).`, items:arr.map(String), answer:sorted.join(','),
    explanation:`Ascending order: ${sorted.map(formatGrouped).join(', ')}`, inputType:'order', checkType:'numlist' };
}
function genFactors(diff){
  const range= diff==='easy'?[12,30]: diff==='medium'?[20,60]:[40,100];
  let num, factors;
  do{
    num=randInt(range[0],range[1]);
    factors=[]; for(let i=1;i<=num;i++) if(num%i===0) factors.push(i);
  } while(factors.length<4);

    if(!factors.includes(c)) nonFactor=c;

  return { prompt:`Which of these is NOT a factor of ${num}?`, answer:String(nonFactor), inputType:'choice', choices,
    explanation:`The factors of ${num} are: ${factors.join(', ')}. ${nonFactor} is not a factor.` };
}
function genAddition(diff){ const r=OPR[diff]; const a=randInt(100,r.addMax), b=randInt(100,r.addMax);
  return { prompt:`${formatGrouped(a)} + ${formatGrouped(b)} = ?`, answer:String(a+b), explanation:`${formatGrouped(a)} + ${formatGrouped(b)} = ${formatGrouped(a+b)}` }; }
function genSubtraction(diff){ const r=OPR[diff]; const a=randInt(100,r.addMax), b=randInt(0,a);
  return { prompt:`${formatGrouped(a)} − ${formatGrouped(b)} = ?`, answer:String(a-b), explanation:`${formatGrouped(a)} − ${formatGrouped(b)} = ${formatGrouped(a-b)}` }; }

  let a,b;

function genDivision(diff){
  let divisor, quotient;

  else if(diff==='medium'){ divisor=randInt(2,9); quotient=randInt(10,19); }
  else { divisor=randInt(2,9); const lo=Math.ceil(100/divisor), hi=Math.floor(999/divisor); quotient=randInt(lo,hi); }
  const a=divisor*quotient;
  return { prompt:`${formatGrouped(a)} ÷ ${divisor} = ?`, answer:String(quotient), explanation:`${formatGrouped(a)} ÷ ${divisor} = ${quotient}` };
}
function genFracHalf(diff){
  const denoms = diff==='easy'?[3,4,5,6,8,10]: diff==='medium'?[3,4,5,6,7,8,9,10,12]:[3,5,6,7,8,9,10,11,12,13];
  const d=pick(denoms); const n=randInt(1,d-1); const left=n*2, right=d;
  const sign= left<right?'less than': left>right?'more than':'equal to';
  return { prompt:`Is ${n}/${d} less than, more than, or equal to 1/2?`, answer:sign, inputType:'choice', choices:['less than','more than','equal to'],
    explanation:`${n}/${d} compared to 1/2: ${n}×2=${left} vs ${d}, so it is ${sign} 1/2.` };
}
const GRID_SIZES = [ {rows:2,cols:5},{rows:4,cols:5},{rows:5,cols:6},{rows:5,cols:8},{rows:5,cols:10},{rows:6,cols:10},{rows:8,cols:10},{rows:10,cols:10} ];
function genShadedGrid(diff, _strategy, year){
  // Year 3 meets halves, quarters and eighths, then thirds. Anything finer is Year 4.

      ansNum:n, ansDen:total, answer:`${n}/${total}`,
      explanation:`${n} of the ${total} squares are shaded, so the fraction is ${n}/${total}.`,
      svg:drawShadedGrid(sh.rows,sh.cols,n), subskill:'count_visual_fraction' };
  }
  if(diff==='medium'){

    // shows, so the DIRECT fraction is the correct answer.
    const size=pick(GRID_SIZES); const total=size.rows*size.cols;
    const n=randInt(2,total-2);
    const correct=`${n}/${total}`;
    const seen=new Set([correct]); const decoys=[];
    // Plausible misreads: counting the unshaded part, off-by-a-row, off-by-one,
    // and inverting the fraction.
    // The different-denominator distractor is added FIRST. Added afterwards it
    // never appeared, because the same-denominator loop had already filled all
    // three slots — four options sharing one denominator reduces the question to
    // counting shaded squares rather than reading the whole fraction.
    const otherTotals=GRID_SIZES.map(g=>g.rows*g.cols).filter(t=>t!==total);
    if(otherTotals.length){
      const ot=pick(otherTotals);
      const alt=`${Math.max(1,Math.min(ot-1,n))}/${ot}`;
      if(!seen.has(alt)){ seen.add(alt); decoys.push(alt); }
    }
    const candidates=[total-n, n+size.cols, n-size.cols, n+1, n-1];
    for(const c of shuffleArr(candidates)){
      if(c<=0||c>=total||c===n) continue;

    }

    while(decoys.length<3){

      renderFractionChoices:true,
      explanation:`${n} of the ${total} parts are shaded, so the fraction is ${n}/${total}.`,
      svg:drawShadedGrid(size.rows,size.cols,n), subskill:'read_visual_fraction' };

  const correct=fracStr(n,total);

  if(raw!==correct){ seen.add(raw); decoys.push(raw); }
  const candidates=[total-n, n+size.cols, n-size.cols, n+2, n-2].filter(x=>x>0&&x<total&&x!==n);
  for(const c of shuffleArr(candidates)){ const f=fracStr(c,total); if(!seen.has(f)){ seen.add(f); decoys.push(f); if(decoys.length>=3) break; } }
  while(decoys.length<3){ const c=randInt(1,total-1); const f=fracStr(c,total); if(!seen.has(f)){ seen.add(f); decoys.push(f); } }
  const choices=shuffleArr([correct, ...decoys.slice(0,3)]);
  return { prompt:`What fraction of the grid is shaded? Give your answer in simplest form.`, answer:correct, inputType:'choice', choices,
    explanation:`${n} out of ${total} squares are shaded — ${n}/${total} simplifies to ${correct}.`, svg:drawShadedGrid(size.rows,size.cols,n) };
}
function genDecimalPlace(diff){

    medium: ['tenths','hundredths','thousandths'],
    hard: ['tenths','hundredths','thousandths','ten-thousandths'],
  };

  const decDigits = places.length; // always generate enough decimal digits to cover every place this difficulty can ask about
  const whole=randInt(1, diff==='hard'?999:99);
  let dec=''; for(let i=0;i<decDigits;i++) dec+=randInt(0,9);
  const numStr=`${whole}.${dec}`;
  const placeIdx=randInt(0,places.length-1);
  const placeName=places[placeIdx]; const digit=dec[placeIdx];

    explanation:`In ${numStr}, the ${placeName} digit is ${digit}.` };

function genOrderDecimals(diff){
  // The "trick" deliberately changes between sets so students can't pattern-match:
  // sometimes trailing zeros, sometimes differing decimal lengths, sometimes a
  // whole number mixed in, sometimes the same digits with the point moved.
  let vals=[];
  if(diff==='easy'){
    const s=new Set();
    while(s.size<4) s.add(randInt(10,49)/10);   // ones and tenths only
    vals=[...s];
  } else if(diff==='medium'){
    const base=randInt(2,8);
    const s=new Set([base, base+randInt(1,4)/10, base+randInt(11,49)/100, base+randInt(111,499)/1000]);
    while(s.size<4) s.add(randInt(1,9)+randInt(1,9)/10);
    vals=[...s].slice(0,4);
  } else {
    const trick=pick(['trailingZeros','movePoint','mixedLengths','wholeMixed']);
    const b=randInt(2,8), t=randInt(1,9);
    if(trick==='trailingZeros'){
      const core=b+t/10;
      vals=[core, b+t/10+randInt(1,9)/100, b+randInt(1,9)/10, b];
    } else if(trick==='movePoint'){
      const d=randInt(2,9), e=randInt(1,9);
      vals=[d+e/10, (d*10)+e, (d+e/10)/10, d+e/100];
    } else if(trick==='mixedLengths'){
      vals=[b+t/10, b+t/100, b+t/1000, b+(t+1)/10];
    } else {
      vals=[b, b+t/10, b+t/100, b-1+randInt(5,9)/10];
    }
  }
  vals=[...new Set(vals.map(v=>Math.round(v*1000)/1000))];
  while(vals.length<4){ const v=Math.round((randInt(1,9)+randInt(0,99)/100)*1000)/1000; if(vals.indexOf(v)===-1) vals.push(v); }
  vals=vals.slice(0,4);
  const asc=Math.random()<0.5;
  const sorted=[...vals].sort((a,b)=>asc?a-b:b-a);
  let shown=shuffleArr(vals);
  let g=0; while(shown.join()===sorted.join() && g++<20) shown=shuffleArr(vals);
  const clue = diff==='hard' ? '' : (asc?' (smallest to biggest)':' (biggest to smallest)');
  return { prompt:`Tap the decimals in ${asc?'ascending':'descending'} order${clue}.`,
    items:shown.map(String), answer:sorted.join(','),
    explanation:`${asc?'Ascending':'Descending'} order: ${sorted.join(', ')}`,
    inputType:'order', checkType:'numlist' };
}

// Fewest-coins solution for an amount, using coins only.
function minimalCoins(cents){
  let rem=cents; const out=[];
  for(let i=AUD_COINS.length-1;i>=0;i--){
    while(rem>=AUD_COINS[i].v){ out.push(AUD_COINS[i].v); rem-=AUD_COINS[i].v; }
  }
  return rem===0 ? out : null;
}

function buildCoinsQuestion(target, promptText, explanationText, opts){
  opts = opts || {};
  const solution = minimalCoins(target) || [];
  // Always offer extra coins that aren't needed, so selecting everything on the
  // table is never the answer.
  const extras=[];
  // A fuller tray, and always a few small coins — without 5c and 10c present the
  // "fewest coins" decision is much easier than it should be.
  extras.push(5,5,10,10,20);
  const extraCount = randInt(4,6);
  for(let i=0;i<extraCount;i++) extras.push(pick(AUD_COINS).v);
  const coins=[...solution, ...extras].map((v,i)=>{
    const c=coinByValue(v);
    return {v, l:c.l, id:'c'+i,
      // Small random offsets so the coins look scattered on a table rather than
      // sorted into a neat row.
      dx: randInt(-6,6), dy: randInt(-7,7), rot: randInt(-14,14)};
  });
  for(let i=coins.length-1;i>0;i--){ const j=randInt(0,i); [coins[i],coins[j]]=[coins[j],coins[i]]; }
  return { prompt:promptText, inputType:'coins', targetCents:target, coins,
    // Coins are graded from the selection, not a typed string — but an answer
    // string still gives the teacher review screen and feedback something to show.
    answer: solution.map(v=>coinByValue(v).l).join(' + '),
    explanation:explanationText, minCoins:solution.length,
    showRunningTotal: !!opts.runningTotal, coinsSubskill:opts.subskill||'make_amount' };
}

function joinWithAnd(parts){
  if(parts.length===1) return parts[0];
  if(parts.length===2) return `${parts[0]} and ${parts[1]}`;
  return `${parts.slice(0,-1).join(', ')} and ${parts[parts.length-1]}`;
}

function genCoinsY4(diff){

    return buildCoinsQuestion(target,

      {runningTotal:false, subskill:'make_amount_no_total'});
  }

  // Payment amounts must be what someone would realistically hand over.
  const itemCount=pick([1,2]);

  const total=chosenItems.reduce((s,it)=>s+it.price,0);

  const payment=pick(candidates);
  const change=payment-total;
  const itemList=joinWithAnd(chosenItems.map(it=>`${it.name} for ${fmtCents(it.price)}`));
  return buildCoinsQuestion(change,
    `I bought ${itemList} and paid with ${fmtCents(payment)}. Choose the fewest coins for my change.`,
    `${fmtCents(payment)} − ${fmtCents(total)} = ${fmtCents(change)} change, which is ${minimalCoins(change).length} coins: ${minimalCoins(change).map(v=>coinByValue(v).l).join(' + ')}.`,
    {runningTotal:false, subskill:'calculate_change'});
}

// ---------- CUT-OUT SHAPES (Q15 medium) ----------
// Built as a grid occupancy map rather than a formula. Area is simply the number
// of filled cells; perimeter is the number of cell edges with nothing next to
// them. That's exact for ANY rectilinear shape, so cut-outs can sit on edges,
// in corners, be bigger than one square, and there can be several of them —
// no special-case geometry to get wrong.
function buildCutoutShape(){
  const W=randInt(5,9), H=randInt(4,7);
  const cells=[]; for(let y=0;y<H;y++){ cells.push(new Array(W).fill(true)); }
  const cutCount = Math.random()<0.42 ? 2 : 1;
  const corners=[[0,0],[1,0],[0,1],[1,1]];   // [right?, bottom?]
  const used=[];
  for(let k=0;k<cutCount;k++){
    // Bites are taken from a corner or the middle of an edge, and can be
    // several squares across, so the same notch never repeats.
    const cw=randInt(1, Math.max(1, Math.floor(W/2)-1));
    const ch=randInt(1, Math.max(1, Math.floor(H/2)-1));
    const fromCorner = Math.random()<0.6 || k===1;
    let x0,y0;
    if(fromCorner){
      const c=pick(corners.filter(c=>!used.some(u=>u[0]===c[0]&&u[1]===c[1])));
      if(!c) continue;
      used.push(c);
      x0 = c[0] ? W-cw : 0;
      y0 = c[1] ? H-ch : 0;
    } else {
      // Edge notch: flush against one side, offset along it.
      const side=pick(['top','bottom','left','right']);
      if(side==='top'){ x0=randInt(1,Math.max(1,W-cw-1)); y0=0; }
      else if(side==='bottom'){ x0=randInt(1,Math.max(1,W-cw-1)); y0=H-ch; }
      else if(side==='left'){ x0=0; y0=randInt(1,Math.max(1,H-ch-1)); }
      else { x0=W-cw; y0=randInt(1,Math.max(1,H-ch-1)); }
    }
    for(let y=y0;y<y0+ch;y++) for(let x=x0;x<x0+cw;x++){ if(cells[y]&&cells[y][x]!==undefined) cells[y][x]=false; }
  }
  let area=0, perim=0;
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    if(!cells[y][x]) continue;
    area++;
    if(y===0 || !cells[y-1][x]) perim++;
    if(y===H-1 || !cells[y+1][x]) perim++;
    if(x===0 || !cells[y][x-1]) perim++;
    if(x===W-1 || !cells[y][x+1]) perim++;
  }
  return {W,H,cells,area,perim};
}
function drawCutoutShape(sh){
  const cell=26, pad=8;
  const w=sh.W*cell+pad*2, h=sh.H*cell+pad*2;
  let rects='';
  for(let y=0;y<sh.H;y++) for(let x=0;x<sh.W;x++){
    if(!sh.cells[y][x]) continue;
    rects+=`<rect x="${pad+x*cell}" y="${pad+y*cell}" width="${cell}" height="${cell}"
      fill="#3F7D5C" stroke="#F5F2E8" stroke-width="1.5"/>`;
  }
  return svgWrap(`${rects}`, w, h);
}

function genAreaY4(diff){

    if(w*h>16){ w=randInt(2,4); h=randInt(2,4); }

      explanation:`Area = ${w} × ${h} = ${area} ${unit}². Perimeter = 2 × (${w} + ${h}) = ${perim} ${unit}.`,
      svg:drawRectShape(w,h), subskill:'area_perimeter_rectangle' };
  }

    const unit='cm';
    return { prompt:`Find the area and perimeter of this shape (each square = 1 ${unit}).`,

      answer:`${sh.area},${sh.perim}`, apArea:sh.area, apPerim:sh.perim,

      svg:drawCutoutShape(sh), subskill:'area_perimeter_cutout' };
  }

  let length=randInt(ctx.lo,ctx.hi), width=randInt(ctx.lo,ctx.hi);
  if(width>length){ [length,width]=[width,length]; }
  // Keep the proportions believable — nothing is 8 times longer than it is wide.
  if(length > width*3) width = Math.max(ctx.lo, Math.round(length/randInt(2,3)));
  const area=length*width, perim=2*(length+width);
  const {correct,choices}=buildAPChoices(area,perim,ctx.unit);
  const sentence=`${ctx.obj.charAt(0).toUpperCase()+ctx.obj.slice(1)} measures ${length} ${ctx.unit} by ${width} ${ctx.unit}. What are its area and perimeter?`;
  return { prompt:sentence, answer:correct, inputType:'choice', choices,
    explanation:`Area = ${length} × ${width} = ${area} ${ctx.unit}². Perimeter = 2 × (${length} + ${width}) = ${perim} ${ctx.unit}.` };
}
function genClock(diff){

  const minute=pick(minuteOptions); const mm=String(minute).padStart(2,'0');
  const correct=`${hour}:${mm}`;
  const step = diff==='easy'?30: diff==='medium'?5:1;
  const seen=new Set([correct]); const decoys=[];
  const candidates=[

// A denominator of 2 forces the numerator to 1, so a quarter of these questions
// had a guaranteed answer and typing "1" scored 56% with no maths done. Worse,
// that inflated SIMPLIFY_FRACTION in the dashboard, so a guesser showed up as
// strong. Dropping 2 and widening the pool takes guessing to 40% across 6 answers.
const NICE_DENOMS_EASY=[3,4,5,6,8];
const NICE_DENOMS_MED=[2,3,4,5,6,7,8,9,10,12];
function pickSimplifiedFraction(denomPool){
  const d1=pick(denomPool); let n1;
  do{ n1=randInt(1,d1-1); } while(gcd(n1,d1)!==1);
  return {n1,d1};
}
function genFractionSimplify(diff){

    const k=2; const n0=n1*k, d0=d1*k;
    return { prompt:`Fill in the missing numerator to complete the equivalent fraction.`,
      hint:'Whatever you do to the top, you must also do to the bottom.', answer:String(n1),
      inputType:'fracEasy', givenNum:n0, givenDen:d0, targetDen:d1,
      explanation:`${n0}/${d0} simplifies by dividing top and bottom by ${k}: ${n0}÷${k} = ${n1}, ${d0}÷${k} = ${d1}.` };
  }
  if(diff==='medium'){
    const {n1,d1}=pickSimplifiedFraction(NICE_DENOMS_MED);
    const k=randInt(2,5); const n0=n1*k, d0=d1*k;

    const correct=`${n1}/${d1}`;

    const raw=`${n0}/${d0}`; if(raw!==correct){ seen.add(raw); decoys.push(raw); }
    const flipped=`${d1}/${n1}`; if(!seen.has(flipped)){ seen.add(flipped); decoys.push(flipped); }
    const forgotDen=`${n1}/${d0}`; if(!seen.has(forgotDen)){ seen.add(forgotDen); decoys.push(forgotDen); }
    const forgotNum=`${n0}/${d1}`; if(!seen.has(forgotNum)){ seen.add(forgotNum); decoys.push(forgotNum); }
    while(decoys.length<3){
      const {n1:rn,d1:rd}=pickSimplifiedFraction(NICE_DENOMS_MED); const f=`${rn}/${rd}`;
      if(!seen.has(f)){ seen.add(f); decoys.push(f); }
    }
    const choices=shuffleArr([correct, ...decoys.slice(0,3)]);
    return { prompt:`Simplify this fraction to its lowest terms.`, hint, answer:correct, inputType:'choice', choices, renderFractionChoices:true,
      givenNum:n0, givenDen:d0,

  }

    n1=pick([7,11,13]); d1=pick([n1+2, n1+4, n1*2, n1+6]); k=pick([2,3,4,5]);
  }
  else { const f=pickSimplifiedFraction(NICE_DENOMS_MED); n1=f.n1; d1=f.d1; k=randInt(2,6); }
  const n0=n1*k, d0=d1*k;

    hint:'Whatever you do to the top, you must also do to the bottom.',
    answer:`${n1}/${d1}`, inputType:'fracHard',
    givenNum:n0, givenDen:d0,
    explanation:`${n0}/${d0} ÷ ${k}/${k} = ${n1}/${d1}.` };

const CONVERSIONS=[{from:'kg',to:'g',factor:1000},{from:'km',to:'m',factor:1000},{from:'L',to:'mL',factor:1000},{from:'m',to:'cm',factor:100},{from:'cm',to:'mm',factor:10}];
function zeroVariants(n){
  const variants=new Set();
  if(n%10===0) variants.add(String(n/10));
  variants.add(String(n*10));
  if(n%100===0) variants.add(String(n/100));
  variants.add(String(n*100));
  const s=String(n);
  if(s.includes('0')){
    const idx=s.indexOf('0');
    const removed=s.slice(0,idx)+s.slice(idx+1);
    if(removed!=='' && !removed.startsWith('0')) variants.add(removed);
  }
  if(s.length>=1){
    const inserted=s[0]+'0'+s.slice(1);
    variants.add(inserted);
  }
  return [...variants].filter(v=>v!==String(n) && v!=='' && Number(v)>0 && !v.startsWith('0'));
}
function genConversion(diff){
  const c=pick(CONVERSIONS);
  const range= diff==='easy'?[1,20]: diff==='medium'?[1,100]:[1,999];
  const val=randInt(range[0],range[1]); const result=val*c.factor;
  const correct=String(result);
  const seen=new Set([correct]); const decoys=[];
  for(const d of shuffleArr(zeroVariants(result))){ if(!seen.has(d)){ seen.add(d); decoys.push(d); if(decoys.length>=3) break; } }
  while(decoys.length<3){
    const factor=pick([10,100]); const op=pick(['*','/']);
    const d = op==='*' ? result*factor : Math.max(1,Math.round(result/factor));
    const ds=String(d);
    if(!seen.has(ds)){ seen.add(ds); decoys.push(ds); }
  }
  const choices=shuffleArr([correct, ...decoys.slice(0,3)]);
  return { prompt:`Complete the conversion: ${val} ${c.from} = ___ ${c.to}`, answer:correct, inputType:'choice', choices,
    explanation:`${val} ${c.from} × ${c.factor} = ${result} ${c.to}.` };
}

    else if(bucket==='obtuse') deg=randInt(100,170); else if(bucket==='straight') deg=180;

  }
  // hard: classify three angles at once — right (90°) shows up now and then, but never twice
  // in the same question, since a repeated identical value is a giveaway rather than a real test.
  // Always three DIFFERENT categories — repeating a type wastes one of the
  // three slots and makes the question easier than intended.
  // 'straight' joins the pool some of the time — it's a named type students are
  // expected to know, and it shouldn't only ever appear at Easy.
  const pool = Math.random()<0.4 ? ['acute','obtuse','reflex','right','straight'] : ['acute','obtuse','reflex','right'];

  if(diff==='easy'){
    return pick([
      ()=>{ const start=randInt(10,25), fly=randInt(2,start-1);
        return { prompt:`There are ${start} birds in a tree. ${fly} fly away. How many birds remain?`, answer:String(start-fly),
          explanation:`${start} − ${fly} = ${start-fly}.` }; },
      ()=>{ const start=randInt(10,25), given=randInt(2,start-1);
        return { prompt:`There are ${start} fish in a tank. ${given} are given to a friend. How many fish remain?`, answer:String(start-given),
          explanation:`${start} − ${given} = ${start-given}.` }; },
    ])();
  }
  if(diff==='medium'){
    return pick([
      ()=>{ const boxes=randInt(3,8), each=randInt(4,9), total=boxes*each, used=randInt(2,total-1);
        return { prompt:`${boxes} boxes contain ${each} pencils each. ${used} pencils are used. How many pencils remain?`, answer:String(total-used),
          explanation:`${boxes} × ${each} = ${total}, then ${total} − ${used} = ${total-used}.` }; },
      ()=>{ const packs=randInt(3,8), each=randInt(4,9), total=packs*each, used=randInt(2,total-1);
        return { prompt:`${packs} packs contain ${each} stickers each. ${used} stickers are used. How many stickers remain?`, answer:String(total-used),
          explanation:`${packs} × ${each} = ${total}, then ${total} − ${used} = ${total-used}.` }; },
    ])();
  }
  return pick([
    ()=>{ const perBus=randInt(20,40), students=randInt(perBus*3+5, perBus*8); const busesNeeded=Math.ceil(students/perBus);
      return { prompt:`A school has ${students} students travelling on buses. Each bus holds ${perBus} students. What is the smallest number of buses needed?`,
        answer:String(busesNeeded), explanation:`${students} ÷ ${perBus} = ${(students/perBus).toFixed(2)}, rounded up to ${busesNeeded} buses.` }; },
    ()=>{ const perBox=randInt(10,30), items=randInt(perBox*3+5, perBox*8); const boxesNeeded=Math.ceil(items/perBox);
      return { prompt:`A warehouse has ${items} items to pack. Each box holds ${perBox} items. What is the smallest number of boxes needed?`,
        answer:String(boxesNeeded), explanation:`${items} ÷ ${perBox} = ${(items/perBox).toFixed(2)}, rounded up to ${boxesNeeded} boxes.` }; },
  ])();
}

// 10. Use logical reasoning
function wpLogic(diff){
  if(diff==='easy'){
    return pick([
      ()=>{ const [p1,p2,p3]=shuffleArr(PETS); const [n1,n2,n3]=shuffleArr(WP_NAMES);
        return { prompt:`${n1}, ${n2} and ${n3} each have a different pet: a ${p1}, ${p2} or ${p3}. ${n1} has the ${p1}. ${n2} does not have the ${p3}. Which pet does ${n2} have?`,
          answer:p2, inputType:'choice', choices:shuffleArr([p1,p2,p3]),
          explanation:`${n1} has the ${p1}, so ${p2}/${p3} are left for ${n2}/${n3}. Since ${n2} doesn't have the ${p3}, ${n2} has the ${p2}.` }; },
      ()=>{ const [c1,c2,c3]=shuffleArr(COLORS).slice(0,3); const [n1,n2,n3]=shuffleArr(WP_NAMES);
        return { prompt:`${n1}, ${n2} and ${n3} each like a different colour best: ${c1}, ${c2} or ${c3}. ${n1} likes ${c1} best. ${n2} does not like ${c3} best. Which colour does ${n2} like best?`,
          answer:c2, inputType:'choice', choices:shuffleArr([c1,c2,c3]),
          explanation:`${n1} likes ${c1}, so ${c2}/${c3} are left for ${n2}/${n3}. Since ${n2} doesn't like ${c3}, ${n2} likes ${c2}.` }; },
    ])();
  }
  if(diff==='medium'){
    return pick([
      ()=>{ const [n1,n2,n3]=shuffleArr(WP_NAMES);
        return { prompt:`${n1}, ${n2} and ${n3} finished a race in first, second and third place. ${n3} finished third. ${n1} finished before ${n2}. Who finished first?`,
          answer:n1, inputType:'choice', choices:shuffleArr([n1,n2,n3]),
          explanation:`${n3} is third, leaving 1st/2nd for ${n1}/${n2}. Since ${n1} finished before ${n2}, ${n1} is first.` }; },
      ()=>{ const [n1,n2,n3]=shuffleArr(WP_NAMES);
        return { prompt:`${n1}, ${n2} and ${n3} lined up to eat lunch first, second and third. ${n3} was last in line. ${n1} was ahead of ${n2}. Who was first in line?`,
          answer:n1, inputType:'choice', choices:shuffleArr([n1,n2,n3]),
          explanation:`${n3} is last, leaving 1st/2nd for ${n1}/${n2}. Since ${n1} was ahead of ${n2}, ${n1} is first.` }; },
    ])();
  }
  return pick([
    ()=>{ const [n1,n2,n3,n4]=shuffleArr(WP_NAMES);
      return { prompt:`${n1}, ${n2}, ${n3} and ${n4} sit in a row. ${n1} sits first. ${n2} sits next to ${n1}. ${n4} sits to the left of ${n3}. Who sits last?`,
        answer:n3, inputType:'choice', choices:shuffleArr([n1,n2,n3,n4]),
        explanation:`${n1}=1st, ${n2}=2nd (next to ${n1}). That leaves 3rd/4th for ${n4}/${n3} — since ${n4} is left of ${n3}, ${n4}=3rd and ${n3}=4th (last).` }; },
    ()=>{ const [n1,n2,n3,n4]=shuffleArr(WP_NAMES);
      return { prompt:`Four books by ${n1}, ${n2}, ${n3} and ${n4} sit on a shelf. ${n1}'s book is first. ${n2}'s book is right next to ${n1}'s. ${n4}'s book is to the left of ${n3}'s. Whose book is last?`,
        answer:n3, inputType:'choice', choices:shuffleArr([n1,n2,n3,n4]),
        explanation:`${n1}=1st, ${n2}=2nd (next to ${n1}). That leaves 3rd/4th for ${n4}/${n3} — since ${n4} is left of ${n3}, ${n4}=3rd and ${n3}=4th (last).` }; },
  ])();

// 11. Eliminate impossible answers
function wpEliminate(diff){
  if(diff==='easy'){
    return pick([
      ()=>{ const target=randInt(6,30)*2, L=target-2, H=target+1;
        return { prompt:`A bag contains more than ${L} but fewer than ${H} marbles. The number is even. How many marbles are in the bag?`, answer:String(target),
          explanation:`Between ${L} and ${H} are ${L+1} and ${target}; only ${target} is even.` }; },
      ()=>{ const target=randInt(6,30)*2, L=target-2, H=target+1;
        return { prompt:`A packet contains more than ${L} but fewer than ${H} stickers. The number is even. How many stickers are in the packet?`, answer:String(target),
          explanation:`Between ${L} and ${H} are ${L+1} and ${target}; only ${target} is even.` }; },
    ])();
  }
  if(diff==='medium'){
    return pick([
      ()=>{ const m=randInt(4,9), mult=randInt(3,9), target=m*mult, L=target-randInt(1,m-1), H=target+randInt(1,m-1);
        return { prompt:`A mystery number is between ${L} and ${H}. It is a multiple of ${m}. What is the number?`, answer:String(target),
          explanation:`The only multiple of ${m} between ${L} and ${H} is ${target}.` }; },
      ()=>{ const m=randInt(4,9), mult=randInt(3,9), target=m*mult, L=target-randInt(1,m-1), H=target+randInt(1,m-1);
        return { prompt:`The number of students in a group is between ${L} and ${H}. It is a multiple of ${m}. How many students are in the group?`, answer:String(target),
          explanation:`The only multiple of ${m} between ${L} and ${H} is ${target}.` }; },
    ])();
  }
  return pick([
    ()=>{ let target,X,Y,digitSum,ok=false,tries=0;
      while(!ok && tries<300){ tries++; target=randInt(26,49)*2; X=Math.max(10,target-randInt(4,15)); Y=Math.min(99,target+randInt(4,15));
        digitSum=Math.floor(target/10)+(target%10); const matches=[];
        for(let n=X+1;n<Y;n++){ if(n%2===0 && (Math.floor(n/10)+(n%10))===digitSum) matches.push(n); }
        if(matches.length===1 && matches[0]===target) ok=true; }
      return { prompt:`A two-digit number is even, greater than ${X} and less than ${Y}. Its digits add to ${digitSum}. What is the number?`, answer:String(target),
        explanation:`The only even number between ${X} and ${Y} whose digits add to ${digitSum} is ${target}.` }; },
    ()=>{ let target,X,Y,digitSum,ok=false,tries=0;
      while(!ok && tries<300){ tries++; target=randInt(26,49)*2; X=Math.max(10,target-randInt(4,15)); Y=Math.min(99,target+randInt(4,15));
        digitSum=Math.floor(target/10)+(target%10); const matches=[];
        for(let n=X+1;n<Y;n++){ if(n%2===0 && (Math.floor(n/10)+(n%10))===digitSum) matches.push(n); }
        if(matches.length===1 && matches[0]===target) ok=true; }
      return { prompt:`A secret number is even, greater than ${X} and less than ${Y}. Its two digits add to ${digitSum}. What is the secret number?`, answer:String(target),
        explanation:`The only even number between ${X} and ${Y} whose digits add to ${digitSum} is ${target}.` }; },
  ])();
}

      ()=>{ const a=randInt(2,9), b=randInt(2,9), p=a*b;
        return { prompt:`Use the fact that ${a} × ${b} = ${p} to work out ${a} × ${b+1}.`, answer:String(a*(b+1)),
          explanation:`${a} × ${b+1} = ${a}×${b} + ${a} = ${p} + ${a} = ${a*(b+1)}.` }; },

      ()=>{ const a=randInt(3,9), b=randInt(3,9), p=a*b, b2=b*2;

      return { prompt:`You know that ${a} × ${b} = ${p}. What is ${a} × ${askB}?`, answer:String(p*mult),

    ()=>{ const a=pick([12,15,20,25,50]), b=randInt(2,6), p=a*b, mult=randInt(3,12), askA=a*mult;
      return { prompt:`Use the fact that ${a} × ${b} = ${p} to work out ${askA} × ${b}.`, answer:String(p*mult),
        explanation:`${askA} is ${mult} × ${a}, so the answer is ${mult} × ${p} = ${p*mult}.` }; },

// ---------- Q1 PARTITIONING (expanded notation) ----------
// Blanks adapt to NON-ZERO place values only: 40 305 has three parts, not five.
function genPartition(diff, _strategy, year){
  // Year 3 partitions 3-digit numbers only, and never into decimal places — a Year 3
  // has not met decimals. Easy keeps a round tens digit so the three parts are clean.
  if(+year===3){
    const h=randInt(1,9), t=diff==='easy'?randInt(1,9):randInt(0,9), o=diff==='easy'?randInt(1,9):randInt(0,9);
    const num=h*100+t*10+o;
    const parts=[h*100, t*10, o].filter(v=>v>0);
    return { prompt:`Complete the partitioning.`, inputType:'parts',
      partsLead:`${formatGrouped(num)} =`, partsJoin:'+',
      parts:parts.map(()=>({})), answer:parts.join(','),
      explanation:`${formatGrouped(num)} = ${parts.join(' + ')}` };
  }
  return genPartitionY4(diff);
}
function genPartitionY4(diff){
  let num, parts=[];
  if(diff==='easy'){
    // 3 digits, no zero digits
    const d=[randInt(1,9),randInt(1,9),randInt(1,9)];
    num=d[0]*100+d[1]*10+d[2];
    parts=[d[0]*100, d[1]*10, d[2]];
  } else if(diff==='medium'){
    // Zeros are deliberate at Medium, but a number like 30 000 leaves one box and
    // no work to do — so require at least 4 non-zero places every time.
    const len=randInt(4,5);
    let d, guard=0;
    do {
      d=[randInt(1,9)];
      for(let i=1;i<len;i++) d.push(Math.random()<0.25?0:randInt(1,9));
    } while(d.filter(x=>x!==0).length<4 && guard++<200);
    if(d.filter(x=>x!==0).length<4){ d=[randInt(1,9),randInt(1,9),randInt(1,9),randInt(1,9)]; }
    num=parseInt(d.join(''),10);
    parts=[];
    d.forEach((dig,i)=>{ if(dig!==0) parts.push(dig*Math.pow(10,d.length-1-i)); });
  } else {
    const len=randInt(5,6);
    let d, guard=0;
    do {
      d=[randInt(1,9)];
      for(let i=1;i<len;i++) d.push(Math.random()<0.25?0:randInt(1,9));
    } while(d.filter(x=>x!==0).length<4 && guard++<200);
    const whole=parseInt(d.join(''),10);
    const dec1=randInt(0,9), dec2=randInt(1,9);
    num=whole+dec1/10+dec2/100;
    parts=[];
    d.forEach((dig,i)=>{ if(dig!==0) parts.push(dig*Math.pow(10,len-1-i)); });
    if(dec1!==0) parts.push(dec1/10);
    parts.push(dec2/100);
  }
  const shown = diff==='hard' ? formatGrouped(Math.floor(num))+'.'+String(Math.round((num%1)*100)).padStart(2,'0')
                              : formatGrouped(num);
  const fmt=(v)=> v>=1 ? formatGrouped(v) : String(v);
  return {
    prompt:`Complete the partitioning.`,
    inputType:'parts',
    partsLead:`${shown} =`,
    partsJoin:'+',
    parts: parts.map(()=>({})),
    answer: parts.map(fmt).join(','),
    explanation:`${shown} = ${parts.map(fmt).join(' + ')}`
  };
}

// ---------- Q2 NUMBER PATTERNS ----------
// Constant step only. Direction, step size, missing position and start all vary.
function genSequenceV2(diff, _strategy, year){
  if(+year===3){
    // Skip counting is the Year 3 objective — 2s, 5s and 10s first, then 3s and 4s.
    const step = diff==='easy' ? pick([2,5,10]) : diff==='medium' ? pick([2,3,5,10]) : pick([3,4,5,10]);
    const start = step*randInt(1,10);
    const terms=[]; for(let i=0;i<5;i++) terms.push(start+i*step);
    const blankIdx=randInt(1,3); const answer=terms[blankIdx];
    const display=terms.map((t,i)=> i===blankIdx? '?' : String(t)).join(', ');
    return { prompt:`Fill in the missing number: ${display}`, answer:String(answer),
      explanation:`The pattern counts up by ${step}, so the missing number is ${answer}.` };
  }
  return genSequenceY4(diff);
}
function genSequenceY4(diff){
  const stepPool = diff==='easy' ? [2,5,10]
    : diff==='medium' ? [20,25,50,100]
    : [25,50,75,125,150,250];
  const step=pick(stepPool);
  const up = Math.random()<0.5;
  // Starting values kept modest so the challenge is spotting the interval,
  // not managing large-number arithmetic.
  const startMax = diff==='easy'?40: diff==='medium'?400:1200;
  let start=randInt(1, startMax);
  // Align the start to the step so the run reads cleanly (200, 225, 250...).
  // Hard occasionally offsets it, which is where the extra challenge belongs.
  if(diff==='medium') start = Math.max(step, Math.round(start/step)*step);
  if(diff==='hard') start = Math.max(step, Math.round(start/step)*step + (Math.random()<0.35 ? Math.floor(step/2) : 0));
  const n=5;
  const seq=[];
  for(let i=0;i<n;i++) seq.push(start + (up?1:-1)*step*i);
  if(seq.some(v=>v<0)) return genSequenceV2(diff);
  const missIdx=randInt(0,n-1);
  const shown=seq.map((v,i)=> i===missIdx ? '?' : formatGrouped(v));
  return {
    prompt:`Fill in the missing number.`,
    inputType:'parts',
    partsLead: missIdx ? shown.slice(0,missIdx).join(',  ')+',' : '',
    partsTail: (missIdx<shown.length-1 ? ',  '+shown.slice(missIdx+1).join(',  ') : ''),
    parts:[{}],
    seqBefore: shown.slice(0,missIdx),
    seqAfter: shown.slice(missIdx+1),
    answer:String(seq[missIdx]),
    explanation:`The pattern ${up?'increases':'decreases'} by ${formatGrouped(step)} each time, so the missing number is ${formatGrouped(seq[missIdx])}.`
  };
}

// ---------- Q3 ROUNDING ----------
// Target place is genuinely random within the allowed set for the level.
function genRoundingV2(diff, _strategy, year){
  if(+year===3){

    const num = diff==='easy' ? randInt(11,99) : randInt(101,999);
    const roundTo = diff==='easy' ? 10 : (diff==='medium' ? pick([10,100]) : 100);
    const rounded = Math.round(num/roundTo)*roundTo;

      explanation:`${formatGrouped(num)} rounds to ${formatGrouped(rounded)} (nearest ${roundTo}).` };

}
function genRoundingY4(diff){
  const opts = diff==='easy' ? [10,100]
    : diff==='medium' ? [10,100,1000,10000]

  const roundTo=pick(opts);

  let num=randInt(lo,hi);

    answer:String(rounded),

    subskill:'round_'+roundTo
  };
}

// ---------- Q4 ORDERING WHOLE NUMBERS ----------
// Four deliberately confusable numbers built from the same digit pool.
function genOrderingV2(diff, _strategy, year){
  if(+year===3) return genOrderingY4(diff==='hard' ? 'medium' : 'easy');
  return genOrderingY4(diff);
}
function genOrderingY4(diff){
  // The four numbers must be genuinely confusable: they share a leading prefix
  // and differ only in the last few digits, so ordering them needs real
  // place-value attention rather than a glance at the first digit.
  const len = diff==='easy'?randInt(3,4) : diff==='medium'?randInt(4,5) : randInt(5,6);
  // Short numbers permute every digit (345 / 354 / 435 / 453). Longer ones keep
  // a fixed prefix and permute the tail, which is where the confusion lives.
  const prefixLen = len<=4 ? 0 : len-3;
  const tailLen = len - prefixLen;
  const prefix=[]; 
  if(prefixLen){ prefix.push(randInt(1,9)); for(let i=1;i<prefixLen;i++) prefix.push(randInt(0,9)); }
  // A shared pool of tail digits, permuted differently for each number, so the
  // options look near-identical (34 506 / 34 650 / 34 560 / 35 406).
  const tailDigits=[];
  while(tailDigits.length<tailLen){
    const d=randInt(0,9);
    // Distinct digits give more permutations, so four unique numbers are reachable.
    if(tailDigits.indexOf(d)===-1 || tailDigits.length>=8) tailDigits.push(d);
  }
  const set=new Set(); let guard=0;
  while(set.size<4 && guard++<400){
    let pre=prefix.slice();
    // Occasionally nudge one prefix digit so they aren't all literally identical.
    if(Math.random()<0.3 && prefixLen>0){
      const k=randInt(0,prefixLen-1);
      pre[k]=Math.min(9, Math.max(k===0?1:0, pre[k]+pick([-1,1])));
    }
    const t=shuffleArr(tailDigits);
    if(!prefixLen && t[0]===0) continue;   // no leading zero when permuting all digits
    set.add(parseInt(pre.join('')+t.join(''),10));
  }
  while(set.size<4) set.add(randInt(Math.pow(10,len-1), Math.pow(10,len)-1));
  const nums=[...set].slice(0,4);
  const asc = Math.random()<0.5;
  const sorted=[...nums].sort((a,b)=>asc?a-b:b-a);
  let shown=shuffleArr(nums);
  // Never present them already in the answer order.
  let g=0; while(shown.join()===sorted.join() && g++<20) shown=shuffleArr(nums);
  const clue = diff==='hard' ? '' : (asc?' (smallest to biggest)':' (biggest to smallest)');
  return {
    prompt:`Tap the numbers in ${asc?'ascending':'descending'} order${clue}.`,
    items:shown.map(formatGrouped),
    answer:sorted.map(formatGrouped).join(','),
    explanation:`${asc?'Ascending':'Descending'} order: ${sorted.map(formatGrouped).join(', ')}`,
    inputType:'order', checkType:'numlist'
  };
}

// ---------- Q5 FACTORS ----------
function genFactorsV2(diff){
  const pool = diff==='easy' ? [8,12,15,16,18,20]
    : diff==='medium' ? [24,30,35,40,45,50,56]
    : [36,42,48,54,60,64,72,80,84,90,96,100];
  const target=pick(pool);
  const factors=[]; for(let i=1;i<=target;i++) if(target%i===0) factors.push(i);
  const nonFactors=[]; for(let i=2;i<=Math.max(target,30);i++) if(target%i!==0) nonFactors.push(i);
  const variantA = Math.random()<0.5;
  if(variantA){
    // Which is NOT a factor
    const mid=factors.filter(f=>f!==1&&f!==target);
    const chosen=shuffleArr(mid).slice(0,1);
    const opts=shuffleArr([1,target].concat(chosen).concat([pick(nonFactors)])).slice(0,4);
    const bad=opts.find(o=>target%o!==0);
    if(bad==null) return genFactorsV2(diff);
    return { prompt:`Which of these is NOT a factor of ${target}?`, inputType:'choice',
      choices:opts.map(String), answer:String(bad),
      explanation:`${bad} does not divide evenly into ${target}. The factors of ${target} are ${factors.join(', ')}.`,
      subskill:'not_a_factor' };
  }
  // Select the factors — exactly three correct, one plausible non-factor
  const mid=factors.filter(f=>f!==1&&f!==target);
  const third = mid.length ? pick(mid) : factors[1];
  const opts=shuffleArr([1,target,third,pick(nonFactors)]);
  return { prompt:`Select the factors of ${target}.`, inputType:'multi',
    choices:opts.map(String),
    answer:opts.filter(o=>target%o===0).map(String).join(','),
    explanation:`The factors of ${target} are ${factors.join(', ')}.`,
    subskill:'select_factors' };
}

// ---------- Q7 SUBTRACTION ----------
// Every question requires regrouping; ~2 in 3 contain a zero in the larger number.
function needsBorrow(a,b){
  const A=String(a).split('').reverse(), B=String(b).padStart(String(a).length,'0').split('').reverse();
  for(let i=0;i<B.length;i++){ if(parseInt(B[i],10) > parseInt(A[i]||'0',10)) return true; }
  return false;
}
function genSubtractionV2(diff, _strategy, year){
  if(+year===3){
    // The answer is always positive by construction, and regrouping appears from
    // Medium up — that is the actual Year 3 skill, not the size of the numbers.
    if(diff==='easy'){ const b=randInt(11,49), a=b+randInt(11,50);
      return { prompt:`${a} − ${b} = ?`, answer:String(a-b), explanation:`${a} − ${b} = ${a-b}` }; }
    const b = diff==='medium' ? randInt(11,99) : randInt(101,399);
    const a = b + randInt(50,500);
    return { prompt:`${formatGrouped(a)} − ${formatGrouped(b)} = ?`, answer:String(a-b),
      explanation:`${formatGrouped(a)} − ${formatGrouped(b)} = ${formatGrouped(a-b)}` };
  }
  return genSubtractionY4(diff);
}
function genSubtractionY4(diff){
  const wantZero = Math.random()<0.67;
  for(let attempt=0; attempt<300; attempt++){
    let a,b;
    if(diff==='easy'){ a=randInt(120,999); b=randInt(20,a-1); }
    else if(diff==='medium'){ a=randInt(1200,9999); b=randInt(100,a-1); }
    else {
      const aLen=randInt(5,6); a=randInt(Math.pow(10,aLen-1),Math.pow(10,aLen)-1);
      const bLen=randInt(3,aLen); b=randInt(Math.pow(10,bLen-1), Math.min(a-1,Math.pow(10,bLen)-1));
    }
    if(b>=a) continue;
    if(!needsBorrow(a,b)) continue;
    const hasZero=String(a).includes('0');
    if(wantZero && !hasZero) continue;
    if(!wantZero && hasZero && attempt<150) continue;
    return { prompt:`${formatGrouped(a)} − ${formatGrouped(b)} = ?`, answer:String(a-b),
      explanation:`${formatGrouped(a)} − ${formatGrouped(b)} = ${formatGrouped(a-b)}` };
  }
  const a=randInt(1000,9999), b=randInt(100,999);
  return { prompt:`${formatGrouped(a)} − ${formatGrouped(b)} = ?`, answer:String(a-b),
    explanation:`${formatGrouped(a)} − ${formatGrouped(b)} = ${formatGrouped(a-b)}` };
}

// ---------- Q8 MULTIPLICATION (+ powers-of-ten rotation) ----------
function genPowersOfTen(diff, op){
  const mult = op==='mult';
  let base;
  if(diff==='easy') base=randInt(2,99);
  else if(diff==='medium'){
    // Division by 1000 must still give a whole number at Medium — decimals are
    // explicitly the Hard band — so the base is always a multiple of 1000.
    base = mult ? pick([randInt(1,9)*100, randInt(1,9)*1000, randInt(11,99)*100])
                : randInt(1,9)*1000 + randInt(0,9)*1000;
    if(!mult && base%1000!==0) base = Math.max(1000, Math.round(base/1000)*1000);
  }
  else {
    // Hard is explicitly the decimal level, so guarantee a fractional part.
    base=pick([ randInt(1,9)+randInt(1,9)/10, randInt(1,99)/100, randInt(11,99)/10 ]);
    base=Math.round(base*100)/100;
    if(Number.isInteger(base)) base += randInt(1,9)/10;
    base=Math.round(base*100)/100;
  }
  const round2=(v)=> Math.round(v*1e6)/1e6;
  const factors=[10,100,1000];
  const parts=factors.map(f=>({
    f, prompt:`${base} ${mult?'×':'÷'} ${f}`,
    answer:String(round2(mult? base*f : base/f))
  }));
  return {
    prompt:`Work out all three.`,
    inputType:'parts',
    parts: parts.map(p=>({label:p.prompt})),
    answer:parts.map(p=>p.answer).join(','),
    explanation:parts.map(p=>`${p.prompt} = ${p.answer}`).join('; '),
    subskill:(mult?'mult':'div')+'_powers_of_ten'+(diff==='hard'?'_decimal':'')
  };
}

  {from:'L',to:'mL',k:1000,fam:'capacity'},{from:'mL',to:'L',k:1/1000,fam:'capacity'},
];
function genConversionV2(diff){
  const p=pick(METRIC_PAIRS);
  let val;
  if(diff==='easy'){
    val = p.k>=1 ? randInt(2,9) : randInt(2,9)*Math.round(1/p.k);
  } else if(diff==='medium'){
    val = p.k>=1 ? (randInt(11,99)/10) : randInt(2,9)*Math.round(1/p.k)+Math.round(1/p.k)/2;
  } else {
    val = p.k>=1 ? (randInt(105,995)/100) : randInt(15,995)*(1/Math.max(1,Math.round(1/p.k)))*Math.round(1/p.k)/100;
  }
  val = Math.round(val*1000)/1000;
  // Rounding the ANSWER to 3dp was wrong: 4.66 mL = 0.00466 L, which got
  // truncated to 0.005 and marked a correct student answer as wrong. Metric
  // conversions are exact powers of ten, so the answer is computed exactly and
  // only cleaned of binary floating-point noise (0.1*3 = 0.30000000000000004).
  const exact = (v)=>{
    const r = Number(v.toPrecision(12));
    return Number(r.toFixed(10).replace(/0+$/,'').replace(/\.$/,''));
  };
  let ans = exact(val * p.k);
  // A conversion whose answer needs more than 5 decimal places is not a Year 4
  // question — regenerate rather than ask a child for 0.0000466.
  if(Math.abs(ans) < 0.0001 && ans !== 0) return genConversionV2(diff);
  return {
    prompt:`Complete the conversion: ${val} ${p.from} = ___ ${p.to}`,
    answer:String(ans),
    explanation:`${val} ${p.from} = ${ans} ${p.to}`,
    subskill:`${p.from}_to_${p.to}`
  };
}

// ---------- Q20 FRACTION OF A COLLECTION ----------
function genFractionOf(diff, _strategy, year){
  if(+year===3){
    // A unit fraction of a small collection, and always a whole-number answer.
    const den = diff==='easy' ? pick([2,4]) : pick([2,3,4,5]);
    const q = diff==='easy' ? pick([2,3,4,5]) : randInt(2,10);
    const total = den*q;
    return { prompt:`What is`, fracOfLead:true, answer:String(q),
      fracNum:1, fracDen:den, ofTotal:total,
      explanation:`${total} ÷ ${den} = ${q}` };
  }
  return genFractionOfY4(diff);
}
function genFractionOfY4(diff){
  if(diff==='easy'){
    const den=pick([2,3,4]); const q=pick([4,5,6,7,8,10]);
    const total=den*q;
    return { prompt:`What is`, fracOfLead:true, answer:String(q),
      fracNum:1, fracDen:den, ofTotal:total,
      explanation:`${total} ÷ ${den} = ${q}` };
  }
  if(diff==='medium'){
    const den=pick([2,3,4,5,6,8,10]); const q=randInt(3,9);
    const total=den*q;
    return { prompt:`What is`, fracOfLead:true, answer:String(q),
      fracNum:1, fracDen:den, ofTotal:total,
      explanation:`${total} ÷ ${den} = ${q}` };
  }
  // Hard: larger collections and bigger numerators, so the two steps (divide,
  // then multiply) both involve real work.
  const den=pick([3,4,5,6,7,8,9,10,12]);
  const gcd=(a,b)=>b?gcd(b,a%b):a;
  const cands=[]; for(let n=2;n<den;n++) if(gcd(n,den)===1) cands.push(n);
  if(!cands.length) return genFractionOf(diff);
  const num=pick(cands); const q=randInt(6,15);
  const total=den*q;
  return { prompt:`What is`, fracOfLead:true, answer:String(num*q),
    fracNum:num, fracDen:den, ofTotal:total,
    explanation:`${total} ÷ ${den} = ${q}, then ${q} × ${num} = ${num*q}` };
}

// ---------- Q21 MISSING NUMBER EQUATIONS ----------
function genMissingNumber(diff, _strategy, year){
  // Year 3 solves a single-operation equation. The two-operation Hard variant is Year 4.
  if(+year===3) return genMissingNumberY4(diff==='hard' ? 'medium' : 'easy');
  return genMissingNumberY4(diff);
}
function genMissingNumberY4(diff){
  const op=pick(['+','-','×','÷']);
  if(diff!=='hard'){
    const big = diff==='medium';
    let a,b,res,prompt,answer;
    if(op==='+'){
      a = big?randInt(120,899):randInt(2,20); b = big?randInt(120,899):randInt(2,20);
      res=a+b;
      if(Math.random()<0.5){ prompt=`___ + ${formatGrouped(b)} = ${formatGrouped(res)}`; answer=a; }
      else { prompt=`${formatGrouped(a)} + ___ = ${formatGrouped(res)}`; answer=b; }
    } else if(op==='-'){
      a = big?randInt(300,999):randInt(10,30); b = big?randInt(50,a-1):randInt(2,a-1);
      res=a-b;
      if(Math.random()<0.5){ prompt=`${formatGrouped(a)} − ___ = ${formatGrouped(res)}`; answer=b; }
      else { prompt=`___ − ${formatGrouped(b)} = ${formatGrouped(res)}`; answer=a; }
    } else if(op==='×'){
      a=randInt(2,12); b=randInt(2,12); res=a*b;
      if(Math.random()<0.5){ prompt=`${a} × ___ = ${res}`; answer=b; }
      else { prompt=`___ × ${b} = ${res}`; answer=a; }
    } else {
      b=randInt(2,12); const q=randInt(2,12); a=b*q;
      if(Math.random()<0.5){ prompt=`${a} ÷ ___ = ${q}`; answer=b; }
      else { prompt=`___ ÷ ${b} = ${q}`; answer=a; }
    }
    return { prompt, answer:String(answer), explanation:`The missing number is ${formatGrouped(answer)}.` };
  }
  // hard: two-step — one side carries an extra calculation
  const rhsOp=pick(['-','×','÷']);
  let rhs, rhsText;
  if(rhsOp==='-'){ const x=randInt(60,200), y=randInt(10,x-10); rhs=x-y; rhsText=`${x} − ${y}`; }
  else if(rhsOp==='×'){ const x=randInt(3,12), y=randInt(3,12); rhs=x*y; rhsText=`${x} × ${y}`; }
  else { const y=randInt(2,12), q=randInt(2,12); rhs=q; rhsText=`${y*q} ÷ ${y}`; }
  // The two sides must use DIFFERENT operations, otherwise "8 × ? = 10 × 8" is a
  // spot-the-pattern exercise rather than two-step reasoning.
  const lhsOp=pick(['+','-','×','÷'].filter(o=>o!==rhsOp));
  let prompt, answer;
  if(lhsOp==='×'){
    const f=pick([2,3,4,5,6,8].filter(n=>rhs%n===0));
    if(!f) return genMissingNumber(diff);
    prompt=`${f} × ___ = ${rhsText}`; answer=rhs/f;
  } else if(lhsOp==='÷'){
    const f=pick([2,3,4,5,6].filter(n=>rhs*n<=999));
    if(!f) return genMissingNumber(diff);
    prompt=`${rhs*f} ÷ ___ = ${rhsText}`; answer=f;
  } else if(lhsOp==='+'){
    const a=randInt(5,Math.max(6,rhs-1)); prompt=`___ + ${a} = ${rhsText}`; answer=rhs-a;
  } else {
    const a=randInt(5,60); prompt=`${rhs+a} − ___ = ${rhsText}`; answer=a;
  }
  if(answer==null || answer<0 || !Number.isInteger(answer)) return genMissingNumber(diff);
  return { prompt, answer:String(answer), explanation:`${rhsText} = ${rhs}, so the missing number is ${answer}.` };
}



// ---------- Q10 COMPARING FRACTIONS ----------
// Two real fractions compared against each other. 1/2 is only ever one of the
// pair by chance, never the fixed benchmark it used to be.
function genCompareFractions(diff){
  const mk=(n,d)=>({n,d,v:n/d});
  let a,b;
  if(diff==='easy'){
    const pool=[[1,2],[1,3],[2,3],[1,4],[3,4],[1,5],[2,5],[4,5],[1,10]];
    const p1=pick(pool); let p2=pick(pool);
    let g=0; while(p2[0]===p1[0] && p2[1]===p1[1] && g++<20) p2=pick(pool);
    a=mk(p1[0],p1[1]); b=mk(p2[0],p2[1]);
  } else if(diff==='medium'){
    const dens=[3,4,5,6,8,10];
    const d1=pick(dens); let d2=pick(dens.filter(x=>x!==d1));
    a=mk(randInt(1,d1-1),d1); b=mk(randInt(1,d2-1),d2);
  } else {
    // Equivalent or near-equivalent pairs: 3/6 vs 4/8, 14/20 vs 8/10, 6/10 vs 3/5
    if(Math.random()<0.45){
      const n=randInt(1,4), d=randInt(n+1,6), k1=randInt(2,4), k2=randInt(2,4);
      a=mk(n*k1,d*k1); b=mk(n*k2,d*k2);
      if(a.n===b.n && a.d===b.d) b=mk(n*(k2+1), d*(k2+1));
    } else {
      const d1=pick([6,8,9,10,12,20]), d2=pick([5,6,8,10,12,20]);
      a=mk(randInt(1,d1-1),d1); b=mk(randInt(1,d2-1),d2);
    }
  }
  const ans = Math.abs(a.v-b.v)<1e-9 ? 'equal to' : (a.v<b.v ? 'less than' : 'more than');
  return {
    prompt:`Choose the correct sign:`, compareLead:true,
    leftNum:a.n, leftDen:a.d, rightNum:b.n, rightDen:b.d,
    inputType:'choice',
    // Symbol on the button, words underneath — the pairing is what teaches
    // students which sign means what.
    choices:['less than','equal to','more than'],
    choiceSymbols:{'less than':'<','equal to':'=','more than':'>'},
    answer:ans,
    explanation:`${a.n}/${a.d} = ${(a.v).toFixed(3)} and ${b.n}/${b.d} = ${(b.v).toFixed(3)}, so ${a.n}/${a.d} is ${ans} ${b.n}/${b.d}.`,
    subskill: a.d===b.d ? 'same_denominator' : (Math.abs(a.v-b.v)<1e-9 ? 'equivalent' : 'different_denominator')
  };
}

// ---------- Q12 FRACTIONS <-> DECIMALS ----------
function genFracDec(diff){
  const toDecimal = Math.random()<0.5;
  let num, den, dec;

    const pool=[[1,2,0.5],[1,4,0.25],[3,4,0.75],[1,10,0.1],[3,10,0.3],[7,10,0.7],[1,5,0.2],[2,5,0.4]];
    const p=pick(pool); num=p[0]; den=p[1]; dec=p[2];

    else { den=1000; num=randInt(101,999); dec=num/1000; }

  if(toDecimal){
    return {
      prompt:`Write this fraction as a decimal.`,
      showFracNum:num, showFracDen:den,
