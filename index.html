// ---------- Clear weekly results for a class ----------
// Deliberately narrow: it removes ONLY `results` (the weekly sets) and the
// in-progress `weekProgress` saves for students in one class. Times-table
// attempts are never touched. Students earn ranks and unlocks from those, and
// wiping them would take away something they worked for. Self-directed skill
// practice is also left alone; it's their own work, not a stale set.
async function clearWeeklyResultsForClass(classId, btnEl){
  const cls = (S.classes||[]).find(c=>c.id===classId);
  const name = cls ? cls.name : 'this class';
  const uids = Object.keys(S.profiles||{}).filter(u=>{
    const p=S.profiles[u]; return p && p.username && p.classId===classId;
  });
  const doomed = (S.results||[]).filter(r=>uids.indexOf(r.uid)!==-1);
  // Targeted skill-practice sessions feed the SAME dashboard as the weekly sets,
  // so leaving them behind produced a confusing half-cleared state: the gradebook
  // was empty while the student still saw strengths and weaknesses.
  const doomedPractice = (S.allSkillPracticeRecords||[]).filter(r=>uids.indexOf(r.uid)!==-1);
  if(!doomed.length && !doomedPractice.length){ S.toast=`Nothing to clear for ${name}.`; render(); return; }
  const typed = prompt(
    `This permanently deletes skills data for ${uids.length} student${uids.length===1?'':'s'} in ${name}:\n\n`+
    `  • ${doomed.length} weekly set result${doomed.length===1?'':'s'}\n`+
    `  • ${doomedPractice.length} targeted practice session${doomedPractice.length===1?'':'s'}\n\n`+
    `Their dashboards will be empty afterwards.\n\n`+
    `Times-table attempts, ranks and unlocks are NOT affected.\n\n`+
    `This cannot be undone. Type CLEAR to confirm.`);
  if(typed!=='CLEAR'){ S.toast='Nothing was cleared.'; render(); return; }
  if(btnEl){ btnEl.disabled=true; btnEl.textContent='Clearing…'; }
  let done=0, failed=0;
  for(const r of doomed){
    try{ await deleteDoc(doc(db,'results',r.id)); done++; }
    catch(e){ failed++; }
  }
  for(const r of doomedPractice){
    try{ await deleteDoc(doc(db,'skillPractice',r.id)); done++; }
    catch(e){ failed++; }
  }
  // Half-finished attempts at now-deleted sets would otherwise linger.
  for(const u of uids){
    for(const w of (S.weeks||[])){
      try{ await deleteDoc(doc(db,'weekProgress', `${u}_${w.id}`)); }catch(e){}
    }
  }
  S.toast = failed
    ? `Cleared ${done} results, ${failed} could not be removed. Try again.`
    : `Cleared ${done} skills records for ${name}. Fast facts, ranks and unlocks untouched.`;
  if(btnEl){ btnEl.disabled=false; btnEl.textContent='Clear weekly results'; }
  render();
}

    // own class. Usernames must be unique across every teacher's class too, and we
    // can't read other teachers' students (by design), so real collisions are caught
    // by Firebase itself and retried below with an incremented suffix.
    const taken=new Set(Object.values(S.profiles).map(p=>String(p.username||'').toLowerCase()).filter(Boolean));
    S.bulkCreating=true; S.bulkResults=[]; S.bulkProgress=`0/${lines.length}`; render();
    // Resolved ONCE, before the loop, and never allowed to be null. This used to read
    // S.currentClassId inside the loop, so creating a class and adding students in one go
    // raced the classes listener: newClassId came out null and every student was created
    // belonging to NO class. They existed, the class looked empty, and a printed sheet
    // came out blank.
    const targetClassId = S.bulkTargetClassId
      || (S.showAllClasses ? (S.classes[0] && S.classes[0].id) : S.currentClassId)
      || ((S.classes||[])[0] && S.classes[0].id) || null;
    if(!targetClassId){
      S.authError='Make a class first, then add students to it.';
      S.bulkBusy=false; render(); return;
    }
    const targetClass=(S.classes||[]).find(c=>c.id===targetClassId);
    S.bulkResultClassId=targetClassId;
    for(let i=0;i<lines.length;i++){
      // The names the teacher REVIEWED, not the raw paste. Falls back to the parser for
      // anything not on screen, so it can never create a blank-named account.
      const fullName=((S.bulkFinalNames||[])[i]||'').trim() || normaliseStudentName(lines[i], S.bulkSwapNames);
      const parts=fullName.split(/\s+/); const first=parts[0]; const last=parts.slice(1).join(' ');
      const newClassId = targetClassId;
      let attempt=0, done=false, lastErr=null;
      while(!done && attempt<25){
        attempt++;
        const username=genUsername(first,last,taken); const password=genPassword();
        const email=usernameToEmail(username);
        try{
          const cred=await createUserWithEmailAndPassword(auth,email,password);
          await updateProfile(cred.user,{displayName:fullName});
          await setDoc(doc(db,'profiles',cred.user.uid),{displayName:fullName, username, email, createdByTeacher:true, teacherUid:S.user.uid, currentPassword:password, classId: newClassId, yearLevel: classYear(targetClass), group: S.bulkGroup||'mainstream'});
          await signInWithEmailAndPassword(auth,teacherEmail,teacherPass);
          S.bulkResults.push({name:fullName, username, password, status:'ok'});
          done=true;
        }catch(e){
          lastErr=e;
          if(e.code==='auth/email-already-in-use'){ continue; } // taken set already advanced; retry with next suffix
          S.bulkResults.push({name:fullName, username, password:null, status:'error', error:friendlyAuthError(e.code)});
          try{ await signInWithEmailAndPassword(auth,teacherEmail,teacherPass); }catch(e2){}
          done=true;
        }
      }
      if(!done && lastErr){
        S.bulkResults.push({name:fullName, username:'-', password:null, status:'error', error:'Could not find a free username. Try again.'});
      }
      S.bulkProgress=`${i+1}/${lines.length}`; render();
    }
    S.bulkCreating=false;
    S.bulkTargetClassId=null;
    await handleAuthChange(auth.currentUser);
    render();
  };
  if(sview==='add') wrap.appendChild(form);

  if(sview!=='list') return wrap;

  const existing = Object.entries(S.profiles).filter(([uid,p])=>p.username && (S.showAllClasses || !p.classId || p.classId===S.currentClassId));
  if(existing.length){
    const pickerRow=el('<div class="mmc-row" style="justify-content:flex-end;margin-bottom:10px;"></div>');
    // Sits directly above the roster it filters. In the tab bar it read as a
    // page-level control and wasn't obviously connected to the list below.
    pickerRow.appendChild(renderClassPicker());
    wrap.appendChild(pickerRow);
    const list=el('<div class="mmc-card"><h3>Student Management</h3><div class="meta">Passwords shown below reflect whatever is currently set. Use "Reset Password" to issue a new one if needed.</div></div>');
    const withPasswords = existing.filter(([uid,p])=>p.currentPassword).map(([uid,p])=>({name:p.displayName, username:p.username, password:p.currentPassword, status:'ok'}));
    const missingCount = existing.length - withPasswords.length;
    const downloadRow=el(`<div class="mmc-row" style="margin-top:10px;">
      <button class="mmc-btn gold sm" id="mmc-manage-csv">Download logins CSV</button>
      <button class="mmc-btn gold sm" id="mmc-manage-pdf">Download Login Cards PDF</button>
      ${missingCount>0 ? `<span class="meta" style="align-self:center;">${missingCount} student${missingCount===1?'':'s'} with no password set yet won't be included. Reset their password first.</span>` : ''}
    </div>`);
    downloadRow.querySelector('#mmc-manage-csv').onclick=()=>downloadLoginsCSV(withPasswords,'student-logins.csv');
    downloadRow.querySelector('#mmc-manage-pdf').onclick=()=>{
      if(!withPasswords.length){ S.toast='No students with a set password yet.'; render(); return; }
      generateLoginCardsPDF(withPasswords, 'mmc-manage-pdf', 'Download Login Cards PDF');
    };
    list.appendChild(downloadRow);
    list.appendChild(el(`<div class="mmc-stu-head">
      <span>Student</span>
      <span>Username</span>
      <span>Password</span>
      <span>${S.classes.length>1?'Class':''}</span>
      <span>Group</span>
      <span></span>
    </div>`));
    // A class is one year level, so a profile year that disagrees with its class is stale
    // data rather than a choice. It can only happen to students set up before this rule,
    // so offer to put it right instead of silently serving them the wrong year's work.
    const mismatched = existing.filter(([uid,p])=>{
      const c=(S.classes||[]).find(x=>x.id===p.classId);
      return c && studentYear(p)!==classYear(c);
    });
    if(mismatched.length){
      const warn=el(`<div class="mmc-card" style="border-color:var(--incorrect);margin-bottom:12px;">
        <h3 style="margin:0 0 4px;">${mismatched.length} student${mismatched.length===1?'':'s'} on the wrong year</h3>
        <div class="meta">A class is one year level, but ${mismatched.length===1?'this student is':'these students are'} set to something else: ${esc(mismatched.map(([u,p])=>p.displayName).join(', '))}. They will get the wrong year's questions until this is fixed.</div>
      </div>`);
      const fix=el('<button class="mmc-btn gold sm" style="margin-top:8px;">Match them to their class</button>');
      fix.onclick=async ()=>{
        fix.disabled=true; fix.textContent='Fixing…';
        for(const [uid,p] of mismatched){
          const c=(S.classes||[]).find(x=>x.id===p.classId);
          try{ await updateDoc(doc(db,'profiles',uid), {yearLevel:classYear(c)}); }catch(e){}
        }
        S.toast='Year levels matched to their classes.'; render();
      };
      warn.appendChild(fix);
      list.appendChild(warn);
    }
    const ul=el('<div></div>');
    existing.sort((a,b)=>(a[1].displayName||'').localeCompare(b[1].displayName||'')).forEach(([uid,p])=>{
      const row=el(`<div class="mmc-stu">
        <div class="mmc-stu-name">${esc(p.displayName)}</div>
        <code class="mmc-stu-user">${esc(p.username)}</code>
        <code class="mmc-stu-pass${p.currentPassword?'':' none'}">${p.currentPassword ? esc(p.currentPassword) : 'not set'}</code>
        ${S.classes.length>1 ? `<select data-act="class">
          ${S.classes.map(c=>`<option value="${c.id}" ${p.classId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}
        </select>` : '<span></span>'}
        <select data-act="group">
          <option value="">Unassigned</option>
          ${STUDENT_GROUPS.map(g=>`<option value="${g.key}" ${p.group===g.key?'selected':''}>${esc(g.label)}</option>`).join('')}
        </select>
        <div class="mmc-stu-actions">
          <button class="mmc-btn ghost sm" data-act="more" title="More options">⋯</button>
        </div>
        ${S.stuExpandedUid===uid ? `<div class="mmc-stu-more">
          <span class="mmc-stu-morelabel">Pin rank</span>
          <select data-act="rank" title="Pin a rank for a student working hard without the numbers moving. A pinned rank can only lift, never demote.">
            <option value="">Earned</option>
            <option value="upandcomer" ${p.rankOverride==='upandcomer'?'selected':''}>Up and Comer</option>

          </select>
          <button class="mmc-btn ghost sm" data-act="preview">Student view</button>
          <button class="mmc-btn ghost sm" data-act="reset">Reset password</button>
          <button class="mmc-btn danger sm" data-act="delete">Delete student</button>
        </div>` : ''}
      </div>`);
      row.querySelector('[data-act="more"]').onclick=()=>{
        S.stuExpandedUid = (S.stuExpandedUid===uid ? null : uid); render();
      };
      // Everything below the ⋯ toggle only exists while that row is expanded, so every
      // lookup has to tolerate null. Without this, each collapsed row throws on render
      // and the whole Students tab goes blank.
      const previewBtn=row.querySelector('[data-act="preview"]');
      if(previewBtn) previewBtn.onclick=()=>startStudentPreview(uid);
      const rankSel=row.querySelector('[data-act="rank"]');
      if(rankSel) rankSel.onchange=async (e)=>{
        const v=e.target.value||null;
        try{ await updateDoc(doc(db,'profiles',uid), {rankOverride:v});
          S.toast = v ? `${p.displayName} is pinned at ${v==='expert'?'Expert':'Up and Comer'}.`
                      : `${p.displayName} is back to their earned rank.`;
        }catch(err){ S.toast='Could not update. Check your connection.'; }
        render();
      };
      const classSel=row.querySelector('[data-act="class"]');
      if(classSel) classSel.onchange=async (e)=>{
        // Moving class moves year. A class is one year level, so a student in it is that
        // year by definition. Leaving the old year behind would recreate exactly the
        // mismatch this design removes.
        const newClass=(S.classes||[]).find(c=>c.id===e.target.value);
        const newYear=classYear(newClass);
        try{ await updateDoc(doc(db,'profiles',uid), {classId:e.target.value, yearLevel:newYear}); }
        catch(err){ S.toast='Could not move student. Check your connection.'; render(); }
      };
      const groupSel=row.querySelector('[data-act="group"]');
      if(groupSel) groupSel.onchange=async (e)=>{
        const val=e.target.value||null;
        try{ await updateDoc(doc(db,'profiles',uid), {group:val}); }
        catch(err){ S.toast='Could not update group. Check your connection.'; render(); }
      };
      const resetBtn=row.querySelector('[data-act="reset"]');
      if(resetBtn) resetBtn.onclick=()=>resetStudentPassword(uid, p.displayName, resetBtn);
      const delBtn=row.querySelector('[data-act="delete"]');
      if(delBtn) delBtn.onclick=()=>deleteStudentAccount(uid, p.displayName, delBtn);
      ul.appendChild(row);
    });
    list.appendChild(ul);
    wrap.appendChild(list);
  }
  return wrap;
}

function renderStudent(){
  if(S.activeWeekId){ const week=S.weeks.find(w=>w.id===S.activeWeekId); if(week) return renderQuizTaking(week); S.activeWeekId=null; }
  if(S.skillSession) return renderSkillPracticeSession();
  if(S.tt && S.tt.active) return renderTTChallenge();
  syncMyLiveSession();
  if(S.myLive && S.myLive.answering) return renderMyLiveSession();
  const wrap=el('<div></div>');
  const lockW = priorityWeekForMe();
  const tabs=el(`<div class="mmc-tabs"><button class="mmc-tab" data-st="dashboard">My Dashboard</button><button class="mmc-tab" data-st="weekly">Skills Practice${lockW?' ⭐':''}</button><button class="mmc-tab" data-st="timetable">Fast Facts Training Ground${lockW?' 🔒':''}</button><button class="mmc-tab" data-st="live">🐎 Racing Ground${lockW?' 🔒':''}</button><button class="mmc-tab" data-st="settings">⚙️ Settings</button></div>`);
  tabs.querySelectorAll('.mmc-tab').forEach(b=>{ if(b.dataset.st===S.studentTab) b.classList.add('active');
    b.onclick=()=>{ S.studentTab=b.dataset.st; render(); }; });
  wrap.appendChild(tabs);
  // Blocked, with the reason and a way straight to it. A locked door with no explanation
  // is the fastest way to make a child give up on the whole app.
  const blocked = priorityBlocked(S.studentTab);
  if(blocked){
    const card=el(`<div class="mmc-card" style="text-align:center;">
      <div style="font-size:34px;">⭐</div>
      <h3>Finish ${esc(blocked.label)} first</h3>

    </div>`);
    const go=el('<button class="mmc-btn gold" style="width:100%;font-size:16px;padding:12px;margin-top:6px;">Go to it now</button>');
    go.onclick=()=>{ S.studentTab='weekly'; render(); };
    card.appendChild(go);
    wrap.appendChild(card);
    return wrap;
  }

    S.studentTab==='dashboard' ? renderStudentDashboard() :

    S.studentTab==='timetable' ? renderTimetableTab() :
    S.studentTab==='live' ? renderStudentLiveGame() : renderSettingsTab()
  );
  return wrap;
}

function initQuizState(week){
  S.activeWeekId=week.id; S.quiz={};
  // Hidden questions never enter the student's quiz state, so they can't be
  // rendered, answered, or counted in the total.
  visibleQuestions(week).forEach(q=> S.quiz[q.id]= q.inputType==='order'
    ? {given:'', pool:shuffleArr(q.items||[]), placed:[], checked:false, correct:false}
    : q.inputType==='classify'
    ? {given:new Array((q.items||[]).length).fill(''), checked:false, correct:false}
    : q.inputType==='parts'
    ? {given:new Array((q.parts||[]).length).fill(''), checked:false, correct:false}
    : q.inputType==='mixed'
    ? {given:{whole:'',num:'',den:''}, checked:false, correct:false}
    : q.inputType==='multi'
    ? {given:[], checked:false, correct:false}
    : {given: q.inputType==='coins' ? [] : '', checked:false, correct:false});
}
function progressMatchesWeek(progress, week){
  if(!progress || !progress.quiz) return false;
  // Compared against the VISIBLE set. If a teacher hides a question after a
  // student has started, the saved progress no longer matches and is discarded
  // rather than leaving a half-answered question they can no longer see.
  return visibleQuestions(week).every(q => progress.quiz[q.id] !== undefined);
}
async function saveWeekProgress(week){
  if(!S.user) return;
  try{
    await setDoc(doc(db,'weekProgress', `${S.user.uid}_${week.id}`), {
      uid:S.user.uid, weekId:week.id, teacherUid: stampTeacherUid(),
      quiz:S.quiz, updatedAt:serverTimestamp()
    });
  }catch(e){ /* auto-save is best-effort. Don't interrupt the student over it */ }
}
async function deleteWeekProgress(weekId){
  if(!S.user) return;
  try{ await deleteDoc(doc(db,'weekProgress', `${S.user.uid}_${weekId}`)); }catch(e){}
}
function studentEffectiveGroup(){ return (S.profile && S.profile.group) || 'mainstream'; }
// What a set is, in one line: the year it was built for and its level, properly cased.
// "hard" in lower case reads like a typo, and the year was missing entirely, so an
// archived set gave no clue which class it belonged to.
// A practice set's level, in the language teachers already use for their groups. The
// STORED value stays easy/medium/hard: every existing set carries it, every generator
// switches on it, and renaming the data would break both for no gain. This is the label
// only, which means no migration and nothing to go wrong.
//
// Deliberately NOT applied to the Fast Facts Training Ground. There a child picks their
// own level, and offering a nine-year-old a button marked "Support" is a different and
// much worse thing than offering one marked "Easy".
const SET_LEVEL_LABEL = { easy:'Support', medium:'Mainstream', hard:'Extension' };
function difficultyLabel(d){
  const x=String(d||'').toLowerCase();
  if(SET_LEVEL_LABEL[x]) return SET_LEVEL_LABEL[x];
  return x ? x.charAt(0).toUpperCase()+x.slice(1) : '';
}
function weekClassification(week){
  const ys = (Array.isArray(week.targetYears) && week.targetYears.length) ? week.targetYears
    : (week.yearLevel!==null && week.yearLevel!==undefined && week.yearLevel!=='' ? [+week.yearLevel] : []);
  const y = ys.length ? ys.map(v=>yearLabel(v)).join(', ') : '';
  return [y, difficultyLabel(week.difficulty)].filter(Boolean).join(' · ');
}

// ---------- "Finish this first" ----------
// A set can be marked as the one thing that must be done before Fast Facts or the Racing
// Ground. Four things make it safe rather than a trap:
//   1. It only ever applies to a student the set was actually AIMED AT. A child outside
//      the audience can never complete it, so they must never be held by it.
//   2. It expires on its own after PRIORITY_MAX_DAYS. A teacher who forgets does not leave
//      a class locked out at home indefinitely.
//   3. A teacher's live class race always overrides it. Being unable to join the race your
//      own teacher just started would be maddening mid-lesson.
//   4. Only one set at a time, so two cannot deadlock each other.
const PRIORITY_MAX_DAYS = 7;
function priorityWeekForMe(){
  if(S.isTeacher) return null;
  const now=Date.now();
  const w=(S.weeks||[]).filter(x=>x.priority && isWeekLive(x) && x.status!=='archived')
    .filter(x=>{
      const set=(x.priorityAt && x.priorityAt.seconds) ? x.priorityAt.seconds*1000 : 0;
      return !set || (now-set) < PRIORITY_MAX_DAYS*86400000;
    })
    .filter(x=>weekVisibleToMe(x))
    .sort((a,b)=>(b.priorityAt?.seconds||0)-(a.priorityAt?.seconds||0))[0];
  if(!w) return null;
  const done=(S.results||[]).some(r=>r.weekId===w.id && r.uid===S.user.uid);
  return done ? null : w;
}
// A live class race is the teacher explicitly wanting these children racing right now.
function priorityBlocked(tab){
  if(tab!=='timetable' && tab!=='live') return null;
  const w=priorityWeekForMe();
  if(!w) return null;
  if(tab==='live'){
    const classRace=(S.liveGames||[]).find(g=>!g.hostUid && (g.status==='lobby'||g.status==='active') && !isRaceOver(g));
    if(classRace) return null;
  }
  return w;
}
// Who a set is actually for. The same rule the student's own view uses, so a teacher's
// "still outstanding" count can never disagree with what children were given.
function weekAudienceUids(week, roster){
  return (roster||[]).filter(uid=>{
    const p=(S.profiles||{})[uid];
    if(!p || !p.username) return false;
    if(Array.isArray(week.classIds) && week.classIds.length && p.classId && week.classIds.indexOf(p.classId)===-1) return false;
    const wy = (Array.isArray(week.targetYears) && week.targetYears.length) ? week.targetYears
      : (week.yearLevel!==null && week.yearLevel!==undefined && week.yearLevel!=='' ? [+week.yearLevel] : null);
    if(wy && wy.indexOf(studentYear(p))===-1) return false;
    if(Array.isArray(week.targetGroups) && week.targetGroups.length
       && week.targetGroups.indexOf(p.group||'mainstream')===-1) return false;
    return true;
  });
}
function weekVisibleToMe(week){
  if(week.classIds && week.classIds.length>0 && S.profile && S.profile.classId && !week.classIds.includes(S.profile.classId)) return false;
  // A set belongs to exactly one year. Sets created before targetYears existed carry no
  // such field, and letting those through to everyone meant a Year 3 student could open a
  // 24-question Year 4 paper. Which is exactly what happened. Every set has always
  // recorded the yearLevel it was built for, so fall back to that. Only a set with
  // neither field is treated as year-agnostic.
  const setYears = (Array.isArray(week.targetYears) && week.targetYears.length)
    ? week.targetYears
    : (week.yearLevel!==null && week.yearLevel!==undefined && week.yearLevel!=='' ? [+week.yearLevel] : null);
  if(setYears && setYears.indexOf(studentYear(S.profile))===-1) return false;
  if(!week.targetGroups || week.targetGroups.length===0) return true;
  return week.targetGroups.includes(studentEffectiveGroup());
}
function renderWeeklyPassport(){
  const wrap=el('<div></div>');
  const myWeeks = S.weeks.filter(weekVisibleToMe);
  if(myWeeks.length===0){
    wrap.appendChild(el('<div class="mmc-empty">No quizzes published yet. Check back soon!</div>'));
    return wrap;
  }
  wrap.appendChild(el('<h3 style="font-family:Fredoka,sans-serif;margin:4px 0 12px;">Your maths passport</h3>'));
  myWeeks.slice().sort((a,b)=> (b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)).forEach(week=>{
    const rec = S.results.find(r=>r.weekId===week.id);
    const card=el(`
      <div class="mmc-card mmc-row" style="justify-content:space-between;">
        <div><h3>${esc(week.label)}</h3><div class="meta">${visibleQuestions(week).length} questions</div></div>
        <div></div>
      </div>
    `);
    const right=card.querySelector('div:last-child');
    if(rec){
      right.style.cssText='display:flex;flex-direction:column;align-items:flex-end;gap:8px;';
      right.innerHTML=stampHTML(rec.score, rec.total);
      const retakeBtn=el('<button class="mmc-btn ghost sm">↻ Retake</button>');
      retakeBtn.onclick=()=>{
        if(!confirm(`Retaking will replace your current score of ${rec.score}/${rec.total} for "${week.label}". Continue?`)) return;
        initQuizState(week); render();
      };
      right.appendChild(retakeBtn);
    } else {
      const progress = S.weekProgress.find(p=>p.weekId===week.id);
      if(progress && progressMatchesWeek(progress, week)){
        const answeredCount = visibleQuestions(week).filter(q=>progress.quiz[q.id] && progress.quiz[q.id].checked).length;
        right.style.cssText='display:flex;flex-direction:column;align-items:flex-end;gap:6px;';
        right.appendChild(el(`<div class="meta" style="margin:0;">${answeredCount}/${(week.questions||[]).length} answered so far</div>`));
        const continueBtn=el('<button class="mmc-btn gold">Continue ▶</button>');
        continueBtn.onclick=()=>{ S.activeWeekId=week.id; S.quiz=progress.quiz; render(); };
        right.appendChild(continueBtn);
      } else {
        if(progress) deleteWeekProgress(week.id); // stale (week was regenerated since). Clean it up
        const startBtn=el('<button class="mmc-btn gold">Start ▶</button>');
        startBtn.onclick=()=>{ initQuizState(week); render(); };
        right.appendChild(startBtn);
      }
    }
    wrap.appendChild(card);
  });
  return wrap;
}

function bestTTScore(level){
  const attempts=S.ttAttempts.filter(a=>a.level===level);
  if(attempts.length===0) return null;
  return attempts.reduce((best,a)=> a.score>best.score? a : best, attempts[0]);
}

    const b=el(`<button type="button" class="mmc-animalbtn"><span>${a.emoji}</span><small>${esc(a.label)}</small></button>`);
    b.onclick=()=>{
      if(!confirm(`Spend 1 gold coin to race as a ${a.label.toLowerCase()}? It only lasts this race.`)) return;
      spendCoinOnAnimal(room.id, a.key);
    };
    grid.appendChild(b);

}

// ---------- Renting a colour or a hat with coins ----------
// Five coins, any locked colour or hat, 24 hours. The nickname and the custom page colour
// stay earned-only: a name is identity rather than decoration, and both belong to Expert.
//
// Deliberately NOT a rank purchase. The gradebook shows rank as a fluency indicator, and a
// bought rank would make that column lie to the teacher. This buys the reward without
// touching the measure.
const RENT_COST = 5;
const RENT_HOURS = 24;
function rentedUntil(kind, key){
  const r = (S.profile && S.profile.rentals) || {};
  const at = r[`${kind}:${key}`];
  return (typeof at==='number' && at>Date.now()) ? at : 0;
}
function hasHorseOption(tier, kind, key){
  const owned = kind==='color' ? tier.colors.includes(key) : tier.hats.includes(key);
  return owned || !!rentedUntil(kind,key);
}
function rentHoursLeft(kind,key){
  const at=rentedUntil(kind,key);
  return at ? Math.max(1, Math.round((at-Date.now())/3600000)) : 0;
}
// What the horse should ACTUALLY wear right now. A rental expires while the item is still
// equipped, so without this a child keeps a gold horse forever after one 5-coin purchase.
// Checked at the moment a race record is written, so it is always current.
function equippedHorseColor(){
  const c=(S.profile && S.profile.horseColor) || 'default';
  if(c==='default') return c;
  try{
    const tier=computeBadgeInfo(S.ttAttempts, S.profile).tier;
    return hasHorseOption(tier,'color',c) ? c : 'default';
  }catch(e){ return c; }
}
function equippedHorseHat(){
  const h=(S.profile && S.profile.horseHat) || 'none';
  if(h==='none') return h;
  try{
    const tier=computeBadgeInfo(S.ttAttempts, S.profile).tier;
    return hasHorseOption(tier,'hat',h) ? h : 'none';
  }catch(e){ return h; }
}
async function rentHorseOption(kind, key, label){
  if(myCoins() < RENT_COST){
    S.toast=`You need ${RENT_COST} gold coins. Find them on golden questions in Fast Facts practice.`;
    render(); return;
  }
  if(!confirm(`Use ${RENT_COST} gold coins to unlock ${label} for ${RENT_HOURS} hours?`)) return;
  const rentals = Object.assign({}, (S.profile && S.profile.rentals) || {});
  rentals[`${kind}:${key}`] = Date.now() + RENT_HOURS*3600000;
  try{
    await updateDoc(doc(db,'profiles',S.user.uid), { rentals, coins: increment(-RENT_COST) });
    S.profile = Object.assign({}, S.profile, { rentals, coins: Math.max(0, myCoins()-RENT_COST) });
    S.toast = `${label} unlocked for ${RENT_HOURS} hours.`;
  }catch(e){ S.toast='Could not unlock that. Check your connection.'; }
  render();
}

// Thirty questions is a long sit for a five-year-old, and a child who abandons halfway
// records nothing at all. Scaled to the year, so a session is finishable.
const TT_PRACTICE_TOTAL = 30;
const TT_PRACTICE_BY_YEAR = { 0:10, 1:15, 2:20 };
function ttPracticeTotal(year){
  const y=+year;
  return TT_PRACTICE_BY_YEAR[y] || TT_PRACTICE_TOTAL;
}
// Five minutes is a long time to hold concentration at any primary age, and it made a
// Challenge something a class could not fit into the end of a lesson.
const TT_CHALLENGE_SECONDS = 180;
// The judgement, made visible. At most three, each with a one-tap drill that pre-fills
// the custom picker. The point is to close the loop between "you need this" and doing it,
// not to present a report.
function renderTTFocusCard(){
  const ins=computeTTInsights(S.ttAttempts||[]);
  const card=el('<div class="mmc-card" style="margin-top:16px;"></div>');
  card.appendChild(el('<div class="mmc-pick-title" style="font-size:clamp(20px,3.6vw,26px);margin-bottom:2px;">Suggested areas to improve</div>'));
  if(!ins.items.length){
    card.appendChild(el(`<div class="meta">${ins.hasData
      ? "Nothing standing out right now. Keep practising and this will tell you where to focus."
      : "Do a few challenges and this will tell you exactly which tables to work on."}</div>`));
    return card;
  }
  ins.items.forEach(it=>{
    const row=el('<div style="border-top:2px solid var(--paper-line);padding:10px 0;"></div>');
    if(it.kind==='turnaround'){
      row.appendChild(el(`<div style="font-weight:800;margin-bottom:3px;">Turnarounds: ${esc(it.weak)}</div>
        <div class="meta">You know ${esc(it.strong)} but ${esc(it.weak)} is catching you out. They have the same answer.</div>`));
      row.appendChild(suggestionGoRow({tables:[it.a,it.b],mult:true,div:false,family:'multdiv'}, 'mmc-op-mul'));
    } else {
      const isDiv = it.op==='div';
      const why = it.kind==='wrong'
        ? `Getting ${it.accuracy}% of these right so far.`
        : `You get these right, but they take about ${it.seconds}s. Around ${it.ratio}× longer than your other answers.`;
      const head = it.kind==='wrong' ? 'Needs work' : 'Nearly there';
      row.appendChild(el(`<div style="font-weight:800;margin-bottom:3px;">${head}: ${esc(ttGroupLabel(it.op,it.table))}</div>
        <div class="meta">${esc(why)}</div>`));
      const cfg={tables:[it.table],mult:!isDiv,div:isDiv,family:'multdiv'};
      row.appendChild(suggestionGoRow(cfg, isDiv?'mmc-op-div':'mmc-op-mul'));
    }
    card.appendChild(row);
  });
  return card;
}

// Pick-your-own drill. Chips rather than a multi-select, because a nine-year-old on a
// tablet can tap a chip and cannot easily ctrl-click a list.
// One question at a time. The old card put tables, operations and a Go button on screen
// together, which is a form rather than a choice, and it only ever offered times tables.
// A child now walks: what kind of maths, what to work on, which operations, how long.
// Built for a six-year-old on an iPad: one question per screen, buttons big enough for a
// small finger, and a title that looks like the rest of the Arena rather than a form.
// Which colour a chosen operation carries, so it follows the child through the walk.
const OP_TINT = { add:'mmc-op-add', sub:'mmc-op-sub', addsub:'mmc-op-both',
                  mul:'mmc-op-mul', div:'mmc-op-div', muldiv:'mmc-op-both' };
// Three steps, not four. Picking the operation and picking WHICH operations were two
// separate questions asking almost the same thing, so they are one screen now: the six
// buttons a child would actually think in. The colour of whatever they choose follows
// them through the rest of the walk.
const PICK_OPS = [
  { key:'add',    sym:'+',       label:'Adding',        family:'addsub', add:true,  sub:false },
  { key:'sub',    sym:'−',       label:'Taking away',   family:'addsub', add:false, sub:true  },
  { key:'mul',    sym:'×',       label:'Times',         family:'multdiv', mult:true, div:false },
  { key:'div',    sym:'÷',       label:'Divide',        family:'multdiv', mult:false, div:true },
  { key:'addsub', sym:'+ and −', label:'Both',          family:'addsub', add:true,  sub:true, wide:true },
  { key:'muldiv', sym:'× and ÷', label:'Both',          family:'multdiv', mult:true, div:true, wide:true },
];
// Both ways of practising a suggestion, side by side. A child who is told "the 7 times
// table is catching you out" should be one tap from doing something about it, and should
// get the same choice they get everywhere else.
function suggestionGoRow(cfg, tint){
  const row=el('<div class="mmc-pick-grid two" style="gap:10px;margin-top:10px;"></div>');
  const mk=(sym,label,sub,fn)=>{
    const b=el(`<button type="button" class="mmc-bigbtn tinted ${tint||'mmc-op-mul'}" style="min-height:64px;font-size:15px;">
      <span class="em" style="font-size:22px;">${sym}</span><span>${esc(label)}</span>
      ${sub?`<span class="sub">${esc(sub)}</span>`:''}</button>`);
    b.onclick=fn; return b;
  };
  row.appendChild(mk('🐢','In your own time', `${ttPracticeTotal(studentYear(S.profile))} questions`,
    ()=>{ S.ttCustom=Object.assign({},cfg); startTTPractice('custom', Object.assign({},cfg)); }));
  row.appendChild(mk('⏱','Speed challenge', `${Math.round(TT_CHALLENGE_SECONDS/60)} minutes`,
    ()=>{ S.ttCustom=Object.assign({},cfg); startTTChallenge('custom', Object.assign({},cfg)); }));
  return row;
}
function renderTTCustomCard(){
  const c=S.ttCustom;
  const tint = OP_TINT[c.op] || '';
  const card=el(`<div class="mmc-card mmc-pickcard ${tint} ${tint?'tinted':''}" style="margin-top:16px;"></div>`);
  const head=(step,total,title)=>{
    card.appendChild(el(`<div class="mmc-pick-step">Step ${step} of ${total}</div>`));
    card.appendChild(el(`<div class="mmc-pick-title">${esc(title)}</div>`));
  };
  const big=(sym,label,sub,on,onClick,cls)=>{
    const b=el(`<button type="button" class="mmc-bigbtn tinted ${cls||tint} ${on?'on':''}">
      ${sym?`<span class="em">${sym}</span>`:''}
      ${label?`<span>${label}</span>`:''}
      ${sub?`<span class="sub">${esc(sub)}</span>`:''}
    </button>`);
    b.onclick=onClick; return b;
  };
  const grid=(cls)=>el(`<div class="mmc-pick-grid ${cls||''}"></div>`);
  const back=(fn,label)=>{
    const b=el(`<button type="button" class="mmc-pick-back">← ${esc(label||'Back')}</button>`);
    b.onclick=fn; return b;
  };

  // ---- 1. which operation ----
  if(!c.op){
    head(1,3,'What do you want to practise?');
    const g=grid();
    PICK_OPS.filter(o=>!o.wide).forEach(o=>g.appendChild(
      big(o.sym, o.label, null, false, ()=>{ Object.assign(c,o,{op:o.key, focus:null, tables:[], step2done:false}); render(); },
        OP_TINT[o.key])));
    card.appendChild(g);
    const g2=grid('two');
    PICK_OPS.filter(o=>o.wide).forEach(o=>g2.appendChild(
      big(o.sym, null, null, false, ()=>{ Object.assign(c,o,{op:o.key, focus:null, tables:[], step2done:false}); render(); },
        OP_TINT[o.key])));
    card.appendChild(g2);
    return card;
  }

  const isAdd = c.family==='addsub';

  // ---- 2. what exactly ----
  if(isAdd ? !c.focus : !c.step2done){
    head(2,3, isAdd ? 'Which one?' : 'Which tables?');
    const g=grid(isAdd?'':'tables');
    if(isAdd){
      ADDSUB_FOCUS.forEach(f=>g.appendChild(big(null, esc(f.label), f.hint, false,
        ()=>{ c.focus=f.key; render(); })));
    } else {
      TT_CUSTOM_TABLES.forEach(n=>g.appendChild(big(`${n}×`, null, null,
        (c.tables||[]).indexOf(n)!==-1, ()=>{
          c.tables=c.tables||[];
          const i2=c.tables.indexOf(n);
          if(i2===-1) c.tables.push(n); else c.tables.splice(i2,1);
          render();
        })));
    }
    card.appendChild(g);
    if(!isAdd){
      const n=(c.tables||[]).length;
      const go=el(`<button type="button" class="mmc-bigbtn tinted ${tint}" style="width:100%;margin-top:14px;${n?'':'opacity:.45;'}" ${n?'':'disabled'}>${n?'Next →':'Pick at least one'}</button>`);
      go.onclick=()=>{ if((c.tables||[]).length){ c.step2done=true; render(); } };
      card.appendChild(go);
    }
    card.appendChild(back(()=>{ S.ttCustom={tables:[],mult:true,div:false}; render(); }));
    return card;
  }

  // ---- 3. how ----
  head(3,3,'Ready?');
  card.appendChild(el(`<div class="meta" style="text-align:center;margin:-8px 0 14px;font-weight:700;color:var(--ink);">${esc(ttCustomLabel(c))}</div>`));
  const nQ=ttPracticeTotal(studentYear(S.profile));
  const g=grid('two');
  g.appendChild(big('🐢', 'In your own time', `${nQ} questions`, false, ()=>startTTPractice('custom', {...c})));
  g.appendChild(big('⏱', 'Speed challenge', `${Math.round(TT_CHALLENGE_SECONDS/60)} minutes`, true, ()=>startTTChallenge('custom', {...c})));
  card.appendChild(g);
  card.appendChild(back(()=>{ if(isAdd) c.focus=null; else { c.tables=[]; c.step2done=false; } render(); }));
  const again=el('<button type="button" class="mmc-pick-back" style="margin-top:2px;">Start again</button>');
  again.onclick=()=>{ S.ttCustom={tables:[],mult:true,div:false}; render(); };
  card.appendChild(again);
  return card;
}

function startTTChallenge(level, custom){
  S.tt = { mode:'challenge', active:true, finished:false, level, custom:custom||null, year:studentYear(S.profile), timeLeft:TT_CHALLENGE_SECONDS,
           score:0, attempted:0, qIndex:0, currentQ:null, lastResult:null, typedValue:'',
           facts:{}, questionStartedAt:Date.now() };
  S.tt.currentQ = ttQuestionFor(S.tt, 0);
  S.tt.questionStartedAt = Date.now();
  S.tt.__scrollTop=true;
  render();
  startTTTimer();
}
// Practice: no clock, a fixed 30 questions, and the answer shown when wrong. Deliberately
// shares S.tt and submitTTAnswer with the timed challenge so the two can't drift apart. // `mode` is the only difference, and it is checked rather than duplicated.
function startTTPractice(level, custom){
  S.tt = { mode:'practice', active:true, finished:false, level, custom:custom||null, year:studentYear(S.profile), timeLeft:null,
           golden:false, coinsFound:0,
           score:0, attempted:0, qIndex:0, currentQ:null, lastResult:null, reveal:null, typedValue:'',
           facts:{}, questionStartedAt:Date.now() };
  S.tt.currentQ = ttQuestionFor(S.tt, 0);
  S.tt.golden = Math.random() < 1/GOLDEN_ODDS;
  S.tt.questionStartedAt = Date.now();
  S.tt.__scrollTop=true;
  render();
}
function startTTTimer(){
  if(S.tt.timerHandle) clearInterval(S.tt.timerHandle);
  S.tt.timerHandle=setInterval(()=>{
    if(!S.tt || !S.tt.active) return;
    S.tt.timeLeft--;
    const timerEl=document.getElementById('mmc-tt-timer');
    if(timerEl) timerEl.textContent=formatMMSS(S.tt.timeLeft);
    if(S.tt.timeLeft<=0){ clearInterval(S.tt.timerHandle); finishTTChallenge(); }
  },1000);
}
function submitTTAnswer(given){
  if(!S.tt || !S.tt.active) return;
  // While a practice answer is on screen the question is already scored. The reveal panel
  // replaces the input so this shouldn't be reachable, but the rule belongs in the logic
  // rather than depending on the UI. Otherwise a future shortcut key could double-count.
  if(S.tt.mode==='practice' && S.tt.reveal) return;
  const q = S.tt.currentQ;
  const correct = sameNumber(given, q.answer) || normalize(given)===normalize(String(q.answer));
  ttRecordFact(S.tt, q, correct, Date.now() - (S.tt.questionStartedAt||Date.now()));
  S.tt.attempted++;
  if(correct) S.tt.score++;
  if(S.tt.mode==='practice'){
    // A golden question only pays out if they get it right. That is what makes it worth
    // slowing down for. Miss it and the coin is gone.
    const wonCoin = !!(S.tt.golden && correct);
    // Held, not paid. Coins are credited only when the whole set is finished, so a child
    // cannot start a session, take the golden question and abandon the rest. Found is
    // still shown immediately, because the moment of finding it is the point.
    if(wonCoin){ S.tt.coinsFound=(S.tt.coinsFound||0)+1; }
    // Hold on this question. The child reads the result, then moves on when ready. // no clock, so there is nothing to be lost by looking at it properly.
    S.tt.reveal = { correct, prompt:q.prompt, answer:String(q.answer), given:String(given||''),
                    golden:!!S.tt.golden, wonCoin };
    S.tt.typedValue='';
    render();
    return;
  }
  flashResult('tt', correct);
  S.tt.qIndex++;
  S.tt.currentQ=ttQuestionFor(S.tt, S.tt.qIndex);
  S.tt.questionStartedAt=Date.now();
  S.tt.__scrollTop=true;
  render();
}
// Practice only: advance past the revealed answer, or finish after the 30th.
function nextTTPracticeQuestion(){
  if(!S.tt || S.tt.mode!=='practice') return;
  S.tt.reveal=null;
  S.tt.__scrollTop=true;
  if(S.tt.attempted >= ttPracticeTotal(S.tt.year)){ finishTTChallenge(); return; }
  S.tt.qIndex++;
  S.tt.currentQ=ttQuestionFor(S.tt, S.tt.qIndex);
  S.tt.typedValue='';
  // Golden questions are Practice-only. A shimmer mid-race is a distraction, and the
  // treasure should reward the careful slow mode rather than the fast one.
  // A golden question should be worth the moment of concentration, so it is drawn from the
  // harder end of whatever this child is working on rather than being whichever question
  // happened to come up.
  S.tt.golden = Math.random() < 1/GOLDEN_ODDS;
  if(S.tt.golden && S.tt.level!=='custom'){
    const stretch = S.tt.level==='easy' ? 'medium' : 'hard';
    const alt = { level:stretch, year:S.tt.year, custom:null, recentPrompts:S.tt.recentPrompts };
    S.tt.currentQ = ttQuestionFor(alt, S.tt.qIndex);
  }
  // Timed from when the question APPEARS, not from when the previous one was answered. // otherwise the seconds spent reading the correction get charged to the next fact.
  S.tt.questionStartedAt=Date.now();
  render();
}
// ---------- Repairing records the teacher cannot see ----------
// Every student record carries a teacherUid so the teacher can query for it. If that field
// was null when the record was written. A profile created before the field existed, or a
// student moved between teacher accounts. The record stays perfectly visible to the child
// and becomes invisible to the teacher. Nothing is lost, but every teacher-side number
// about that student is quietly understated, which is worse than an obvious break.
//
// Only the student's own account can still see those records, so the repair has to run
// here. It touches one field, only on their own documents, and only when it actually
// disagrees. So on a healthy account it writes nothing at all.
// Writing `null` here is what created the problem, and it did so silently. Every write
// goes through this now, so a missing teacherUid leaves a trace instead of vanishing.
function stampTeacherUid(){
  const t = S.profile && S.profile.teacherUid;
  if(!t) console.warn('Mathmentum: saving a record with no teacherUid. The teacher will not see it.');
  return t || null;
}
const HEAL_COLLECTIONS = ['ttAttempts','results','skillPractice','weekProgress'];
async function repairOrphanedRecords(){
  if(!S.user || S.isTeacher || isPreviewing()) return;
  const mine = S.profile && S.profile.teacherUid;
  if(!mine) return;                       // nothing to repair TO
  let fixed=0;
  for(const coll of HEAL_COLLECTIONS){
    const local = coll==='ttAttempts' ? S.ttAttempts
      : coll==='results' ? S.results
      : coll==='skillPractice' ? S.skillPracticeRecords
      : S.weekProgress;
    for(const rec of (local||[])){
      if(!rec || !rec.id || rec.teacherUid===mine) continue;
      try{ await updateDoc(doc(db,coll,rec.id), {teacherUid:mine}); rec.teacherUid=mine; fixed++; }
      catch(e){ /* a record we cannot repair is no worse than before */ }
    }
  }
  if(fixed){ S.healed=fixed; render(); }
}

async function finishTTChallenge(){
  const {level, score, attempted} = S.tt;
  const mode = S.tt.mode==='practice' ? 'practice' : 'challenge';
  const accuracy = attempted? Math.round((score/attempted)*100) : 0;
  if(S.tt.timerHandle) clearInterval(S.tt.timerHandle);
  // Paid out here, and only here. Finishing is the condition.
  const earned = S.tt.coinsFound||0;
  if(earned) awardGoldCoin(earned);
  S.tt.active=false; S.tt.finished=true; S.tt.reveal=null; S.tt.lastResult={level,score,attempted,accuracy,mode,coins:earned};
  try{
    // `mode` is what computeBadgeInfo reads to keep practice out of the accuracy gates.
    // Older records have no mode field and are treated as timed. That is deliberate.
    const rec = { uid:S.user.uid, teacherUid: stampTeacherUid(), level, score, attempted, accuracy, mode, submittedAt:serverTimestamp() };
    // Only on custom sessions, so an attempt history row can say "6, 7 ×" rather than
    // an anonymous "custom" that means nothing to a teacher reading it later.
    if(level==='custom' && S.tt.custom) rec.customLabel = ttCustomLabel(S.tt.custom);
    if(S.tt.facts && Object.keys(S.tt.facts).length) rec.facts = S.tt.facts;
    await addDoc(collection(db,'ttAttempts'), rec);
  }catch(e){ S.toast='Could not save this attempt. Check your connection.'; }
  render();
}
function abortTTChallenge(){
  if(!S.tt) return;
  const held=S.tt.coinsFound||0;
  const coinWarning = held ? ` You will lose ${held} gold coin${held===1?'':'s'} you found.` : '';
  if(!confirm(S.tt.mode==='practice' ? "Stop practising? This session won't be saved."+coinWarning : "Quit this challenge? Your progress won't be saved.")) return;
  if(S.tt.timerHandle) clearInterval(S.tt.timerHandle);
  S.tt=null;
  render();
}
function renderTTChallenge(){
  const wrap=el('<div></div>');
  const t=S.tt;
  const head=el(`
    <div class="mmc-card">

        ${t.mode==='practice'
          ? `<div style="font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:700;color:var(--sky-deep);">${Math.min(t.attempted+1,TT_PRACTICE_TOTAL)} of ${TT_PRACTICE_TOTAL}</div>`
          : `<div id="mmc-tt-timer" style="font-family:'IBM Plex Mono',monospace;font-size:28px;font-weight:700;color:var(--sky-deep);">${formatMMSS(t.timeLeft)}</div>`}
      </div>
      <button class="mmc-btn danger sm" id="mmc-tt-quit" style="margin-top:8px;">✕ Quit</button>
    </div>
  `);
  head.querySelector('#mmc-tt-quit').onclick=abortTTChallenge;
  wrap.appendChild(head);
  const isGolden = !!(t.mode==='practice' && t.golden && !t.reveal);
  const qbox=el(`
    <div class="mmc-card${isGolden?' mmc-golden':''}" style="text-align:center;">
      ${isGolden ? '<div class="mmc-goldenflag">🪙 Golden question!</div>' : ''}
      <div style="font-family:'Fredoka',sans-serif;font-size:${String(ttPromptText(t.currentQ)).length>18?'26px':'36px'};font-weight:700;margin-bottom:16px;">${esc(ttPromptText(t.currentQ))}</div>
      <div class="mmc-row" style="justify-content:center;">
        <input type="text" id="mmc-tt-input" class="${t.flash?('mmc-flash-'+t.flash):''}" autocomplete="off" inputmode="${KEYPAD_INPUTMODE}" value="${esc(t.typedValue||'')}" style="width:120px;text-align:center;font-size:22px;padding:10px;border-radius:8px;border:1.5px solid var(--paper-line);">
        <button class="mmc-btn gold" id="mmc-tt-submit">Go</button>
      </div>
      <div class="mmc-row" style="justify-content:center;margin-top:8px;" id="mmc-tt-speak"></div>
    </div>
  `);
  // While a practice answer is revealed, the input and keypad are replaced by the result
  // panel. Swapping rather than disabling means there is no half-live field to tab into
  // and no way to submit the same question twice.
  if(t.mode==='practice' && t.reveal){
    const r=t.reveal;
    qbox.innerHTML='';
    qbox.appendChild(el(`
      <div style="text-align:center;">
        <div style="font-family:'Fredoka',sans-serif;font-size:${String(r.prompt).length>18?'22px':'30px'};font-weight:700;margin-bottom:10px;">${esc(/[?=]/.test(String(r.prompt)) ? r.prompt.replace(/\?(?!.*[?=])/,r.answer) : r.prompt+' = '+r.answer)}</div>
        <div style="font-size:20px;font-weight:800;color:${r.correct?'var(--correct)':'var(--incorrect)'};margin-bottom:6px;">
          ${r.correct ? '✓ Correct!' : '✗ Not quite'}
        </div>
        ${r.correct ? '' : `<div class="meta" style="margin-bottom:4px;">You put ${esc(r.given||'nothing')}.</div>`}
        ${r.wonCoin ? '<div style="font-size:19px;font-weight:800;margin-top:6px;">🪙 You found a gold coin!</div>'

  // week or live-game update) triggers a full re-render, which rebuilt this field empty

  // and is also what lets the keypad survive a redraw.
  input.oninput=(e)=>{ S.tt.typedValue=e.target.value; };
  const go=()=>{ const v=input.value; input.value=''; S.tt.typedValue=''; submitTTAnswer(v); };
  qbox.querySelector('#mmc-tt-submit').onclick=go;

    }));

}

// ---------- Live Game (shared helpers) ----------
// The 'ended' status is only ever written by whoever happens to have the room open. The
// teacher's screen, or a student host's. Close the tab and nobody writes it, so the room
// sits 'active' forever. Because it is the ONLY room students can see, that one stuck room
// blocks the entire Racing Ground for the whole class: no race to finish, no way to start
// another. Treat an expired clock as finished regardless of what the document says; the
// status write becomes a tidy-up rather than something the interface depends on.
function isRaceOver(room){
  if(!room) return true;
  if(room.status==='ended') return true;
  return room.status==='active' && liveTimeLeft(room) <= 0;
}
function liveTimeLeft(room){
  if(!room.startedAt || !room.startedAt.seconds) return room.durationSec||300;
  const elapsed = (Date.now()/1000) - room.startedAt.seconds;
  return Math.max(0, Math.round((room.durationSec||300) - elapsed));
}
function renderLiveLeaderboardCard(title, room, isFinal){
  const card=el(`<div class="mmc-card"><h3>${esc(title)}</h3></div>`);
  const sorted=S.liveParticipants.slice().sort((a,b)=>(b.score||0)-(a.score||0));
  if(sorted.length===0){ card.appendChild(el('<div class="meta">No players yet.</div>')); return card; }
  const medal=(i)=> i===0?'🥇':i===1?'🥈':i===2?'🥉':`${i+1}.`;
  // The winner is announced. A child who answered nearly twice as many as anyone else
  // walked away not knowing they had won, because the result was a list of numbers and
  // they had to work it out themselves.
  if(isFinal){
    const w=sorted[0];
    const mine = S.user && w && w.id===S.user.uid;
    card.appendChild(el(`<div class="mmc-winner${mine?' me':''}">
      <div class="mmc-winner-cup">🏆</div>
      <div class="mmc-winner-name">${mine? 'You win!' : esc(w.name)+' wins!'}</div>
      ${sorted[1]? `<div class="mmc-winner-sub">${esc(sorted[1].name)} came second</div>`:''}
    </div>`));
  }
  sorted.forEach((p,i)=>{
    card.appendChild(el(`
      <div class="mmc-row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--paper-line);">
        <div>${medal(i)} ${esc(p.name)}</div>
        ${'' /* Counts are blind, live and final. Seeing the raw numbers gives away both
                 the handicap and the finish effect, and a child who is nine behind stops
                 trying. Places are the honest thing to show. */}
      </div>
    `));
  });
  return card;
}
function renderRaceTrack(myUid, capNearFinish){
  const participants=S.liveParticipants.slice().sort((a,b)=>(a.joinedAt?.seconds||0)-(b.joinedAt?.seconds||0));
  const outer=el('<div class="mmc-race-scene"></div>');
  if(participants.length===0){ outer.appendChild(el('<div class="meta">No players yet.</div>')); return outer; }
  const laneH=46, topPad=14;
  const track=el(`<div class="mmc-race-track" style="height:${participants.length*laneH+topPad*2}px;"></div>`);
  track.appendChild(el('<div class="mmc-race-finish"></div>'));
  // Drawn from the SCORE and the clock, not from an accumulated position. See
  // raceDisplayPct: the old accumulation let the whole field reach the line at half time.
  const room=currentLiveRoom();
  const dur=(room && Number(room.durationSec)) || 300;
  const left=room? liveTimeLeft(room) : 0;
  const elapsedFrac = room && room.startedAt ? Math.max(0, Math.min(1, (dur-left)/dur)) : 0;
  const scores=participants.map(x=>Number(x.score)||0);
  const rawPcts=participants.map(x=>raceDisplayPct(x.score, scores, elapsedFrac));
  // Rank by score, so the pull toward the line respects who is actually winning.
  const order=participants.map((x,i)=>({i, sc:Number(x.score)||0}))
    .sort((a,b)=>b.sc-a.sc).map(x=>x.i);
  const rankOf={}; order.forEach((idx,r)=>{ rankOf[idx]=r; });
  const closing = room && room.status==='active' && !capNearFinish && left<=RACE_ZOOM_FROM_SEC;
  if(closing) outer.classList.add('zoomed');
  participants.forEach((p,i)=>{
    let pos=closing ? raceFinishPct(rawPcts[i], rankOf[i], left) : rawPcts[i];
    if(capNearFinish) pos=Math.min(pos,96); // the line is only actually crossed once time runs out
    const isMe = myUid && p.id===myUid;
    const label = p.nickname || p.username || p.name;
    const colorFilter = HORSE_COLOR_FILTERS[p.horseColor] || 'none';
    const meGlow = isMe ? ' drop-shadow(0 0 5px var(--purple))' : '';
    const combinedFilter = ((colorFilter==='none'?'':colorFilter) + meGlow).trim() || 'none';
    const hatEmoji = HORSE_HAT_EMOJI[p.horseHat] || '';
    const lane=el(`<div class="mmc-race-lane" style="top:${topPad+i*laneH}px;"><div class="mmc-race-track-line"></div></div>`);
    const horse=el(`
      <div class="mmc-race-horse${isMe?' me':''}" style="left:calc(${pos}% - 18px);">
        <span class="mmc-race-horse-wrap">
          ${hatEmoji? `<span class="mmc-race-hat">${hatEmoji}</span>` : ''}
          <span class="mmc-race-emoji" style="filter:${p.animal? (meGlow||'none') : combinedFilter};">${animalEmoji(p.animal)}</span>
        </span>
        <span class="mmc-race-name">${esc(label)}${isMe?' (you)':''}</span>
      </div>
    `);
    lane.appendChild(horse);
    track.appendChild(lane);
  });
  outer.appendChild(track);
  return outer;
}
function renderChaseCallout(myUid){
  const sorted=S.liveParticipants.slice().sort((a,b)=>(b.position||0)-(a.position||0));
  const myIdx=sorted.findIndex(p=>p.id===myUid);
  if(myIdx===-1) return null;
  if(myIdx===0){
    return el(`<div class="mmc-card" style="text-align:center;background:var(--slime);"><h3 style="margin:0;">🏆 You're in the lead. Don't let up!</h3></div>`);
  }
  const ahead=sorted[myIdx-1];
  const gap=Math.max(0.1, (ahead.position||0)-(sorted[myIdx].position||0));
  return el(`<div class="mmc-card" style="text-align:center;"><h3 style="margin:0;">🎯 Chasing ${esc(ahead.name)}</h3><div class="meta" style="margin:2px 0 0;">${gap.toFixed(1)} points ahead of you. Answer fast to catch up!</div></div>`);
}

// ---------- Live Game (teacher) ----------
let teacherLiveTimerHandle=null, teacherLiveTimerRoomId=null;
function startLiveTeacherTimer(room){
  if(teacherLiveTimerRoomId===room.id && teacherLiveTimerHandle) return;
  if(teacherLiveTimerHandle) clearInterval(teacherLiveTimerHandle);
  teacherLiveTimerRoomId=room.id;
  teacherLiveTimerHandle=setInterval(async ()=>{
    const r=currentLiveRoom();
    if(!r || r.id!==room.id || r.status!=='active'){ clearInterval(teacherLiveTimerHandle); teacherLiveTimerHandle=null; return; }
    const left=liveTimeLeft(r);
    const timerEl=document.getElementById('mmc-live-timer');
    if(timerEl) timerEl.textContent=formatMMSS(left);
    // A full redraw once a second while a race is running. The timer used to only poke a
    // clock element, and the view built for a running race has no such element, so the
    // whole screen sat frozen: a static clock, an empty track, and players who only
    // appeared if something else happened to force a repaint.
    else if(!(S.myLive && S.myLive.answering)) render();
    if(left<=0){
      clearInterval(teacherLiveTimerHandle); teacherLiveTimerHandle=null;
      try{ await updateDoc(doc(db,'liveGames',r.id), {status:'ended', endedAt:serverTimestamp()}); }
      catch(e){ S.toast='Could not auto-end the game: '+e.message; render(); }
    }
  },1000);
}
// Runs off the data subscription itself (not the UI), so the 5-minute
// auto-end fires reliably even if the teacher is looking at a different tab.
function ensureTeacherLiveTimer(){
  const room=currentLiveRoom();
  if(room && room.status==='active'){ startLiveTeacherTimer(room); }
  else if(teacherLiveTimerHandle){ clearInterval(teacherLiveTimerHandle); teacherLiveTimerHandle=null; teacherLiveTimerRoomId=null; }
}
async function createLiveRoom(){
      // `level` is no longer chosen. It survives only as the fallback for a student with
      // no group set, and their YEAR still applies on top of it. Kept on the document so
      // older rooms and any code reading room.level keep working.
      const level='medium';
      // Closing children's races is the right default when a teacher wants the room's
      // attention, but doing it silently is not. Now that every race is listed rather than
      // one being chosen, a teacher can also just leave them running.
      const openStudentRooms=(S.liveGames||[]).filter(g=>g.hostUid && (g.status==='lobby'||g.status==='active') && !isRaceOver(g));
      let closeTheirs = false;
      if(openStudentRooms.length){
        closeTheirs = confirm(`${openStudentRooms.length} student race${openStudentRooms.length===1?' is':'s are'} open.\n\nOK  -  close ${openStudentRooms.length===1?'it':'them'} and start yours\nCancel  -  leave ${openStudentRooms.length===1?'it':'them'} running alongside yours`);
      }
      try{
        if(closeTheirs) for(const g of openStudentRooms){
          try{ await updateDoc(doc(db,'liveGames',g.id), {status:'ended', endedAt:serverTimestamp()}); await retireRacePin(g); }catch(e2){}
        }
        const pin = await generateRacePin();
        const ref = await addDoc(collection(db,'liveGames'), { pin, teacherUid:S.user.uid, level, status:'lobby', createdAt:serverTimestamp(), durationSec:300,
          classId: S.showAllClasses ? null : S.currentClassId });
        await publishRacePin(pin, ref.id, (S.profile&&S.profile.displayName)||'Your teacher');
        // Watch the players straight away. Student-hosted races already did this; the
        // teacher's own did not, so the room showed "nobody yet" while children were
        // visibly joining, and only a refresh fixed it.
        ensureParticipantsSub(ref.id);
        S.toast = closeTheirs
          ? `Class race created · ${openStudentRooms.length} student race${openStudentRooms.length===1?'':'s'} closed.`
          : 'Class race created.';
      }
      catch(e){ S.toast='Could not create the room. Check your connection.'; render(); }
    }

function renderTeacherLiveGame(){
  const wrap=el('<div></div>');
  const rgHead=el('<div class="mmc-row" style="justify-content:flex-end;margin-bottom:12px;"></div>');
  rgHead.appendChild(renderClassPicker());
  wrap.appendChild(rgHead);

    if(room){

      wrap.appendChild(renderLiveLeaderboardCard('Final leaderboard', room, true));
      // Best-effort tidy-up: if the clock ran out while nobody was watching, close the
      // document now so it stops being the room everyone can see. The interface no longer
      // depends on this succeeding. It just keeps the data honest.
      if(room.status==='active'){
        updateDoc(doc(db,'liveGames',room.id), {status:'ended', endedAt:serverTimestamp()}).catch(()=>{});
      }

    const form=el(`
      <div class="mmc-card">

        <button class="mmc-btn gold" id="mmc-live-create">Create Room</button>
      </div>
    `);
    form.querySelector('#mmc-live-create').onclick=()=>createLiveRoom();
    wrap.appendChild(form);
    return wrap;
  }

  // ---- a race is RUNNING ----
  // There was no branch for this at all. isRaceOver handled a finished race and the block
  // below handled a lobby, so the moment a teacher pressed Start their screen fell through
  // to "Start the Racing Ground" with no track, no horses and nothing driving the sound.
  if(room && room.status==='active'){
    ensureParticipantsSub(room.id);

      <div class="meta" style="margin:2px 0 0;">${S.liveParticipants.length} racing</div>
      ${room.pin?`<div class="meta" style="margin:6px 0 0;">Race PIN <code class="mmc-code">${esc(room.pin)}</code></div>`:''}
    </div>`);
    const controls=el('<div class="mmc-row" style="gap:8px;justify-content:center;margin-bottom:12px;"></div>');
    const sound=el(`<button class="mmc-pill ${S.raceSound?'on':''}" title="Plays on THIS screen only, never on student devices">
      <span class="mmc-pill-knob"></span>
      <span class="mmc-pill-label">${S.raceSound?'🔊 Sound on':'🔈 Sound off'}</span></button>`);
    sound.onclick=()=>{
      S.raceSound=!S.raceSound;
      if(S.raceSound){ raceAudio(); raceTone(880,0,.12,'triangle',.18); raceCallerStart(); }
      else raceCallerStop();
      render();
    };
    const endBtn=el('<button class="mmc-btn ghost sm">End now</button>');
    endBtn.onclick=async ()=>{
      try{ await updateDoc(doc(db,'liveGames',room.id), {status:'ended', endedAt:serverTimestamp()}); await retireRacePin(room); }
      catch(e){ S.toast='Could not end the race. Check your connection.'; }
      render();
    };
    controls.appendChild(sound); controls.appendChild(endBtn);
    wrap.appendChild(head);
    wrap.appendChild(controls);
    wrap.appendChild(renderRaceTrack(null));
    wrap.appendChild(renderLiveLeaderboardCard('Live leaderboard', room, false));
    return wrap;
  }

  if(room.status==='lobby'){
    // One card per race, not four stacked ones saying overlapping things. The old view
    // showed a "started by" banner, a stale-lobby warning, a room card and a player list
    // for a single race, and the warning claimed students could not start their own,
    // which stopped being true the moment races became a list.
    const nowSec = Date.now()/1000;
    const rooms = (S.liveGames||[]).filter(g=>{
        if(g.status!=='lobby' && g.status!=='active') return false;
        if(isRaceOver(g)) return false;
        if(g.status==='lobby'){
          const opened=(g.createdAt && g.createdAt.seconds)||0;
          if(opened && (nowSec-opened) > LOBBY_MAX_AGE_SEC) return false;
        }
        return true;
      })
      .sort((a,b)=>{
        if(!a.hostUid && b.hostUid) return -1;
        if(a.hostUid && !b.hostUid) return 1;
        return (b.createdAt?.seconds||0)-(a.createdAt?.seconds||0);
      });
    if(rooms.length>1){
      wrap.appendChild(el(`<div class="mmc-setgroup"><span class="mmc-setgroup-name">Races open now</span>
        <span class="mmc-setgroup-count">${rooms.length}</span></div>`));
    }
    // Watch the room the PLAYERS are drawn from, which is currentLiveRoom, not whichever
    // room happens to sort first. With two races open these were different rooms, so every
    // render flipped the listener between them and each flip cleared the player list. That
    // is why the lobby said "nobody yet" while children were visibly joining.
    if(room) ensureParticipantsSub(room.id);
    rooms.forEach(r=>{
      const isMine = !r.hostUid;
      const opened = r.createdAt && r.createdAt.seconds ? r.createdAt.seconds : 0;
      const mins = opened ? Math.floor((Date.now()/1000 - opened)/60) : null;
      const stale = mins!=null && mins>=20;
      const players = (r.id===(room&&room.id)) ? S.liveParticipants : null;
      const card=el(`<div class="mmc-card${isMine?' mmc-classrace':''}" style="margin-bottom:10px;">
        ${isMine?'<div class="mmc-classflag">Your class race</div>':''}
