function friendlyAuthError(code){
  const map={ 'auth/email-already-in-use':'That username is already taken — try logging in instead.',
    'auth/invalid-email':'That doesn\'t look like a valid username or email.',
    'auth/weak-password':'Password should be at least 6 characters.',
    'auth/user-not-found':'Incorrect username/email or password.', 'auth/wrong-password':'Incorrect username/email or password.',
    'auth/invalid-credential':'Incorrect username/email or password.', 'auth/missing-password':'Please enter a password.' };
  return map[code] || 'Something went wrong — please try again.';
}

async function handleAuthChange(user){
  clearSubs();
  S.user=user; S.authError=null;
  if(user){
    try{
      const teachersSnap = await getDoc(doc(db,'config','teachers'));
      S.teacherEmails = teachersSnap.exists() ? (teachersSnap.data().emails||[]) : [];
      S.isTeacher = S.teacherEmails.map(e=>String(e).toLowerCase()).includes((user.email||'').toLowerCase());
      if(S.isTeacher && S.pendingDeepLinkTab){
        S.teacherTab = S.pendingDeepLinkTab;
        S.pendingDeepLinkTab = null;
        // Clear it from the address bar so a later refresh doesn't yank them back.
        try{ history.replaceState(null,"", window.location.pathname); }catch(e){}
      }
      const profSnap = await getDoc(doc(db,'profiles',user.uid));
      S.profile = profSnap.exists() ? profSnap.data() : { displayName:user.displayName||user.email, email:user.email };
    }catch(e){ S.error='Could not load your account details.'; }
    subscribeData();
  } else {
    S.isTeacher=false; S.profile=null; S.weeks=[]; S.results=[]; S.profiles={};
  }
  S.loading=false; render();
}

if(!configured){
  S.loading=false; S.error='This page isn\'t connected to Firebase yet — follow SETUP-INSTRUCTIONS.md and paste your config near the top of the script.';
  render();
} else {
  const refParam = new URLSearchParams(window.location.search).get('ref');
  if(refParam) S.referredBy = refParam.toLowerCase();
  onAuthStateChanged(auth, (user)=>{ if(S.bulkCreating) return; handleAuthChange(user); });
}

function subscribeData(){
  if(S.isTeacher){
    unsubs.push(onSnapshot(query(collection(db,'weeks'), where('teacherUid','==',S.user.uid)), snap=>{ S.weeks=snap.docs.map(d=>({id:d.id,...d.data()})); render(); }, (err)=>{ S.toast='Weeks error: '+err.message; render(); }));
    unsubs.push(onSnapshot(query(collection(db,'results'), where('teacherUid','==',S.user.uid)), snap=>{ S.results=snap.docs.map(d=>({id:d.id,...d.data()})); render(); runAutoArchive(); }, (err)=>{ S.toast='Results error: '+err.message; render(); }));
    unsubs.push(onSnapshot(query(collection(db,'profiles'), where('teacherUid','==',S.user.uid)), snap=>{ S.profiles={}; snap.docs.forEach(d=>S.profiles[d.id]=d.data()); render(); }, (err)=>{ S.toast='Profiles error: '+err.message; render(); }));
    unsubs.push(onSnapshot(query(collection(db,'ttAttempts'), where('teacherUid','==',S.user.uid)), snap=>{ S.ttAttempts=snap.docs.map(d=>({id:d.id,...d.data()})); render(); }, (err)=>{ S.toast='Timetable data error: '+err.message; render(); }));
    unsubs.push(onSnapshot(query(collection(db,'skillPractice'), where('teacherUid','==',S.user.uid)), snap=>{ S.allSkillPracticeRecords=snap.docs.map(d=>({id:d.id,...d.data()})); render(); }, (err)=>{ S.toast='Skill practice data error: '+err.message; render(); }));
    unsubs.push(onSnapshot(query(collection(db,'classes'), where('teacherUid','==',S.user.uid)), snap=>{
      S.classes=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.createdAt?.seconds||0)-(b.createdAt?.seconds||0));
      if(!S.currentClassId && S.classes.length) S.currentClassId=S.classes[0].id;
      ensureDefaultClass();
      render();
    }, (err)=>{ S.toast='Classes error: '+err.message; render(); }));
    unsubs.push(onSnapshot(doc(db,'config','teachers'), snap=>{
      const data=snap.exists()? snap.data() : {};
      S.allTeacherEmails=(data.emails||[]).map(e=>String(e).toLowerCase());
      S.adminTeacherEmails=data.admins? data.admins.map(e=>String(e).toLowerCase()) : null;
      render();
    }, (err)=>{ /* not critical to app function — silent */ }));
    // Both of these are admin-only per firestore.rules — a non-admin teacher's listener
    // will simply get a permission error and stay empty, which is fine, since the UI
    // that uses this data is itself gated behind isCurrentUserAdminTeacher().
    unsubs.push(onSnapshot(query(collection(db,'teacherRequests'), where('status','==','pending')), snap=>{
      S.pendingTeacherRequests=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.requestedAt?.seconds||0)-(b.requestedAt?.seconds||0));
      render();
    }, (err)=>{ /* not admin — silent */ }));
    unsubs.push(onSnapshot(collection(db,'teacherDirectory'), snap=>{
      S.teacherDirectory=snap.docs.map(d=>({uid:d.id,...d.data()})).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
      render();
    }, (err)=>{ /* not admin — silent */ }));
    unsubs.push(onSnapshot(query(collection(db,'liveGames'), where('teacherUid','==',S.user.uid)), snap=>{
      S.liveGames=snap.docs.map(d=>({id:d.id,...d.data()})); ensureParticipantsSub(currentLiveRoom()?.id||null); ensureTeacherLiveTimer(); render();
    }, (err)=>{ S.toast='Racing Ground error: '+err.message; render(); }));
  } else {
    unsubs.push(onSnapshot(query(collection(db,'weeks'), where('status','==','published'), where('teacherUid','==',(S.profile&&S.profile.teacherUid)||'__none__')), snap=>{
      S.weeksPublished=snap.docs.map(d=>({id:d.id,...d.data()}));
      S.weeks=[...S.weeksPublished, ...(S.weeksScheduled||[])];
      render();
    }, (err)=>{ S.toast='Weeks error: '+err.message; render(); }));
    subscribeScheduledWeeks();
    if(scheduledWeeksInterval) clearInterval(scheduledWeeksInterval);
    scheduledWeeksInterval=setInterval(subscribeScheduledWeeks, 60000); // re-check every minute so newly-due weeks appear without a manual reload
    unsubs.push(onSnapshot(query(collection(db,'results'), where('uid','==',S.user.uid)), snap=>{
      S.results=snap.docs.map(d=>({id:d.id,...d.data()})); render();
    }, (err)=>{ S.toast='Results error: '+err.message; render(); }));
    unsubs.push(onSnapshot(query(collection(db,'weekProgress'), where('uid','==',S.user.uid)), snap=>{
      S.weekProgress=snap.docs.map(d=>({id:d.id,...d.data()})); render();
    }, (err)=>{ S.toast='Saved progress error: '+err.message; render(); }));
    unsubs.push(onSnapshot(query(collection(db,'ttAttempts'), where('uid','==',S.user.uid)), snap=>{
      S.ttAttempts=snap.docs.map(d=>({id:d.id,...d.data()})); render();
    }, (err)=>{ S.toast='Timetable data error: '+err.message; render(); }));
    unsubs.push(onSnapshot(query(collection(db,'skillPractice'), where('uid','==',S.user.uid)), snap=>{
      S.skillPracticeRecords=snap.docs.map(d=>({id:d.id,...d.data()})); render();
    }, (err)=>{ S.toast='Skill practice data error: '+err.message; render(); }));
    unsubs.push(onSnapshot(query(collection(db,'liveGames'), where('teacherUid','==',(S.profile&&S.profile.teacherUid)||'__none__')), snap=>{
      S.liveGames=snap.docs.map(d=>({id:d.id,...d.data()})); ensureParticipantsSub(currentLiveRoom()?.id||null);
      if(S.myLive && S.myLive.answering) return; // same reasoning as the participants listener — don't interrupt active typing
      render();
    }, (err)=>{ S.toast='Racing Ground error: '+err.message; render(); }));
  }
}

// ---------- Root render ----------
let toastTimer=null, toastTimerValue=null;
function scheduleToastClear(){
  if(S.toast && S.toast!==toastTimerValue){
    if(toastTimer) clearTimeout(toastTimer);
    toastTimerValue=S.toast;
    toastTimer=setTimeout(()=>{ S.toast=null; toastTimerValue=null; toastTimer=null; render(); }, 7000);
  } else if(!S.toast){
    if(toastTimer){ clearTimeout(toastTimer); toastTimer=null; }
    toastTimerValue=null;
  }
}
function render(){
  window.__mmcRenderCount = (window.__mmcRenderCount||0)+1;
  const root=document.getElementById('mmc');
  applyTheme();
  // Teacher-side facelift: a single scope class swaps the whole teacher UI into the
  // quieter "pro" styling. Students never get this class, so their playful styling is
  // untouched — see the .mmc-pro block at the bottom of <style>.
  root.classList.toggle('mmc-pro', !!(S.user && S.isTeacher));
  root.innerHTML='';
  // Logged out — and while a teacher waits for approval — the pitch card IS the
  // header. A teacher mid-signup shouldn't be shown THE ARENA; that's the
  // students' side of the product and it reads as though they've landed in the
  // wrong place.
  if(S.user && !isAwaitingApproval()) root.appendChild(renderHead());
  const body=el('<div class="mmc-body"></div>');
  if(S.toast){
    scheduleToastClear();
    const toastEl=el(`<div class="mmc-toast">${esc(S.toast)}<button type="button" class="mmc-toast-close">✕</button></div>`);
    toastEl.querySelector('.mmc-toast-close').onclick=()=>{ S.toast=null; if(toastTimer){clearTimeout(toastTimer); toastTimer=null;} toastTimerValue=null; render(); };
    body.appendChild(toastEl);
  }
  if(S.error) body.appendChild(el(`<div class="mmc-toast">${esc(S.error)}</div>`));
  if(S.loading){ body.appendChild(el('<div class="mmc-empty"><div class="mmc-empty-icon">✏️</div>Loading…</div>')); }
  else if(!configured){ /* error already shown above */ }
  else if(!S.user){ body.appendChild(renderAuth()); }
  else if(S.previewStudentUid){ body.appendChild(renderStudentPreview()); }
  else if(S.isTeacher){ body.appendChild(renderTeacher()); }
  else if(isAwaitingApproval()){ body.appendChild(renderAwaitingApproval()); }
  else { body.appendChild(renderStudent()); }
  // Shown to students too, not just teachers. Testing a student-side change meant having
  // no way to tell which build the student screen was actually running — which turned a
  // simple "is this deployed yet" question into guesswork.
  if(S.user){
    body.appendChild(el(`<div class="mmc-buildstamp">${S.isTeacher? '<a href="privacy.html" style="color:inherit;">Privacy</a> · ' : ''}Mathmentum build ${esc(BUILD)}</div>`));
  }
  root.appendChild(body);
  const ttInput=document.getElementById('mmc-tt-input');
  if(ttInput) ttInput.focus();
  // Note: the Live Game race screen (renderMyLiveSession) manages its own focus and cursor
  // position deliberately — an unconditional, unpositioned .focus() call here on every single
  // render was fighting against that and is the real reason multi-digit answers were
  // collapsing down to just the last digit typed (an unpositioned focus can reset or select
  // the field's existing text in some browsers, so the next keystroke overwrites it).
}

    students: Object.keys(S.profiles||{}).length,
    sets: (S.weeks||[]).filter(w=>w.status!=='archived').length,
    completions: (S.results||[]).length,
    avgPct: (S.results||[]).length ? Math.round((S.results.reduce((s,r)=>s+(r.total? r.score/r.total : 0),0)/S.results.length)*100) : null,

        <span style="top:70%;left:90%;font-size:20px;">√9</span>
        <span style="top:40%;left:28%;font-size:18px;">−</span>
      </div>
      ${S.user ? `<button id="mmc-signout" class="mmc-signout-pill">↪ Sign out</button>` : ''}

      <div class="mmc-arena-wrap">
        <div class="mmc-brandmark"><span class="bm-a">Math</span><span class="bm-b">mentum</span></div>
        <div class="mmc-arena">
          <span class="mmc-arena-the">the</span>

      ` : `

      ${S.user ? `

              <div class="mmc-welcome-role">${S.isTeacher?`${esc(name)} · <b>Teacher</b>`:`Signed in as <b>Student</b>`}</div>
            </div>
          </div>
          ${teacherStats ? `
            <div class="mmc-stat-card"><div class="mmc-stat-icon" style="background:#3B82F6;">👥</div><div><div class="mmc-stat-label">Students</div><div class="mmc-stat-num">${teacherStats.students}</div></div></div>
            <div class="mmc-stat-card"><div class="mmc-stat-icon" style="background:#8B5CF6;">📘</div><div><div class="mmc-stat-label">Revision Sets</div><div class="mmc-stat-num">${teacherStats.sets}</div></div></div>

function renderAuth(){
  const wrap=el('<div></div>');
  const isSignup = S.showSignup;

  if(isSignup){
    if(S.teacherRequestSubmitted){
      const done=el(`
        <div class="mmc-card">
          <h3>Account created</h3>
          <div class="meta">Your account is ready and your request is with the admin. Once it's approved you can sign in with the email and password you just chose — nothing else to do, and no email to wait for.</div>
          <a href="#" id="mmc-req-back" style="display:inline-block;margin-top:10px;font-size:12.5px;color:var(--ink-soft);">← back to log in</a>
        </div>
      `);
      done.querySelector('#mmc-req-back').onclick=(e)=>{ e.preventDefault(); S.showSignup=false; S.teacherRequestSubmitted=false; render(); };
      wrap.appendChild(done);
      return wrap;
    }
    // Teachers choose their own password up front. Every previous flow depended on
    // an email arriving — and across the first handful of real invitations, one was
    // quarantined by a school filter, one by Hotmail, and Outlook mangled the link
    // in a third. Nothing in this flow needs email to work.
    const card=el(`
      <div class="mmc-card">
        <h3>Sign up as a teacher</h3>
        ${S.authError? `<div class="mmc-autherr">${esc(S.authError)}</div>` : ''}
        <div class="meta">Choose your own password now. An admin approves new teachers, usually quickly — then you just sign in. No email needed.</div>
        <div class="mmc-field"><label>Your name</label><input type="text" id="mmc-a-name" placeholder="e.g. Priya Nair"></div>
        <div class="mmc-field"><label>Your email</label><input type="email" id="mmc-a-email" placeholder="you@example.com" autocomplete="username"></div>
        <div class="mmc-field"><label>Choose a password</label><input type="password" id="mmc-a-pw" autocomplete="new-password" placeholder="At least 6 characters"></div>
        <div class="mmc-field"><label>Confirm password</label><input type="password" id="mmc-a-pw2" autocomplete="new-password"></div>
        <button class="mmc-btn gold" id="mmc-a-go">Create my account</button>
      </div>
    `);
    card.querySelector('#mmc-a-go').onclick=async ()=>{
      const name=card.querySelector('#mmc-a-name').value.trim();
      const email=card.querySelector('#mmc-a-email').value.trim();
      const pw=card.querySelector('#mmc-a-pw').value;
      const pw2=card.querySelector('#mmc-a-pw2').value;
      if(!name || !email || !email.includes('@')){ S.authError='Please fill in your name and a valid email.'; render(); return; }
      if(pw.length<6){ S.authError='Your password needs at least 6 characters.'; render(); return; }
      if(pw!==pw2){ S.authError="The two passwords don't match."; render(); return; }
      const btn=card.querySelector('#mmc-a-go'); btn.disabled=true; btn.textContent='Creating…';
      try{
        // Create the sign-in account first, then lodge the request. The account
        // exists but has no teacher permissions until an admin approves it, so
        // signing in before then shows a "waiting for approval" screen.
        try{
          await createUserWithEmailAndPassword(auth, email, pw);
        }catch(e){
          if(e && e.code==='auth/email-already-in-use'){
            // They may have signed up before, or been invited. Signing in proves
            // it's them and still lodges the request.
            await signInWithEmailAndPassword(auth, email, pw);
          } else { throw e; }
        }
        const call = httpsCallable(functions, 'requestTeacherAccess');
        await call({ name, email, referredBy: S.referredBy || null });
        S.authError=null; S.teacherRequestSubmitted=true;
      }catch(e){
        const code=(e && e.code)||'';
        S.authError =
          code.includes('email-already-in-use') ? 'There is already an account for that email. Try signing in, or use "Forgot your password?".'
          : code.includes('wrong-password') || code.includes('invalid-credential') ? 'There is already an account for that email and that password is not right. Try "Forgot your password?".'
          : code.includes('weak-password') ? 'That password is too weak — try a longer one.'
          : code.includes('invalid-email') ? 'That email address does not look right.'
          : (e.message || 'Could not create your account — check your connection.');
      }
      btn.disabled=false; btn.textContent='Create my account';
      render();
    };
    wrap.appendChild(card);
    const toggle=el(`<a href="#" style="display:inline-block;margin-top:4px;font-size:12.5px;color:var(--ink-soft);">← back to log in</a>`);
    toggle.onclick=(e)=>{ e.preventDefault(); S.showSignup=false; S.authError=null; render(); };
    wrap.appendChild(toggle);
    return wrap;
  }

  // The front door is seen by teachers, students and anyone a teacher shares the
  // link with, so it has to say what the product IS before asking for a password.
  wrap.appendChild(el(`
    <div class="mmc-pitch">
      <div class="mmc-pitch-mark"><span>Math</span><span class="o">mentum</span></div>
      <p class="mmc-pitch-line">Weekly maths practice for primary classrooms. Quick to set, marks itself, and shows you exactly who's getting it and who isn't.</p>
      <div class="mmc-pitch-grid">
        <div class="pp pp1"><b>Key skills</b><span>Tests understanding right across the year level.</span></div>
        <div class="pp pp2"><b>Times tables fluency</b><span>Builds automaticity with the operations that matter.</span></div>
        <div class="pp pp3"><b>Differentiated</b><span>Every student practises at their own level.</span></div>
        <div class="pp pp4"><b>Feedback that tells you something</b><span>Strengths, gaps and progress — not just a percentage.</span></div>
      </div>
    </div>
  `));

  const card=el(`
    <div class="mmc-card">
      <h3>Log in</h3>
      ${S.authError? `<div class="mmc-autherr">${esc(S.authError)}</div>` : ''}
      <div class="mmc-field"><label>Username (or teacher email)</label>
        <input type="text" id="mmc-a-email" placeholder="e.g. SusieM"></div>
      <div class="mmc-field"><label>Password</label><input type="password" id="mmc-a-pass" placeholder="Your password"></div>
      <button class="mmc-btn gold" id="mmc-a-go">Log in</button>
      <a href="#" id="mmc-a-forgot" class="mmc-forgot">Forgot your password?</a>
    </div>
  `);
  card.querySelector('#mmc-a-forgot').onclick=async (e)=>{
    e.preventDefault();
    const raw=card.querySelector('#mmc-a-email').value.trim();
    if(!raw || !raw.includes('@')){
      S.authError='Type your teacher email above first, then click again. Students should ask their teacher for a new password.';
      render(); return;
    }
    try{
      await sendPasswordResetEmail(auth, raw, { url:'https://mathmentum.com.au', handleCodeInApp:false });
      S.authError=null; S.toast='If that address has an account, a reset email is on its way.';
    }catch(err){
      // Deliberately vague: confirming which addresses exist would leak your roster.
      S.toast='If that address has an account, a reset email is on its way.';
    }
    render();
  };
  card.querySelector('#mmc-a-go').onclick=async ()=>{
    const raw=card.querySelector('#mmc-a-email').value.trim();
    const pass=card.querySelector('#mmc-a-pass').value;
    if(!raw || !pass){ S.authError='Please fill in every field.'; render(); return; }
    try{
      const email = raw.includes('@') ? raw : usernameToEmail(raw);
      await signInWithEmailAndPassword(auth,email,pass);
    }catch(e){ S.authError=friendlyAuthError(e.code); render(); }
  };
  wrap.appendChild(card);

  const panels=el(`
    <div class="mmc-entrypanels">
      <div class="ep ep-teacher">
        <b>New teacher?</b>
        <span>Sign up, choose a password, and you'll be approved shortly.</span>
        <button class="mmc-btn ghost sm" id="mmc-req-go">Sign up as a teacher</button>
      </div>
      <div class="ep ep-student">
        <b>Students</b>
        <span>Use the username and password on your login card. Your teacher can reset it if you're stuck.</span>
      </div>
    </div>
  `);
  panels.querySelector('#mmc-req-go').onclick=(e)=>{ e.preventDefault(); S.showSignup=true; S.authError=null; render(); };
  wrap.appendChild(panels);
  // A school or parent looks for this BEFORE signing up, so it has to be on the
  // signed-out page. privacy.html is a separate, dependency-free file — it loads on a
  // locked-down school network even if every CDN is blocked.
  wrap.appendChild(el(`<div style="text-align:center;margin-top:22px;font-size:13px;">
    <a href="privacy.html" style="color:var(--ink-soft);text-decoration:underline;">Privacy — what we hold and where</a>
  </div>`));
  return wrap;
}

// ================= TEACHER =================
function renderTeacherHome(){
  const wrap=el('<div></div>');
  const ts = (r)=> (r && r.submittedAt && r.submittedAt.seconds) ? r.submittedAt.seconds*1000 : null;
  // Home deliberately ignores the class switcher — it's the whole-teaching-load view.
  const roster = Object.keys(S.profiles||{});
  const results = (S.results||[]);
  const tt = (S.ttAttempts||[]);
  const practice = (S.allSkillPracticeRecords||[]);
  const everything = results.concat(tt, practice);

  const now=Date.now(), DAY=86400000;
  const since=(ms)=>everything.filter(r=>{const t=ts(r); return t && (now-t)<=ms;});
  const last24 = since(DAY), last7 = since(7*DAY), prev7 = everything.filter(r=>{
    const t=ts(r); return t && (now-t)>7*DAY && (now-t)<=14*DAY;
  });

  const activeUids = new Set(last7.map(r=>r.uid));
  const doneRecent = results.filter(r=>{const t=ts(r); return t && (now-t)<=DAY;}).length;
  const scored = results.filter(r=>r.total);
  const avgPct = scored.length ? Math.round(scored.reduce((s,r)=>s+r.score/r.total,0)/scored.length*100) : null;

  // "After school" = anything submitted outside 8am–4pm on a weekday, or any weekend activity.
  const afterHours = last7.filter(r=>{
    const t=ts(r); if(!t) return false;
    const d=new Date(t), h=d.getHours(), day=d.getDay();
    return day===0 || day===6 || h<8 || h>=16;
  });
  const afterHoursNames = [...new Set(afterHours.map(r=>r.uid))]
    .map(u=>(S.profiles[u]&&S.profiles[u].displayName)||'').filter(Boolean);

  const greet = (h=>h<12?'Morning':h<17?'Afternoon':'Evening')(new Date().getHours());
  const first = ((S.profile&&S.profile.displayName)||'').trim().split(/\s+/)[0] || 'there';
  const nClasses = (S.classes||[]).length;
  const className = nClasses>1 ? `${nClasses} classes` : (((S.classes||[])[0]||{}).name || '');
  const dateStr = new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});

  let lead;
  if(!roster.length) lead = `No students yet. Add your class list and this page starts filling up.`;
  else if(!last24.length && !last7.length) lead = `It's been quiet — nothing recorded in the past week. Setting a fresh task usually gets things moving again.`;
  else if(!last24.length) lead = `Nothing since yesterday, though ${activeUids.size} student${activeUids.size===1?'':'s'} practised earlier this week.`;
  else lead = `Your students have been busy — ${last24.length} thing${last24.length===1?'':'s'} finished in the last 24 hours.`;

  const card=el(`<div class="mmc-card">
    <div class="meta" style="letter-spacing:.09em;text-transform:uppercase;font-size:11px;font-weight:700;">${esc(dateStr)}${className?' · '+esc(className):''}</div>
    <h3 style="font-size:24px;margin-bottom:6px;">${esc(greet)}, ${esc(first)}</h3>
    <div class="meta" style="font-size:16px;margin-bottom:0;">${esc(lead)}</div>
  </div>`);
  wrap.appendChild(card);

  if(roster.length){
    const prev24 = everything.filter(r=>{const t=ts(r); return t && (now-t)>DAY && (now-t)<=2*DAY;});
    const delta = last24.length - prev24.length;
    const stats=el(`<div class="mmc-card">
      <div class="mmc-row" style="gap:0;align-items:stretch;">
        <div style="flex:1;min-width:120px;padding-right:20px;">
          <div class="meta" style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px;">Finished today</div>
          <div class="mmc-stat-num" style="font-size:27px;">${last24.length}</div>
          ${delta!==0?`<div class="meta" style="font-size:12px;margin:2px 0 0;color:${delta>0?'#2E7D4F':'#8A6008'};font-weight:600;">${delta>0?'+':''}${delta} on yesterday</div>`:''}
        </div>
        <div style="flex:1;min-width:120px;padding:0 20px;border-left:1px solid #EEECE7;">
          <div class="meta" style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px;">Active this week</div>
          <div class="mmc-stat-num" style="font-size:27px;">${activeUids.size}<span style="font-size:16px;color:#8A8880;"> / ${roster.length}</span></div>
        </div>
        <div style="flex:1;min-width:120px;padding-left:20px;border-left:1px solid #EEECE7;">
          <div class="meta" style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px;">Average score</div>
          <div class="mmc-stat-num" style="font-size:27px;">${avgPct==null?'—':avgPct+'%'}</div>
        </div>
      </div>
    </div>`);
    wrap.appendChild(stats);
  }

  // ---- Insight engine -------------------------------------------------
  // Deliberately reuses computeSkillStats / pickStrengthsAndWeaknesses — the same
  // engine behind the student dashboard — rather than recalculating alongside it.
  // That means insights here include self-directed skillPractice (not just set
  // results), and inherit the tuned thresholds that avoid false positives on
  // small samples. Everything is measured against the student's own history,
  // never ranked against classmates.
  const notes=[];
  const nameOf=(u)=>(S.profiles[u]&&S.profiles[u].displayName)||'';
  const practiceFor=(u)=>(S.allSkillPracticeRecords||[]).filter(r=>r.uid===u);

  roster.forEach(uid=>{
    const nm=nameOf(uid); if(!nm) return;
    const mine=results.filter(r=>r.uid===uid);
    if(!mine.length) return;
    let stats;
    try { stats=computeSkillStats(mine, S.weeks, practiceFor(uid)); } catch(e){ return; }

    // Something they used to get wrong and now reliably get right. Note the
    // thresholds account for recentAccuracy being a fixed 5-attempt window —
    // a genuine turnaround still carries older misses inside that window, so
    // demanding near-perfect recent accuracy would suppress the very insight
    // this is here to surface.
    const turned=stats.filter(sk=>sk.total>=4 && sk.trend==='improving'
        && sk.recentAccuracy>=0.6 && sk.overallAccuracy<0.7)
      .sort((a,b)=>(b.recentAccuracy-b.overallAccuracy)-(a.recentAccuracy-a.overallAccuracy))[0];
    if(turned){
      const mastered = turned.recentAccuracy>=0.85;
      notes.push({score: mastered?130:110, k: mastered?'Finally clicked':'Turning a corner', good:true,
        t: mastered
          ? nm+' has cracked '+turned.title.toLowerCase()+' — '+Math.round(turned.recentAccuracy*100)+'% lately.'
          : nm+' is getting '+turned.title.toLowerCase()+' right at last, after a long run of misses.'});
    }

    // Broader upward movement, when there's no single breakthrough to report.
    const rising=stats.filter(sk=>sk.total>=4 && sk.trend==='improving');
    if(rising.length>=2) notes.push({score:70, k:'On the up', good:true,
      t:nm+' is improving across '+rising.length+' skills.'});

    // A skill slipping for someone who is otherwise engaged.
    const slipping=stats.filter(sk=>sk.total>=4 && sk.trend==='declining' && sk.recentAccuracy<0.6)
      .sort((a,b)=>b.concernScore-a.concernScore)[0];
    if(slipping) notes.push({score:75, k:'Slipping', good:false,
      t:nm+' has gone backwards on '+slipping.title.toLowerCase()+' — '+Math.round(slipping.recentAccuracy*100)+'% lately.'});
  });

  // Class-wide weak spot, using the same weakness rules as the student view.
  try {
    const classStats=computeSkillStats(results, S.weeks, practice);
    const cw=pickStrengthsAndWeaknesses(classStats).weaknesses[0];
    if(cw && cw.total>=Math.max(4,roster.length)) notes.push({score:90, k:'Sticking point', good:false,
      t:cw.title+' — the class is at '+Math.round(cw.recentAccuracy*100)+'% and it is the weakest topic going.'});
  } catch(e){}

  // Repeated unsimplified-but-correct answers. The marks look fine and the habit
  // is invisible in the gradebook, so it only surfaces via these flags.
  const simplifyCounts={};
  results.forEach(r=>{
    (r.answers||[]).forEach(a=>{
      if((a.flags||[]).indexOf('could_simplify')!==-1) simplifyCounts[r.uid]=(simplifyCounts[r.uid]||0)+1;
    });
  });
  // Area vs perimeter: one is often solid while the other isn't, and the single
  // combined mark hides which.
  const apCounts={};
  results.forEach(r=>{ (r.answers||[]).forEach(a=>{
    (a.flags||[]).forEach(f=>{
      if(f==='perimeter_wrong'||f==='area_wrong'){
        apCounts[r.uid]=apCounts[r.uid]||{perimeter_wrong:0,area_wrong:0};
        apCounts[r.uid][f]++;
      }
    });
  }); });
  Object.keys(apCounts).forEach(u=>{
    const c=apCounts[u], nm=nameOf(u); if(!nm) return;
    if(c.perimeter_wrong>=3 && c.perimeter_wrong>c.area_wrong*2)
      notes.push({score:62, k:'Specific gap', good:false, t:`${nm} gets area right but keeps missing perimeter.`});
    else if(c.area_wrong>=3 && c.area_wrong>c.perimeter_wrong*2)
      notes.push({score:62, k:'Specific gap', good:false, t:`${nm} gets perimeter right but keeps missing area.`});
  });

  const simplifyKids=Object.keys(simplifyCounts).filter(u=>simplifyCounts[u]>=3);
  if(simplifyKids.length){
    const names=simplifyKids.map(nameOf).filter(Boolean);
    notes.push({score:58, k:'Worth a reminder', good:false,
      t: (simplifyKids.length===1 && names.length) ? `${names[0]} keeps leaving fractions unsimplified.`
        : `${simplifyKids.length} students keep leaving fractions unsimplified.`});
  }

  if(afterHoursNames.length){
    notes.push({score:55+afterHoursNames.length, k:'Nobody asked them to', good:true,
      t:afterHoursNames.length===1 ? afterHoursNames[0]+' practised after hours this week.'
        : afterHoursNames.length+' students practised after hours this week.'});
  }

  const quiet = roster.filter(u=>!activeUids.has(u));
  if(quiet.length && roster.length){
    const names = quiet.map(nameOf).filter(Boolean);
    notes.push({score:60+quiet.length, k:'Gone quiet', good:false,
      t: (quiet.length===1 && names.length) ? names[0]+' — nothing all week.'
        : quiet.length+" students haven't touched it this week"+(names.length?'. '+names.slice(0,2).join(', ')+(quiet.length>2?' and others':''):'')+'.'});
  }

  if(!notes.length && scored.length>=3){
    const best=[...scored].sort((a,b)=>(b.score/b.total)-(a.score/a.total))[0];
    const nm=nameOf(best.uid);
    if(nm) notes.push({score:10, k:'Best this week', good:true, t:nm+' — '+best.score+' out of '+best.total+'.'});
  }

  // Additional observations, so the panel is rarely thin. Each is still only
  // added when it's actually true — the list shortens rather than inventing.
  try {
    const classStats=computeSkillStats(results, S.weeks, practice);
    const sw=pickStrengthsAndWeaknesses(classStats);
    const strong=sw.strengths[0];
    if(strong) notes.push({score:35, k:'Nailed it', good:true,
      t:'The class is at '+Math.round(strong.overallAccuracy*100)+'% on '+strong.title.toLowerCase()+' — safe to move on.'});
    const untouched=classStats.filter(sk=>sk.total===0).length;
    if(untouched>0 && untouched<20) notes.push({score:15, k:'Not covered yet', good:false,
      t:untouched+' of the 20 topics have not been attempted at all yet.'});
  } catch(e){}

  // Best scorer, even when other insights exist (lower priority).
  if(scored.length>=3 && !notes.some(n=>n.k==='Best this week')){
    const best=[...scored].sort((a,b)=>(b.score/b.total)-(a.score/a.total))[0];
    const nm=nameOf(best.uid);
    if(nm) notes.push({score:25, k:'Best result', good:true,
      t:nm+' — '+best.score+' out of '+best.total+' on '+(best.weekLabel||'their latest set')+'.'});
  }

  // Busiest student by volume of activity this week.
  if(last7.length>=5){
    const tally={};
    last7.forEach(r=>{ tally[r.uid]=(tally[r.uid]||0)+1; });
    const topUid=Object.keys(tally).sort((a,b)=>tally[b]-tally[a])[0];
    const nm=nameOf(topUid);
    if(nm && tally[topUid]>=3) notes.push({score:30, k:'Putting the work in', good:true,
      t:nm+' has done '+tally[topUid]+' activities this week — more than anyone.'});
  }

  // Whole-class momentum, week on week.
  if(prev7.length>0 && last7.length>0){
    const pct=Math.round((last7.length-prev7.length)/prev7.length*100);
    if(Math.abs(pct)>=20) notes.push({score:45, k: pct>0?'Picking up':'Easing off', good: pct>0,
      t:'Activity is '+(pct>0?'up':'down')+' '+Math.abs(pct)+'% on last week.'});
  }

  // Students with no results at all yet — different from having gone quiet.
  const never = roster.filter(u=>!everything.some(r=>r.uid===u));
  if(never.length){
    const names=never.map(nameOf).filter(Boolean);
    notes.push({score:65, k:'Never started', good:false,
      t: never.length===1 && names.length ? names[0]+' has never used it.'
        : never.length+' students have never used it'+(names.length?', including '+names.slice(0,2).join(' and '):'')+'.'});
  }

  // How the most recent published set is landing — the most useful thing to
  // know when there isn't yet much history to draw on.
  const published=(S.weeks||[]).filter(w=>w.status!=='archived' && w.status!=='draft');
  if(published.length && roster.length){
    const latest=published.slice().sort((a,b)=>
      ((b.createdAt&&b.createdAt.seconds)||0)-((a.createdAt&&a.createdAt.seconds)||0))[0];
    const did=new Set(results.filter(r=>r.weekId===latest.id).map(r=>r.uid)).size;
    const pct=Math.round(did/roster.length*100);
    if(did<roster.length) notes.push({score:80, k:'Still outstanding', good:false,
      t:(roster.length-did)+' of '+roster.length+" haven't done "+(latest.label||'the latest set')+' yet.'});
    else notes.push({score:50, k:'All in', good:true,
      t:'Every student has finished '+(latest.label||'the latest set')+'.'});
  }

  // Keep one of each kind so the panel doesn't fill with five near-identical
  // per-student notes, then show the strongest five.
  const seen={};
  const show = notes.sort((a,b)=>b.score-a.score)
    .filter(n=>{ if(seen[n.k]) return false; seen[n.k]=1; return true; })
    .slice(0,5);
  if(show.length){
    const nc=el(`<div class="mmc-card">
      <div class="meta" style="font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;">Worth knowing</div>
      ${show.map(n=>`<div style="border-left:3px solid ${n.good?'#2E7D4F':'#FF7A1A'};padding:1px 0 1px 15px;margin-top:16px;">
        <div class="meta" style="font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-bottom:1px;color:${n.good?'#2E7D4F':'#8A6008'};">${esc(n.k)}</div>
        <div style="font-size:17px;font-weight:600;letter-spacing:-.01em;">${esc(n.t)}</div></div>`).join('')}
    </div>`);
    wrap.appendChild(nc);
  }

  const acts=el(`<div class="mmc-row" style="margin-top:4px;">
    <button class="mmc-btn gold" data-go="${roster.length?'ledger':'students'}">${roster.length?'Open gradebook':'Add students'}</button>
    <button class="mmc-btn ghost" data-go="weeks">Set a new week</button>
  </div>`);
  acts.querySelectorAll('[data-go]').forEach(b=>{ b.onclick=()=>{ S.teacherTab=b.dataset.go; render(); }; });
  wrap.appendChild(acts);
  return wrap;
}


// ---------- Preview as a student ----------
// Lets a teacher walk through exactly what a given child sees — the same sets,
// the same difficulty, their own dashboard. Every Firestore write is blocked by
// the guard at the top of this file, so nothing they do here touches the child's
// record. The teacher's own identity is untouched; only what's rendered changes.
function startStudentPreview(uid){
  S.previewStudentUid = uid;
  S.previewSaved = {
    profile: S.profile,
    skillPracticeRecords: S.skillPracticeRecords,
    activeWeekId: S.activeWeekId,
    quiz: S.quiz,
    studentTab: S.studentTab,
  };
  // Borrow the student's profile so difficulty targeting, groups and theme all
  // behave exactly as they do for them.
  S.profile = Object.assign({}, S.profiles[uid] || {});
  S.skillPracticeRecords = (S.allSkillPracticeRecords||[]).filter(r=>r.uid===uid);
  S.activeWeekId = null; S.quiz = {}; S.studentTab = 'dashboard';
  render();
}
function endStudentPreview(){
  const saved = S.previewSaved || {};
  S.previewStudentUid = null;
  S.profile = saved.profile || S.profile;
  S.skillPracticeRecords = saved.skillPracticeRecords || [];
  S.activeWeekId = saved.activeWeekId || null;
  S.quiz = saved.quiz || {};
  S.studentTab = saved.studentTab || 'dashboard';
  S.previewSaved = null;
  render();
}

// Sets a colleague's password directly, for when a setup link can't get through.
// The password is shown once here and never stored — the admin passes it on and
// the teacher changes it themselves afterwards.
async function setTeacherPasswordFlow(email, name, btnEl){
  const suggestion = pick(PASSWORD_WORDS)+randInt(100,999);
  const pw = prompt(
    `Set a password for ${name||email}.\n\n`+
    `They can change it once they're signed in. Tell them in person or by text —\n`+
    `don't email it alongside their username.\n\n`+
    `At least 6 characters:`, suggestion);
  if(pw===null) return;
  if(String(pw).length<6){ S.toast='Password must be at least 6 characters.'; render(); return; }
  const original = btnEl ? btnEl.textContent : '';
  if(btnEl){ btnEl.disabled=true; btnEl.textContent='Setting…'; }
  try{
    const call = httpsCallable(functions, 'setTeacherPassword');
    await call({ email, password: pw });
    S.setTeacherPwResult = { email, name, password: pw };
  }catch(e){
    S.toast = 'Could not set the password: '+(e.message||'unknown error');
  }
  if(btnEl){ btnEl.disabled=false; btnEl.textContent=original; }
  render();
}
function renderTeacherPwCard(){
  const r = S.setTeacherPwResult;
  if(!r) return null;
  const card=el(`<div class="mmc-card mmc-notice" style="margin-bottom:14px;">
    <h3>Password set for ${esc(r.name||r.email)}</h3>
    <div class="meta">Shown once — it isn't stored anywhere. Pass it on in person, by text or on Teams, and ask them to change it after signing in.</div>
    <div class="mmc-row" style="align-items:center;gap:10px;margin-top:10px;">
      <code class="mmc-code" style="font-size:18px;padding:8px 14px;">${esc(r.password)}</code>
      <button class="mmc-btn gold sm" id="mmc-pw-copy">Copy password</button>
      <button class="mmc-btn ghost sm" id="mmc-pw-done">Done</button>
    </div>
    <div class="meta" style="margin-top:8px;">They sign in at <b>mathmentum.com.au</b> with <b>${esc(r.email)}</b>.</div>
  </div>`);
  card.querySelector('#mmc-pw-copy').onclick=async ()=>{
    try{ await navigator.clipboard.writeText(r.password); }catch(e){}
    S.toast='Password copied.'; render();
  };
  card.querySelector('#mmc-pw-done').onclick=()=>{ S.setTeacherPwResult=null; render(); };
  return card;
}


// ---------- Change your own password ----------
// Firebase requires a recent sign-in before it will change a password, so the
// current one is verified by re-authenticating rather than simply trusted. That
// also stops someone changing the password on a machine left signed in.
function renderChangePasswordCard(){
  const card=el(`<div class="mmc-card">
    <h3>Change your password</h3>
    <div class="meta">Signed in as ${esc((S.user&&S.user.email)||'')}. Use at least 6 characters.</div>
    ${S.pwChangeMsg ? `<div class="mmc-autherr" style="${S.pwChangeOk?'background:#E7F9EE;border-color:#2E9E4F;color:#1E6B37;':''}">${esc(S.pwChangeMsg)}</div>` : ''}
    <div class="mmc-field"><label>Current password</label><input type="password" id="mmc-pw-old" autocomplete="current-password"></div>
    <div class="mmc-field"><label>New password</label><input type="password" id="mmc-pw-new" autocomplete="new-password"></div>
    <div class="mmc-field"><label>Confirm new password</label><input type="password" id="mmc-pw-new2" autocomplete="new-password"></div>
    <button class="mmc-btn gold" id="mmc-pw-save">Change password</button>
  </div>`);
  const btn=card.querySelector('#mmc-pw-save');
  btn.onclick=async ()=>{
    const oldPw=card.querySelector('#mmc-pw-old').value;
    const a=card.querySelector('#mmc-pw-new').value;
    const b=card.querySelector('#mmc-pw-new2').value;
    S.pwChangeOk=false;
    if(!oldPw){ S.pwChangeMsg='Enter your current password.'; render(); return; }
    if(a.length<6){ S.pwChangeMsg='Your new password needs at least 6 characters.'; render(); return; }
    if(a!==b){ S.pwChangeMsg="The two new passwords don't match."; render(); return; }
    if(a===oldPw){ S.pwChangeMsg='That is already your password — choose a different one.'; render(); return; }
    btn.disabled=true; btn.textContent='Changing…';
    try{
      const cred = EmailAuthProvider.credential(S.user.email, oldPw);
      await reauthenticateWithCredential(auth.currentUser, cred);
      await updatePassword(auth.currentUser, a);
      S.pwChangeOk=true;
      S.pwChangeMsg='Password changed. Use the new one next time you sign in.';
    }catch(e){
      const code = (e && e.code) || '';
      S.pwChangeMsg =
        code.includes('wrong-password') || code.includes('invalid-credential')
          ? 'That current password is not right.'
        : code.includes('weak-password') ? 'That password is too weak — try a longer one.'
        : code.includes('too-many-requests') ? 'Too many attempts — wait a few minutes and try again.'
        : 'Could not change your password: '+(e.message||'unknown error');
    }
    btn.disabled=false; btn.textContent='Change password';
    render();
  };
  return card;
}


// Signed in, but not yet approved as a teacher. Without this they'd fall through
// to the student view, which expects a student profile and shows nothing useful.
// Students are excluded by their address: they use the internal students domain,
// never a real email.
function isAwaitingApproval(){
  if(!S.user || S.isTeacher) return false;
  const em = String(S.user.email||'');
  if(!em || em.endsWith('@'+STUDENT_DOMAIN)) return false;
  return true;
}
function renderAwaitingApproval(){
  const wrap=el('<div></div>');
  wrap.appendChild(el(`
    <div class="mmc-pitch">
      <div class="mmc-pitch-mark"><span>Math</span><span class="o">mentum</span></div>
      <p class="mmc-pitch-line">You're all set — just waiting on approval.</p>
      <div class="mmc-pitch-grid" style="grid-template-columns:1fr;">
        <div class="pp pp1"><b>Your account is ready</b><span>The password you chose works. Nothing else to set up.</span></div>
        <div class="pp pp2"><b>An admin is reviewing you</b><span>Usually quick. You'll be able to sign in as soon as they approve.</span></div>
        <div class="pp pp3"><b>No email to wait for</b><span>Just come back and sign in, or press Check again below.</span></div>
      </div>
    </div>
  `));
  wrap.appendChild(el(`<div class="mmc-card"><div class="meta">Signed in as <b>${esc(S.user.email||'')}</b>.</div></div>`));
  const row=el('<div class="mmc-row" style="margin-top:10px;gap:8px;"></div>');

    back.onclick=(e)=>{ e.preventDefault(); S.viewingStudentDashboardUid=null; render(); };
    wrap.appendChild(back);
    const dashWrap=el('<div style="margin-top:10px;"></div>');
    dashWrap.appendChild(renderStudentDashboard({
      forTeacher:true,
      studentName: (S.profiles[uid]&&S.profiles[uid].displayName) || uid,
      results: S.results.filter(r=>r.uid===uid),
      weeks: S.weeks,
      skillPracticeRecords: S.allSkillPracticeRecords.filter(r=>r.uid===uid),
      ttAttempts: (S.ttAttempts||[]).filter(a=>a.uid===uid),
    }));
    wrap.appendChild(dashWrap);
    return wrap;
  }
  const wrap=el('<div></div>');
  // The old full-width "Viewing:" banner is gone — class selection now lives
  // inline inside the tabs that actually need it (see renderClassPicker).
  const pendingCount = (S.pendingTeacherRequests||[]).length;
  const tabs=el(`<div class="mmc-tabs"><button class="mmc-tab" data-t="home">Home</button><button class="mmc-tab" data-t="weeks">Practice sets</button><button class="mmc-tab" data-t="ledger">Gradebook</button><button class="mmc-tab" data-t="activity">Activity</button><button class="mmc-tab" data-t="students">Students</button><button class="mmc-tab" data-t="teachers">Teachers${pendingCount?` (${pendingCount})`:''}</button><button class="mmc-tab" data-t="live">Racing Ground</button></div>`);
  tabs.querySelectorAll('.mmc-tab').forEach(b=>{ if(b.dataset.t===S.teacherTab) b.classList.add('active');
    b.onclick=()=>{ S.teacherTab=b.dataset.t; render(); }; });
  wrap.appendChild(tabs);
  wrap.appendChild(
    S.teacherTab==='home' ? renderTeacherHome() :
    S.teacherTab==='weeks' ? renderTeacherWeeks() :
    S.teacherTab==='ledger' ? renderLedger() :
    S.teacherTab==='activity' ? renderTeacherActivity() :
    S.teacherTab==='students' ? renderStudentsTab('students') :
    S.teacherTab==='teachers' ? renderStudentsTab('teachers') :
    S.teacherTab==='timetable' ? renderLedger() : renderTeacherLiveGame()
  );
  return wrap;
}

// How many students have already completed this set. Deleting a set with results
// would orphan them — the results keep a weekId pointing at nothing, so they
// vanish from the gradebook and quietly skew every trend and insight that uses
// them. That's why delete is only offered when the count is zero.
function weekResultCount(week){
  return (S.results||[]).filter(r=>r.weekId===week.id).length;
}

// ---------- Auto-archive ----------
// Finished sets clutter the page for both teacher and student. A set retires
// itself once EVERY student in its audience has completed it, or after 21 days —
// whichever comes first. The age rule matters: without it, one child who is away
// (or never does it) would keep a set live indefinitely, which is exactly the
// mess auto-archiving is meant to prevent. Archiving only hides it; all results
// stay in the gradebook and every report.
const AUTO_ARCHIVE_DAYS = 21;
let autoArchiveRunning = false;
async function runAutoArchive(){
  if(autoArchiveRunning) return;
  if(!S.user || !S.isTeacher) return;
  autoArchiveRunning = true;
  try{
    const now = Date.now();
    const roster = Object.keys(S.profiles||{});
    for(const w of (S.weeks||[])){
      if(w.status!=='published') continue;
      if(w.autoArchiveOff) continue;          // teacher explicitly kept it live
      const created = (w.createdAt && w.createdAt.seconds) ? w.createdAt.seconds*1000 : null;
      const ageDays = created ? (now-created)/86400000 : 0;
      // Who this set was actually aimed at — archiving on "everyone" would never
      // fire for a set targeted at one ability group.
      const audience = roster.filter(uid=>{
        const p=S.profiles[uid]; if(!p||!p.username) return false;
        if(Array.isArray(w.classIds) && w.classIds.length && p.classId && w.classIds.indexOf(p.classId)===-1) return false;
        if(Array.isArray(w.targetGroups) && w.targetGroups.length){
          const g = p.group || 'mainstream';
          if(w.targetGroups.indexOf(g)===-1) return false;
        }
        return true;
      });
      const done = new Set((S.results||[]).filter(r=>r.weekId===w.id).map(r=>r.uid));
      const everyoneDone = audience.length>0 && audience.every(uid=>done.has(uid));
      const tooOld = ageDays >= AUTO_ARCHIVE_DAYS;
      if(!everyoneDone && !tooOld) continue;
      try{
        await updateDoc(doc(db,'weeks',w.id), {
          status:'archived', scheduledAt:null,
          archivedAutomatically:true,
          archivedReason: everyoneDone ? 'all_completed' : 'age',
        });
      }catch(e){ /* a failed archive is harmless — it retries next render */ }
    }
  } finally { autoArchiveRunning = false; }
}

async function deleteWeekAction(week){
  const n = weekResultCount(week);
  if(n>0){
    S.toast = `"${week.label}" has ${n} result${n===1?'':'s'} saved against it, so it can't be deleted. Archive it instead — the data stays in your reports.`;
    render(); return;
  }
  if(!confirm(`Permanently delete "${week.label}"? No students have done it, so no results are lost. This can't be undone.`)) return;
  try{ await deleteDoc(doc(db,'weeks',week.id)); }catch(e){ S.toast='Could not delete — check your connection.'; render(); }
}
function archivedReasonLabel(week){

    ? `Archive "${week.label}"? Students will no longer be able to access it. You can restore it any time from Archived Sets.`

// Builds one full copy of the week's control panel (Edit/Publish/Archive/Delete + the
// scheduler). Called twice per card (top and bottom) so teachers reviewing a long set can
// act from wherever they are — but every button here wires back to the SAME shared action
// functions above, so there is exactly one place the actual publish/archive/schedule/delete
// logic lives, not a duplicated copy per location.
function buildWeekControlPanel(week, isEditing, suffix){
  const live = isWeekLive(week);
  const isScheduled = week.status==='draft' && week.scheduledAt && !live;
  const panel=el('<div></div>');
  const btnRow=el('<div class="mmc-row"></div>');
  if(week.status==='draft'){
    const editBtn=el(`<button class="mmc-btn ghost sm">${isEditing?'Close':'Edit'}</button>`);
    editBtn.onclick=()=>{ S.editingDraftId = isEditing? null : week.id; render(); };
    btnRow.appendChild(editBtn);
  }
  if(week.status==='draft' && !live){
    const pubBtn=el('<button class="mmc-btn gold sm">Publish now</button>');
    pubBtn.onclick=()=>publishWeek(week);
    btnRow.appendChild(pubBtn);
  }
  const archiveBtn=el('<button class="mmc-btn ghost sm">Archive</button>');
  archiveBtn.onclick=()=>archiveWeekAction(week);
  btnRow.appendChild(archiveBtn);
  if(week.status==='published'){
    // Escape hatch: a set a teacher wants left up (revision, a catch-up week)
    // shouldn't be retired out from under them by the automatic rule.
    const keepBtn=el(`<button class="mmc-btn ghost sm">${week.autoArchiveOff?'Auto-archive off':'Keep live'}</button>`);
    keepBtn.onclick=async ()=>{
      try{ await updateDoc(doc(db,'weeks',week.id), { autoArchiveOff: !week.autoArchiveOff });
        S.toast = week.autoArchiveOff ? 'This set will auto-archive again when everyone finishes.' : 'This set will stay live until you archive it.';
      }catch(e){ S.toast='Could not update — check your connection.'; }
      render();
    };
    btnRow.appendChild(keepBtn);
  }
  const doneCount = weekResultCount(week);
  if(doneCount===0){
    const deleteBtn=el('<button class="mmc-btn danger sm">Delete</button>');
    deleteBtn.onclick=()=>deleteWeekAction(week);
    btnRow.appendChild(deleteBtn);
  } else {
    btnRow.appendChild(el(`<span class="meta" style="align-self:center;">${doneCount} result${doneCount===1?'':'s'} saved — archive to keep the data</span>`));
  }
  panel.appendChild(btnRow);
  if(week.status==='draft' && !live){
    const inputId=`mmc-sched-${week.id}-${suffix}`;
    const schedRow=el(`
      <div class="mmc-row" style="margin-top:10px;padding-top:10px;border-top:1px solid var(--paper-line);">
        <div class="mmc-field" style="margin-bottom:0;flex:1;min-width:200px;"><label>Auto-activate at</label>
          <input type="datetime-local" id="${inputId}" value="${week.scheduledAt ? new Date((week.scheduledAt.seconds||0)*1000 - new Date().getTimezoneOffset()*60000).toISOString().slice(0,16) : ''}"></div>
        <button class="mmc-btn ghost sm" data-act="schedule">${isScheduled?'Update schedule':'Schedule'}</button>
        ${isScheduled ? '<button class="mmc-btn ghost sm" data-act="unschedule">Cancel schedule</button>' : ''}
      </div>
    `);
    const schedInput=schedRow.querySelector(`#${inputId}`);
    schedRow.querySelector('[data-act="schedule"]').onclick=()=>scheduleWeekAction(week, schedInput.value);
    const unschedBtn=schedRow.querySelector('[data-act="unschedule"]');
    if(unschedBtn) unschedBtn.onclick=()=>unscheduleWeekAction(week);
    panel.appendChild(schedRow);
  }
  return panel;
}

// ---------- Hidden questions ----------
// A teacher can hold a question back — usually because they haven't taught that
// skill yet. Hidden questions are removed from the student's set entirely (so a
// 24-question week becomes 23 and the numbering they see is contiguous), but
// stay visible and greyed in the gradebook so the column doesn't silently
// disappear from the class record.
function isQuestionHidden(week, q){
  return !!(week && Array.isArray(week.hiddenQIds) && week.hiddenQIds.indexOf(q.id)!==-1);
}
function visibleQuestions(week){
  return (week.questions||[]).filter(q=>!isQuestionHidden(week,q));
}
async function toggleQuestionHidden(week, q){
  const hidden = Array.isArray(week.hiddenQIds) ? week.hiddenQIds.slice() : [];
  const i = hidden.indexOf(q.id);
  if(i===-1) hidden.push(q.id); else hidden.splice(i,1);
  week.hiddenQIds = hidden;
  try{ await updateDoc(doc(db,'weeks',week.id), { hiddenQIds: hidden }); }
  catch(e){ S.toast='Could not update — check your connection.'; }
  render();
}

function renderQuestionEditor(week){
  const box=el('<div style="margin-top:12px;"></div>');
  async function saveQuestions(){
    try{ await updateDoc(doc(db,'weeks',week.id), {questions:week.questions}); }
    catch(e){ S.toast='Could not save changes — check your connection.'; render(); }
  }
  (week.questions||[]).forEach((q,i)=>{
    const isStructured = !!(q.svg || q.inputType==='choice' || q.inputType==='coins' || q.inputType==='order' || q.inputType==='fracEasy' || q.inputType==='fracHard' || q.inputType==='classify' || q.inputType==='parts' || q.inputType==='multi');
    const row=el(`
      <div class="mmc-qedit${isQuestionHidden(week,q)?' hidden-q':''}">
        <div class="idx">Q${i+1} — ${esc(q.title||'Question')}${q.strategyLabel?` (${esc(q.strategyLabel)})`:''}${isQuestionHidden(week,q)?' <span class="hidetag">HIDDEN</span>':''}</div>
        ${q.svg ? `<div class="mmc-qsvg">${q.svg}</div>` : ''}
        <div class="label2">Question</div>
        <textarea rows="2" data-f="prompt">${esc(q.prompt)}</textarea>
        ${q.inputType==='choice' ? `
          <div class="label2">Correct answer</div>
          <select data-f="answer">${(q.choices||[]).map(c=>`<option value="${esc(c)}" ${c===q.answer?'selected':''}>${esc(c)}</option>`).join('')}</select>
        ` : q.inputType==='coins' ? `
          <div class="label2">Target amount</div>
          <div class="meta" style="margin-bottom:8px;">${esc(fmtCents(q.targetCents))} · ${(q.coins||[]).length} coins shown${q.minCoins!=null?` · must use exactly ${q.minCoins} piece${q.minCoins===1?'':'s'}`:''} — use Regenerate for a different amount.</div>
        ` : q.inputType==='order' ? `
          <div class="label2">Correct order</div>
          <div class="meta" style="margin-bottom:8px;">${esc((q.answer||'').split(',').join(' → '))} — use Regenerate for different numbers.</div>
        ` : q.inputType==='fracEasy' ? `
          <div class="label2">Fraction</div>
          <div class="meta" style="margin-bottom:8px;">${esc(q.givenNum)}/${esc(q.givenDen)} = ?/${esc(q.targetDen)} · answer: ${esc(q.answer)} — use Regenerate for different numbers.</div>
        ` : q.inputType==='fracHard' ? `
          <div class="label2">Fraction to simplify</div>
          <div class="meta" style="margin-bottom:8px;">${esc(q.givenNum)}/${esc(q.givenDen)} → ${esc(q.answer)} — use Regenerate for different numbers.</div>
        ` : q.inputType==='parts' ? `
          <div class="label2">Answer boxes</div>
          <div class="meta" style="margin-bottom:8px;">${esc(q.partsLead||'')} ${(q.parts||[]).map(p=>p.label?`[${esc(p.label)}]`:'[ ]').join(' '+esc(q.partsJoin||'')+' ')} ${esc(q.partsTail||'')} &nbsp;→&nbsp; ${esc(String(q.answer).split(',').join(' , '))}</div>
        ` : q.inputType==='multi' ? `
          <div class="label2">Select all that apply</div>
          <div class="meta" style="margin-bottom:8px;">Options: ${(q.choices||[]).map(esc).join(', ')} &nbsp;→&nbsp; correct: ${esc(String(q.answer).split(',').join(', '))}</div>
        ` : q.inputType==='classify' ? `
          <div class="label2">Angles to classify</div>
          <div class="meta" style="margin-bottom:8px;">${(q.items||[]).map(it=>`${esc(it.deg)}° = ${esc(it.correct)}`).join(', ')} — use Regenerate for different angles.</div>
        ` : `
          <div class="label2">Answer</div>
          <input type="text" data-f="answer" value="${esc(q.answer)}">
        `}
        <div class="label2">Explanation (shown after they answer)</div>
        <input type="text" data-f="explanation" value="${esc(q.explanation||'')}">
        <div class="mmc-row" style="margin-top:6px;">
          <button class="mmc-btn ghost sm" data-act="regen">↻ Regenerate</button>
          <button class="mmc-btn ghost sm" data-act="hide">${isQuestionHidden(week,q)?'Show to students':'Hide from students'}</button>
          <button class="mmc-btn danger sm" data-act="rm">Remove question</button>
        </div>
      </div>
    `);
    row.querySelector('[data-f="prompt"]').onchange=(e)=>{ q.prompt=e.target.value; saveQuestions(); };
    const answerEl=row.querySelector('[data-f="answer"]');
    if(answerEl) answerEl.onchange=(e)=>{ q.answer=e.target.value; saveQuestions(); };
    row.querySelector('[data-f="explanation"]').onchange=(e)=>{ q.explanation=e.target.value; saveQuestions(); };
    row.querySelector('[data-act="hide"]').onclick=()=>toggleQuestionHidden(week,q);
    row.querySelector('[data-act="rm"]').onclick=()=>{ week.questions=week.questions.filter(x=>x.id!==q.id); saveQuestions(); render(); };
    row.querySelector('[data-act="regen"]').onclick=()=>{
      // Restore the set's own overrides so regenerating one question keeps the
      // same question family the rest of the set was built with.
      const prevRot=S.rotationOverride, prevTime=S.timeOverride;
      S.rotationOverride = week.rotationOverride||null; S.timeOverride = week.timeOverride||null;
      const fresh = q.slot ? buildQuestion(q.slot-1, week.difficulty, q.strategyKey) : q;
      S.rotationOverride=prevRot; S.timeOverride=prevTime;
      Object.assign(q, fresh, {id:q.id});
      saveQuestions(); render();
    };
    box.appendChild(row);
  });
  return box;
}

function formatGivenAnswer(ans, q){
  if(!ans) return '(no answer recorded)';
  const given=ans.given;
  if(q.inputType==='coins'){
    if(!Array.isArray(given)) return String(given==null?'':given);
    const labels=(q.coins||[]).filter(c=>given.includes(c.id)).map(c=>c.l);
    return labels.length? labels.join(' + ') : '(no coins selected)';
  }
  if(q.inputType==='order'){
    return given? String(given).split(',').join(' → ') : '(not completed)';
  }
  return given==null || given==='' ? '(left blank)' : String(given);
}
function formatCorrectAnswer(q){
  if(q.inputType==='coins') return `${fmtCents(q.targetCents)}${q.minCoins!=null?` in exactly ${q.minCoins} piece${q.minCoins===1?'':'s'}`:''}`;
  if(q.inputType==='order') return (q.answer||'').split(',').join(' → ');
  return q.answer;
}
function renderGradebookDetail(){
  const d=S.gradebookDetail;
  if(!d) return null;
  if(d.type==='week'){
    const week=S.weeks.find(w=>w.id===d.weekId);
    const q=week && (week.questions||[]).find(x=>x.id===d.qId);
    if(!week || !q) return null;
    const rec=S.results.find(r=>r.uid===d.uid && r.weekId===d.weekId);
    const ans=rec && (rec.answers||[]).find(a=>a.qId===d.qId);
    const studentName=(S.profiles[d.uid]&&S.profiles[d.uid].displayName)||d.uid;
    const card=el(`
      <div class="mmc-card" style="border-color:var(--purple);">
        <div class="mmc-row" style="justify-content:space-between;align-items:flex-start;">
          <h3>Q${q.slot} — ${esc(q.title||'')} · ${esc(studentName)}</h3>
          <button class="mmc-btn ghost sm" id="mmc-gb-close">✕ Close</button>
        </div>
      </div>
    `);
    if(q.svg) card.querySelector('h3').insertAdjacentHTML('afterend', `<div class="mmc-qsvg">${q.svg}</div>`);
    card.appendChild(el(`<div class="qtext" style="margin:8px 0 12px;">${esc(q.prompt)}</div>`));
    const answerRow=el(`
      <div class="mmc-row" style="gap:24px;">
        <div><div class="label2">Student's answer</div><div style="font-weight:700;color:${ans&&ans.correct?'var(--correct)':'var(--incorrect)'};">${esc(formatGivenAnswer(ans,q))}</div></div>
        <div><div class="label2">Correct answer</div><div style="font-weight:700;">${esc(formatCorrectAnswer(q))}</div></div>
      </div>
    `);
    card.appendChild(answerRow);
    if(q.explanation) card.appendChild(el(`<div class="meta" style="margin-top:10px;">${esc(q.explanation)}</div>`));
    card.querySelector('#mmc-gb-close').onclick=()=>{ S.gradebookDetail=null; render(); };
    return card;
  }
  if(d.type==='question'){
    const studentName=(S.profiles[d.uid]&&S.profiles[d.uid].displayName)||d.uid;
    const card=el(`
      <div class="mmc-card" style="border-color:var(--purple);">
        <div class="mmc-row" style="justify-content:space-between;">
          <h3>${esc(d.skill ? skillTitle(d.skill) : ('Q'+d.slot))} history · ${esc(studentName)}</h3>
          <button class="mmc-btn ghost sm" id="mmc-gb-close">✕ Close</button>
        </div>
      </div>
    `);
    card.querySelector('#mmc-gb-close').onclick=()=>{ S.gradebookDetail=null; render(); };
    const pubWeeks=S.weeks.filter(isWeekLive).sort((a,b)=>(a.createdAt?.seconds||0)-(b.createdAt?.seconds||0));
    let any=false;
    pubWeeks.forEach(w=>{
      // Match on skill when we have one — a Year 3 set and a Year 4 set put the same
      // skill at different slot numbers, so slot matching would show the wrong question.
      const q=(w.questions||[]).find(x=> d.skill ? skillOfQuestion(x)===d.skill : x.slot===d.slot);
      if(!q) return;
      const rec=S.results.find(r=>r.uid===d.uid && r.weekId===w.id);
      if(!rec) return;
      const ans=(rec.answers||[]).find(a=>a.qId===q.id);
      if(!ans) return;
      any=true;
      card.appendChild(el(`
        <div style="border-top:1px solid var(--paper-line);padding:10px 0;">
          <div class="meta" style="font-weight:700;">${esc(w.label)}</div>
          <div style="margin:4px 0;">${esc(q.prompt)}</div>
          <div class="mmc-row" style="gap:16px;">
            <div style="color:${ans.correct?'var(--correct)':'var(--incorrect)'};font-weight:700;">Answered: ${esc(formatGivenAnswer(ans,q))}</div>
            <div class="meta">Correct: ${esc(formatCorrectAnswer(q))}</div>
          </div>
        </div>
      `));
    });
    if(!any) card.appendChild(el('<div class="meta">No attempts yet.</div>'));
    return card;
  }
  return null;
}

function renderLedgerSummary(){
  const wrap=el('<div></div>');
  const pubWeeks = S.weeks.filter(isWeekLive).sort((a,b)=> (a.createdAt?.seconds||0)-(b.createdAt?.seconds||0));

  if(pubWeeks.length===0 || studentUids.length===0){
    wrap.appendChild(el('<div class="mmc-empty"><div class="mmc-empty-icon">📒</div>Once weeks are published and students sign up &amp; submit, results collect here automatically — live, from any device.</div>'));
    return wrap;
  }
  const tableWrap=el('<div class="mmc-ledger-wrap"></div>');
  const table=el('<table class="mmc-ledger"></table>');
  const thead=el('<thead><tr></tr></thead>');
  const trh=thead.querySelector('tr');
  trh.appendChild(el('<th>Student</th>'));
  pubWeeks.forEach(w=> trh.appendChild(el(`<th>${esc(w.label)}</th>`)));
  trh.appendChild(el('<th>Average</th>'));
  table.appendChild(thead);
  const tbody=el('<tbody></tbody>');
  studentUids.sort((a,b)=> (S.profiles[a].displayName||'').localeCompare(S.profiles[b].displayName||'')).forEach(uid=>{
    const tr=el('<tr></tr>');
    tr.appendChild(el(`<td>${esc(S.profiles[uid].displayName||S.profiles[uid].email)}</td>`));
    let sum=0, cnt=0;
    pubWeeks.forEach(w=>{
      const rec = S.results.find(r=>r.uid===uid && r.weekId===w.id);
      if(rec){ const pct = rec.total? rec.score/rec.total : 0; const cls = pct>=0.7?'good':(pct>=0.5?'mid':'low');
        sum+=pct; cnt++; tr.appendChild(el(`<td class="mmc-cellscore ${cls}">${rec.score}/${rec.total}</td>`)); }
      else tr.appendChild(el(`<td style="color:var(--ink-soft);">—</td>`));

function renderLedgerByWeek(){
  const wrap=el('<div></div>');
  const pubWeeks = S.weeks.filter(isWeekLive).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
  if(pubWeeks.length===0){ wrap.appendChild(el('<div class="mmc-empty"><div class="mmc-empty-icon">📒</div>No published weeks yet.</div>')); return wrap; }
  if(!S.gradebookWeekId || !pubWeeks.some(w=>w.id===S.gradebookWeekId)) S.gradebookWeekId=pubWeeks[0].id;

  const selectRow=el(`<div class="mmc-field" style="max-width:280px;margin-bottom:14px;"><label>Week</label>
    <select id="mmc-gb-week">${pubWeeks.map(w=>`<option value="${w.id}" ${w.id===S.gradebookWeekId?'selected':''}>${esc(w.label)}</option>`).join('')}</select></div>`);
  selectRow.querySelector('select').onchange=(e)=>{ S.gradebookWeekId=e.target.value; S.gradebookDetail=null; render(); };
  wrap.appendChild(selectRow);

  wrap.appendChild(el('<div class="meta" style="margin-bottom:10px;">Click any ✓ or ✗ to see the question and the student\'s answer.</div>'));
  const detail=renderGradebookDetail();
  if(detail && S.gradebookDetail && S.gradebookDetail.type==='week') wrap.appendChild(detail);

  const week = pubWeeks.find(w=>w.id===S.gradebookWeekId);
  const qidToSlot={}; (week.questions||[]).forEach(q=>{ qidToSlot[q.id]=q.slot; });
  const studentUids = classFilteredStudentUids().sort((a,b)=>(S.profiles[a].displayName||'').localeCompare(S.profiles[b].displayName||''));
  if(studentUids.length===0){ wrap.appendChild(el('<div class="mmc-empty">No students yet.</div>')); return wrap; }

  const tableWrap=el('<div class="mmc-ledger-wrap"></div>');
  const table=el('<table class="mmc-ledger"></table>');
  const thead=el('<thead><tr></tr></thead>');
  const trh=thead.querySelector('tr');
  trh.appendChild(el('<th>Student</th>'));
  // Driven by the week's OWN questions, not a hardcoded 20 — a 24-question week
  // was silently losing its last four columns. Hidden questions keep their
  // column, greyed, so the class record doesn't quietly change shape.
  const cols = (week.questions||[]).map((q,i)=>({ slot:q.slot||(i+1), title:q.title||('Q'+(i+1)), hidden:isQuestionHidden(week,q), n:i+1 }));
  cols.forEach(c=>trh.appendChild(el(
    `<th title="${esc(c.title)}${c.hidden?' (hidden from students)':''}"${c.hidden?' style="opacity:.4;"':''}>Q${c.n}</th>`)));
  trh.appendChild(el('<th>Overall</th>'));
  table.appendChild(thead);
  const tbody=el('<tbody></tbody>');
  studentUids.forEach(uid=>{
    const rec=S.results.find(r=>r.uid===uid && r.weekId===week.id);
    const tr=el('<tr></tr>');
    tr.appendChild(el(`<td>${esc(S.profiles[uid].displayName||uid)}</td>`));
    if(!rec){
      cols.forEach(c=>tr.appendChild(el(`<td style="color:var(--ink-soft);${c.hidden?'opacity:.4;':''}">—</td>`)));
      tr.appendChild(el('<td style="color:var(--ink-soft);">—</td>'));
    } else {
      const bySlot={}; (rec.answers||[]).forEach(a=>{ const slot=qidToSlot[a.qId]; if(slot) bySlot[slot]={correct:a.correct, qId:a.qId}; });
      for(const c of cols){
        const s=c.slot;
        const info=bySlot[s];
        if(!info){ tr.appendChild(el(`<td style="color:var(--ink-soft);${c.hidden?'opacity:.4;':''}" title="${c.hidden?'Hidden from students':'Not attempted'}">—</td>`)); continue; }
        const td=el('<td></td>');
        const btn=el(`<button type="button" style="background:none;border:none;cursor:pointer;font-weight:800;font-size:16px;color:${info.correct?'var(--correct)':'var(--incorrect)'};">${info.correct?'✓':'✗'}</button>`);
        btn.onclick=()=>{ S.gradebookDetail={type:'week', uid, weekId:week.id, qId:info.qId}; render(); };
        td.appendChild(btn);
        tr.appendChild(td);
      }
      const pct = rec.total? Math.round((rec.score/rec.total)*100) : 0;
      const cls = pct>=70?'good':(pct>=50?'mid':'low');
      tr.appendChild(el(`<td class="mmc-cellscore ${cls}">${pct}%</td>`));
    }
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  tableWrap.appendChild(table);
  wrap.appendChild(tableWrap);
  return wrap;
}

function renderLedgerByQuestion(){
  const wrap=el('<div></div>');
  wrap.appendChild(el('<div class="meta" style="margin-bottom:12px;">Accuracy per question, across every published week each student has completed. 🟩 80%+ · 🟧 50–79% · 🟥 under 50% · — not attempted yet. Click a cell to see the question history.</div>'));
  const detail=renderGradebookDetail();
  if(detail && S.gradebookDetail && S.gradebookDetail.type==='question') wrap.appendChild(detail);

  const pubWeeks = S.weeks.filter(isWeekLive);
  const qidToSlotByWeek={};
  // Keyed by SKILL CODE, not slot number. Once Year 3 sets exist alongside Year 4 ones,
  // "Q5" means Factors in one and Addition in the other — the same column would have been
  // averaging two different skills together. Skill codes are stable across years, which is
  // what the registry was built for, and it means a child's Addition history follows them
  // from Year 3 into Year 4 instead of resetting.
  pubWeeks.forEach(w=>{ const m={}; (w.questions||[]).forEach(q=>{ m[q.id]=skillOfQuestion(q); }); qidToSlotByWeek[w.id]=m; });

  const studentUids = classFilteredStudentUids().sort((a,b)=>(S.profiles[a].displayName||'').localeCompare(S.profiles[b].displayName||''));
  if(studentUids.length===0){ wrap.appendChild(el('<div class="mmc-empty">No students yet.</div>')); return wrap; }

  const tableWrap=el('<div class="mmc-ledger-wrap"></div>');
  const table=el('<table class="mmc-ledger"></table>');
  const thead=el('<thead><tr></tr></thead>');
  const trh=thead.querySelector('tr');
  trh.appendChild(el('<th>Student</th>'));
  // Columns are the skills actually present in these students' sets, in plan order, so a
  // Year 3 class shows 16 columns and a Year 4 class shows 24 — never a grid of dashes for
  // skills that year never sees. A mixed class shows the union.
  const present = new Set();
  pubWeeks.forEach(w=>(w.questions||[]).forEach(q=>{ const c=skillOfQuestion(q); if(c) present.add(c); }));
  const ordered = [];
  [3,4].forEach(y=>planForYear(y).forEach(c=>{ if(present.has(c) && ordered.indexOf(c)===-1) ordered.push(c); }));
  present.forEach(c=>{ if(ordered.indexOf(c)===-1) ordered.push(c); });   // retired skills last
  const COLS = ordered;
  const SLOT_COUNT = COLS.length;
  COLS.forEach((code,i)=> trh.appendChild(el(`<th title="${esc(skillTitle(code))}">Q${i+1}</th>`)));
  table.appendChild(thead);
  const tbody=el('<tbody></tbody>');

  const avgRow=el('<tr style="background:var(--bg);font-weight:700;"></tr>');
  avgRow.appendChild(el('<td>Class average</td>'));
  COLS.forEach((code)=>{
    let avgCorrect=0, avgTotal=0;
    S.results.forEach(rec=>{
      const map=qidToSlotByWeek[rec.weekId]; if(!map) return;
      (rec.answers||[]).forEach(a=>{ if(map[a.qId]===code){ avgTotal++; if(a.correct) avgCorrect++; } });
    });
    if(avgTotal===0) avgRow.appendChild(el('<td style="color:var(--ink-soft);">—</td>'));
    else {
      const pct=Math.round((avgCorrect/avgTotal)*100);
      const emoji = pct>=80?'🟩':(pct>=50?'🟧':'🟥');
      avgRow.appendChild(el(`<td title="${avgCorrect}/${avgTotal} correct across the class">${emoji} ${pct}%</td>`));
    }
  });
  tbody.appendChild(avgRow);

  studentUids.forEach(uid=>{
    const tr=el('<tr></tr>');
    tr.appendChild(el(`<td>${esc(S.profiles[uid].displayName||uid)}</td>`));
    const myResults = S.results.filter(r=>r.uid===uid);
    COLS.forEach((code)=>{
      let correctCount=0, total=0;
      myResults.forEach(rec=>{
        const map=qidToSlotByWeek[rec.weekId]; if(!map) return;
        (rec.answers||[]).forEach(a=>{ if(map[a.qId]===code){ total++; if(a.correct) correctCount++; } });
      });
      if(total===0){ tr.appendChild(el('<td style="color:var(--ink-soft);">—</td>')); }
      else {
        const pct=Math.round((correctCount/total)*100);
        const emoji = pct>=80?'🟩':(pct>=50?'🟧':'🟥');
        const td=el('<td></td>');
        const btn=el(`<button type="button" title="${correctCount}/${total} correct" style="background:none;border:none;cursor:pointer;font-weight:700;">${emoji} ${pct}%</button>`);
        btn.onclick=()=>{ S.gradebookDetail={type:'question', uid, skill:code}; render(); };
        td.appendChild(btn);
        tr.appendChild(td);
      }
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  tableWrap.appendChild(table);
  wrap.appendChild(tableWrap);
  return wrap;
}


function exportCSV(pubWeeks, studentUids){
  const header=['Student name','Email', ...pubWeeks.map(w=>w.label), 'Average %'];
  const rows=[header];
  studentUids.forEach(uid=>{
    const row=[S.profiles[uid].displayName||'', S.profiles[uid].email||''];
    let sum=0, cnt=0;
    pubWeeks.forEach(w=>{ const rec=S.results.find(r=>r.uid===uid && r.weekId===w.id);
      if(rec){ row.push(`${rec.score}/${rec.total}`); sum+= rec.total? rec.score/rec.total:0; cnt++; } else row.push(''); });
    row.push(cnt? Math.round((sum/cnt)*100) : '');
    rows.push(row);
  });
  const csv=rows.map(r=>r.map(c=>{ const s=String(c); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='weekly-maths-club-results.csv';
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}

function renderTeacherTimetable(){

    wrap.appendChild(el('<div class="mmc-empty"><div class="mmc-empty-icon">⏱️</div>No students yet — add some from the Students tab.</div>'));
    return wrap;
  }

  // Class picture first — it is what a teacher plans a lesson from.
  const cls=computeTTClassInsights(S.ttAttempts, studentUids);
  const clsCard=el('<div class="mmc-card" style="margin-bottom:14px;"><h3>🔍 What this class needs</h3></div>');
  if(!cls.length){
    clsCard.appendChild(el('<div class="meta">No shared pattern yet. This fills in once students have done a few sessions — it only counts something when two or more students show the same gap.</div>'));
  } else {
    cls.forEach(g=>{
      const names=g.students.map(u=>(S.profiles[u]&&S.profiles[u].displayName)||'?').join(', ');
      const kind = (g.kinds.wrong||0) >= (g.kinds.slow||0) ? 'getting these wrong' : 'accurate but slow';
      clsCard.appendChild(el(`<div style="border-top:2px solid var(--paper-line);padding:9px 0;">
        <div style="font-weight:800;">${g.count} student${g.count===1?'':'s'} — ${esc(ttGroupLabel(g.op,g.table))}</div>
        <div class="meta">Mostly ${esc(kind)}. ${esc(names)}</div></div>`));
    });
  }
  wrap.appendChild(clsCard);

  const tableWrap=el('<div class="mmc-ledger-wrap"></div>');
  const table=el(`<table class="mmc-ledger"><thead><tr><th>Student</th><th>Status</th><th>Focus</th><th>Best Easy</th><th>Best Medium</th><th>Best Hard</th><th>Attempts</th><th>Last attempt</th></tr></thead><tbody></tbody></table>`);
  const tbody=table.querySelector('tbody');
  studentUids.forEach(uid=>{
    const mine=S.ttAttempts.filter(a=>a.uid===uid);
    const bestOf=(lvl)=>{ const at=mine.filter(a=>a.level===lvl); if(!at.length) return '—';
      const best=at.reduce((b,a)=>a.score>b.score?a:b, at[0]); return `${best.score}/${best.attempted} (${best.accuracy}%)`; };
    const last=mine.slice().sort((a,b)=>(b.submittedAt?.seconds||0)-(a.submittedAt?.seconds||0))[0];
    const lastStr = last && last.submittedAt?.seconds ? new Date(last.submittedAt.seconds*1000).toLocaleDateString() : '—';
    const tier = computeBadgeInfo(mine, S.profiles[uid]).tier;
    const ins = computeTTInsights(mine);
    const top = ins.items[0];
    // Anything recorded before per-question tracking existed carries no detail, so an
    // empty cell means "not measured yet", not "nothing wrong". Say which.
    const focus = top ? esc(ttInsightShort(top))
      : (ins.hasData ? '<span style="color:var(--ink-soft);">nothing flagged</span>'
                     : '<span style="color:var(--ink-soft);">no data yet</span>');
    const tr=el(`<tr style="cursor:pointer;"><td>${esc(S.profiles[uid].displayName||uid)}</td><td>${tier.emoji} ${esc(tier.label)}</td><td>${focus}</td><td>${esc(bestOf('easy'))}</td><td>${esc(bestOf('medium'))}</td><td>${esc(bestOf('hard'))}</td><td>${mine.length}</td><td>${esc(lastStr)}</td></tr>`);
    tr.onclick=()=>{ S.ttDetailUid = (S.ttDetailUid===uid? null : uid); render(); };
    tbody.appendChild(tr);
    if(S.ttDetailUid===uid) tbody.appendChild(renderTTStudentDetailRow(uid, mine, ins));
  });
  table.appendChild(tbody);
  tableWrap.appendChild(table);
  wrap.appendChild(tableWrap);

  return wrap;
}

// The expandable row. Written as full sentences deliberately — a teacher needs something
// they can read out to a child or a parent, not an abbreviation only the app understands.
function renderTTStudentDetailRow(uid, mine, ins){
  const name=(S.profiles[uid]&&S.profiles[uid].displayName)||'This student';
  const first=name.split(/\s+/)[0];
  const tr=el('<tr></tr>');
  const td=el('<td colspan="8" style="background:var(--bg);padding:14px 16px;"></td>');
  if(!ins.items.length){
    td.appendChild(el(`<div class="meta">${ins.hasData
      ? `Nothing is standing out for ${esc(first)} at the moment.`
      : `No per-question data for ${esc(first)} yet. This builds up as they complete sessions.`}</div>`));
  } else {
    td.appendChild(el(`<div class="meta" style="margin-bottom:8px;">Based on ${mine.length} session${mine.length===1?'':'s'}. Times come from timed challenges only.</div>`));
    ins.items.forEach(it=>{
      td.appendChild(el(`<div style="padding:6px 0;font-size:14px;">• ${esc(ttInsightSentence(first,it))}</div>`));
    });
    const rec = ins.items[0];
    if(rec && rec.kind!=='turnaround'){
      td.appendChild(el(`<div class="meta" style="margin-top:8px;font-weight:700;color:var(--ink);">Suggested: set ${esc(first)} to practise ${esc(ttGroupLabel(rec.op,rec.table))} — they can pick it themselves under "Pick your own" on the Training Ground.</div>`));
    }
  }
  tr.appendChild(td);
  return tr;
}

// The child's dashboard shows trophies and colour because a nine-year-old needs to want
// to look at it. A teacher needs the same information as evidence: plain figures, plain
// language, printable, and something you could read aloud to a parent. Same underlying
