        <div class="meta" style="margin:0;">${r.status==='active'?'Running now':'Waiting to start'} · ${(Number(r.durationSec)||300)<=60?'one minute':'five minutes'}${mins!=null?` · opened ${mins} min ago`:''}</div>
        ${r.pin?`<div class="meta" style="margin-top:6px;">Race PIN <code class="mmc-code" style="font-size:15px;letter-spacing:.12em;">${esc(r.pin)}</code></div>`:''}
        ${players ? `<div class="mmc-worth-names" style="margin-top:10px;">${
            players.length ? players.slice().sort((a,b)=>(a.joinedAt?.seconds||0)-(b.joinedAt?.seconds||0))
              .map(p=>`<span>${esc(p.name||'Player')}</span>`).join('')
            : '<span style="opacity:.6;">nobody yet</span>'}</div>` : ''}
        <div class="mmc-row" style="margin-top:10px;gap:8px;">
          ${r.status==='lobby'?'<button class="mmc-btn gold sm" data-act="start">▶ Start</button>':''}
          <button class="mmc-btn ${stale?'danger':'ghost'} sm" data-act="end">${r.status==='active'?'End now':'Close'}</button>
        </div>
        ${stale?`<div class="meta" style="margin-top:8px;color:var(--incorrect);font-weight:700;">Open ${mins} minutes. Close it if you are finished with it.</div>`:''}
      </div>`);
      const sound=el(`<button class="mmc-pill ${S.raceSound?'on':''}" title="Plays on THIS screen only, never on student devices">
        <span class="mmc-pill-knob"></span>
        <span class="mmc-pill-label">${S.raceSound?'🔊 Sound on':'🔈 Sound off'}</span>
      </button>`);
      sound.onclick=()=>{
        S.raceSound=!S.raceSound;
        // The first tap has to happen inside a click, or the browser refuses to start audio.
        // The first tap must start the audio, or the browser blocks it for the whole session.
        if(S.raceSound){ raceAudio(); raceTone(880,0,.12,'triangle',.18); raceCallerStart(); }
        else raceCallerStop();
        render();
      };
      card.querySelector('.mmc-row').appendChild(sound);
      const startBtn=card.querySelector('[data-act="start"]');
      if(startBtn) startBtn.onclick=async ()=>{
        try{ await updateDoc(doc(db,'liveGames',r.id), {status:'active', startedAt:serverTimestamp()}); }
        catch(e){ S.toast='Could not start. Check your connection.'; render(); }
      };
      card.querySelector('[data-act="end"]').onclick=async ()=>{
        try{ await updateDoc(doc(db,'liveGames',r.id), {status:'ended', endedAt:serverTimestamp()}); await retireRacePin(r); }
        catch(e){ S.toast='Could not close that race. Check your connection.'; render(); }
      };
      wrap.appendChild(card);
    });
    // A teacher can always open another, even with student races running.
    const another=el(`<button class="mmc-btn ${rooms.some(r=>!r.hostUid)?'ghost':'gold'} sm" style="margin-top:6px;">${rooms.some(r=>!r.hostUid)?'Start another class race':'Start a class race'}</button>`);
    another.onclick=()=>createLiveRoom();
    wrap.appendChild(another);
    return wrap;
  }

  if(room.status==='active'){
    const head=el(`
      <div class="mmc-card">
        <div class="mmc-row" style="justify-content:space-between;">
          <div><h3>Race in progress</h3><div class="meta">${S.liveParticipants.length} player${S.liveParticipants.length===1?'':'s'} · Room: <code class="mmc-code">${esc(room.id.slice(0,6))}</code></div></div>
          <div id="mmc-live-timer" style="font-family:'IBM Plex Mono',monospace;font-size:28px;font-weight:700;color:var(--purple-deep);">${room.startedAt? formatMMSS(liveTimeLeft(room)) : 'Starting…'}</div>
        </div>
        <button class="mmc-btn danger" id="mmc-live-end" style="margin-top:10px;width:100%;font-size:16px;padding:12px;">⏹ End Game Now</button>
      </div>
    `);
    head.querySelector('#mmc-live-end').onclick=async ()=>{
      if(!confirm('End the Racing Ground now for everyone? This freezes the final standings.')) return;
      try{ await updateDoc(doc(db,'liveGames',room.id), {status:'ended', endedAt:serverTimestamp()}); }catch(e){ S.toast='Could not end. Check your connection.'; render(); }
    };
    wrap.appendChild(head);
    wrap.appendChild(renderRaceTrack(null, true));
    wrap.appendChild(renderLiveLeaderboardCard('Live leaderboard', room, false));
    startLiveTeacherTimer(room);
    return wrap;
  }
  return wrap;
}

// ---------- Live Game (student) ----------
function syncMyLiveSession(){
  const room=currentLiveRoom();
  if(!room){ if(S.myLive){ if(S.myLive.timerHandle) clearInterval(S.myLive.timerHandle); S.myLive=null; } return; }
  // This ran on EVERY render and only checked the stored status, so a room whose clock had
  // expired but was never closed put the student straight back into the race. Question and
  // all. Until the timer ticked a second later and threw them out again. That is the
  // flash of a live race on page load. Asking whether the race is actually over, rather
  // than what the document says, removes it.
  if(isRaceOver(room)){
    if(S.myLive && S.myLive.gameId===room.id){ if(S.myLive.timerHandle) clearInterval(S.myLive.timerHandle); S.myLive=null; }
    return;
  }
  if(room.status==='lobby') return;
  if(S.raceLeft===room.id) return;   // they chose to stop; don't drag them back in
  if(room.status==='active'){
    const joined = S.liveParticipants.some(p=>p.id===S.user.uid);
    if(!joined) return;
    if(S.myLive && S.myLive.gameId===room.id) return;
    if(S.myLive && S.myLive.timerHandle) clearInterval(S.myLive.timerHandle);
    const myLevel = studentRaceLevel(S.profile, room.level);
    S.myLive = { gameId:room.id, level:myLevel, answering:true, qIndex:0, currentQ:genTTQuestion(myLevel,0,studentYear(S.profile)),
      score:0, attempted:0, position:0, questionStartedAt:Date.now(), timerHandle:null, typedValue:'' };
    startMyLiveTimer();
  }
}
function startMyLiveTimer(){
  S.myLive.timerHandle=setInterval(()=>{
    const r=currentLiveRoom();
    if(!r || r.id!==S.myLive.gameId){ clearInterval(S.myLive.timerHandle); return; }
    const left=liveTimeLeft(r);
    const timerEl=document.getElementById('mmc-live-my-timer');
    if(timerEl) timerEl.textContent=formatMMSS(left);
    // If this player is the host, their screen is the only thing that can close the room.
    endMyHostedRaceIfDue(r);
    if(left<=0){ clearInterval(S.myLive.timerHandle); S.myLive.answering=false; render(); }
  },1000);
}
async function submitMyLiveAnswer(given){
  if(!S.myLive || !S.myLive.answering) return;
  const correct = normalize(given)===normalize(String(S.myLive.currentQ.answer));
  S.myLive.attempted++; if(correct) S.myLive.score++;
  flashResult('live', correct);
  const elapsedSec = (Date.now()-S.myLive.questionStartedAt)/1000;
  const allPositions = S.liveParticipants.map(p=>p.position||0);
  const rubberBand = raceRubberBandMultiplier(S.myLive.position, allPositions.length? allPositions : [S.myLive.position]);
  // Streak and pace, kept on the racer themselves so the handicap never depends on
  // anyone else's data arriving.
  // GUESSING THROUGH. A wrong answer used to reset the streak, which dropped the level
  // back down. So a child who found the hard questions inconvenient could type anything,
  // take a small penalty, and be handed an easy one. The wrong answer was a shortcut.
  //
  // A leader now keeps their streak, less a bite, so a wrong answer costs them ground
  // without buying them easier work. Guessing gets you nowhere except further back.
  // "Has been running away", not "is right now". Checking the current level meant that
  // after two guesses she had slipped below the threshold, the protection switched off,
  // and the third guess dropped her all the way to easy. It has to remember.
  if(racePaceShift(S.myLive) >= 2) S.myLive.wasAhead = Date.now();
  const wasFlying = !!(S.myLive.wasAhead && Date.now()-S.myLive.wasAhead < 45000);
  if(correct){
    S.myLive.streak = Math.max(0,(S.myLive.streak||0))+1;
  } else if(wasFlying){
    // Floored at 5, which is above the threshold for a raised level. Three wrong answers
    // in a row used to slip under it, so persistent guessing still escaped to easy
    // questions eventually. It cannot now: the way out is answering correctly.
    S.myLive.streak = Math.max(4, (S.myLive.streak||0) - 2);
    S.myLive.guessed = (S.myLive.guessed||0)+1;
  } else {
    S.myLive.streak = Math.min(0,(S.myLive.streak||0))-1;
  }
  S.myLive.recentMs = (S.myLive.recentMs||[]).concat(elapsedSec*1000).slice(-8);
  if(correct){
    const room0 = currentLiveRoom();
    const boost = raceBoostAmount(S.myLive.currentQ.level, S.myLive.currentQ.isDivision, elapsedSec,
                                  room0 ? room0.durationSec : null) * rubberBand;
    S.myLive.position = Math.min(100, S.myLive.position + boost);
  } else {
    // A wrong answer costs a leader far more than it costs a straggler. It is the only
    // thing that makes a guess a bad idea for someone who is already in front, and it is
    // fair: they had the easier question relative to their ability.
    const penalty = wasFlying ? 3.2 : 0.8;
    S.myLive.position = Math.max(0, S.myLive.position - penalty);
    S.myLive.score = Math.max(0, (S.myLive.score||0) - (wasFlying ? 1 : 0));
  }
  S.myLive.qIndex++;
  // Re-handicapped on every question, so a child who catches up is asked more, and one who
  // falls behind is given something they can land.
  const room1=currentLiveRoom();
  const dur1=(room1 && Number(room1.durationSec))||300;
  const elapsedRaceSec = room1 ? (dur1 - liveTimeLeft(room1)) : 0;
  const lvl=raceAdaptiveLevel(S.myLive.level, S.myLive.score,
    S.liveParticipants.map(x=>Number(x.score)||0).concat(S.myLive.score),
    !!(room1 && !room1.hostUid), S.myLive, raceElapsedFrac(room1), elapsedRaceSec);
  S.myLive.currentQ=genRaceQuestion(lvl, S.myLive.qIndex, studentYear(S.profile)); S.myLive.questionStartedAt=Date.now();
  render();
  try{ await updateDoc(doc(db,'liveGames',S.myLive.gameId,'participants',S.user.uid), {score:S.myLive.score, attempted:S.myLive.attempted, position:S.myLive.position}); }
  catch(e){ S.toast='Score sync error: '+e.message; render(); }
}
// Host-side auto-end. Only the TEACHER's screen runs the five-minute clock that closes a
// room, so a student-hosted race with no teacher present would sit 'active' forever and
// block the next race from appearing. Guarded three ways: only the host's device, only
// once, and only when the clock has genuinely run out.
let studentHostEndedRoom=null;
async function endMyHostedRaceIfDue(room){
  if(!room || room.status!=='active') return;
  if(room.hostUid !== S.user.uid) return;
  if(studentHostEndedRoom===room.id) return;
  if(liveTimeLeft(room) > 0) return;
  studentHostEndedRoom=room.id;
  try{ await updateDoc(doc(db,'liveGames',room.id), {status:'ended', endedAt:serverTimestamp()}); }
  catch(e){ studentHostEndedRoom=null; }   // let it retry next tick
}

function renderMyLiveSession(){
  const wrap=el('<div></div>');
  const room=currentLiveRoom();
  const head=el(`
    <div class="mmc-card">
      <div class="mmc-row" style="justify-content:space-between;">
        <div><h3 style="text-transform:capitalize;">${room && !room.hostUid ? '🏫 Class Race' : esc(S.myLive.level)+'Live!'}</h3><div class="meta">Your score: ${S.myLive.score} / ${S.myLive.attempted} · Room: <code class="mmc-code">${esc(S.myLive.gameId.slice(0,6))}</code></div></div>
        <div id="mmc-live-my-timer" style="font-family:'IBM Plex Mono',monospace;font-size:28px;font-weight:700;color:var(--purple-deep);">${room? formatMMSS(liveTimeLeft(room)) : ''}</div>
      </div>
    </div>
  `);
  // Quitting keeps the score already earned on the leaderboard. Those answers were real
  // and deleting them would be dishonest. It just stops this player answering.
  const exits=el('<div class="mmc-row" style="gap:8px;justify-content:flex-end;margin:-4px 0 10px;"></div>');
  const quit=el('<button class="mmc-btn ghost sm">← Leave race</button>');
  quit.onclick=()=>{
    if(!confirm('Leave this race? Your score so far stays on the leaderboard.')) return;
    if(S.myLive && S.myLive.timerHandle) clearInterval(S.myLive.timerHandle);
    if(S.myLive) S.myLive.answering=false;
    S.raceLeft = room ? room.id : null;
    render();
  };
  exits.appendChild(quit);
  if(room && room.hostUid===S.user.uid){
    const endAll=el('<button class="mmc-btn danger sm">■ End race for everyone</button>');
    endAll.onclick=()=>endHostedRaceNow(room);
    exits.appendChild(endAll);
  }
  wrap.appendChild(head);
  wrap.appendChild(exits);
  const chase=renderChaseCallout(S.user.uid);
  if(chase) wrap.appendChild(chase);
  const qbox=el(`
    <div class="mmc-card" style="text-align:center;">
      <div style="font-family:'Baloo 2',sans-serif;font-size:${String(ttPromptText(S.myLive.currentQ)).length>18?'26px':'36px'};font-weight:700;margin-bottom:16px;">${esc(ttPromptText(S.myLive.currentQ))}</div>
      <div class="mmc-row" style="justify-content:center;">
        <input type="text" id="mmc-live-input" class="${S.myLive.flash?('mmc-flash-'+S.myLive.flash):''}" autocomplete="off" inputmode="${KEYPAD_INPUTMODE}" value="${esc(S.myLive.typedValue||'')}" style="width:120px;text-align:center;font-size:22px;padding:10px;border-radius:10px;border:2px solid var(--paper-line);">
        <button class="mmc-btn gold" id="mmc-live-submit">Go</button>
      </div>
    </div>
  `);
  const input=qbox.querySelector('#mmc-live-input');
  // The race track re-renders every time ANY player in the room answers a question (their
  // score/position updates trigger a fresh snapshot for everyone). A raw <input> only keeps
  // its typed value in the DOM, so without this it gets wiped mid-keystroke every time someone
  // else in a busy race answers. Persisting it in state and restoring focus after every
  // render is what actually fixes that, on top of Enter already submitting.
  input.oninput=(e)=>{ S.myLive.typedValue=e.target.value; };
  const go=()=>{ if(!S.myLive.answering) return; const v=input.value; input.value=''; S.myLive.typedValue=''; submitMyLiveAnswer(v); };
  qbox.querySelector('#mmc-live-submit').onclick=go;
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
  // Keypad taps write to S.myLive.typedValue, the same store the re-render restores from,
  // so a rival answering mid-tap can no longer disturb what this player has entered.
  if(IS_TOUCH){
    qbox.appendChild(buildKeypad(k=>{
      if(!S.myLive.answering) return;
      if(k==='go'){ go(); return; }
      if(k==='del') input.value=input.value.slice(0,-1);
      else if(input.value.length<6) input.value+=k;
      S.myLive.typedValue=input.value;
    }));
  }
  wrap.appendChild(qbox);
  wrap.appendChild(renderRaceTrack(S.user.uid, true));
  wrap.appendChild(renderLiveLeaderboardCard('Live leaderboard', room||{}, false));
  if(S.myLive.answering){
    setTimeout(()=>{ const el2=document.getElementById('mmc-live-input'); if(el2){ el2.focus(); const len=el2.value.length; el2.setSelectionRange(len,len); } }, 0);
  }
  return wrap;
}
// A student hosting their own race. Deliberately scoped to their OWN teacher's students:
// teacherUid is copied from their profile and the rules refuse anything else, so a race
// can never reach a child in another teacher's class. hostUid marks who may start it.
const STUDENT_RACE_SECONDS = 60;   // the default, kept for older rooms
const STUDENT_RACE_CHOICES = [2,3,4,5];
async function hostStudentRace(){
  // One race per child, and that includes a race already RUNNING. Only lobbies were
  // checked, so a host whose race had started could open a second one, end up in neither
  // properly, and take her class with her.
  const already=(S.liveGames||[]).find(g=>g.hostUid===S.user.uid &&
    (g.status==='lobby'||g.status==='active') && !isRaceOver(g));
  if(already){
    S.joinedRoomId=already.id;
    S.toast = already.status==='active'
      ? 'Your race is already running. This is it.'
      : 'You already have a race waiting. This is it.';
    render(); return;
  }
  S.raceLeft=null;
  if(!S.profile || !S.profile.teacherUid){ S.toast='You need to be in a class to start a race.'; render(); return; }
  // Belt and braces: the button is hidden while a class race is open, but the rule belongs
  // here too so it can't be reached some other way.
  const classRace=(S.liveGames||[]).find(g=>!g.hostUid && (g.status==='lobby'||g.status==='active') && !isRaceOver(g));
  if(classRace){ S.toast='Your teacher has a race on. Join that one!'; render(); return; }
  try{
    const pin = await generateRacePin();
    const ref = await addDoc(collection(db,'liveGames'), {
      pin,
      teacherUid: S.profile.teacherUid,
      hostUid: S.user.uid,
      hostName: S.profile.displayName || '',
      level: studentRaceLevel(S.profile, 'medium'),   // only a fallback; each racer uses their own
      // A student challenge is a quick duel between friends, not the class event. One
      // minute, so it can be run again and again at lunchtime without eating the hour.
      // The teacher's own races stay at five minutes.
      status: 'lobby', createdAt: serverTimestamp(),
      durationSec: (STUDENT_RACE_CHOICES.indexOf(+S.raceMinutes)!==-1 ? +S.raceMinutes : 2)*60,
      classId: S.profile.classId || null
    });
    await publishRacePin(pin, ref.id, S.profile.displayName||'');
    await joinLiveGame(ref.id);
    // Watch the room straight away rather than waiting for the liveGames listener to
    // deliver it. Until that arrives, currentLiveRoom() cannot find the room, so nothing
    // attaches to the player list and the host sees an empty lobby until they refresh.
    ensureParticipantsSub(ref.id);
  }catch(e){ S.toast='Could not start the race. Check your connection.'; render(); }
}

// Always on screen, whether or not their own class has a race going. It is the only way
// across to another class, so it cannot be tucked behind a state.
function renderJoinByPinCard(){
  const card=el(`<div class="mmc-card">
    <h3 style="margin:0 0 4px;">Join with a PIN</h3>
    <div class="meta" style="margin-bottom:10px;">Racing someone in another class? Ask them for their 4-number race PIN.</div>
    <div class="mmc-row" style="gap:8px;align-items:center;">
      <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" id="mmc-pin-in"
        placeholder="0000" value="${esc(S.pinDraft||'')}"
        style="width:130px;font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:700;letter-spacing:.22em;text-align:center;padding:8px 10px;">
      <button class="mmc-btn gold" id="mmc-pin-go" ${S.pinBusy?'disabled':''}>${S.pinBusy?'Joining…':'Join ▶'}</button>
    </div>
  </div>`);
  const input=card.querySelector('#mmc-pin-in');
  input.oninput=(e)=>{ S.pinDraft=e.target.value.replace(/\D/g,'').slice(0,4); e.target.value=S.pinDraft; };

  // joining; five is a lesson-sized event. Only the host chooses, so there is nothing to

  const mins = STUDENT_RACE_CHOICES.indexOf(+S.raceMinutes)!==-1 ? +S.raceMinutes : 2;
  const picker=el(`<div style="margin-top:10px;">
    <div class="meta" style="margin:0 0 6px;">How long?</div>
    <div class="mmc-row" style="gap:6px;justify-content:center;flex-wrap:wrap;">

  btn.onclick=hostStudentRace;

// ---------- Leaving and ending a race ----------
// Every state a student can be in now has a way out. Before this, joining a lobby was a
// one-way door: no leave, no quit, and only the clock could end a race. That is fine in a
// classroom where a teacher is driving, and not fine at all when children run their own.
async function leaveLiveGame(gameId){
  try{
    await deleteDoc(doc(db,'liveGames',gameId,'participants',S.user.uid));
    if(S.myLive && S.myLive.gameId===gameId){
      if(S.myLive.timerHandle) clearInterval(S.myLive.timerHandle);
      S.myLive=null;
    }
    S.lobbyReadyForRoom=null;
    if(S.joinedRoomId===gameId) S.joinedRoomId=null;
  }catch(e){ S.toast='Could not leave. Check your connection.'; }
  render();
}
// The host ending an active race early. Everyone's screen follows, because isRaceOver
// reads the room status.
async function endHostedRaceNow(room){
  if(!room || room.hostUid!==S.user.uid) return;
  if(!confirm('End this race now for everyone?')) return;
  try{ await updateDoc(doc(db,'liveGames',room.id), {status:'ended', endedAt:serverTimestamp()}); }
  catch(e){ S.toast='Could not end the race. Check your connection.'; render(); }
}
// One consistent exit control, so every state offers the same affordance in the same place.
function raceExitButton(label, onClick, danger){
  const b=el(`<button class="mmc-btn ${danger?'danger':'ghost'} sm" style="width:100%;margin-top:10px;">${esc(label)}</button>`);
  b.onclick=onClick;
  return b;
}

// Which races this student could join right now. Everything open and visible, not one
// chosen by a precedence rule nobody can see. Three children hosting used to mean each of
// them saw a different single race and none of them could find each other.
function joinableRaces(){
  const myClassId = S.profile && S.profile.classId;
  const nowSec = Date.now()/1000;
  const rooms = (S.liveGames||[]).filter(g=>{
    if(g.status!=='lobby' && g.status!=='active') return false;
    if(isRaceOver(g)) return false;
    if(g.status==='lobby'){
      const opened=(g.createdAt && g.createdAt.seconds)||0;
      if(opened && (nowSec-opened) > LOBBY_MAX_AGE_SEC) return false;
    }
    if(g.classId && myClassId && g.classId!==myClassId) return false;
    return true;
  });
  // A race joined by PIN lives outside this student's teacher, so it is not in liveGames.
  if(S.externalRoom && !isRaceOver(S.externalRoom) &&
     !rooms.some(r=>r.id===S.externalRoom.id)) rooms.push(S.externalRoom);
  // The teacher's race first, then most recent. It is not hidden from anyone, and it does
  // not hide anyone else either.
  return rooms.sort((a,b)=>{
    if(!a.hostUid && b.hostUid) return -1;
    if(a.hostUid && !b.hostUid) return 1;
    return (b.createdAt?.seconds||0)-(a.createdAt?.seconds||0);
  });
}
async function startLiveGame(gameId){
  try{
    // The host must actually BE in their own race. Robyn started one and was "in it but
    // not in it": her participant record was missing, so she had no horse, no score and
    // no way back in. Written before the race starts, and harmless if it already exists.
    const me=(S.liveParticipants||[]).some(p=>p.id===S.user.uid);
    if(!me && !S.isTeacher){
      try{
        await setDoc(doc(db,'liveGames',gameId,'participants',S.user.uid), {
          uid:S.user.uid,
          name:(S.profile&&S.profile.displayName)||(S.profile&&S.profile.username)||'Player',
          score:0, position:0, joinedAt:serverTimestamp(),
          horseColor:equippedHorseColor(),
          horseHat:equippedHorseHat()
        }, {merge:true});
      }catch(e2){}
    }
    S.joinedRoomId=gameId;
    await updateDoc(doc(db,'liveGames',gameId), {status:'active', startedAt:serverTimestamp()});
  }
  catch(e){ S.toast='Could not start the race. Check your connection.'; render(); }
}

function renderStudentLiveGame(){
  const wrap=el('<div></div>');
  const room=currentLiveRoom();

  // ---- a race is running ----
  if(room && room.status==='active' && !isRaceOver(room) && S.raceLeft!==room.id){
    const joined = S.liveParticipants.some(p=>p.id===S.user.uid);
    if(joined){
      if(S.myLive && S.myLive.gameId===room.id && !S.myLive.answering){
        wrap.appendChild(el(`<div class="mmc-card"><h3>⏱ Time's up!</h3><div class="meta">Waiting for the final leaderboard…</div></div>`));
        wrap.appendChild(renderLiveLeaderboardCard('Live leaderboard', room, false));
        return wrap;
      }
      wrap.appendChild(el('<div class="mmc-empty">Loading your game…</div>'));
      return wrap;
    }
    // Not in this one. It is still listed below with the others, so this is only a note.
    wrap.appendChild(el(`<div class="mmc-card"><h3>${esc(raceLabel(room))} has already started</h3><div class="meta">You can still jump in, or join one of the others.</div></div>`));
  }
  // ---- a race just finished ----
  if(room && room.status==='ended' && raceEndedSecondsAgo(room) <= RACE_RESULT_WINDOW_SEC){
    const mine = S.liveParticipants.find(p=>p.id===S.user.uid);
    if(mine){
      // One result, not two. The finish used to be drawn here AND again at the bottom of
      // the page, with the start-a-race card in between, so a child scrolled past the same
      // leaderboard twice and the screen after a race was a mess.
      //
      // The raw count is gone too. It was the last place a child could see the numbers,
      // which gives away both the handicap and the finish.
      wrap.appendChild(renderRaceTrack(S.user.uid));
      wrap.appendChild(renderLiveLeaderboardCard('Final leaderboard', room, true));
      const again=el('<button class="mmc-btn gold" style="width:100%;font-size:16px;padding:12px;margin-top:10px;">Race again</button>');
      again.onclick=()=>{
        // Remember that THIS child has seen this result. Clearing the join alone did
        // nothing, because a finished race stays current for fifteen minutes and the same
        // screen simply drew itself again.
        S.raceSeen = Object.assign({}, S.raceSeen, {[room.id]:1});
        S.joinedRoomId=null; S.raceLeft=null; S.externalRoomId=null; S.externalRoom=null;
        render();
      };
      wrap.appendChild(again);
      return wrap;   // nothing else belongs on this screen
    }
  }
  // ---- walked away mid-race ----
  if(room && S.raceLeft===room.id && room.status==='active'){
    wrap.appendChild(el(`<div class="mmc-card"><h3>You left this race</h3><div class="meta">Your score is still on the leaderboard. You can rejoin, or wait for the next one.</div></div>`));
    const back=el('<button class="mmc-btn gold sm" style="width:100%;margin-bottom:10px;">↩ Rejoin the race</button>');
    back.onclick=()=>{ S.raceLeft=null; render(); };
    wrap.appendChild(back);
    wrap.appendChild(renderLiveLeaderboardCard('Live leaderboard', room, false));
    return wrap;
  }

  const races = joinableRaces();
  const myRoom = races.find(r=>r.id===(S.joinedRoomId||'')) ||
                 races.find(r=>S.liveParticipants.some(p=>p.id===S.user.uid) && r.id===(room&&room.id));

  // ---- the one you are in, stated plainly at the top ----
  if(myRoom && myRoom.status==='lobby'){
    const iAmHost = myRoom.hostUid===S.user.uid;
    const isClass = !myRoom.hostUid;
    // The whole screen answers one question: who is in this race, and when does it start.
    // Everything else was noise while twenty children tried to find each other.
    const names=S.liveParticipants.slice().sort((a,b)=>(a.joinedAt?.seconds||0)-(b.joinedAt?.seconds||0));
    const card=el(`<div class="mmc-card${isClass?' mmc-classrace':''}">
      ${isClass?'<div class="mmc-classflag">🏫 Class Race</div>':''}
      <div class="meta" style="margin:0;">You are in</div>
      <h3 style="margin:2px 0 10px;font-size:26px;">${esc(raceLabel(myRoom))}</h3>
      <div class="mmc-lobbylist">${
        names.length ? names.map(p=>`<span class="mmc-lobbyname${p.id===S.user.uid?' me':''}">${esc(p.name||'Player')}${p.id===S.user.uid?' (you)':''}</span>`).join('')
        : '<span class="meta" style="margin:0;">Waiting for players…</span>'}</div>
      <div class="meta" style="margin-top:10px;font-weight:700;color:var(--ink);">${
        names.length} in this race${iAmHost ? '. Press Start when everyone is in.'
          : isClass ? '. Your teacher will start it.'
          : '. '+esc(myRoom.hostName||'The host')+' will start it.'}</div>
      ${myRoom.pin?`<div style="margin-top:14px;">
        <div class="meta" style="margin:0;">Race PIN, for someone in another class</div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:34px;font-weight:800;letter-spacing:.18em;">${esc(myRoom.pin)}</div></div>`:''}
    </div>`);
    wrap.appendChild(card);
    wrap.appendChild(renderHorseCustomizeCard());
    wrap.appendChild(renderCoinAnimalCard(myRoom));
    if(iAmHost){
      const n=S.liveParticipants.length;
      const go=el(`<button class="mmc-btn gold" style="width:100%;font-size:18px;padding:14px;">Start the race${n>1?` (${n} players)`:''}</button>`);
      go.onclick=()=>{
        // Nobody else has joined. Almost always means they are still finding it, so say so
        // rather than starting a race of one.
        if(S.liveParticipants.length<2 &&
           !confirm('Nobody else has joined yet. Start anyway?')) return;
        startLiveGame(myRoom.id);
      };
      wrap.appendChild(go);
      wrap.appendChild(raceExitButton('✕ Cancel this race', async ()=>{
        try{ await updateDoc(doc(db,'liveGames',myRoom.id), {status:'ended', endedAt:serverTimestamp()}); await retireRacePin(myRoom); }
        catch(e){ S.toast='Could not cancel. Check your connection.'; render(); }
      }));
    } else {
      wrap.appendChild(raceExitButton('← Leave this race', ()=>{ S.joinedRoomId=null; leaveLiveGame(myRoom.id); }));
    }
    return wrap;
  }

  // ---- not in one: every race you could join, plus your own options ----
  if(races.length){
    wrap.appendChild(el(`<div class="mmc-setgroup"><span class="mmc-setgroup-name">🐎 Races you can join</span>
      <span class="mmc-setgroup-count">${races.length} open</span></div>`));
    races.forEach(r=>{
      const isClass=!r.hostUid;
      // Once a race is running it is closed. Joining halfway is unfair on everyone already
      // in it and made it impossible to tell who was actually racing. I added a "Jump in"
      // button, which was the wrong call.
      const running = r.status==='active';
      const card=el(`<div class="mmc-card${isClass?' mmc-classrace':''}" style="margin-bottom:10px;">
        ${isClass?'<div class="mmc-classflag">🏫 Class Race</div>':''}
        <div class="mmc-row" style="justify-content:space-between;align-items:center;gap:12px;">
          <div style="flex:1;">
            <h3 style="margin:0 0 2px;">${esc(raceLabel(r))}</h3>
            <div class="meta" style="margin:0;">${Math.round((Number(r.durationSec)||300)/60)} minute${Math.round((Number(r.durationSec)||300)/60)===1?'':'s'} · questions at your own level${running?' · already running':''}</div>
          </div>
          ${running
            ? '<span class="meta" style="margin:0;white-space:nowrap;font-weight:700;">Already started</span>'
            : `<button class="mmc-btn ${isClass?'gold':'ghost'} sm" style="white-space:nowrap;">Join</button>`}
        </div>
      </div>`);
      const jb=card.querySelector('button');
      if(jb) jb.onclick=()=>{ S.joinedRoomId=r.id; joinLiveGame(r.id); };
      wrap.appendChild(card);
    });
  }
  wrap.appendChild(renderStartRaceCard(races.length? 'Or start your own. Everyone above can join yours too.' : null));
  wrap.appendChild(renderJoinByPinLink());

  // ---- a result worth seeing, once, underneath everything ----
  if(room && isRaceOver(room) && !races.some(r=>r.id===room.id)){
    wrap.appendChild(renderLiveLeaderboardCard('Last race', room, true));
  }
  return wrap;
}
async function joinLiveGame(gameId){
  try{ console.log('[race] joining', gameId); }catch(e){}
  // A started race is closed. Enforced here as well as in the interface, because a stale
  // screen is exactly how somebody ends up halfway through someone else's race.
  const target=(S.liveGames||[]).find(g=>g.id===gameId) ||
    (S.externalRoom && S.externalRoom.id===gameId ? S.externalRoom : null);
  if(target && (target.status==='active' || isRaceOver(target))){
    S.toast='That race has already started. Join the next one or start your own.';
    S.joinedRoomId=null; render(); return;
  }
  // Clear any "I left" marker. Joining is an explicit decision to be in this race.
  S.raceLeft=null;
  S.joinedRoomId=gameId;
  try{
    await setDoc(doc(db,'liveGames',gameId,'participants',S.user.uid), {
      uid:S.user.uid, name:S.profile? S.profile.displayName : S.user.email,
      username: S.profile && S.profile.username ? S.profile.username : null,
      nickname: S.profile && S.profile.nickname ? S.profile.nickname : null,
      horseColor: equippedHorseColor(),
      horseHat: equippedHorseHat(),
      score:0, attempted:0, position:0, joinedAt:serverTimestamp()
    });
    // Attach to the player list now, not on the next render. Waiting meant the joiner saw
    // an empty lobby until something else happened to trigger a re-render.
    ensureParticipantsSub(gameId);
  }catch(e){ S.toast='Could not join. Check your connection.'; render(); }
}
async function syncParticipantCustomization(gameId){
  if(!S.user || !S.profile) return;
  try{
    await updateDoc(doc(db,'liveGames',gameId,'participants',S.user.uid), {
      horseColor: equippedHorseColor(),
      horseHat: equippedHorseHat(),
      nickname: S.profile.nickname || null,
    });

// ---------- Skill Practice sessions (launched from the Student Dashboard) ----------
function startSkillPractice(slot){
  const difficulty='medium';
  const questions=[]; for(let i=0;i<6;i++) questions.push(buildQuestion(slot-1, difficulty));
  const quiz={};
  questions.forEach(q=> quiz[q.id]= q.inputType==='order'
    ? {given:'', pool:shuffleArr(q.items||[]), placed:[], checked:false, correct:false}
    : q.inputType==='classify'
    ? {given:new Array((q.items||[]).length).fill(''), checked:false, correct:false}
    : q.inputType==='parts'
    ? {given:new Array((q.parts||[]).length).fill(''), checked:false, correct:false}
    : q.inputType==='mixed'
    ? {given:{whole:'',num:'',den:''}, checked:false, correct:false}
    : q.inputType==='multi'
    ? {given:[], checked:false, correct:false}
    : {given: q.inputType==='coins' ? [] : '', checked:false, correct:false});
  const myList = slotsForYear(studentYear(S.profile));
  S.skillSession={ slot, title: (myList[slot-1]||SLOTS[slot-1]||{}).title || `Skill ${slot}`, difficulty, questions, quiz, index:0, finished:false };
  render();
}
async function finishSkillPractice(){
  const sess=S.skillSession;
  const score=sess.questions.filter(q=>sess.quiz[q.id].correct).length;
  const answers=sess.questions.map(q=>({ qId:q.id, correct:sess.quiz[q.id].correct }));
  try{
    await addDoc(collection(db,'skillPractice'), {
      uid:S.user.uid, teacherUid: stampTeacherUid(), slot:sess.slot,
      score, total:sess.questions.length, answers, submittedAt:serverTimestamp()
    });
  }catch(e){ S.toast='Could not save your practice session. Check your connection.'; }
  sess.finished=true; render();
}
function renderSkillPracticeSession(){
  const sess=S.skillSession;
  const wrap=el('<div></div>');
  const back=el('<a href="#" style="color:var(--sky-deep);font-size:13px;">← back to dashboard</a>');
  back.onclick=(e)=>{ e.preventDefault(); S.skillSession=null; render(); };
  wrap.appendChild(back);
  wrap.appendChild(el(`<h3 style="font-family:Fredoka,sans-serif;margin:10px 0 14px;">🎯 Practice: ${esc(sess.title)}</h3>`));

  if(sess.finished){
    const score=sess.questions.filter(q=>sess.quiz[q.id].correct).length;
    const pct=Math.round((score/sess.questions.length)*100);
    wrap.appendChild(el(`
      <div class="mmc-card" style="text-align:center;">
        <div style="font-size:40px;">${pct>=80?'🌟':pct>=50?'👍':'💪'}</div>
        <h3>You scored ${score}/${sess.questions.length}</h3>
        <div class="meta">${pct>=80? "Awesome work. That's really paying off!" : "Nice effort. Every bit of practice helps this stick."}</div>
      </div>
    `));
    const row=el('<div class="mmc-row" style="margin-top:10px;"></div>');
    const again=el('<button class="mmc-btn gold">Practice again</button>');
    again.onclick=()=>startSkillPractice(sess.slot);
    const done=el('<button class="mmc-btn ghost">Back to dashboard</button>');
    done.onclick=()=>{ S.skillSession=null; render(); };
    row.appendChild(again); row.appendChild(done);
    wrap.appendChild(row);
    return wrap;
  }

  wrap.appendChild(el(`<div class="meta" style="margin-bottom:8px;">Question ${sess.index+1} of ${sess.questions.length}</div>`));
  const q=sess.questions[sess.index];
  const st=sess.quiz[q.id];
  const qbox=renderQuestionBody(q, st, ()=>{}, '');
  wrap.appendChild(qbox);

  if(st.checked){
    const isLast = sess.index>=sess.questions.length-1;
    const nextBtn=el(`<button class="mmc-btn gold">${isLast?'Finish practice ✓':'Next question →'}</button>`);
    nextBtn.onclick=()=>{ if(isLast){ finishSkillPractice(); } else { sess.index++; render(); } };
    wrap.appendChild(nextBtn);
  }
  return wrap;
}
// Renders one question's input UI (all input types) + Check button + feedback-once-checked.
// Shared by both the Weekly Quiz and the new Skill Practice sessions, so every question type
// only has one place its interaction logic lives. OnCheck lets the caller decide what happens
// after grading (save weekly progress, advance a practice session, etc) without duplicating
// any of the input-handling code itself.
function renderQuestionBody(q, st, onCheck, headerHTML){
  const qbox=el(`
    <div class="mmc-quiz-q">
      ${headerHTML}
      ${q.svg ? `<div class="mmc-qsvg">${q.svg}</div>` : ''}
      <div class="qtext">${esc(q.prompt)}</div>
      ${q.hint? `<div class="mmc-hint">${esc(q.hint)}</div>` : ''}
      ${fracPromptHTML(q)}
    </div>
  `);
  // Every student question goes through this function, so the read-aloud button only
  // needs adding once and can never be missing from one question type.
  const speak=renderSpeakButton(q);
  if(speak){
    const qt=qbox.querySelector('.qtext');
    if(qt) qt.insertAdjacentElement('afterend', speak); else qbox.appendChild(speak);
  }
  // A blank answer must never be graded. It used to be accepted, marked wrong, and stored
  // as "no response", which is worse than a wrong answer: the gradebook then says a child
  // got something wrong when they never actually attempted it, and that follows them into
  // every average. A child who does not know should still have to put something down.
  function hasAnswer(){
    const g=st.given;
    if(g===null || g===undefined) return false;
    if(Array.isArray(g)) return g.length>0 && g.some(x=>String(x==null?'':x).trim()!=='');
    if(typeof g==='object'){
      const vals=Object.values(g);
      return vals.length>0 && vals.some(x=>String(x==null?'':x).trim()!=='');
    }
    return String(g).trim()!=='';
  }
  function doCheck(){
    if(st.checked) return;
    if(!hasAnswer()){
      S.toast='Put an answer in first. Have a go, even if you are not sure.';
      S.toastTone='warn'; render(); return;
    }
    stopSpeaking(); st.checked=true; st.correct=gradeQuestion(q, st.given);
    st.flags=answerFlags(q, st.given); render(); onCheck(); }

  if(q.inputType==='choice'){
    if(q.renderFractionChoices && q.givenNum!=null){
      const givenRow=el(`<div class="mmc-frac-eq" style="margin-bottom:14px;">${fracHTML(q.givenNum, q.givenDen)}</div>`);
      qbox.appendChild(givenRow);
    }
    const choiceRow=el('<div class="mmc-choices"></div>');
    (q.choices||[]).forEach(c=>{
      const label = q.choiceSymbols && q.choiceSymbols[c]
        ? `<span class="mmc-symbtn"><span class="sym">${esc(q.choiceSymbols[c])}</span><span class="wrd">${esc(c)}</span></span>`
        : (q.renderFractionChoices ? fracChoiceHTML(c) : esc(c));
      const b=el(`<button type="button" class="mmc-choice-btn ${st.given===c?'selected':''}" ${st.checked?'disabled':''}>${label}</button>`);
      b.onclick=()=>{ if(st.checked) return; st.given=c; render(); };
      choiceRow.appendChild(b);
    });
    qbox.appendChild(choiceRow);
    const checkBtn=el(`<button class="mmc-btn ${st.checked?'ghost':'gold'} sm" ${st.checked||!st.given?'disabled':''}>${st.checked?'Checked':'Check'}</button>`);
    checkBtn.onclick=doCheck;
    qbox.appendChild(checkBtn);
  } else if(q.inputType==='mixed'){
    // Whole-number box (optional) plus numerator/denominator stacked to its right.
    // Also used for plain fractions by setting wantWhole:false.
    const wantWhole = q.wantWhole!==false;
    const g=st.given||{};
    const shownVal = (q.showFracNum!=null)
      ? mixedHTML(q.showWhole, q.showFracNum, q.showFracDen)
      : (q.mixedLead ? `<span style="font-family:'IBM Plex Mono',monospace;">${esc(q.mixedLead)}</span>` : '');
    const row=el(`<div class="mmc-frac-eq" style="margin:14px 0 16px;">
      ${shownVal ? shownVal+'<span>=</span>' : ''}
      <span class="mmc-mixed">
        ${wantWhole ? (q.lockWhole!=null
          ? `<span class="whole">${esc(q.lockWhole)}</span>`
          : `<input type="text" class="wholebox" data-f="whole" inputmode="numeric" value="${esc(g.whole||'')}" ${st.checked?'disabled':''}>`) : ''}
        <span class="mmc-frac">
          <input type="text" data-f="num" inputmode="numeric" value="${esc(g.num||'')}" ${st.checked?'disabled':''}>
          <span class="line"></span>
          ${q.lockDen!=null
            ? `<span class="den">${esc(q.lockDen)}</span>`
            : `<input type="text" data-f="den" inputmode="numeric" value="${esc(g.den||'')}" ${st.checked?'disabled':''}>`}
        </span>
      </span>
    </div>`);
    row.querySelectorAll('[data-f]').forEach(inp=>{
      inp.oninput=(e)=>{ st.given=Object.assign({}, st.given, {[e.target.dataset.f]: e.target.value}); };
    });
    qbox.appendChild(row);
    const ready=()=> String((st.given||{}).num||'').trim()!=='' && (q.lockDen!=null || String((st.given||{}).den||'').trim()!=='');
    const mb=el(`<button class="mmc-btn ${st.checked?'ghost':'gold'} sm" ${st.checked?'disabled':''}>${st.checked?'Checked':'Check'}</button>`);
    mb.onclick=()=>{ if(!ready()) return; doCheck(); };
    qbox.appendChild(mb);
  } else if(q.inputType==='parts'){
    // Inline answer boxes rendered in the shape of the question itself, so a
    // partitioning question looks like  823 = [ ] + [ ] + [ ]  rather than one
    // long text field the student has to format by hand.
    const row=el('<div class="mmc-partsrow"></div>');
    if(q.partsLead) row.appendChild(el(`<span class="mmc-partslead">${esc(q.partsLead)}</span>`));
    (q.parts||[]).forEach((pt,i)=>{
      if(i>0 && q.partsJoin) row.appendChild(el(`<span class="mmc-partsjoin">${esc(q.partsJoin)}</span>`));
      const cell=el('<span class="mmc-partscell"></span>');
      if(pt.label) cell.appendChild(el(`<span class="mmc-partslabel">${esc(pt.label)}</span>`));
      const inp=el(`<input type="text" class="mmc-partsbox" value="${esc(st.given[i]||'')}" ${st.checked?'disabled':''} inputmode="decimal">`);
      inp.oninput=(e)=>{ st.given[i]=e.target.value; };
      cell.appendChild(inp);
      row.appendChild(cell);
    });
    if(q.partsTail) row.appendChild(el(`<span class="mmc-partslead">${esc(q.partsTail)}</span>`));
    qbox.appendChild(row);
    const allFilled=()=> (q.parts||[]).every((_,i)=>String(st.given[i]||'').trim()!=='');
    const pb=el(`<button class="mmc-btn ${st.checked?'ghost':'gold'} sm" ${st.checked?'disabled':''}>${st.checked?'Checked':'Check'}</button>`);
    pb.onclick=()=>{ if(!allFilled()) return; doCheck(); };
    qbox.appendChild(pb);
  } else if(q.inputType==='multi'){
    const choiceRow=el('<div class="mmc-choices"></div>');
    (q.choices||[]).forEach(c=>{
      const on=(st.given||[]).indexOf(c)!==-1;
      const b=el(`<button type="button" class="mmc-choice-btn ${on?'selected':''}" ${st.checked?'disabled':''}>${esc(c)}</button>`);
      b.onclick=()=>{ if(st.checked) return;
        const arr=st.given||[]; const i=arr.indexOf(c);
        if(i===-1) arr.push(c); else arr.splice(i,1);
        st.given=arr; render(); };
      choiceRow.appendChild(b);
    });
    qbox.appendChild(el('<div class="meta" style="margin-bottom:6px;">Select all that apply.</div>'));
    qbox.appendChild(choiceRow);
    const mb=el(`<button class="mmc-btn ${st.checked?'ghost':'gold'} sm" ${st.checked||!(st.given||[]).length?'disabled':''}>${st.checked?'Checked':'Check'}</button>`);
    mb.onclick=doCheck;
    qbox.appendChild(mb);
  } else if(q.inputType==='classify'){
    const rows=el('<div></div>');
    (q.items||[]).forEach((it,i)=>{
      const row=el(`
        <div class="mmc-row" style="justify-content:space-between;align-items:center;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--paper-line);">
          <div style="font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:700;min-width:70px;">${it.deg}°</div>
          <div class="mmc-choices" style="margin-bottom:0;"></div>
        </div>
      `);
      const choiceRow=row.querySelector('.mmc-choices');
      ['acute','right','obtuse','straight','reflex'].forEach(label=>{
        const selected = st.given[i]===label;
        const b=el(`<button type="button" class="mmc-choice-btn${selected?' selected':''}" ${st.checked?'disabled':''}>${label[0].toUpperCase()+label.slice(1)}</button>`);
        b.onclick=()=>{ if(st.checked) return; st.given[i]=label; render(); };
        choiceRow.appendChild(b);
      });
      rows.appendChild(row);
    });
    qbox.appendChild(rows);
    const allAnswered = st.given.every(g=>g);
    const classifyCheckBtn=el(`<button class="mmc-btn ${st.checked?'ghost':'gold'} sm" ${st.checked||!allAnswered?'disabled':''}>${st.checked?'Checked':'Check'}</button>`);
    classifyCheckBtn.onclick=doCheck;
    qbox.appendChild(classifyCheckBtn);
  } else if(q.inputType==='fracEasy'){
    const row=el(`
      <div class="mmc-frac-eq">
        ${fracHTML(q.givenNum, q.givenDen)}
        <span>=</span>
        <span class="mmc-frac"><input type="text" id="mmc-frac-in" autocomplete="off" value="${esc(st.given)}" ${st.checked?'disabled':''}><span class="line"></span><span class="den">${esc(q.targetDen)}</span></span>
      </div>
    `);
    const input=row.querySelector('#mmc-frac-in');
    input.oninput=(e)=>{ st.given=e.target.value; };
    input.addEventListener('keydown', e=>{ if(e.key==='Enter' && !st.checked) doCheck(); });
    qbox.appendChild(row);
    const checkBtn=el(`<button class="mmc-btn ${st.checked?'ghost':'gold'} sm" style="margin-top:10px;" ${st.checked?'disabled':''}>${st.checked?'Checked':'Check'}</button>`);
    checkBtn.onclick=doCheck;
    qbox.appendChild(checkBtn);
  } else if(q.inputType==='fracHard'){
    const parts=String(st.given||'').split('/');
    const row=el(`
      <div class="mmc-frac-eq">
        ${fracHTML(q.givenNum, q.givenDen)}
        <span>=</span>
        <span class="mmc-frac">
          <input type="text" id="mmc-frac-num" autocomplete="off" value="${esc(parts[0]||'')}" ${st.checked?'disabled':''}>
          <span class="line"></span>
          <input type="text" id="mmc-frac-den" autocomplete="off" value="${esc(parts[1]||'')}" ${st.checked?'disabled':''}>
        </span>
      </div>
    `);
    const numIn=row.querySelector('#mmc-frac-num'), denIn=row.querySelector('#mmc-frac-den');
    const sync=()=>{ st.given=`${numIn.value.trim()}/${denIn.value.trim()}`; };
    numIn.oninput=sync; denIn.oninput=sync;
    [numIn,denIn].forEach(inp=>inp.addEventListener('keydown', e=>{ if(e.key==='Enter' && !st.checked){ sync(); doCheck(); } }));
    qbox.appendChild(row);
    const checkBtn=el(`<button class="mmc-btn ${st.checked?'ghost':'gold'} sm" style="margin-top:10px;" ${st.checked?'disabled':''}>${st.checked?'Checked':'Check'}</button>`);
    checkBtn.onclick=()=>{ sync(); doCheck(); };
    qbox.appendChild(checkBtn);
  } else if(q.inputType==='coins'){
    // Real coin graphics, scattered on a "table" rather than sorted into a row,
    // so students identify coins by sight the way they would in a shop.
    const tray=el('<div class="mmc-cointray"></div>');
    (q.coins||[]).forEach(c=>{
      const sel=st.given.includes(c.id);
      const b=el(`<button type="button" class="mmc-coin ${sel?'selected':''}" ${st.checked?'disabled':''}
        style="transform:translate(${c.dx||0}px,${c.dy||0}px) rotate(${c.rot||0}deg);" aria-label="${esc(c.l)}">${coinSVG(c.v)}</button>`);
      b.onclick=()=>{ if(st.checked) return; st.given = sel ? st.given.filter(id=>id!==c.id) : [...st.given, c.id]; render(); };
      tray.appendChild(b);
    });
    qbox.appendChild(tray);
    const chosen=(q.coins||[]).filter(c=>st.given.includes(c.id));
    const runTotal=chosen.reduce((t,c)=>t+c.v,0);
    if(q.showRunningTotal){
      const cls = runTotal===q.targetCents ? ' hit' : '';
      qbox.appendChild(el(`<div class="mmc-cointotal${cls}">Total so far: <b>${fmtCents(runTotal)}</b>
        <span class="tgt">Target ${fmtCents(q.targetCents)}</span></div>`));
    } else {
      qbox.appendChild(el(`<div class="meta" style="margin-top:6px;">${chosen.length} coin${chosen.length===1?'':'s'} selected.</div>`));
    }
    const checkBtn=el(`<button class="mmc-btn ${st.checked?'ghost':'gold'} sm" ${st.checked||st.given.length===0?'disabled':''}>${st.checked?'Checked':'Check'}</button>`);
    checkBtn.onclick=doCheck;
    qbox.appendChild(checkBtn);
  } else if(q.inputType==='order'){
    const slotsRow=el('<div class="mmc-choices" style="min-height:44px;"></div>');
    for(let s=0;s<(q.items||[]).length;s++){
      const val=st.placed[s];
      if(val===undefined){
        slotsRow.appendChild(el(`<div class="mmc-order-slot"></div>`));
      } else {
        const b=el(`<button type="button" class="mmc-choice-btn selected" ${st.checked?'disabled':''}>${esc(val)}</button>`);
        b.onclick=()=>{ if(st.checked) return; st.placed=st.placed.filter((_,idx)=>idx!==s); st.pool.push(val); render(); };
        slotsRow.appendChild(b);
      }
    }
    qbox.appendChild(el('<div class="meta" style="margin-bottom:4px;">Your order:</div>'));
    qbox.appendChild(slotsRow);
    qbox.appendChild(el('<div class="meta" style="margin:10px 0 4px;">Tap to add:</div>'));
    const poolRow=el('<div class="mmc-choices"></div>');
    st.pool.forEach(val=>{
      const b=el(`<button type="button" class="mmc-choice-btn" ${st.checked?'disabled':''}>${esc(val)}</button>`);
      b.onclick=()=>{ if(st.checked) return; st.pool=st.pool.filter(v=>v!==val); st.placed.push(val); render(); };
      poolRow.appendChild(b);
    });
    qbox.appendChild(poolRow);
    const btnRow=el('<div class="mmc-row" style="margin-top:8px;"></div>');
    const resetBtn=el(`<button class="mmc-btn ghost sm" ${st.checked?'disabled':''}>Reset</button>`);
    resetBtn.onclick=()=>{ if(st.checked) return; st.pool=shuffleArr(q.items||[]); st.placed=[]; render(); };
    const allPlaced = st.placed.length===(q.items||[]).length;
    const checkBtn=el(`<button class="mmc-btn ${st.checked?'ghost':'gold'} sm" ${st.checked||!allPlaced?'disabled':''}>${st.checked?'Checked':'Check'}</button>`);
    checkBtn.onclick=()=>{ if(!allPlaced) return; st.given=st.placed.join(','); doCheck(); };
    btnRow.appendChild(resetBtn); btnRow.appendChild(checkBtn);
    qbox.appendChild(btnRow);
  } else {
    const row=el(`
      <div class="answer-row">
        <input type="text" value="${esc(st.given)}" ${st.checked?'disabled':''} placeholder="Your answer">
        <button class="mmc-btn ${st.checked?'ghost':'gold'} sm" ${st.checked?'disabled':''}>${st.checked?'Checked':'Check'}</button>
      </div>
    `);
    const input=row.querySelector('input'); const btn=row.querySelector('button');
    input.oninput=(e)=>{ st.given=e.target.value; };
    input.addEventListener('keydown', e=>{ if(e.key==='Enter' && !st.checked) doCheck(); });
    btn.onclick=doCheck;
    qbox.appendChild(row);
  }

  if(st.checked){
    const correctText = q.inputType==='coins' ? `Try a different combination adding up to ${fmtCents(q.targetCents)}.`
      : q.inputType==='classify' ? `The answers were: ${(q.items||[]).map(it=>`${it.deg}° = ${it.correct}`).join(', ')}.`
      : `The answer was ${esc(q.answer)}.`;
    const nudge = (st.correct && (st.flags||[]).indexOf('could_simplify')!==-1) ? nudgeText(q, st.given) : '';
    const fb=el(`<div class="mmc-feedback ${st.correct?'ok':'no'}">${st.correct? '✓ Correct!' : `✗ Not quite. ${correctText}`}${q.explanation? ''+esc(q.explanation):''}${nudge? `<div class="mmc-nudge">${esc(nudge)}</div>`:''}</div>`);
    qbox.appendChild(fb);
  }
  return qbox;
}
function renderQuizTaking(week){
  const wrap=el('<div></div>');
  const back=el('<a href="#" style="color:var(--sky-deep);font-size:13px;">← back to The Arena</a>');
  back.onclick=(e)=>{ e.preventDefault(); S.activeWeekId=null; render(); };
  wrap.appendChild(back);
  wrap.appendChild(el(`<h3 style="font-family:Fredoka,sans-serif;margin:10px 0 14px;">${esc(week.label)}</h3>`));
  const qs = visibleQuestions(week);
  qs.forEach((q,i)=>{
    const st=S.quiz[q.id];
    const header=`<div class="qnum">Question ${i+1} of ${qs.length} · ${esc(q.title||'')}${q.strategyLabel?` (${esc(q.strategyLabel)})`:''}</div>`;
    const qbox=renderQuestionBody(q, st, ()=>saveWeekProgress(week), header);
    wrap.appendChild(qbox);
  });
  const allChecked=qs.every(q=>S.quiz[q.id] && S.quiz[q.id].checked);
  const finishBtn=el(`<button class="mmc-btn gold" ${allChecked?'':'disabled'} style="margin-top:6px;">Finish week ✓</button>`);
  if(!allChecked) wrap.appendChild(el('<div class="meta" style="margin-bottom:8px;">Check every question to finish.</div>'));
  finishBtn.onclick=async ()=>{
    const score=week.questions.filter(q=>S.quiz[q.id].correct).length;
    const total=week.questions.length;
    const answers=visibleQuestions(week).map(q=>({ qId:q.id, given:S.quiz[q.id].given, correct:S.quiz[q.id].correct, flags:S.quiz[q.id].flags||[] }));
    try{
      await setDoc(doc(db,'results', `${S.user.uid}_${week.id}`), {
        uid:S.user.uid, studentName:S.profile? S.profile.displayName : S.user.email, studentEmail:S.user.email,
        teacherUid: stampTeacherUid(),
        weekId:week.id, weekLabel:week.label, score, total, answers, submittedAt:serverTimestamp()
      });
    }catch(e){ S.toast='Could not save your result. Check your connection and try again.'; render(); return; }
    deleteWeekProgress(week.id);
    S.activeWeekId=null; render();
  };
  wrap.appendChild(finishBtn);
  return wrap;
}

render();
</script>
