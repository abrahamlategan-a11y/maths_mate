<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mathmentum</title>
<!-- Favicon embedded as an SVG data URI rather than a separate .ico file, so the deploy
     stays a single paste: no second file to forget, no path to get wrong, and nothing
     extra for the school network to block. Single quotes inside the SVG and %23 for the
     colours keep it a valid HTML attribute. -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%2317181C'/><path d='M13 46V18h7l12 17 12-17h7v28h-7V30L33 45h-2L20 30v16z' fill='%23FF7A1A'/></svg>">
<meta name="theme-color" content="#FF7A1A">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap');

  html,body{ margin:0; padding:0; background:#F5F2E8; }
  body{ padding:24px 12px; }

  #mmc {
    --ink: #17181C; --ink-soft: #5C5A56;
    --paper: #FFFFFF; --paper-line: #E9E4D6; --bg: #F5F2E8;
    --slime: #B7E600; --slime-deep: #8FB800;
    --orange: #FF7A1A; --orange-deep: #E85C0A;
    --magenta: #FF3D8A; --magenta-deep: #D91F6B;
    --purple: #8B5CF6; --purple-deep: #6D28D9;
    --yellow: #FFD23F; --yellow-deep: #E6B400;
    --correct: #2E9E4F; --incorrect: #E23B3B;
    /* legacy aliases so nothing else needs renaming */
    --green-deep: var(--ink); --green: var(--ink);
    --mustard: var(--orange); --mustard-deep: var(--orange-deep);
    --sky: var(--purple); --sky-deep: var(--purple-deep);
    --gold: var(--orange); --chalk: #FFFFFF;

    font-family: 'Nunito Sans', sans-serif; color: var(--ink); background: var(--paper);
    border-radius: 22px; overflow: hidden; max-width: 900px; margin: 0 auto;
    border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink);
  }
  #mmc * { box-sizing: border-box; }
  #mmc button { font-family: inherit; cursor: pointer; }
  #mmc input, #mmc select, #mmc textarea { font-family: inherit; }

  .mmc-head {
    background: linear-gradient(120deg, var(--purple-deep) 0%, var(--purple) 40%, var(--slime) 100%);
    color: var(--ink); padding: 34px 28px 26px; position: relative; overflow: hidden;
    border-bottom: 4px solid var(--ink);
  }
  .mmc-head::before {
    content:""; position:absolute; top:-40px; right:-40px; width:140px; height:140px;
    background: var(--purple); opacity:.25; border-radius: 62% 38% 55% 45% / 45% 55% 45% 55%;
  }
  .mmc-head::after {
    content:""; position:absolute; bottom:-30px; left:-20px; width:100px; height:100px;
    background: var(--yellow); opacity:.3; border-radius: 40% 60% 55% 45% / 55% 45% 60% 40%;
  }
  .mmc-head-deco { position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
  .mmc-head-deco span { position:absolute; color:#fff; opacity:.16; font-weight:800; font-family:'Baloo 2',sans-serif; }
  .mmc-signout-pill {
    position:absolute; top:20px; right:20px; z-index:2; background:#fff; border:none; border-radius:999px;
    padding:9px 18px; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:13px; color:var(--ink);
    box-shadow:0 2px 8px rgba(0,0,0,0.18); display:inline-flex; align-items:center; gap:6px; cursor:pointer;
    transition:transform .12s ease;
  }
  .mmc-signout-pill:hover { transform:translateY(-1px); }
  .mmc-title {
    font-family:'Baloo 2',sans-serif; font-weight:800; font-size:clamp(38px,8vw,68px);
    margin:6px 0 2px; position:relative; z-index:1; letter-spacing:.2px; line-height:1;
    text-align:center;
  }
  .mmc-title-plain { color:#fff; text-shadow:2px 3px 0 rgba(0,0,0,0.15); }
  .mmc-title-rainbow {
    background: linear-gradient(90deg, var(--slime) 0%, var(--yellow) 35%, #4FB6E8 65%, var(--purple) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent; text-shadow:none;
  }
  /* ---- Student-side branding: small Mathmentum wordmark, big ARENA ---- */
  /* ---- Logged-out landing: says what this IS before asking for a password ---- */
  #mmc:not(:has(.mmc-head)) .mmc-body { padding-top:22px; }
  .mmc-pitch {
    background:var(--paper); border:2.5px solid var(--ink); border-radius:16px;
    box-shadow:5px 5px 0 var(--ink); padding:22px 24px; margin-bottom:16px;
  }
  .mmc-pitch-mark {
    font-family:'Baloo 2',sans-serif; font-weight:800; font-size:clamp(26px,6vw,34px);
    letter-spacing:-.035em; line-height:1; color:var(--ink);
  }
  .mmc-pitch-mark .o { color:var(--orange); }
  .mmc-pitch-line {
    font-family:'Nunito Sans',sans-serif; font-size:16px; color:var(--ink-soft);
    margin:11px 0 0; max-width:56ch; line-height:1.55; font-weight:600;
  }
  .mmc-pitch-grid {
    display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
    gap:13px; margin-top:18px;
  }
  .mmc-pitch-grid .pp { border-left:3px solid var(--paper-line); padding-left:12px; }
  .mmc-pitch-grid .pp1 { border-left-color:var(--slime); }
  .mmc-pitch-grid .pp2 { border-left-color:var(--orange); }
  .mmc-pitch-grid .pp3 { border-left-color:var(--purple); }
  .mmc-pitch-grid .pp4 { border-left-color:var(--yellow); }
  .mmc-pitch-grid b {
    display:block; font-family:'Baloo 2',sans-serif; font-weight:800; font-size:15px; color:var(--ink);
  }
  .mmc-pitch-grid span {
    display:block; font-family:'Nunito Sans',sans-serif; font-size:13.5px;
    color:var(--ink-soft); line-height:1.5; font-weight:600;
  }
  .mmc-qedit.hidden-q { opacity:.55; border-style:dashed; }
  .hidetag {
    display:inline-block; margin-left:8px; font-size:10px; font-weight:800; letter-spacing:.08em;
    background:var(--ink); color:#fff; border-radius:20px; padding:1px 8px; vertical-align:2px;
  }
  .mmc-previewbar {
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    background:var(--yellow); border:2.5px solid var(--ink); border-radius:12px;
    box-shadow:3px 3px 0 var(--ink); padding:10px 14px; margin-bottom:14px;
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:14px; color:var(--ink);
  }
  /* On-screen keypad. Shown only on touch devices, where the OS keyboard covers the
     screen and (on iPad) opens as a full QWERTY even for a numbers-only answer. */
  /* Instant right/wrong feedback for the two SPEED games. A ring only. No answer, no
     pause. So the race is untouched. It sits on the answer box because that is where a
     child's eyes already are when they tap Go. */
  @keyframes mmc-ringpop { 0%{ box-shadow:0 0 0 0 var(--mmc-ring); } 100%{ box-shadow:0 0 0 7px transparent; } }
  .mmc-flash-ok, .mmc-flash-no { animation:mmc-ringpop .55s ease-out; border-radius:10px; }
  .mmc-flash-ok { --mmc-ring:var(--correct); border-color:var(--correct) !important; }
  .mmc-flash-no { --mmc-ring:var(--incorrect); border-color:var(--incorrect) !important; }
  @media (prefers-reduced-motion:reduce){
    .mmc-flash-ok, .mmc-flash-no { animation:none; }
  }
  /* Show-password toggle. A six-year-old typing "puddle88" into dots has no way to see
     which character went wrong, and their password is on a printed card next to them
     anyway. Hiding it protects nothing and blocks the login. */
  /* A class race is a whole-class event and has to look unmistakably different from a
     friend's race, or a child glances at the screen and joins the wrong thing. Bigger,
     bolder, and gold rather than the plain card. */
  .mmc-classrace {
    border:3px solid var(--ink) !important; background:linear-gradient(135deg,#FFF3D6,#FFE7B0) !important;
    box-shadow:5px 5px 0 var(--ink) !important; text-align:center; padding:20px 18px !important;
  }
  .mmc-classrace .mmc-classflag {
    display:inline-block; background:var(--ink); color:#fff; font-family:'Baloo 2',sans-serif;
    font-weight:800; font-size:12px; letter-spacing:.14em; text-transform:uppercase;
    padding:5px 14px; border-radius:999px; margin-bottom:10px;
  }
  .mmc-classrace h3 {
    font-family:'Baloo 2',sans-serif; font-size:clamp(24px,5.5vw,34px); margin:2px 0 6px;
  }
  .mmc-classrace .mmc-btn { font-size:19px; padding:14px 22px; width:100%; max-width:320px; }
  @keyframes mmc-classpulse { 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.03);} }
  .mmc-classrace .mmc-classflag { animation:mmc-classpulse 1.8s ease-in-out infinite; }
  @media (prefers-reduced-motion:reduce){ .mmc-classrace .mmc-classflag { animation:none; } }
  /* A golden question has to be noticeable before you answer it, or there is no moment of
     "ooh". Gold border, warm fill, and a slow shine. */
  .mmc-golden {
    border:3px solid #E8A33D !important;
    background:linear-gradient(135deg,#FFF8E6,#FFEFC6) !important;
    box-shadow:0 0 0 4px rgba(232,163,61,.18), 5px 5px 0 var(--ink) !important;
    position:relative; overflow:hidden;
  }
  .mmc-golden::after {
    content:''; position:absolute; top:0; left:-60%; width:40%; height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);
    animation:mmc-shine 2.4s ease-in-out infinite;
  }
  @keyframes mmc-shine { 0%{left:-60%;} 60%,100%{left:120%;} }
  .mmc-goldenflag {
    display:inline-block; background:#E8A33D; color:var(--ink);
    font-family:'Baloo 2',sans-serif; font-weight:800; font-size:13px; letter-spacing:.1em;
    text-transform:uppercase; padding:5px 14px; border-radius:999px; margin-bottom:10px;
  }
  .mmc-coinbar {
    display:inline-flex; align-items:center; gap:7px; background:#FFF3D6;
    border:2px solid #E8A33D; border-radius:999px; padding:5px 14px;
    font-family:'Baloo 2',sans-serif; font-weight:800; font-size:15px; color:var(--ink);
  }
  .mmc-animalgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(78px,1fr)); gap:8px; margin-top:10px; }
  .mmc-animalbtn {
    background:var(--paper); border:2px solid var(--ink); border-radius:12px;
    padding:9px 4px 7px; cursor:pointer; text-align:center; box-shadow:2px 2px 0 var(--ink);
    font-family:'Nunito Sans',sans-serif;
  }
  .mmc-animalbtn:active { transform:translateY(2px); box-shadow:none; }
  .mmc-animalbtn span { display:block; font-size:26px; line-height:1.1; }
  .mmc-animalbtn small { font-size:11px; font-weight:700; color:var(--ink-soft); }
  @media (prefers-reduced-motion:reduce){ .mmc-golden::after { animation:none; display:none; } }
  .mmc-plainrow {
    font-size:15.5px; font-weight:600; padding:9px 12px; margin-bottom:7px;
    border-radius:10px; border:2px solid var(--ink); box-shadow:2px 2px 0 var(--ink);
  }
  .mmc-plainrow.good { background:#E7F9EE; }
  .mmc-plainrow.up   { background:#EAF2FF; }
  .mmc-plainrow.work { background:#FFF4E0; }
  /* Editorial, not a kid's dashboard. Salience comes from typography and white space. A heavy rule above the heading, a bigger statement line, and thin coloured margins. Rather than from tinted blocks, which read as the student view. */
  .mmc-worth { border-top:3px solid var(--ink) !important; padding-top:16px !important; }
  .mmc-worth-head {
    display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:2px;
  }
  .mmc-worth-title {
    font-size:11px; font-weight:800; letter-spacing:.16em; text-transform:uppercase;
    color:var(--ink);
  }
  .mmc-worth-count {
    font-size:11px; font-weight:600; letter-spacing:.02em; color:var(--ink-soft); white-space:nowrap;
  }
  .mmc-worth-item { padding:1px 0 1px 16px; margin-top:18px; border-left:3px solid var(--ink); }
  .mmc-worth-item.flag { border-left-color:#E8720A; }
  .mmc-worth-item.good { border-left-color:#2E7D4F; }
  .mmc-worth-k {
    font-size:10.5px; font-weight:800; letter-spacing:.09em; text-transform:uppercase;
    margin-bottom:3px;
  }
  .mmc-worth-item.flag .mmc-worth-k { color:#8A4B02; }
  .mmc-worth-item.good .mmc-worth-k { color:#1F6340; }
  .mmc-worth-t {
    font-size:19px; font-weight:600; line-height:1.32; letter-spacing:-.015em; color:var(--ink);
  }
  .mmc-worth-item.has-detail { cursor:pointer; }
  .mmc-worth-item.has-detail:hover .mmc-worth-more { opacity:1; }
  .mmc-worth-more {
    font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    color:var(--ink-soft); margin-left:9px; opacity:.55; white-space:nowrap;
    border-bottom:1.5px solid currentColor; padding-bottom:1px;
  }
  .mmc-worth-names { display:flex; flex-wrap:wrap; gap:6px; margin-top:9px; }
  .mmc-worth-names span {
    font-size:12.5px; font-weight:600; padding:3px 9px; border-radius:999px;
    background:var(--paper-line); color:var(--ink);
  }
  .mmc-getstarted { border:3px solid var(--ink) !important; box-shadow:6px 6px 0 var(--ink) !important;
    background:linear-gradient(180deg,#FFFDF7,var(--paper)) !important; margin-bottom:18px; }
  .mmc-gs-step { display:flex; gap:12px; align-items:flex-start; margin-top:14px; }
  .mmc-gs-mark {
    width:30px; height:30px; border-radius:50%; flex:0 0 30px; display:flex;
    align-items:center; justify-content:center; font-weight:800; font-size:14px;
    border:2px solid var(--ink); background:var(--paper);
  }
  .mmc-gs-step.done .mmc-gs-mark { background:#2E7D4F; color:#fff; border-color:#2E7D4F; }
  .mmc-gs-step.next .mmc-gs-mark { background:var(--gold); }
  .mmc-gs-step.later { opacity:.45; }
  .mmc-gs-title { font-weight:750; font-size:16.5px; letter-spacing:-.01em; padding-top:4px; }
  .mmc-gs-step.done .mmc-gs-title { text-decoration:line-through; opacity:.6; }
  .mmc-gs-text { font-size:14px; color:var(--ink-soft); margin-top:3px; line-height:1.45; }
  .mmc-lobbylist { display:flex; flex-wrap:wrap; gap:7px; margin-top:4px; }
  .mmc-lobbyname {
    font-size:15px; font-weight:700; padding:6px 13px; border-radius:999px;
    background:var(--paper-line); color:var(--ink);
  }
  .mmc-lobbyname.me { background:var(--ink); color:#fff; }
  .mmc-donecount {
    font-size:12.5px; font-weight:800; padding:5px 11px; border-radius:999px;
    background:var(--paper-line); color:var(--ink-soft); white-space:nowrap; align-self:center;
  }
  .mmc-donecount.all { background:#2E7D4F; color:#fff; }
  /* Colour was carried by an emoji square, which went when the teacher pages were
     de-emojied. A background band is what it should always have been: it tints the whole
     cell rather than sitting beside the number, so a row is readable at a glance. */
  .mmc-q { text-align:center; font-variant-numeric:tabular-nums; }
  .mmc-q.hi  { background:#E7F6EC; }
  .mmc-q.mid { background:#FFF3DC; }
  .mmc-q.lo  { background:#FDE8E4; }
  .mmc-qbtn {
    background:none; border:0; cursor:pointer; width:100%; padding:6px 4px;
    font-family:inherit; font-size:13px; font-weight:700; color:var(--ink);
    font-variant-numeric:tabular-nums; letter-spacing:-.01em;
  }
  .mmc-q.hi  .mmc-qbtn { color:#1F6340; }
  .mmc-q.mid .mmc-qbtn { color:#8A5B02; }
  .mmc-q.lo  .mmc-qbtn { color:#9B2C1A; }
  .mmc-qbtn:hover { text-decoration:underline; }
  .mmc-qbtn { cursor:pointer; }
  /* Started but not finished. Deliberately not red: it is not a failure, it is a child
     partway through, and it wants to look different from both a score and a blank. */
  .mmc-inprog {
    color:#8A5B02; font-weight:700; background:#FFF8E8;
    font-variant-numeric:tabular-nums;
  }
  /* Not reached yet. Quiet on purpose: it is not a wrong answer and should not read as one. */
  .mmc-inc {
    color:var(--ink-soft); font-size:11px; font-weight:800; letter-spacing:.06em;
    background:#FAF7EE; text-align:center;
  }
  .mmc-qbtn.static { cursor:default; display:block; }
  .mmc-qbtn.static:hover { text-decoration:none; }
  /* The cell you clicked, kept obvious while the panel is open. */
  .mmc-q.picked { outline:3px solid var(--ink); outline-offset:-3px; position:relative; z-index:1; }
  .mmc-qpop {
    /* An explicit width, not just a max. The pictures are SVGs sized at width:100%, and a
       position:fixed box with no width shrinks to fit its content, so "100% of the parent"
       and "the parent is as wide as its content" resolve each other to ZERO. The picture
       was present and collapsed to nothing, which is why it rendered everywhere else. */
    position:fixed; z-index:60; width:min(400px, calc(100vw - 20px));
    max-width:calc(100vw - 20px); opacity:0;
    transition:opacity .1s; filter:drop-shadow(0 6px 20px rgba(0,0,0,.22));
    background:var(--paper); border:2.5px solid var(--ink); border-radius:14px;
  }
  /* The card inside brought no background of its own, so the grid showed straight
     through the bubble. The bubble owns the surface now and the card just fills it. */
  .mmc-qbox {
    display:inline-block; min-width:44px; border-bottom:2px solid var(--ink);
    text-align:center; color:var(--ink-soft); font-weight:700;
  }
  .mmc-qpop .mmc-card {
    margin:0; border:0; box-shadow:none; background:transparent; border-radius:14px;
  }
  /* A soft shadow at whichever edge is about to pull, so it is clear the grid will move
     before it does. */
  .mmc-ledger-wrap { position:relative; }
  .mmc-ledger-wrap.edge-l { box-shadow:inset 22px 0 18px -18px rgba(0,0,0,.35); }
  .mmc-ledger-wrap.edge-r { box-shadow:inset -22px 0 18px -18px rgba(0,0,0,.35); }
  .mmc-qpop::after {
    content:''; position:absolute; left:var(--tipx,50%); border:9px solid transparent;
  }
  .mmc-qpop.up::after { top:100%; margin-left:-9px; border-top-color:var(--paper); }
  .mmc-qpop.down::after { bottom:100%; margin-left:-9px; border-bottom-color:var(--paper); }
  .mmc-q.picked .mmc-qbtn { text-decoration:underline; }
  .mmc-q:hover { filter:brightness(.96); }
  /* An instant tooltip. The native one is slow enough that a teacher scanning a row gives
     up before it appears, and there was nothing on screen to suggest hovering at all. */
  .mmc-qhead { position:relative; cursor:help; overflow:visible; }
  .mmc-ledger thead { position:relative; z-index:5; }
  .mmc-qhead::after {
    content:attr(data-tip); position:absolute; left:50%; top:100%;
    transform:translate(-50%,6px); background:var(--ink); color:#fff;
    font-size:12px; font-weight:600; letter-spacing:0; text-transform:none;
    padding:5px 9px; border-radius:7px; white-space:nowrap;
    opacity:0; pointer-events:none; transition:opacity .08s; z-index:6;
  }
  .mmc-qhead::before {
    content:''; position:absolute; left:50%; top:100%;
    transform:translate(-50%,-4px); border:5px solid transparent;
    border-bottom-color:var(--ink); opacity:0; transition:opacity .08s; z-index:6;
  }
  .mmc-qhead:hover::after, .mmc-qhead:hover::before { opacity:1; }
  .mmc-qhead span { border-bottom:1.5px dotted currentColor; padding-bottom:1px; }
  /* ---- Pick your own: built for a six-year-old on an iPad ---- */
  /* Apple and Google both put the minimum comfortable touch target at 44px. The old chips
     were about 30px high and packed together, which is fine for a mouse and not for a
     small finger. These are 84px with real space between them. */
  /* Each operation carries an Arena colour, and the choice follows the child through the
     rest of the walk, so a screen mid-way still shows what they picked. Faint on purpose:
     it should tint, not shout. */
  .mmc-op-add  { --op:var(--slime);   --opd:var(--slime-deep); }
  .mmc-op-sub  { --op:var(--orange);  --opd:var(--orange-deep); }
  .mmc-op-mul  { --op:var(--purple);  --opd:var(--purple-deep); }
  .mmc-op-div  { --op:var(--magenta); --opd:var(--magenta-deep); }
  .mmc-op-both { --op:var(--yellow);  --opd:var(--yellow-deep); }
  .mmc-bigbtn.tinted { background:color-mix(in srgb, var(--op) 16%, #fff); }
  .mmc-bigbtn.tinted:hover { background:color-mix(in srgb, var(--op) 26%, #fff); }
  .mmc-bigbtn.tinted.on { background:color-mix(in srgb, var(--op) 55%, #fff); }
  .mmc-pickcard.tinted {
    border-color:var(--opd) !important;
    background:linear-gradient(180deg, color-mix(in srgb, var(--op) 12%, #fff), var(--paper)) !important;
  }
  /* Each level owns an Arena colour, so a child recognises "the green one" before they can
     comfortably read "Easy". */
  .mmc-ff-head { position:relative; text-align:center; margin:6px 0 16px; }
  .mmc-ff-head .mmc-coinbar { position:absolute; right:0; top:0; }
  .mmc-ff-title {
    font-family:'Baloo 2',sans-serif; font-weight:800; line-height:.95;
    font-size:clamp(30px,7vw,54px); letter-spacing:.01em;
    text-transform:uppercase; color:var(--ink);
  }
  .mmc-ff-title span {
    display:block; color:var(--orange);
    text-shadow:2px 2px 0 rgba(0,0,0,.08);
  }
  @media (max-width:520px){ .mmc-ff-head .mmc-coinbar { position:static; display:inline-block; margin-top:8px; } }
  /* The closing stretch. The track quietly tightens and the horses grow, so the last
     twenty seconds feel different from the rest without anything jumping. */
  .mmc-race-scene { transition:transform .6s ease-out; }
  .mmc-race-scene.zoomed { transform:scale(1.03); }
  .mmc-race-scene.zoomed .mmc-race-horse { transition:left .45s cubic-bezier(.22,1,.36,1); }
  /* A slider, not a button. A button that says "Sound off" is ambiguous: is that the
     state, or what tapping it will do? A pill shows the state. */
  .mmc-pill {
    display:inline-flex; align-items:center; gap:9px; cursor:pointer;
    border:2px solid var(--paper-line); background:var(--paper); border-radius:999px;

  /* Students can pick their own theme colours, so the banner must stay legible

     it survives a pale yellow header as readily as a dark purple one. */
  .mmc-arena-the {
    display:block; font-family:'Baloo 2',sans-serif; font-weight:700;

  .mmc-race-name { font-family:'Baloo 2',sans-serif; font-size:10.5px; font-weight:700; background:#fff; border:1.5px solid var(--ink); border-radius:8px; padding:1px 6px; white-space:nowrap; }

  .mmc-frac-eq { display:inline-flex; align-items:center; gap:10px; font-size:22px; font-weight:700; flex-wrap:wrap; justify-content:center; }

  .mmc-frac input:focus { outline:none; border-color:var(--purple); }
  /* Mixed numbers: a taller whole-number box to the left of a stacked fraction,

  .mmc-mixed { display:inline-flex; align-items:center; gap:8px; vertical-align:middle; }
  .mmc-mixed .whole {
    font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:26px; line-height:1;

  }

  .mmc-choice-btn .mmc-mixed { font-size:15px; gap:5px; }
  .mmc-choice-btn .mmc-mixed .whole { font-size:17px; padding:0 3px; }
  .mmc-nudge {
    margin-top:8px; padding-top:8px; border-top:1.5px dashed rgba(0,0,0,.15);
    font-size:14px; font-weight:700; color:var(--orange-deep);
  }
  .mmc-quiz-q .qtext { white-space:pre-line; }
  /* Coin tray: coins sit slightly scattered and overlap a little, like real
     change on a desk. Selected coins lift and gain a ring. */
  .mmc-cointray {
    display:flex; flex-wrap:wrap; align-items:center; gap:6px 4px;
    padding:14px 12px; margin:12px 0 8px;
    background:#FBF7EC; border:2px dashed var(--paper-line); border-radius:14px;
  }
  .mmc-coin {

  .mmc-coin:hover:not(:disabled) { filter:drop-shadow(2px 3px 2px rgba(0,0,0,.3)); }

  .mmc-cointotal {

  .mmc-cointotal.hit { background:#EAF7EE; border-color:var(--correct); box-shadow:2px 2px 0 var(--correct); }
  .mmc-cointotal .tgt { font-size:13px; font-weight:700; color:var(--ink-soft); }
  .mmc-hint {
    font-size:13.5px; font-weight:700; color:var(--purple-deep);
    background:#F5F1FF; border-left:3px solid var(--purple);

  }
  .mmc-symbtn { display:flex; flex-direction:column; align-items:center; line-height:1.1; gap:1px; }
  .mmc-symbtn .sym { font-size:24px; font-weight:800; font-family:'IBM Plex Mono',monospace; }
  .mmc-symbtn .wrd { font-size:11.5px; font-weight:700; letter-spacing:.01em; }
  .mmc-cmpgap { font-size:28px; font-weight:800; color:var(--ink-soft); }
  .mmc-choice-btn .mmc-frac { font-size:15px; }
  .mmc-choice-btn .mmc-frac .num, .mmc-choice-btn .mmc-frac .den { padding:1px 4px; }

  .mmc-stamp { display:inline-flex; flex-direction:column; align-items:center; justify-content:center; min-width:92px; padding:10px 14px;
    border-radius:14px; border:3px solid var(--ink); transform:rotate(-3deg); font-family:'Baloo 2',sans-serif; box-shadow:3px 3px 0 var(--ink); }
  .mmc-stamp .score { font-family:'IBM Plex Mono',monospace; font-size:18px; font-weight:700; }
  .mmc-stamp .msg { font-size:11px; font-weight:800; margin-top:2px; text-align:center; }
  .mmc-stamp.gold { background:var(--yellow); color:var(--ink); }
  .mmc-stamp.green { background:var(--slime); color:var(--ink); }
  .mmc-stamp.blue { background:#fff; color:var(--purple-deep); border-color:var(--purple); }
  .mmc-stamp.amber { background:#fff; color:var(--orange-deep); border-color:var(--orange); }

  .mmc-ledger-wrap { overflow-x:auto; border:2.5px solid var(--ink); border-radius:14px; }
  table.mmc-ledger { border-collapse:collapse; width:100%; font-size:13px; background:#fff; }
  table.mmc-ledger th, table.mmc-ledger td { padding:9px 12px; text-align:center; border-bottom:1.5px solid var(--paper-line); white-space:nowrap; }

  table.mmc-ledger td:first-child, table.mmc-ledger th:first-child { text-align:left; font-weight:700; position:sticky; left:0; background:#fff; }

  .mmc-autherr { color:var(--incorrect); font-size:13px; font-weight:700; margin-bottom:10px; }
  /* Inline answer boxes: the question keeps its mathematical shape and the
     student types into the gaps, instead of formatting a whole line themselves. */
  .mmc-partsrow { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:14px 0 16px; }
  .mmc-partslead { font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:600; }
  .mmc-partsjoin { font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:700; color:var(--ink-soft); }
  .mmc-partscell { display:flex; flex-direction:column; align-items:center; gap:3px; }
  .mmc-partslabel { font-size:11px; font-weight:800; letter-spacing:.04em; color:var(--ink-soft); text-transform:uppercase; }
  .mmc-partsbox {
    width:118px; padding:10px 10px; font-size:19px; font-weight:700; text-align:center;
    font-family:'IBM Plex Mono',monospace; border:2.5px solid var(--ink); border-radius:10px;
    background:var(--paper); color:var(--ink); box-shadow:2px 2px 0 var(--ink);
  }
  .mmc-partsbox:focus { outline:none; border-color:var(--slime-deep); box-shadow:2px 2px 0 var(--slime-deep); }
  .mmc-partsbox:disabled { background:var(--bg); box-shadow:none; }
  @media (max-width:520px){ .mmc-partsbox { width:88px; font-size:17px; } .mmc-partslead { font-size:19px; } }
  @media (max-width:520px){ .mmc-head, .mmc-body { padding-left:16px; padding-right:16px; } }

  /* ============================================================
     TEACHER-SIDE FACELIFT (.mmc-pro)
     Applied only when a teacher is signed in (see render()).
     Everything here is an override of the classes above. No markup
     or class names change, so every existing feature keeps working.
     The student experience never receives this class and is unaffected.
     ============================================================ */
  #mmc.mmc-pro {
    --paper-line:#E4E2DC; --ink-soft:#5C5A56;
    --pro-mute:#8A8880; --pro-wash:#FAF9F7; --pro-line:#E4E2DC; --pro-soft:#EEECE7;
    --pro-good:#2E7D4F; --pro-bad:#B3352F; --pro-warn:#8A6008;

  #mmc.mmc-pro .mmc-tagline .dot { color:var(--orange); }

  #mmc.mmc-pro .mmc-sub { color:var(--pro-mute); font-size:13px; }
  #mmc.mmc-pro .mmc-signout-pill {

    font-family:'Nunito Sans',sans-serif; font-weight:600; font-size:13px; color:var(--ink); padding:7px 13px;

  #mmc.mmc-pro .mmc-welcome-role { color:var(--pro-mute); }

  #mmc.mmc-pro .mmc-stat-card {

  }

    letter-spacing:-.04em; font-variant-numeric:tabular-nums; display:block; line-height:1.05;
  }

  #mmc.mmc-pro .mmc-card .meta { color:var(--pro-mute); font-size:13.5px; font-weight:400; }

    font-family:'Nunito Sans',sans-serif; font-weight:600; font-size:14px; padding:9px 16px;
    border-radius:6px; border:1px solid var(--pro-line); background:var(--paper); color:var(--ink); box-shadow:none;
  }
  #mmc.mmc-pro .mmc-btn:hover { border-color:var(--pro-mute); transform:none; box-shadow:none; background:var(--paper); }
  #mmc.mmc-pro .mmc-btn:active { transform:none; box-shadow:none; }
  #mmc.mmc-pro .mmc-btn.gold { background:var(--ink); border-color:var(--ink); color:#fff; }
  #mmc.mmc-pro .mmc-btn.gold:hover { background:#000; border-color:#000; }

  #mmc.mmc-pro .mmc-btn.danger { background:var(--paper); color:var(--pro-bad); border:1px solid #E8D5D3; box-shadow:none; }
  #mmc.mmc-pro .mmc-btn.danger:hover { border-color:var(--pro-bad); background:var(--paper); }

  }

    border-color:var(--ink); box-shadow:none;
  }
  #mmc.mmc-pro .mmc-ledger-wrap { border:1px solid var(--pro-line); border-radius:6px; }
  #mmc.mmc-pro table.mmc-ledger { font-size:13.5px; }
  #mmc.mmc-pro table.mmc-ledger th {
    background:var(--pro-wash); font-family:'Nunito Sans',sans-serif; font-weight:700; font-size:11px;
    letter-spacing:.08em; text-transform:uppercase; color:var(--pro-mute);
    border-bottom:1px solid var(--pro-line);
  }
  #mmc.mmc-pro table.mmc-ledger td { border-bottom:1px solid var(--pro-soft); }
  #mmc.mmc-pro table.mmc-ledger th:first-child { background:var(--pro-wash); }
  #mmc.mmc-pro .mmc-cellscore { font-weight:500; }
  #mmc.mmc-pro .mmc-cellscore.good { color:var(--pro-good); }
  #mmc.mmc-pro .mmc-cellscore.mid { color:var(--pro-warn); }
  #mmc.mmc-pro .mmc-cellscore.low { color:var(--pro-bad); }
  #mmc.mmc-pro .mmc-stamp {
    transform:none; border:1px solid var(--pro-line); border-radius:6px; box-shadow:none;
    font-family:'Nunito Sans',sans-serif; background:var(--pro-wash) !important; color:var(--ink) !important;
  }
  #mmc.mmc-pro .mmc-stamp .score { font-weight:500; }
  #mmc.mmc-pro .mmc-qedit { border:1px solid var(--pro-line); border-radius:6px; background:var(--pro-wash); }

  #mmc.mmc-pro .mmc-toast { border:1px solid var(--pro-bad); border-radius:6px; box-shadow:none; font-weight:600; }
  #mmc.mmc-pro .mmc-toast.good { border-color:#2E7D4F; }
  #mmc.mmc-pro .mmc-toast.warn { border-color:#B8690A; }
  #mmc.mmc-pro code.mmc-code { border:1px solid var(--pro-line); background:var(--pro-wash); border-radius:4px; }
  #mmc.mmc-pro .mmc-empty { color:var(--pro-mute); font-weight:400; }

  #mmc.mmc-pro .mmc-genstep:last-child { padding-bottom:2px; }

    flex-shrink:0; width:24px; height:24px; border-radius:50%; border:1px solid var(--pro-line);
    display:flex; align-items:center; justify-content:center; color:var(--pro-mute);
    font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:500; margin-top:1px;
  }
  #mmc.mmc-pro .mmc-steplabel { font-size:16px; font-weight:700; letter-spacing:-.015em; margin-bottom:4px; }

    display:flex; align-items:center; gap:7px; font-size:14px; font-weight:600; cursor:pointer;
    color:var(--ink);
  }
  #mmc.mmc-pro .mmc-pick input { accent-color:var(--ink); width:15px; height:15px; }
  #mmc.mmc-pro .mmc-quickcard {
    background:var(--paper) !important; border:1px solid var(--pro-line) !important;
    border-left:3px solid var(--orange) !important; border-radius:6px !important;
  }
  #mmc.mmc-pro .mmc-classpick select {
    font-size:13.5px; font-weight:600; padding:6px 10px; border:1px solid var(--pro-line);
    border-radius:6px; background:var(--paper); color:var(--ink);
  }
  #mmc.mmc-pro .mmc-classpick select:hover { border-color:var(--pro-mute); }
  #mmc.mmc-pro .mmc-stu, #mmc.mmc-pro .mmc-stu-head {
    display:grid;
    /* Six data columns plus a fixed actions column. The Year select was added on
       10 August without widening this, which pushed Rank onto a second line and the
       buttons onto a third, and left every header from Class onward describing the
       wrong control. */
    grid-template-columns: minmax(120px,1.4fr) 104px 100px 116px 128px 92px;
    align-items:center; column-gap:10px;
  }
  /* The action buttons get their own line spanning the full width, right-aligned.
     Cramming them into a seventh column meant they either overlapped or wrapped
     awkwardly, and Delete ended up stranded on a line of its own. */
  #mmc.mmc-pro .mmc-stu { row-gap:6px; padding:12px 0; }
  /* Class rows are simpler. A plain flex line with the buttons pushed right. */
  #mmc.mmc-pro .mmc-clsrow {
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    padding:11px 0; border-bottom:1px solid var(--pro-soft);

  #mmc.mmc-pro .mmc-clsrow .mmc-stu-actions { margin-left:auto; }
  #mmc.mmc-pro .mmc-stu-actions { justify-content:flex-end; }
  /* The expanded strip spans the full row underneath it. Rank, password reset and delete
     live here: a once-a-term decision and two destructive actions had no business sitting
     in every row, one misclick from wiping a child's history. */
  /* Teacher-facing profile. Deliberately plain: the .mmc-pro palette, no coloured fills,
     no emoji cards. A teacher may read this to a parent or print it; the child's own
     dashboard is the place for trophies. */
  .mmc-ov-figs { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:0; border:1px solid var(--paper-line); border-radius:8px; overflow:hidden; margin:12px 0 18px; }
  .mmc-ov-fig { padding:12px 14px; border-right:1px solid var(--paper-line); }
  .mmc-ov-fig:last-child { border-right:0; }
  .mmc-ov-figlabel { font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-soft); }
  .mmc-ov-fignum { font-size:24px; font-weight:800; margin-top:2px; }
  .mmc-ov-figsub { font-size:12px; color:var(--ink-soft); }
  .mmc-ov-cols { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:18px; }
  .mmc-ov-h { font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin:18px 0 6px; }
  .mmc-ov-list { width:100%; border-collapse:collapse; font-size:14px; }
  .mmc-ov-list td { padding:6px 0; border-bottom:1px solid var(--paper-line); }
  .mmc-ov-list td:last-child { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .mmc-ov-pick { width:100%; border-collapse:collapse; font-size:14px; }

// ---------- Preview mode write guard ----------
// When a teacher previews the app as one of their students, NOTHING they do may
// be recorded. No results, no times-table attempts, no saved progress, no theme
// or horse-colour changes. Rather than patching ~36 individual call sites (where
// a single miss would silently pollute a real child's data), every Firestore
// write is intercepted here at the import. Preview mode is therefore safe by
// construction: a write path added later is guarded automatically.
// Tone is read from the message rather than set at 80-odd call sites, so a new message
// is styled sensibly the moment it is written. An explicit S.toastTone always wins.
const TOAST_BAD  = /could not|couldn'?t|failed|error:|error\b/i;
const TOAST_WARN = /cannot|can'?t|choose |pick at least|give the |enter |need |no students|no practice sets|nothing to clear|nothing was cleared|already|is 4 numbers|first\.|try again|switched off|not enough|no race with/i;
function toastTone(msg){
  if(S.toastTone) return S.toastTone;
  const m=String(msg||'');
  if(TOAST_BAD.test(m)) return 'bad';
  if(TOAST_WARN.test(m)) return 'warn';
  return 'good';
}
function isPreviewing(){ try { return !!S.previewStudentUid; } catch(e){ return false; } }
// While previewing, a teacher's live listeners keep firing and would replace the narrowed
// arrays with the whole class again mid-preview. Every snapshot goes through this, so the
// narrowing survives however long the teacher stays in there.
function scopeToPreview(list){
  if(!S.previewStudentUid) return list;
  return (list||[]).filter(r=>r && r.uid===S.previewStudentUid);
}
function _blockedWrite(what){
  console.info('[preview] blocked '+what+'nothing is saved while previewing.');

}

function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function pick(arr){ return arr[randInt(0,arr.length-1)]; }
function uid(p){ return p+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ [a,b]=[b,a%b]; } return a||1; }
function simplify(n,d){ const g=gcd(n,d)||1; return [n/g, d/g]; }
function fracStr(n,d){ const [sn,sd]=simplify(n,d); return sd===1 ? String(sn) : (sn+'/'+sd); }
function formatGrouped(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
function shuffleArr(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=randInt(0,i); [a[i],a[j]]=[a[j],a[i]]; } return a; }

// ---------- SVG diagram helpers ----------
function svgWrap(inner, w, h){
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:260px;height:auto;background:#fff;border:1px solid var(--paper-line);border-radius:8px;display:block;">${inner}</svg>`;
}
function drawShadedGrid(rows, cols, n){
  const cell = Math.max(12, Math.min(22, Math.floor(220/Math.max(rows,cols))));
  let cells='';
  const total=rows*cols;
  for(let i=0;i<total;i++){
    const r=Math.floor(i/cols), c=i%cols;
    const fill = i<n ? '#3F7A57' : '#ffffff';
    cells+=`<rect x="${c*cell}" y="${r*cell}" width="${cell}" height="${cell}" fill="${fill}" stroke="#E4DCC8"/>`;
  }
  return svgWrap(cells, cols*cell, rows*cell);
}
function drawRectShape(w,h){
  const cell=26, pad=1, gridW=w+pad*2, gridH=h+pad*2;
  let lines='';
  for(let x=0;x<=gridW;x++) lines+=`<line x1="${x*cell}" y1="0" x2="${x*cell}" y2="${gridH*cell}" stroke="#E4DCC8"/>`;
  for(let y=0;y<=gridH;y++) lines+=`<line x1="0" y1="${y*cell}" x2="${gridW*cell}" y2="${y*cell}" stroke="#E4DCC8"/>`;
  const rect=`<rect x="${pad*cell}" y="${pad*cell}" width="${w*cell}" height="${h*cell}" fill="#4C7A96" fill-opacity="0.45" stroke="#395E76" stroke-width="2"/>`;
  return svgWrap(lines+rect, gridW*cell, gridH*cell);
}
function lShapePoints(s, cell, offsetX, offsetY){
  return [
    [offsetX, offsetY],
    [offsetX+(s.W-s.nw)*cell, offsetY],
    [offsetX+(s.W-s.nw)*cell, offsetY+s.nh*cell],
    [offsetX+s.W*cell, offsetY+s.nh*cell],
    [offsetX+s.W*cell, offsetY+s.H*cell],
    [offsetX, offsetY+s.H*cell],
  ];
}
function gridLines(W,H,cell,offsetX,offsetY){
  let l='';
  for(let x=0;x<=W;x++) l+=`<line x1="${offsetX+x*cell}" y1="${offsetY}" x2="${offsetX+x*cell}" y2="${offsetY+H*cell}" stroke="#E4DCC8"/>`;
  for(let y=0;y<=H;y++) l+=`<line x1="${offsetX}" y1="${offsetY+y*cell}" x2="${offsetX+W*cell}" y2="${offsetY+y*cell}" stroke="#E4DCC8"/>`;
  return l;
}
function drawLShape(s){
  const cell=24, pad=1;
  const ox=pad*cell, oy=pad*cell;
  const lines=gridLines(s.W,s.H,cell,ox,oy);
  const poly=lShapePoints(s,cell,ox,oy).map(p=>p.join(',')).join(' ');
  const shape=`<polygon points="${poly}" fill="#4C7A96" fill-opacity="0.45" stroke="#395E76" stroke-width="2"/>`;
  return svgWrap(lines+shape, (s.W+pad*2)*cell, (s.H+pad*2)*cell);
}
function drawShapePair(s1,s2){
  const cell=20, gap=30, topPad=22;
  const w1=s1.W*cell, w2=s2.W*cell, maxH=Math.max(s1.H,s2.H)*cell;
  const offset2=w1+gap;
  let inner='';
  inner+=gridLines(s1.W,s1.H,cell,0,0);
  inner+=`<polygon points="${lShapePoints(s1,cell,0,0).map(p=>p.join(',')).join(' ')}" fill="#4C7A96" fill-opacity="0.45" stroke="#395E76" stroke-width="2"/>`;
  inner+=`<text x="${w1/2}" y="-6" font-size="14" text-anchor="middle" fill="#2B2620" font-family="IBM Plex Mono, monospace" font-weight="600">A</text>`;
  inner+=gridLines(s2.W,s2.H,cell,offset2,0);
  inner+=`<polygon points="${lShapePoints(s2,cell,offset2,0).map(p=>p.join(',')).join(' ')}" fill="#FF7A1A" fill-opacity="0.4" stroke="#E85C0A" stroke-width="2"/>`;
  inner+=`<text x="${offset2+w2/2}" y="-6" font-size="14" text-anchor="middle" fill="#2B2620" font-family="IBM Plex Mono, monospace" font-weight="600">B</text>`;
  return svgWrap(`<g transform="translate(4,${topPad})">${inner}</g>`, w1+gap+w2+8, maxH+topPad+8);
}
function drawClock(hour,minute,minorTicks){
  const cx=100, cy=100, r=90;
  const minuteAngle = minute*6, hourAngle=(hour%12)*30 + minute*0.5;
  function pt(deg,len){ const rad=(deg-90)*Math.PI/180; return [cx+len*Math.cos(rad), cy+len*Math.sin(rad)]; }
  const [hx,hy]=pt(hourAngle,48), [mx,my]=pt(minuteAngle,74);
  let ticks='';
  for(let i=0;i<12;i++){ const [x1,y1]=pt(i*30,80), [x2,y2]=pt(i*30,88);
    ticks+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#2B2620" stroke-width="2"/>`; }
  // Medium difficulty gets fine minute markers between the hour positions, so
  // students can read any time without having to count in fives unaided.
  if(minorTicks){
    for(let i=0;i<60;i++){
      if(i%5===0) continue;
      const [x1,y1]=pt(i*6,84), [x2,y2]=pt(i*6,88);
      ticks+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#2B2620" stroke-width="1"/>`;
    }
  }
  return svgWrap(`<circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff" stroke="#2B2620" stroke-width="3"/>${ticks}
    <line x1="${cx}" y1="${cy}" x2="${hx}" y2="${hy}" stroke="#2B2620" stroke-width="5" stroke-linecap="round"/>
    <line x1="${cx}" y1="${cy}" x2="${mx}" y2="${my}" stroke="#2B2620" stroke-width="3" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="4" fill="#2B2620"/>`, 200,200);
}
function drawAngle(deg){
  const cx=115, cy=150, r=110, arcR=32;
  function pt(a,len){ const rad=a*Math.PI/180; return [cx+len*Math.cos(rad), cy-len*Math.sin(rad)]; }
  const [x1,y1]=pt(0,r), [x2,y2]=pt(deg,r), [ax1,ay1]=pt(0,arcR), [ax2,ay2]=pt(deg,arcR);
  const largeArc = deg>180?1:0;
  // A right angle is marked with a SQUARE, not an arc. That is the convention every maths
  // book uses, and an arc on a 90 degree angle reads as "some angle" rather than "this one
  // is exactly square".
  const mark = deg===90
    ? (()=>{ const k=26; const [px,py]=pt(0,k), [qx,qy]=pt(90,k);
        return `<path d="M ${px} ${py} L ${px+(qx-cx)} ${py+(qy-cy)} L ${qx} ${qy}" fill="none" stroke="#C4801F" stroke-width="2.5"/>`; })()
    : `<path d="M ${ax1} ${ay1} A ${arcR} ${arcR} 0 ${largeArc} 0 ${ax2} ${ay2}" fill="none" stroke="#C4801F" stroke-width="2.5"/>`;
  return svgWrap(`<line x1="${cx}" y1="${cy}" x2="${x1}" y2="${y1}" stroke="#2B2620" stroke-width="3"/>
    <line x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}" stroke="#2B2620" stroke-width="3"/>
    ${mark}
    <circle cx="${cx}" cy="${cy}" r="3" fill="#2B2620"/>`, 240,190);
}
function drawCompositeAngle(a1,a2){
  const cx=115, cy=150, r=110, arcR=28, arcR2=44;
  function pt(a,len){ const rad=a*Math.PI/180; return [cx+len*Math.cos(rad), cy-len*Math.sin(rad)]; }
  const [x0,y0]=pt(0,r), [x1,y1]=pt(a1,r), [x2,y2]=pt(a1+a2,r);
  const [ax0,ay0]=pt(0,arcR), [ax1,ay1]=pt(a1,arcR);
  const [bx1,by1]=pt(a1,arcR2), [bx2,by2]=pt(a1+a2,arcR2);
  const large1=a1>180?1:0, large2=a2>180?1:0;
  return svgWrap(`
    <line x1="${cx}" y1="${cy}" x2="${x0}" y2="${y0}" stroke="#2B2620" stroke-width="3"/>
    <line x1="${cx}" y1="${cy}" x2="${x1}" y2="${y1}" stroke="#2B2620" stroke-width="3"/>
    <line x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}" stroke="#2B2620" stroke-width="3"/>
    <path d="M ${ax0} ${ay0} A ${arcR} ${arcR} 0 ${large1} 0 ${ax1} ${ay1}" fill="none" stroke="#C4801F" stroke-width="2.5"/>
    <path d="M ${bx1} ${by1} A ${arcR2} ${arcR2} 0 ${large2} 0 ${bx2} ${by2}" fill="none" stroke="#8B5CF6" stroke-width="2.5"/>
    <circle cx="${cx}" cy="${cy}" r="3" fill="#2B2620"/>`, 240,190);
}
function drawTriangleAngles(labels){
  const pts=[[120,20],[20,170],[220,170]];
  const poly=pts.map(p=>p.join(',')).join(' ');
  const labelPos=[[120,48],[58,148],[182,148]];
  let labelsSvg='';
  labels.forEach((l,i)=>{ labelsSvg+=`<text x="${labelPos[i][0]}" y="${labelPos[i][1]}" font-size="17" font-family="IBM Plex Mono, monospace" font-weight="600" fill="#2B2620" text-anchor="middle">${l}</text>`; });
  return svgWrap(`<polygon points="${poly}" fill="none" stroke="#2B2620" stroke-width="3"/>${labelsSvg}`, 240,190);
}
function drawQuadAngles(labels){
  const pts=[[40,30],[200,30],[220,170],[20,170]];
  const poly=pts.map(p=>p.join(',')).join(' ');
  const labelPos=[[58,58],[182,58],[192,148],[48,148]];
  let labelsSvg='';
  labels.forEach((l,i)=>{ labelsSvg+=`<text x="${labelPos[i][0]}" y="${labelPos[i][1]}" font-size="17" font-family="IBM Plex Mono, monospace" font-weight="600" fill="#2B2620" text-anchor="middle">${l}</text>`; });
  return svgWrap(`<polygon points="${poly}" fill="none" stroke="#2B2620" stroke-width="3"/>${labelsSvg}`, 240,190);
}
// A single bar split into equal parts. The Year 3 fraction model. The Year 4 grids are
// a rectangle of up to sixty squares, which is a different (and later) idea.
function drawBar(num, den){
  const w=Math.min(360, den*44), h=54, cw=w/den;
  let inner='';
  for(let i=0;i<den;i++){
    inner+=`<rect x="${i*cw}" y="0" width="${cw}" height="${h}" fill="${i<num?'#E8A33D':'#FFFDF8'}" stroke="#2B2620" stroke-width="3"/>`;
  }
  return svgWrap(inner, w, h);
}
function drawLayers(layers,rows,cols){
  const cell=18, gap=10; let inner=''; let y=8;
  for(let L=0;L<layers;L++){
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++)
      inner+=`<rect x="${c*cell+8}" y="${y+r*cell}" width="${cell-2}" height="${cell-2}" fill="#E8A33D" stroke="#C4801F"/>`;
    y+=rows*cell+gap;
  }
  return svgWrap(inner, cols*cell+16, y);
}

// ---------- Question generators (20 fixed curriculum slots) ----------
const OPR = {
  easy:   { addMax:999,   mulA:[2,9],  mulB:[2,9],  divDivisor:[2,9],  divQuotient:[2,9] },
  medium: { addMax:9999,  mulA:[2,12], mulB:[2,12], divDivisor:[2,12], divQuotient:[2,12] },
  hard:   { addMax:99999, mulA:[10,20],mulB:[2,12], divDivisor:[2,15], divQuotient:[10,30] }
};
const PLACES=['ones','tens','hundreds','thousands','ten-thousands','hundred-thousands'];

function genPlaceValue(diff){
  const L = diff==='easy'?4: diff==='medium'?5:6;
  let digits=[randInt(1,9)]; for(let i=1;i<L;i++) digits.push(randInt(0,9));
  const num=parseInt(digits.join(''),10);
  const placeIdx=randInt(0,L-1); const placeName=PLACES[placeIdx]; const digit=digits[L-1-placeIdx];
  return { prompt:`Which digit is in the ${placeName} place in the number ${formatGrouped(num)}?`, answer:String(digit),
    explanation:`In ${formatGrouped(num)}, the ${placeName} digit is ${digit}.` };
}
function genSequence(diff){
  const step = diff==='easy'? randInt(1,5) : diff==='medium'? pick([5,10,20,25]) : pick([50,100,200,250]);
  const start = randInt(1,40)*step;
  const terms=[]; for(let i=0;i<5;i++) terms.push(start+i*step);
  const blankIdx=randInt(1,3); const answer=terms[blankIdx];
  const display=terms.map((t,i)=> i===blankIdx? '?' : String(t)).join(', ');
  return { prompt:`Fill in the missing number: ${display}`, answer:String(answer),
    explanation:`The pattern increases by ${step} each time, so the missing number is ${answer}.` };
}
function genRounding(diff){
  const range = diff==='easy'?[100,999]: diff==='medium'?[1000,9999]:[10000,99999];
  const num=randInt(range[0],range[1]);
  const toOptions = diff==='easy'? [10,100] : diff==='medium'? [100,1000] : [1000,10000];
  const roundTo=pick(toOptions); const rounded=Math.round(num/roundTo)*roundTo;
  return { prompt:`Round ${formatGrouped(num)} to the nearest ${formatGrouped(roundTo)}.`, answer:String(rounded),
    explanation:`${formatGrouped(num)} rounds to ${formatGrouped(rounded)} (nearest ${formatGrouped(roundTo)}).` };
}
function genOrdering(diff){
  const range = diff==='easy'?[10,999]: diff==='medium'?[1000,99999]:[10000,999999];
  let s=new Set(); while(s.size<4) s.add(randInt(range[0],range[1]));
  const arr=shuffleArr([...s]); const sorted=[...s].sort((a,b)=>a-b);
  return { prompt:`Tap the numbers in ascending order (smallest first).`, items:arr.map(String), answer:sorted.join(','),
    explanation:`Ascending order: ${sorted.map(formatGrouped).join(', ')}`, inputType:'order', checkType:'numlist' };
}
function genFactors(diff){
  const range= diff==='easy'?[12,30]: diff==='medium'?[20,60]:[40,100];
  let num, factors;
  do{
    num=randInt(range[0],range[1]);
    factors=[]; for(let i=1;i<=num;i++) if(num%i===0) factors.push(i);
  } while(factors.length<4);
  const decoyFactors = shuffleArr(factors).slice(0,3);
  let nonFactor=null;
  for(let tries=0; tries<40 && nonFactor===null; tries++){
    const c=randInt(2,num-1);
    if(!factors.includes(c)) nonFactor=c;
  }
  if(nonFactor===null) nonFactor = num + randInt(1,9);
  const choices=shuffleArr([String(nonFactor), ...decoyFactors.map(String)]);
  return { prompt:`Which of these is NOT a factor of ${num}?`, answer:String(nonFactor), inputType:'choice', choices,
    explanation:`The factors of ${num} are: ${factors.join(', ')}. ${nonFactor} is not a factor.` };
}
function genAddition(diff){ const r=OPR[diff]; const a=randInt(100,r.addMax), b=randInt(100,r.addMax);
  return { prompt:`${formatGrouped(a)} + ${formatGrouped(b)} = ?`, answer:String(a+b), explanation:`${formatGrouped(a)} + ${formatGrouped(b)} = ${formatGrouped(a+b)}` }; }
function genSubtraction(diff){ const r=OPR[diff]; const a=randInt(100,r.addMax), b=randInt(0,a);
  return { prompt:`${formatGrouped(a)} − ${formatGrouped(b)} = ?`, answer:String(a-b), explanation:`${formatGrouped(a)} − ${formatGrouped(b)} = ${formatGrouped(a-b)}` }; }
function genMultiplication(diff){
  let a,b;
  if(diff==='easy'){ a=randInt(10,99); b=randInt(2,9); }
  else if(diff==='medium'){ a=randInt(100,999); b=randInt(2,9); }
  else { a=randInt(100,999); b=randInt(10,99); }
  return { prompt:`${formatGrouped(a)} × ${b} = ?`, answer:String(a*b), explanation:`${formatGrouped(a)} × ${b} = ${formatGrouped(a*b)}` };

function genDivision(diff){

const GRID_SIZES = [ {rows:2,cols:5},{rows:4,cols:5},{rows:5,cols:6},{rows:5,cols:8},{rows:5,cols:10},{rows:6,cols:10},{rows:8,cols:10},{rows:10,cols:10} ];

function genShadedGridY4(diff){
  if(diff==='easy'){
    // Denominator is prefilled and varies (10, 20, 25, 50, 100) so students meet
    // several "wholes", and they only type the numerator.
    const shapes=[{rows:2,cols:5},{rows:4,cols:5},{rows:5,cols:5},{rows:5,cols:10},{rows:10,cols:10}];
    const sh=pick(shapes); const total=sh.rows*sh.cols;
    const n=randInt(1,total-1);
    return { prompt:`What fraction of the grid is shaded?`,
      inputType:'mixed', wantWhole:false, lockDen:total,
      ansNum:n, ansDen:total, answer:`${n}/${total}`,
      explanation:`${n} of the ${total} squares are shaded, so the fraction is ${n}/${total}.`,
      svg:drawShadedGrid(sh.rows,sh.cols,n), subskill:'count_visual_fraction' };
  }
  if(diff==='medium'){
    // No simplification at Medium. The skill is reading the fraction the visual
    // shows, so the DIRECT fraction is the correct answer.
    const size=pick(GRID_SIZES); const total=size.rows*size.cols;
    const n=randInt(2,total-2);
    const correct=`${n}/${total}`;
    const seen=new Set([correct]); const decoys=[];
    // Plausible misreads: counting the unshaded part, off-by-a-row, off-by-one,
    // and inverting the fraction.
    // The different-denominator distractor is added FIRST. Added afterwards it
    // never appeared, because the same-denominator loop had already filled all
    // three slots. Four options sharing one denominator reduces the question to
    // counting shaded squares rather than reading the whole fraction.
    const otherTotals=GRID_SIZES.map(g=>g.rows*g.cols).filter(t=>t!==total);
    if(otherTotals.length){
      const ot=pick(otherTotals);
      const alt=`${Math.max(1,Math.min(ot-1,n))}/${ot}`;
      if(!seen.has(alt)){ seen.add(alt); decoys.push(alt); }
    }
    const candidates=[total-n, n+size.cols, n-size.cols, n+1, n-1];
    for(const c of shuffleArr(candidates)){
      if(c<=0||c>=total||c===n) continue;
      const f=`${c}/${total}`; if(!seen.has(f)){ seen.add(f); decoys.push(f); if(decoys.length>=3) break; }
    }
    if(decoys.length<3){ const inv=`${total}/${n}`; if(!seen.has(inv)){ seen.add(inv); decoys.push(inv); } }
    while(decoys.length<3){
      const useOther = Math.random()<0.4 && otherTotals.length;
      const t = useOther ? pick(otherTotals) : total;
      const c=randInt(1,t-1); const f=`${c}/${t}`;
      if(!seen.has(f)){ seen.add(f); decoys.push(f); }
    }
    const choices=shuffleArr([correct,...decoys.slice(0,3)]);
    return { prompt:`What fraction of the grid is shaded?`, answer:correct, inputType:'choice', choices,
      renderFractionChoices:true,
      explanation:`${n} of the ${total} parts are shaded, so the fraction is ${n}/${total}.`,
      svg:drawShadedGrid(size.rows,size.cols,n), subskill:'read_visual_fraction' };
  }
  // hard: multiple choice, correct answer is the simplified fraction
  const pool=GRID_SIZES.filter(s=>s.rows*s.cols>=20);
  const size=pick(pool); const total=size.rows*size.cols;
  let n=randInt(2,total-2);
  if(gcd(n,total)<2){ n = total%2===0 ? total-2 : total-3; } // ensure it's reducible
  const correct=fracStr(n,total);
  const raw=`${n}/${total}`;
  const seen=new Set([correct]); const decoys=[];
  if(raw!==correct){ seen.add(raw); decoys.push(raw); }
  const candidates=[total-n, n+size.cols, n-size.cols, n+2, n-2].filter(x=>x>0&&x<total&&x!==n);
  for(const c of shuffleArr(candidates)){ const f=fracStr(c,total); if(!seen.has(f)){ seen.add(f); decoys.push(f); if(decoys.length>=3) break; } }
  while(decoys.length<3){ const c=randInt(1,total-1); const f=fracStr(c,total); if(!seen.has(f)){ seen.add(f); decoys.push(f); } }
  const choices=shuffleArr([correct, ...decoys.slice(0,3)]);
  return { prompt:`What fraction of the grid is shaded? Give your answer in simplest form.`, answer:correct, inputType:'choice', choices,
    explanation:`${n} out of ${total} squares are shaded · ${n}/${total} simplifies to ${correct}.`, svg:drawShadedGrid(size.rows,size.cols,n) };
}
function genDecimalPlace(diff){

  const numStr=`${whole}.${dec}`;

function genOrderDecimals(diff, _strategy, year){
  if(+year===5){
    // The Year 5 marker: decimals GREATER THAN 1 and beyond two places, where 3.407,
    // 3.47 and 3.7 have to be told apart. Year 4 stops at hundredths.
    const whole = diff==='easy' ? randInt(0,4) : randInt(1,9);
    const dps = diff==='easy' ? [1,2] : [1,2,3];
    const seen=new Set(), vals=[];
    let guard=0;
    while(vals.length<4 && guard++<300){
      const dp=pick(dps);
      const v=Number((whole + randInt(1, Math.pow(10,dp)-1)/Math.pow(10,dp)).toFixed(dp));
      if(!seen.has(v)){ seen.add(v); vals.push(v); }
    }
    if(vals.length>=4){
      const asc=Math.random()<0.5;
      const sorted=vals.slice().sort((a,b)=> asc? a-b : b-a);
      return { prompt:`Tap the decimals in ${asc?'ascending':'descending'} order${diff==='easy'?(asc?' (smallest to biggest)':' (biggest to smallest)'):''}.`,
        items:vals.map(String), answer:sorted.join(','),
        inputType:'order', checkType:'numlist',
        explanation:`${asc?'Ascending':'Descending'}: ${sorted.join(', ')}` };
    }
  }
  // The "trick" deliberately changes between sets so students can't pattern-match:
  // sometimes trailing zeros, sometimes differing decimal lengths, sometimes a
  // whole number mixed in, sometimes the same digits with the point moved.
  let vals=[];
  if(diff==='easy'){
    const s=new Set();
    while(s.size<4) s.add(randInt(10,49)/10);   // ones and tenths only
    vals=[...s];
  } else if(diff==='medium'){
    const base=randInt(2,8);
    const s=new Set([base, base+randInt(1,4)/10, base+randInt(11,49)/100, base+randInt(111,499)/1000]);
    while(s.size<4) s.add(randInt(1,9)+randInt(1,9)/10);
    vals=[...s].slice(0,4);
  } else {
    const trick=pick(['trailingZeros','movePoint','mixedLengths','wholeMixed']);
    const b=randInt(2,8), t=randInt(1,9);
    if(trick==='trailingZeros'){
      const core=b+t/10;
      vals=[core, b+t/10+randInt(1,9)/100, b+randInt(1,9)/10, b];
    } else if(trick==='movePoint'){
      const d=randInt(2,9), e=randInt(1,9);
      vals=[d+e/10, (d*10)+e, (d+e/10)/10, d+e/100];
    } else if(trick==='mixedLengths'){
      vals=[b+t/10, b+t/100, b+t/1000, b+(t+1)/10];
    } else {
      vals=[b, b+t/10, b+t/100, b-1+randInt(5,9)/10];
    }
  }
  vals=[...new Set(vals.map(v=>Math.round(v*1000)/1000))];
  while(vals.length<4){ const v=Math.round((randInt(1,9)+randInt(0,99)/100)*1000)/1000; if(vals.indexOf(v)===-1) vals.push(v); }
  vals=vals.slice(0,4);
  const asc=Math.random()<0.5;
  const sorted=[...vals].sort((a,b)=>asc?a-b:b-a);
  let shown=shuffleArr(vals);
  let g=0; while(shown.join()===sorted.join() && g++<20) shown=shuffleArr(vals);
  const clue = diff==='hard' ? '' : (asc?' (smallest to biggest)':' (biggest to smallest)');
  return { prompt:`Tap the decimals in ${asc?'ascending':'descending'} order${clue}.`,
    items:shown.map(String), answer:sorted.join(','),
    explanation:`${asc?'Ascending':'Descending'} order: ${sorted.join(', ')}`,
    inputType:'order', checkType:'numlist' };
}

// Fewest-coins solution for an amount, using coins only.
function minimalCoins(cents){
  let rem=cents; const out=[];
  for(let i=AUD_COINS.length-1;i>=0;i--){
    while(rem>=AUD_COINS[i].v){ out.push(AUD_COINS[i].v); rem-=AUD_COINS[i].v; }
  }
  return rem===0 ? out : null;
}

function buildCoinsQuestion(target, promptText, explanationText, opts){
  opts = opts || {};
  const solution = minimalCoins(target) || [];
  // Always offer extra coins that aren't needed, so selecting everything on the
  // table is never the answer.
  const extras=[];
  // A fuller tray, and always a few small coins. Without 5c and 10c present the
  // "fewest coins" decision is much easier than it should be.
  extras.push(5,5,10,10,20);
  const extraCount = randInt(4,6);
  for(let i=0;i<extraCount;i++) extras.push(pick(AUD_COINS).v);
  const coins=[...solution, ...extras].map((v,i)=>{
    const c=coinByValue(v);
    return {v, l:c.l, id:'c'+i,
      // Small random offsets so the coins look scattered on a table rather than
      // sorted into a neat row.
      dx: randInt(-6,6), dy: randInt(-7,7), rot: randInt(-14,14)};
  });
  for(let i=coins.length-1;i>0;i--){ const j=randInt(0,i); [coins[i],coins[j]]=[coins[j],coins[i]]; }
  return { prompt:promptText, inputType:'coins', targetCents:target, coins,
    // Coins are graded from the selection, not a typed string. But an answer
    // string still gives the teacher review screen and feedback something to show.
    answer: solution.map(v=>coinByValue(v).l).join(' + '),
    explanation:explanationText, minCoins:solution.length,
    showRunningTotal: !!opts.runningTotal, coinsSubskill:opts.subskill||'make_amount' };
}

function joinWithAnd(parts){
  if(parts.length===1) return parts[0];
  if(parts.length===2) return `${parts[0]} and ${parts[1]}`;
  return `${parts.slice(0,-1).join(', ')} and ${parts[parts.length-1]}`;
}

// ---------- CUT-OUT SHAPES (Q15 medium) ----------
// Built as a grid occupancy map rather than a formula. Area is simply the number
// of filled cells; perimeter is the number of cell edges with nothing next to
// them. That's exact for ANY rectilinear shape, so cut-outs can sit on edges,
// in corners, be bigger than one square, and there can be several of them. // no special-case geometry to get wrong.
function buildCutoutShape(){
  const W=randInt(5,9), H=randInt(4,7);
  const cells=[]; for(let y=0;y<H;y++){ cells.push(new Array(W).fill(true)); }
  const cutCount = Math.random()<0.42 ? 2 : 1;
  const corners=[[0,0],[1,0],[0,1],[1,1]];   // [right?, bottom?]
  const used=[];
  for(let k=0;k<cutCount;k++){
    // Bites are taken from a corner or the middle of an edge, and can be
    // several squares across, so the same notch never repeats.
    const cw=randInt(1, Math.max(1, Math.floor(W/2)-1));
    const ch=randInt(1, Math.max(1, Math.floor(H/2)-1));
    const fromCorner = Math.random()<0.6 || k===1;
    let x0,y0;
    if(fromCorner){
      const c=pick(corners.filter(c=>!used.some(u=>u[0]===c[0]&&u[1]===c[1])));
      if(!c) continue;
      used.push(c);
      x0 = c[0] ? W-cw : 0;
      y0 = c[1] ? H-ch : 0;
    } else {
      // Edge notch: flush against one side, offset along it.
      const side=pick(['top','bottom','left','right']);
      if(side==='top'){ x0=randInt(1,Math.max(1,W-cw-1)); y0=0; }
      else if(side==='bottom'){ x0=randInt(1,Math.max(1,W-cw-1)); y0=H-ch; }
      else if(side==='left'){ x0=0; y0=randInt(1,Math.max(1,H-ch-1)); }
      else { x0=W-cw; y0=randInt(1,Math.max(1,H-ch-1)); }
    }
    for(let y=y0;y<y0+ch;y++) for(let x=x0;x<x0+cw;x++){ if(cells[y]&&cells[y][x]!==undefined) cells[y][x]=false; }
  }
  let area=0, perim=0;
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    if(!cells[y][x]) continue;
    area++;
    if(y===0 || !cells[y-1][x]) perim++;
    if(y===H-1 || !cells[y+1][x]) perim++;
    if(x===0 || !cells[y][x-1]) perim++;

      fill="#3F7D5C" stroke="#F5F2E8" stroke-width="1.5"/>`;
  }

function genArea(diff, _strategy, year){

// Q17: Simplify a fraction
// A denominator of 2 forces the numerator to 1, so a quarter of these questions
// had a guaranteed answer and typing "1" scored 56% with no maths done. Worse,
// that inflated SIMPLIFY_FRACTION in the dashboard, so a guesser showed up as
// strong. Dropping 2 and widening the pool takes guessing to 40% across 6 answers.
const NICE_DENOMS_EASY=[3,4,5,6,8];
const NICE_DENOMS_MED=[2,3,4,5,6,7,8,9,10,12];
function pickSimplifiedFraction(denomPool){
  const d1=pick(denomPool); let n1;

function genFractionSimplify(diff, _strategy, year){
  if(+year===6){
    // 6/10, then 12/20, then 18/24. Always a real simplification, never the fill-in-the-
    // numerator form, which is a Year 4 stepping stone and guessable besides.
    const pairs = diff==='easy' ? [[6,10],[8,12],[4,10],[6,8],[9,12]]
      : diff==='medium' ? [[12,20],[15,25],[10,15],[14,21],[16,20]]
      : [[18,24],[24,36],[21,28],[30,45],[27,36],[32,40]];
    const [n,d]=pick(pairs);
    const g=gcd2(n,d);
    return { prompt:`Simplify this fraction to its lowest terms.`, inputType:'fracHard',
      givenNum:n, givenDen:d, answer:`${n/g}/${d/g}`, requireSimplest:true,
      hint: diff==='easy' ? 'Whatever you do to the top, you must also do to the bottom.' : undefined,
      explanation:`${n}/${d} ÷ ${g}/${g} = ${n/g}/${d/g}.`, subskill:'simplifying_fractions' };
  }

}
function genFractionSimplifyY4(diff){
  if(diff==='easy'){
    // Easy is deliberately a single halving step. No unrelated division facts.
    const {n1,d1}=pickSimplifiedFraction(NICE_DENOMS_EASY);
    const k=2; const n0=n1*k, d0=d1*k;
    return { prompt:`Fill in the missing numerator to complete the equivalent fraction.`,
      hint:'Whatever you do to the top, you must also do to the bottom.', answer:String(n1),
      inputType:'fracEasy', givenNum:n0, givenDen:d0, targetDen:d1,
      explanation:`${n0}/${d0} simplifies by dividing top and bottom by ${k}: ${n0}÷${k} = ${n1}, ${d0}÷${k} = ${d1}.` };
  }
  if(diff==='medium'){
    const {n1,d1}=pickSimplifiedFraction(NICE_DENOMS_MED);
    const k=randInt(2,5); const n0=n1*k, d0=d1*k;
    const hint='Whatever you do to the top, you must also do to the bottom.';
    const correct=`${n1}/${d1}`;
    const seen=new Set([correct]); const decoys=[];
    const raw=`${n0}/${d0}`; if(raw!==correct){ seen.add(raw); decoys.push(raw); }
    const flipped=`${d1}/${n1}`; if(!seen.has(flipped)){ seen.add(flipped); decoys.push(flipped); }
    const forgotDen=`${n1}/${d0}`; if(!seen.has(forgotDen)){ seen.add(forgotDen); decoys.push(forgotDen); }
    const forgotNum=`${n0}/${d1}`; if(!seen.has(forgotNum)){ seen.add(forgotNum); decoys.push(forgotNum); }
    while(decoys.length<3){
      const {n1:rn,d1:rd}=pickSimplifiedFraction(NICE_DENOMS_MED); const f=`${rn}/${rd}`;
      if(!seen.has(f)){ seen.add(f); decoys.push(f); }
    }
    const choices=shuffleArr([correct, ...decoys.slice(0,3)]);
    return { prompt:`Simplify this fraction to its lowest terms.`, hint, answer:correct, inputType:'choice', choices, renderFractionChoices:true,
      givenNum:n0, givenDen:d0,
      explanation:`${n0}/${d0} ÷ ${k}/${k} = ${n1}/${d1}.` };
  }
  // Hard: broader range including prime numerators (13/65 -> 1/5), but the mix is
  // deliberately varied so not every one is a brain-teaser.
  const primeNum = Math.random()<0.35;
  let n1,d1,k;
  if(primeNum){
    // n1 must stay below d1 · 13/2 is improper and belongs in Q22, not here.
    n1=pick([7,11,13]); d1=pick([n1+2, n1+4, n1*2, n1+6]); k=pick([2,3,4,5]);
  }
  else { const f=pickSimplifiedFraction(NICE_DENOMS_MED); n1=f.n1; d1=f.d1; k=randInt(2,6); }
  const n0=n1*k, d0=d1*k;
  return { prompt:`Simplify this fraction to its lowest terms.`,
    hint:'Whatever you do to the top, you must also do to the bottom.',
    answer:`${n1}/${d1}`, inputType:'fracHard',
    givenNum:n0, givenDen:d0,
    explanation:`${n0}/${d0} ÷ ${k}/${k} = ${n1}/${d1}.` };
}
const CONVERSIONS=[{from:'kg',to:'g',factor:1000},{from:'km',to:'m',factor:1000},{from:'L',to:'mL',factor:1000},{from:'m',to:'cm',factor:100},{from:'cm',to:'mm',factor:10}];
function zeroVariants(n){
  const variants=new Set();
  if(n%10===0) variants.add(String(n/10));
  variants.add(String(n*10));
  if(n%100===0) variants.add(String(n/100));
  variants.add(String(n*100));
  const s=String(n);
  if(s.includes('0')){
    const idx=s.indexOf('0');
    const removed=s.slice(0,idx)+s.slice(idx+1);
    if(removed!=='' && !removed.startsWith('0')) variants.add(removed);
  }
  if(s.length>=1){
    const inserted=s[0]+'0'+s.slice(1);
    variants.add(inserted);
  }
  return [...variants].filter(v=>v!==String(n) && v!=='' && Number(v)>0 && !v.startsWith('0'));
}
function genConversion(diff){
  const c=pick(CONVERSIONS);

  const val=randInt(range[0],range[1]); const result=val*c.factor;
  const correct=String(result);
  const seen=new Set([correct]); const decoys=[];
  for(const d of shuffleArr(zeroVariants(result))){ if(!seen.has(d)){ seen.add(d); decoys.push(d); if(decoys.length>=3) break; } }
  while(decoys.length<3){
    const factor=pick([10,100]); const op=pick(['*','/']);
    const d = op==='*' ? result*factor : Math.max(1,Math.round(result/factor));
    const ds=String(d);
    if(!seen.has(ds)){ seen.add(ds); decoys.push(ds); }
  }
  const choices=shuffleArr([correct, ...decoys.slice(0,3)]);
  return { prompt:`Complete the conversion: ${val} ${c.from} = ___ ${c.to}`, answer:correct, inputType:'choice', choices,
    explanation:`${val} ${c.from} × ${c.factor} = ${result} ${c.to}.` };
}
// An isometric rectangular prism. Two offset faces and three joining edges is enough to

function drawPrism(l,w,h){

  const W=l*S, H=h*S, D=Math.min(w*S, 46)*0.72;

  const p=(a,b)=>`${a},${b}`;
  return svgWrap(`
    <polygon points="${p(x,y)} ${p(x+W,y)} ${p(x+W,y+H)} ${p(x,y+H)}"
      fill="#FFF6E2" stroke="#2B2620" stroke-width="2.5"/>
    <polygon points="${p(x,y)} ${p(x+D,y-D)} ${p(x+W+D,y-D)} ${p(x+W,y)}"
      fill="#FFEFC6" stroke="#2B2620" stroke-width="2.5"/>
    <polygon points="${p(x+W,y)} ${p(x+W+D,y-D)} ${p(x+W+D,y+H-D)} ${p(x+W,y+H)}"

function genAngle(diff, _strategy, year){

    else deg=randInt(190,340);
    return { prompt:`What type of angle is shown?`, answer:bucket, inputType:'choice', choices:['acute','right','obtuse','straight','reflex'],
      explanation:`This angle measures about ${deg}°, which makes it a ${bucket} angle.`, svg:drawAngle(deg) };
  }
  // hard: classify three angles at once. Right (90°) shows up now and then, but never twice
  // in the same question, since a repeated identical value is a giveaway rather than a real test.
  // Always three DIFFERENT categories. Repeating a type wastes one of the
  // three slots and makes the question easier than intended.

        return { prompt:`Each week ${name} saves these amounts: ${terms.join(', ')}. If the pattern continues, how much will ${name} save the next week?`, answer:String(answer),
          explanation:`Each term increases by ${step}, so the next amount is ${answer}.` }; },
    ])();
  }
  if(diff==='medium'){
    return pick([
      ()=>{ const ratio=pick([2,3]), start=randInt(2,5); const terms=[0,1,2,3].map(i=>start*Math.pow(ratio,i)); const answer=start*Math.pow(ratio,4);

      return { prompt:`The first shape uses ${first} matchsticks. Each new shape uses ${inc} more matchsticks. How many matchsticks does the ${ordinal(shapeNum)} shape use?`,
        answer:String(answer), explanation:`${first} + ${inc} × ${shapeNum-1} = ${answer} matchsticks.` }; },

        answer:String(answer), explanation:`${first} + ${inc} × ${designNum-1} = ${answer} tiles.` }; },
