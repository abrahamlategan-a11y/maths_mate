function isAwaitingApproval(){
  if(!S.user || S.isTeacher) return false;
  const em = String(S.user.email||'');

  return true;
}

  // A group with nobody in it makes a set nobody can ever sit. Greyed out, with the count

  const syncGroupCounts=()=>{

      : (S.currentClassId?[S.currentClassId]:[]);

  // The old label read "Generate 24 questions" whatever you were about to make, because it

    const classIds = classCbs.length ? classCbs.filter(cb=>cb.checked).map(cb=>cb.value)
      : (S.currentClassId?[S.currentClassId]:[]);
    // yearLevel is recorded on the set now so that when the generators become
    // year-aware, existing sets already carry the year they were built for.
    // Taken from the targeted class; falls back to the current class, then DEFAULT_YEAR.
    const yearFrom = (classIds && classIds.length===1)
      ? S.classes.find(c=>c.id===classIds[0])
      : (S.currentClassId ? S.classes.find(c=>c.id===S.currentClassId) : (S.classes||[])[0]);
    // A class is one year level, so there is exactly one year and exactly one set. The
    // per-year fan-out this replaced existed to serve composite classes, which are now

    const years = [classYear(yearFrom)];

      const yr=years[0];

  }

  // ---- "Your sets" sub-tab -------------------------------------------
  const archivedCount = S.weeks.filter(w=>w.status==='archived').length;

  toggleBtn.onclick=()=>{ S.showArchivedWeeks=!S.showArchivedWeeks; render(); };
  wrap.appendChild(toggleBtn);

  if(S.showArchivedWeeks){
    wrap.appendChild(renderArchivedWeeksList());

  }

  const activeWeeks = S.weeks.filter(w=>w.status!=='archived');
  if(activeWeeks.length===0){

    wrap.appendChild(empty);

  }
  // A flat list stops working at about six sets. Every card looks the same and there is
  // nothing to tell you which class a set belongs to except reading the student names.
  // Grouped under class headings, with a filter, it stays readable however many there are.
  wrap.appendChild(renderSetsFilterBar(activeWeeks));
  const shown = activeWeeks.filter(w=>setMatchesFilter(w));
  if(!shown.length){
    wrap.appendChild(el('<div class="mmc-empty">No sets for that class yet.</div>'));
    return wrap;
  }
  // Pinned only while it is still a DRAFT. Publishing is the teacher saying "I have looked
  // at this", so it needs no separate dismiss button. It simply drops into its class
  // group the moment it goes live.
  const fresh = S.justCreatedId
    ? shown.find(w=>w.id===S.justCreatedId && w.status==='draft')
    : null;
  if(fresh){
    wrap.appendChild(el(`<div class="mmc-setgroup" style="border-bottom-color:var(--gold);">
      <span class="mmc-setgroup-name">✨ Just created. Check it over</span>
      <span class="mmc-setgroup-count">${visibleQuestions(fresh).length} questions</span>
    </div>`));
    wrap.appendChild(renderWeekCard(fresh));
  }
  groupWeeksByClass(shown).forEach(g=>{
    const weeks = fresh ? g.weeks.filter(w=>w.id!==fresh.id) : g.weeks;
    if(!weeks.length) return;
    wrap.appendChild(el(`<div class="mmc-setgroup">
      <span class="mmc-setgroup-name">${esc(g.title)}</span>
      <span class="mmc-setgroup-count">${weeks.length} set${weeks.length===1?'':'s'}</span>
    </div>`));
    weeks.forEach(week=> wrap.appendChild(renderWeekCard(week)));
  });
  return wrap;
}
// Which class heading a set belongs under. A set aimed at every class is its own group
// rather than being duplicated under each one.
function weekClassKey(w){
  const ids=Array.isArray(w.classIds)? w.classIds.filter(Boolean) : [];
  if(!ids.length) return '__all__';
  return ids.length===1 ? ids[0] : '__multi__';
}
function weekClassTitle(key){
  if(key==='__all__') return 'Every class';
  if(key==='__multi__') return 'Several classes';
  const c=(S.classes||[]).find(x=>x.id===key);
  return c ? `${c.name} · Year Level: ${classYear(c)===0?'Pre-Primary':classYear(c)}` : 'Deleted class';
}
function groupWeeksByClass(weeks){
  const map={};
  weeks.forEach(w=>{ const k=weekClassKey(w); (map[k]=map[k]||[]).push(w); });
  // Real classes first in the teacher's own class order, then the catch-all groups.
  const order=[...(S.classes||[]).map(c=>c.id), '__multi__', '__all__'];
  return order.filter(k=>map[k]).map(k=>({
    key:k, title:weekClassTitle(k),
    weeks: map[k].sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0))
  }));
}
function setMatchesFilter(w){
  const f=S.setsFilter||'ALL';
  if(f==='ALL') return true;                       // everything
  if(f==='__all__') return weekClassKey(w)==='__all__';  // only the every-class sets
  // A specific class: its own sets, plus anything aimed at every class, because those
  // genuinely are that class's work too.
  return weekClassKey(w)===f || weekClassKey(w)==='__all__';
}
// Buttons rather than a dropdown. A teacher can see every option and how many sets each
// holds without opening anything.
function renderSetsFilterBar(weeks){
  const counts={};
  weeks.forEach(w=>{ const k=weekClassKey(w); counts[k]=(counts[k]||0)+1; });
  const keys=[...(S.classes||[]).map(c=>c.id), '__multi__', '__all__'].filter(k=>counts[k]);
  if(keys.length<2) return el('<span></span>');   // nothing to filter
  const bar=el('<div class="mmc-setfilter"></div>');
  const mk=(key,label,n)=>{
      const active=(S.setsFilter||'ALL')===key;
    const b=el(`<button type="button" class="mmc-setchip${active?' active':''}">${esc(label)}${n!=null?` <span class="mmc-setchip-n">${n}</span>`:''}</button>`);
    b.onclick=()=>{ S.setsFilter=key; render(); };
    return b;
  };
  bar.appendChild(mk('ALL','All sets', weeks.length));
  keys.forEach(k=>{ if(k!=='__all__') bar.appendChild(mk(k, weekClassTitle(k), counts[k])); });
  if(counts['__all__']) bar.appendChild(mk('__all__','Every class', counts['__all__']));
  return bar;
}
function renderArchivedWeeksList(){
  const wrap=el('<div></div>');
  const archived = S.weeks.filter(w=>w.status==='archived').sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
  if(archived.length===0){
    wrap.appendChild(el('<div class="mmc-empty">No archived sets. Anything you archive from the active list shows up here, ready to reuse next year.</div>'));
    return wrap;
  }
  archived.forEach(week=>{
    const card=el(`
      <div class="mmc-card">
        <div class="mmc-row" style="justify-content:space-between;">
          <div>
            <h3>${esc(week.label)} <span style="color:var(--ink-soft);font-size:12px;font-weight:700;">ARCHIVED</span></h3>
            <div class="meta">${esc(weekClassification(week))} · ${visibleQuestions(week).length} questions</div>
          </div>
          <div class="mmc-row">
            <button class="mmc-btn gold sm" data-act="restore">Reassign</button>
            <button class="mmc-btn danger sm" data-act="delete">Delete permanently</button>
          </div>
        </div>
      </div>
    `);
    card.querySelector('[data-act="restore"]').onclick=async ()=>{
      // Reassign, not restore. A set built for Year 4 Hard is worth using again with a
      // different Year 4 class, and bringing it back into the class it came from is only
      // one of the things a teacher might want. Only classes of the right year are
      // offered, because the questions were generated for that year and no other.
      const wYear = (Array.isArray(week.targetYears)&&week.targetYears.length) ? +week.targetYears[0]
        : (week.yearLevel!=null && week.yearLevel!=='' ? +week.yearLevel : null);
      const eligible=(S.classes||[]).filter(c=> wYear===null || classYear(c)===wYear);
      if(!eligible.length){
        S.toast = wYear===null ? 'No classes to assign this to.'
          : `This set was built for ${yearLabel(wYear)}, and you have no ${yearLabel(wYear)} class.`;
        render(); return;
      }
      const listed=eligible.map((c,i)=>`${i+1}. ${c.name}`).join('\n');
      const pick=prompt(`Reassign "${week.label}" (${weekClassification(week)}) to which class?\n\n${listed}\n\nType a number:`);
      if(pick===null) return;
      const idx=parseInt(pick,10)-1;
      if(!(idx>=0 && idx<eligible.length)){ S.toast='That was not one of the numbers listed.'; render(); return; }
      const target=eligible[idx];
      try{
        await updateDoc(doc(db,'weeks',week.id), {
          status:'draft', scheduledAt:null,
          classIds:[target.id], targetYears:[classYear(target)], yearLevel:classYear(target)
        });
        S.weeksView='list';
        S.toast=`"${week.label}" is back as a draft for ${target.name}. Publish it when you are ready.`;
      }
      catch(e){ S.toast='Could not reassign. Check your connection.'; }
      render();
    };
    card.querySelector('[data-act="delete"]').onclick=async ()=>{
      if(!confirm(`Permanently delete "${week.label}"? This can't be undone.`)) return;
      try{ await deleteDoc(doc(db,'weeks',week.id)); }catch(e){ S.toast='Could not delete. Check your connection.'; render(); }
    };
    wrap.appendChild(card);
  });
  return wrap;
}

async function publishWeek(week){
  try{ await updateDoc(doc(db,'weeks',week.id), {status:'published', scheduledAt:null}); S.editingDraftId=null; render(); }
  catch(e){ S.toast='Could not publish. Check your connection.'; render(); }
}
// How many students have already completed this set. Deleting a set with results
// would orphan them. The results keep a weekId pointing at nothing, so they
// vanish from the gradebook and quietly skew every trend and insight that uses
// them. That's why delete is only offered when the count is zero.
function weekResultCount(week){
  return (S.results||[]).filter(r=>r.weekId===week.id).length;
}

// ---------- Auto-archive ----------
// Finished sets clutter the page for both teacher and student. A set retires
// itself once EVERY student in its audience has completed it, or after 21 days. // whichever comes first. The age rule matters: without it, one child who is away
// (or never does it) would keep a set live indefinitely, which is exactly the
// mess auto-archiving is meant to prevent. Archiving only hides it; all results
// stay in the gradebook and every report.
const AUTO_ARCHIVE_DAYS = 21;
// Auto-archive removed. A set used to disappear by itself once everyone had finished,
// which meant work vanishing without a teacher doing anything, and needed a "Keep live"
// toggle to opt out of. The completion count on each set now says when it is done and the
// Archive button turns green at that moment, so archiving is a deliberate act.

async function deleteWeekAction(week){
  const n = weekResultCount(week);
  if(n>0){
    S.toast = `"${week.label}" has ${n} result${n===1?'':'s'} saved against it, so it can't be deleted. Archive it instead. The data stays in your reports.`;
    render(); return;
  }
  if(!confirm(`Permanently delete "${week.label}"? No students have done it, so no results are lost. This can't be undone.`)) return;
  try{ await deleteDoc(doc(db,'weeks',week.id)); }catch(e){ S.toast='Could not delete. Check your connection.'; render(); }
}
function archivedReasonLabel(week){
  if(!week.archivedAutomatically) return '';
  return week.archivedReason==='all_completed'
    ? ' · archived automatically (everyone finished)'
    : ' · archived automatically (over 3 weeks old)';
}
async function archiveWeekAction(week){
  const msg = week.status==='published'
    ? `Archive "${week.label}"? Students will no longer be able to access it. You can restore it any time from Archived Sets.`
    : `Archive "${week.label}"? You can restore it any time from Archived Sets.`;
  if(!confirm(msg)) return;
  try{ await updateDoc(doc(db,'weeks',week.id), {status:'archived', scheduledAt:null}); if(S.editingDraftId===week.id) S.editingDraftId=null; render(); }
  catch(e){ S.toast='Could not archive. Check your connection.'; render(); }
}
async function scheduleWeekAction(week, dateStr){
  if(!dateStr){ S.toast='Pick a date and time first.'; render(); return; }
  const when=new Date(dateStr);
  if(when.getTime()<=Date.now()){ S.toast='Pick a time in the future.'; render(); return; }
  try{ await updateDoc(doc(db,'weeks',week.id), {scheduledAt:when}); }
  catch(e){ S.toast='Could not schedule. Check your connection.'; render(); }
}
async function unscheduleWeekAction(week){
  try{ await updateDoc(doc(db,'weeks',week.id), {scheduledAt:null}); }
  catch(e){ S.toast='Could not cancel. Check your connection.'; render(); }
}
// Builds one full copy of the week's control panel (Edit/Publish/Archive/Delete + the
// scheduler). Called twice per card (top and bottom) so teachers reviewing a long set can
// act from wherever they are. But every button here wires back to the SAME shared action
// functions above, so there is exactly one place the actual publish/archive/schedule/delete
// logic lives, not a duplicated copy per location.
function buildWeekControlPanel(week, isEditing, suffix){
  const live = isWeekLive(week);
  const isScheduled = week.status==='draft' && week.scheduledAt && !live;
  const panel=el('<div></div>');
  const btnRow=el('<div class="mmc-row"></div>');
  if(week.status==='draft'){
    const editBtn=el(`<button class="mmc-btn ghost sm">${isEditing?'Close':'Edit'}</button>`);
    editBtn.onclick=()=>{ S.editingDraftId = isEditing? null : week.id; render(); };
    btnRow.appendChild(editBtn);
  }
  if(week.status==='draft' && !live){
    const pubBtn=el('<button class="mmc-btn gold sm">Publish now</button>');
    pubBtn.onclick=()=>publishWeek(week);
    btnRow.appendChild(pubBtn);
  }
  // Two buttons rather than one: a blank paper for the class, and a marked copy for the
  // teacher. Wanting the answers is a different job from wanting the worksheet.
  const printBtn=el('<button class="mmc-btn ghost sm" title="Opens your print dialog. Choose Save as PDF there to keep a copy">Print</button>');
  printBtn.onclick=()=>printWeekSheet(week, {answers:false});
  btnRow.appendChild(printBtn);
  const printAnsBtn=el('<button class="mmc-btn ghost sm" title="The same paper with an answer sheet on the back">Print with answers</button>');
  printAnsBtn.onclick=()=>printWeekSheet(week, {answers:true});
  btnRow.appendChild(printAnsBtn);
  // How many of the students this set was AIMED AT have finished it. Green when everyone
  // has, so a glance at the list tells a teacher which sets are done.
  const aimed = weekAudienceUids(week, Object.keys(S.profiles||{}));
  const doneSet = new Set((S.results||[]).filter(r=>r.weekId===week.id).map(r=>r.uid));
  const doneN = aimed.filter(u=>doneSet.has(u)).length;
  const allDone = aimed.length>0 && doneN===aimed.length;
  if(aimed.length){
    btnRow.appendChild(el(`<span class="mmc-donecount${allDone?' all':''}">${doneN}/${aimed.length} done</span>`));
  }
  const isPri = !!week.priority;
  const priBtn=el(`<button class="mmc-btn ${isPri?'gold':'ghost'} sm" title="Students cannot use Fast Facts or the Racing Ground until they have finished this">${isPri?'★ Finish first':'☆ Finish first'}</button>`);
  priBtn.onclick=async ()=>{
    try{
      if(isPri){
        await updateDoc(doc(db,'weeks',week.id), {priority:false});
        S.toast='No longer required first. Everything is open again.';
      } else {
        // Only one at a time, or two sets can lock each other and nobody can do either.
        for(const w of (S.weeks||[])){
          if(w.priority && w.id!==week.id){ try{ await updateDoc(doc(db,'weeks',w.id), {priority:false}); }catch(e){} }
        }
        await updateDoc(doc(db,'weeks',week.id), {priority:true, priorityAt:serverTimestamp()});
        S.toast=`"${week.label}" must be finished before Fast Facts or racing. This clears itself after ${PRIORITY_MAX_DAYS} days.`;
      }
    }catch(e){ S.toast='Could not change that. Check your connection.'; }
    render();
  };
  btnRow.appendChild(priBtn);
  const archiveBtn=el(`<button class="mmc-btn ${allDone?'gold':'ghost'} sm">Archive</button>`);
  archiveBtn.onclick=()=>{
    const missing = aimed.filter(u=>!doneSet.has(u));
    if(missing.length){
      // Two different situations, named separately. A child partway through will finish
      // if given the time; a child who never opened it needs chasing.
      const nameOf=u=>(S.profiles[u]&&S.profiles[u].displayName)||'';
      const started=[], never=[];
      missing.forEach(u=>{
        const p=partialProgress(u, week.id);
        (p ? started : never).push(p ? `${nameOf(u)} (${p.done}/${visibleQuestions(week).length})` : nameOf(u));
      });
      const lines=[];
      if(started.length) lines.push(`Partway through: ${started.filter(Boolean).join(', ')}`);
      if(never.length) lines.push(`Not started: ${never.filter(Boolean).join(', ')}`);
      if(!confirm(`${missing.length} student${missing.length===1?" hasn't":"s haven't"} finished this yet.\n\n${lines.join('\n\n')}\n\nArchive it anyway?`)) return;
    }
    archiveWeekAction(week);
  };
  btnRow.appendChild(archiveBtn);
  if(week.status==='published'){
    // Escape hatch: a set a teacher wants left up (revision, a catch-up week)
    // shouldn't be retired out from under them by the automatic rule.
  }
  const doneCount = weekResultCount(week);
  if(doneCount===0){
    const deleteBtn=el('<button class="mmc-btn danger sm">Delete</button>');
    deleteBtn.onclick=()=>deleteWeekAction(week);
    btnRow.appendChild(deleteBtn);
  } else {
    btnRow.appendChild(el(`<span class="meta" style="align-self:center;">${doneCount} result${doneCount===1?'':'s'} saved. Archive to keep the data</span>`));
  }
  panel.appendChild(btnRow);
  if(week.status==='draft' && !live){
    const inputId=`mmc-sched-${week.id}-${suffix}`;
    const schedRow=el(`
      <div class="mmc-row" style="margin-top:10px;padding-top:10px;border-top:1px solid var(--paper-line);">
        <div class="mmc-field" style="margin-bottom:0;flex:1;min-width:200px;"><label>Auto-activate at</label>
          <input type="datetime-local" id="${inputId}" value="${week.scheduledAt ? new Date((week.scheduledAt.seconds||0)*1000 - new Date().getTimezoneOffset()*60000).toISOString().slice(0,16) : ''}"></div>
        <button class="mmc-btn ghost sm" data-act="schedule">${isScheduled?'Update schedule':'Schedule'}</button>
        ${isScheduled ? '<button class="mmc-btn ghost sm" data-act="unschedule">Cancel schedule</button>' : ''}
      </div>
    `);
    const schedInput=schedRow.querySelector(`#${inputId}`);
    schedRow.querySelector('[data-act="schedule"]').onclick=()=>scheduleWeekAction(week, schedInput.value);
    const unschedBtn=schedRow.querySelector('[data-act="unschedule"]');
    if(unschedBtn) unschedBtn.onclick=()=>unscheduleWeekAction(week);
    panel.appendChild(schedRow);
  }
  return panel;
}

// ---------- Hidden questions ----------
// A teacher can hold a question back. Usually because they haven't taught that
// skill yet. Hidden questions are removed from the student's set entirely (so a
// 24-question week becomes 23 and the numbering they see is contiguous), but
// stay visible and greyed in the gradebook so the column doesn't silently
// disappear from the class record.
function isQuestionHidden(week, q){
  return !!(week && Array.isArray(week.hiddenQIds) && week.hiddenQIds.indexOf(q.id)!==-1);
}
function visibleQuestions(week){
  return (week.questions||[]).filter(q=>!isQuestionHidden(week,q));
}
async function toggleQuestionHidden(week, q){
  const hidden = Array.isArray(week.hiddenQIds) ? week.hiddenQIds.slice() : [];
  const i = hidden.indexOf(q.id);
  if(i===-1) hidden.push(q.id); else hidden.splice(i,1);
  week.hiddenQIds = hidden;
  try{ await updateDoc(doc(db,'weeks',week.id), { hiddenQIds: hidden }); }
  catch(e){ S.toast='Could not update. Check your connection.'; }
  render();
}

// ---------- Printing a set ----------
// Done through the browser rather than jsPDF. Half these questions carry an SVG. Angles,
// clocks, grids, 3D shapes, fraction bars. And jsPDF cannot draw SVG without another
// library, which would mean another CDN on a school network that already blocks one.
// Printed from an iframe the SVGs render natively, page breaks behave, and "Save as PDF"
// is already in every print dialog.
function printQuestionHTML(q, n){
  const parts=[];
  parts.push(`<div class="pq-n">${n}.</div>`);
  const body=[];
  // The stem, in whatever shape this question type uses.
  if(q.partsLead!=null || q.partsTail!=null){
    const boxes=(q.parts||[{}]).map(pt=>`<span class="pq-box">${pt && pt.label? `<i>${esc(pt.label)}</i>`:''}</span>`)
      .join(` <b>${esc(q.partsJoin||'')}</b> `);
    body.push(`<div class="pq-q">${esc(q.partsLead||'')} ${boxes} ${esc(q.partsTail||'')}</div>`);
  } else if(q.fracOfLead){
    body.push(`<div class="pq-q">What is <span class="pq-frac"><i>${esc(q.fracNum)}</i><i>${esc(q.fracDen)}</i></span> of ${esc(q.ofTotal)}?</div>`);
  } else {
    body.push(`<div class="pq-q">${esc(String(q.prompt||'')).replace(/\n/g,'<br>')}</div>`);
  }
  // The picture, if there is one.
  if(q.svg) body.push(`<div class="pq-svg">${q.svg}</div>`);
  // A given fraction shown alongside the prompt.
  if(q.givenNum!=null && q.givenDen!=null)
    body.push(`<div class="pq-given"><span class="pq-frac"><i>${esc(q.givenNum)}</i><i>${esc(q.givenDen)}</i></span></div>`);
  if(q.showFracNum!=null)
    body.push(`<div class="pq-given">${q.showWhole!=null?esc(q.showWhole)+' ':''}<span class="pq-frac"><i>${esc(q.showFracNum)}</i><i>${esc(q.showFracDen)}</i></span></div>`);
  if(q.leftNum!=null && q.rightNum!=null)
    body.push(`<div class="pq-given"><span class="pq-frac"><i>${esc(q.leftNum)}</i><i>${esc(q.leftDen)}</i></span> <b>&nbsp;___&nbsp;</b> <span class="pq-frac"><i>${esc(q.rightNum)}</i><i>${esc(q.rightDen)}</i></span></div>`);
  // Options to choose from.
  if(Array.isArray(q.choices) && q.choices.length)
    body.push(`<div class="pq-opts">${q.choices.map((c,i)=>`<span class="pq-opt"><b>${String.fromCharCode(65+i)}</b> ${esc(c)}</span>`).join('')}</div>`);
  if(Array.isArray(q.items) && q.items.length && q.inputType==='order')
    body.push(`<div class="pq-opts">${q.items.map(c=>`<span class="pq-opt">${esc(typeof c==='object'? (c.deg!=null? c.deg+'°':JSON.stringify(c)) : c)}</span>`).join('')}</div>`);
  if(Array.isArray(q.coins) && q.coins.length)
    body.push(`<div class="pq-opts">${q.coins.map(c=>`<span class="pq-opt">${esc(c.l||c.label||'')}</span>`).join('')}</div>`);
  // Somewhere to write.
  if(!Array.isArray(q.choices) && q.partsLead==null && q.partsTail==null)
    body.push('<div class="pq-line"></div>');
  parts.push(`<div class="pq-body">${body.join('')}</div>`);
  return `<div class="pq">${parts.join('')}</div>`;
}

function printWeekSheet(week, opts){
  opts = opts || {};
  const qs = visibleQuestions(week);
  const cls = (S.classes||[]).find(c=>Array.isArray(week.classIds) && week.classIds.indexOf(c.id)!==-1);
  const yrs = (Array.isArray(week.targetYears)&&week.targetYears.length) ? week.targetYears
    : (week.yearLevel!=null && week.yearLevel!=='' ? [+week.yearLevel] : []);
  const sub = [cls? cls.name : 'All classes', yrs.length? yrs.map(y=>yearLabel(y)).join(', '):'', week.difficulty]
    .filter(Boolean).join(' · ');
  const answers = opts.answers
    ? `<div class="pg-break"></div><h2>Answers · ${esc(week.label)}</h2><ol class="pa">${
        qs.map(q=>`<li>${esc(String(q.answer||'').replace(/,/g,', '))}${q.explanation?` <span class="pa-x">${esc(q.explanation)}</span>`:''}</li>`).join('')}</ol>`
    : '';
  const doc = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc(week.label)}</title><style>
    *{box-sizing:border-box;}
    body{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#111;margin:0;padding:18mm 14mm;}
    h1{font-size:20pt;margin:0 0 2px;}
    .sub{font-size:10pt;color:#555;margin-bottom:4px;}
    .namebar{display:flex;gap:22px;font-size:10pt;color:#555;border-bottom:1.5px solid #111;padding-bottom:8px;margin-bottom:14px;}
    .namebar span{flex:1;border-bottom:1px solid #bbb;padding-bottom:2px;}
    .pq{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid #e4e2dc;break-inside:avoid;page-break-inside:avoid;}
    .pq-n{font-weight:700;min-width:22px;font-size:11pt;}
    .pq-body{flex:1;}
    .pq-q{font-size:12pt;line-height:1.45;}
    .pq-svg{margin:6px 0;}
    .pq-svg svg{max-height:90px;width:auto;}
    .pq-given{margin:6px 0;font-size:13pt;}
    .pq-box{display:inline-block;min-width:52px;border-bottom:1.5px solid #111;height:17px;vertical-align:middle;}
    .pq-box i{font-size:7pt;color:#777;font-style:normal;display:block;text-align:center;}
    .pq-frac{display:inline-block;text-align:center;vertical-align:middle;line-height:1.05;}
    .pq-frac i{display:block;font-style:normal;padding:0 5px;}
    .pq-frac i:first-child{border-bottom:1.5px solid #111;}
    .pq-opts{margin-top:5px;font-size:10.5pt;color:#333;}
    .pq-opt{display:inline-block;margin:2px 14px 2px 0;}
    .pq-line{margin-top:9px;border-bottom:1px solid #bbb;height:15px;max-width:230px;}
    .pg-break{page-break-before:always;}
    h2{font-size:14pt;margin:0 0 8px;}
    .pa{font-size:10.5pt;line-height:1.7;} .pa-x{color:#666;font-size:9pt;}
    @page{margin:0;}
  </style></head><body>
    <h1>${esc(week.label)}</h1>
    <div class="sub">${esc(sub)} · ${qs.length} question${qs.length===1?'':'s'}</div>
    <div class="namebar"><span>Name</span><span>Date</span></div>
    ${qs.map((q,i)=>printQuestionHTML(q,i+1)).join('')}
    ${answers}
  </body></html>`;
  // An iframe rather than a popup: popup blockers do not interfere, and the app behind
  // it is untouched.
  const frame=document.createElement('iframe');
  frame.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0;';
  document.body.appendChild(frame);
  const d=frame.contentWindow.document;
  d.open(); d.write(doc); d.close();
  const go=()=>{ try{ frame.contentWindow.focus(); frame.contentWindow.print(); }catch(e){}
    setTimeout(()=>{ try{ document.body.removeChild(frame); }catch(e){} }, 1500); };
  if(d.readyState==='complete') setTimeout(go,250); else frame.onload=()=>setTimeout(go,250);
}

function renderWeekCard(week){
  const isEditing = S.editingDraftId===week.id;
  const live = isWeekLive(week);
  const isScheduled = week.status==='draft' && week.scheduledAt && !live;
  const statusBadge = week.status==='published'
    ? '<span style="color:#2E9E4F;font-size:12px;font-weight:700;">PUBLISHED</span>'
    : (live ? '<span style="color:#2E9E4F;font-size:12px;font-weight:700;">LIVE (scheduled)</span>'
      : (isScheduled ? `<span style="color:#8B5CF6;font-size:12px;font-weight:700;">⏰ SCHEDULED · ${esc(formatScheduledAt(week.scheduledAt))}</span>`
        : '<span style="color:#E85C0A;font-size:12px;font-weight:700;">DRAFT</span>'));
  const cardYears = (Array.isArray(week.targetYears) && week.targetYears.length)
    ? week.targetYears
    : (week.yearLevel!==null && week.yearLevel!==undefined && week.yearLevel!=='' ? [+week.yearLevel] : []);
  const yearText = cardYears.length ? cardYears.map(y=>yearLabel(y)).join(', ') + ' · ' : '';
  const groupText = yearText + ((!week.targetGroups || week.targetGroups.length===0) ? 'All students'
    : week.targetGroups.map(g=>groupLabel(g)).join(', '));
  // Who is actually going to sit this set. Once sets are generated per year AND group,
  // "reviewing a set" is meaningless without knowing whose it is. A teacher could
  // carefully check a Year 3 paper believing it was the one their Year 4s would see.
  const forWhom = Object.entries(S.profiles||{}).filter(([uid,p])=>{
    if(!p || !p.username) return false;
    if(Array.isArray(week.classIds) && week.classIds.length && p.classId && week.classIds.indexOf(p.classId)===-1) return false;
    const wy = (Array.isArray(week.targetYears) && week.targetYears.length) ? week.targetYears
      : (week.yearLevel!==null && week.yearLevel!==undefined && week.yearLevel!=='' ? [+week.yearLevel] : null);
    if(wy && wy.indexOf(studentYear(p))===-1) return false;
    if(Array.isArray(week.targetGroups) && week.targetGroups.length &&
       week.targetGroups.indexOf(p.group||'mainstream')===-1) return false;
    return true;
  }).map(([uid,p])=>p.displayName||uid);
  const names = forWhom.length===0 ? 'nobody in this class matches'
    : forWhom.length<=4 ? forWhom.join(', ')
    : `${forWhom.slice(0,4).join(', ')} and ${forWhom.length-4} more`;
  const card=el(`
    <div class="mmc-card">
      <h3>${esc(week.label)} ${statusBadge}</h3>
      <div class="meta" style="margin-bottom:6px;">${esc(weekClassification(week))} · ${visibleQuestions(week).length} question${visibleQuestions(week).length===1?'':'s'}${(week.questions||[]).length!==visibleQuestions(week).length?` (${(week.questions||[]).length-visibleQuestions(week).length} hidden)`:''} · ${esc(groupText)}</div>
      <div class="meta" style="margin-bottom:10px;font-weight:700;color:${forWhom.length?'var(--ink)':'var(--incorrect)'};">
        ${forWhom.length? `Will be sat by ${forWhom.length} student${forWhom.length===1?'':'s'}: ${esc(names)}` : 'No students match this set. Check the year level and group.'}
      </div>
    </div>
  `);
  card.appendChild(buildWeekControlPanel(week, isEditing, 'top'));
  if(isEditing){
    card.appendChild(renderQuestionEditor(week));
    const bottomWrap=el('<div style="margin-top:14px;padding-top:14px;border-top:2px solid var(--paper-line);"></div>');
    bottomWrap.appendChild(el('<div class="meta" style="margin:0 0 8px;">Reviewed the whole set? Act on it right from here.</div>'));
    bottomWrap.appendChild(buildWeekControlPanel(week, isEditing, 'bottom'));
    card.appendChild(bottomWrap);
  }
  return card;
}

  async function saveQuestions(){
    try{ await updateDoc(doc(db,'weeks',week.id), {questions:week.questions}); }

  (week.questions||[]).forEach((q,i)=>{
    const isStructured = !!(q.svg || q.inputType==='choice' || q.inputType==='coins' || q.inputType==='order' || q.inputType==='fracEasy' || q.inputType==='fracHard' || q.inputType==='classify' || q.inputType==='parts' || q.inputType==='multi');

        ` : q.inputType==='order' ? `

          <div class="label2">Fraction</div>
          <div class="meta" style="margin-bottom:8px;">${esc(q.givenNum)}/${esc(q.givenDen)} = ?/${esc(q.targetDen)} · answer: ${esc(q.answer)}. Use Regenerate for different numbers.</div>
        ` : q.inputType==='fracHard' ? `

        ` : q.inputType==='parts' ? `
          <div class="label2">Answer boxes</div>
          <div class="meta" style="margin-bottom:8px;">${esc(q.partsLead||'')} ${(q.parts||[]).map(p=>p.label?`[${esc(p.label)}]`:'[ ]').join(' '+esc(q.partsJoin||'')+' ')} ${esc(q.partsTail||'')} &nbsp;→&nbsp; ${esc(String(q.answer).split(',').join(' , '))}</div>
        ` : q.inputType==='multi' ? `
          <div class="label2">Select all that apply</div>
          <div class="meta" style="margin-bottom:8px;">Options: ${(q.choices||[]).map(esc).join(', ')} &nbsp;→&nbsp; correct: ${esc(String(q.answer).split(',').join(', '))}</div>
        ` : q.inputType==='classify' ? `
          <div class="label2">Angles to classify</div>
          <div class="meta" style="margin-bottom:8px;">${(q.items||[]).map(it=>`${esc(it.deg)}° = ${esc(it.correct)}`).join(', ')}. Use Regenerate for different angles.</div>
        ` : `
          <div class="label2">Answer</div>
          <input type="text" data-f="answer" value="${esc(q.answer)}">
        `}
        <div class="label2">Explanation (shown after they answer)</div>
        <input type="text" data-f="explanation" value="${esc(q.explanation||'')}">
        <div class="mmc-row" style="margin-top:6px;">
          <button class="mmc-btn ghost sm" data-act="regen">↻ Regenerate</button>
          <button class="mmc-btn ghost sm" data-act="hide">${isQuestionHidden(week,q)?'Show to students':'Hide from students'}</button>
          <button class="mmc-btn danger sm" data-act="rm">Remove question</button>
        </div>
      </div>
    `);
    row.querySelector('[data-f="prompt"]').onchange=(e)=>{ q.prompt=e.target.value; saveQuestions(); };
    const answerEl=row.querySelector('[data-f="answer"]');
    if(answerEl) answerEl.onchange=(e)=>{ q.answer=e.target.value; saveQuestions(); };
    row.querySelector('[data-f="explanation"]').onchange=(e)=>{ q.explanation=e.target.value; saveQuestions(); };
    row.querySelector('[data-act="hide"]').onclick=()=>toggleQuestionHidden(week,q);
    row.querySelector('[data-act="rm"]').onclick=()=>{ week.questions=week.questions.filter(x=>x.id!==q.id); saveQuestions(); render(); };
    row.querySelector('[data-act="regen"]').onclick=()=>{
      // Restore the set's own overrides so regenerating one question keeps the
      // same question family the rest of the set was built with.
      const prevRot=S.rotationOverride, prevTime=S.timeOverride;
      S.rotationOverride = week.rotationOverride||null; S.timeOverride = week.timeOverride||null;
      // The set's OWN year, not the default. Without this, regenerating question 9 of a
      // Year 3 set replaced it with Year 4's question 9. A different skill entirely,
      // because the two years have different slot lists.
      const fresh = q.slot ? buildQuestion(q.slot-1, week.difficulty, q.strategyKey, weekYear(week)) : q;
      S.rotationOverride=prevRot; S.timeOverride=prevTime;
      Object.assign(q, fresh, {id:q.id});
      saveQuestions(); render();
    };
    box.appendChild(row);
  });
  return box;
}

function formatGivenAnswer(ans, q){
  if(!ans) return '(no answer recorded)';
  const given=ans.given;
  if(q.inputType==='coins'){
    if(!Array.isArray(given)) return String(given==null?'':given);
    const labels=(q.coins||[]).filter(c=>given.includes(c.id)).map(c=>c.l);
    return labels.length? labels.join(' + ') : '(no coins selected)';
  }
  if(q.inputType==='order'){
    return given? String(given).split(',').join(' → ') : '(not completed)';
  }
  return given==null || given==='' ? '(left blank)' : String(given);
}
function formatCorrectAnswer(q){
  if(q.inputType==='coins') return `${fmtCents(q.targetCents)}${q.minCoins!=null?` in exactly ${q.minCoins} piece${q.minCoins===1?'':'s'}`:''}`;
  if(q.inputType==='order') return (q.answer||'').split(',').join(' → ');
  return q.answer;
}
// Everything a child actually SAW, not just the prompt. Written once because there are two
// places that show a past question, and only one of them had been taught about pictures,
// fractions, answer boxes and choices.
function questionFaceHTML(q){
  if(!q) return '';
  const bits=[];
  if(q.svg) bits.push(`<div class="mmc-qsvg">${q.svg}</div>`);
  bits.push(`<div style="margin:4px 0;">${esc(String(q.prompt||'').replace(/\n/g,' '))}</div>`);
  const frac = fracPromptHTML(q);
  if(frac) bits.push(frac);
  if(q.partsLead!=null || q.partsTail!=null){
    const boxes=(q.parts||[{}]).map(()=>'<span class="mmc-qbox">?</span>')
      .join(` <b>${esc(q.partsJoin||'')}</b> `);
    bits.push(`<div style="margin:4px 0;">${esc(q.partsLead||'')} ${boxes} ${esc(q.partsTail||'')}</div>`);
  }
  if(Array.isArray(q.items) && q.items.length){
    bits.push(`<div class="mmc-worth-names" style="margin:4px 0;">${
      q.items.map(x=>`<span>${esc(typeof x==='object' ? (x.deg!=null? x.deg+'°' : '') : x)}</span>`).join('')}</div>`);
  }
  if(Array.isArray(q.choices) && q.choices.length){
    bits.push(`<div class="mmc-worth-names" style="margin:4px 0;">${
      q.choices.map(c=>`<span>${esc(c)}</span>`).join('')}</div>`);
  }
  if(Array.isArray(q.coins) && q.coins.length){
    bits.push(`<div class="mmc-worth-names" style="margin:4px 0;">${
      q.coins.map(c=>`<span>${esc(c.l||c.label||'')}</span>`).join('')}</div>`);
  }
  return bits.join('');
}
function renderGradebookDetail(){
  const d=S.gradebookDetail;
  if(!d) return null;
  if(d.type==='week'){
    const week=S.weeks.find(w=>w.id===d.weekId);
    const q=week && (week.questions||[]).find(x=>x.id===d.qId);
    if(!week || !q) return null;
    const rec=S.results.find(r=>r.uid===d.uid && r.weekId===d.weekId);
    const ans=rec && (rec.answers||[]).find(a=>a.qId===d.qId);
    const studentName=(S.profiles[d.uid]&&S.profiles[d.uid].displayName)||d.uid;
    const card=el(`
      <div class="mmc-card" style="border-color:var(--purple);">
        <div class="mmc-row" style="justify-content:space-between;align-items:flex-start;">
          <h3>Q${q.slot} · ${esc(q.title||'')} · ${esc(studentName)}</h3>
          <button class="mmc-btn ghost sm" id="mmc-gb-close">✕ Close</button>
        </div>
      </div>
    `);
    card.appendChild(el(`<div>${questionFaceHTML(q)}</div>`));
    const answerRow=el(`
      <div class="mmc-row" style="gap:24px;">
        <div><div class="label2">Student's answer</div><div style="font-weight:700;color:${ans&&ans.correct?'var(--correct)':'var(--incorrect)'};">${esc(formatGivenAnswer(ans,q))}</div></div>
        <div><div class="label2">Correct answer</div><div style="font-weight:700;">${esc(formatCorrectAnswer(q))}</div></div>
      </div>
    `);
    card.appendChild(answerRow);
    if(q.explanation) card.appendChild(el(`<div class="meta" style="margin-top:10px;">${esc(q.explanation)}</div>`));
    card.querySelector('#mmc-gb-close').onclick=()=>{ S.gradebookDetail=null; render(); };
    return card;
  }
  if(d.type==='question'){
    const studentName=(S.profiles[d.uid]&&S.profiles[d.uid].displayName)||d.uid;
    const card=el(`
      <div class="mmc-card" style="border-color:var(--purple);">
        <div class="mmc-row" style="justify-content:space-between;">
          <h3>${(d.col||d.slot)?`Q${esc(String(d.col||d.slot))} · `:''}${esc(d.skill ? skillTitle(d.skill) : 'Question')} · ${esc(studentName)}</h3>
          <button class="mmc-btn ghost sm" id="mmc-gb-close">✕ Close</button>
        </div>
      </div>
    `);
    card.querySelector('#mmc-gb-close').onclick=()=>{ S.gradebookDetail=null; render(); };
    // Deliberately NOT class-scoped: this is one student's history for one skill, and a
    // child who changed class should not lose sight of what they did before.
    const pubWeeks=S.weeks.filter(isWeekLive).sort((a,b)=>(a.createdAt?.seconds||0)-(b.createdAt?.seconds||0));
    let any=false;
    pubWeeks.forEach(w=>{
      // Match on skill when we have one. A Year 3 set and a Year 4 set put the same
      // skill at different slot numbers, so slot matching would show the wrong question.
      const q=(w.questions||[]).find(x=> d.skill ? skillOfQuestion(x)===d.skill : x.slot===d.slot);
      if(!q) return;
      const rec=S.results.find(r=>r.uid===d.uid && r.weekId===w.id);
      if(!rec) return;
      const ans=(rec.answers||[]).find(a=>a.qId===q.id);
      if(!ans) return;
      any=true;
      card.appendChild(el(`
        <div style="border-top:1px solid var(--paper-line);padding:10px 0;">
          <div class="meta" style="font-weight:700;">${esc(w.label)}</div>
          ${questionFaceHTML(q)}
          <div class="mmc-row" style="gap:16px;">
            <div style="color:${ans.correct?'var(--correct)':'var(--incorrect)'};font-weight:700;">Answered: ${esc(formatGivenAnswer(ans,q))}</div>
            <div class="meta">Correct: ${esc(formatCorrectAnswer(q))}</div>
          </div>
        </div>
      `));
    });
    if(!any) card.appendChild(el('<div class="meta">No attempts yet.</div>'));
    return card;
  }
  return null;
}

function renderLedgerSummary(){
  const wrap=el('<div></div>');
  const pubWeeks = S.weeks.filter(w=>isWeekLive(w) && weekInCurrentClass(w))
    .sort((a,b)=> (a.createdAt?.seconds||0)-(b.createdAt?.seconds||0));

  });

      const rec = S.results.find(r=>r.uid===uid && r.weekId===w.id);
      if(rec){ const pct = rec.total? rec.score/rec.total : 0; const cls = pct>=0.7?'good':(pct>=0.5?'mid':'low');
        sum+=pct; cnt++; tr.appendChild(el(`<td class="mmc-cellscore ${cls}">${rec.score}/${rec.total}</td>`)); }
      else {

// Whether a set is relevant to the class currently being viewed. Every other part of the
// gradebook is scoped to the selected class; the By Week picker was not, so a teacher
// looking at 3B was offered every Year 6 set they had ever made.
function weekInCurrentClass(w){
  if(S.showAllClasses || !S.currentClassId) return true;
  const ids = Array.isArray(w.classIds) ? w.classIds.filter(Boolean) : [];
  if(!ids.length) return true;              // aimed at every class, so it counts here too
  return ids.indexOf(S.currentClassId)!==-1;
}

function renderLedgerByWeek(){
  const wrap=el('<div></div>');
  const pubWeeks = S.weeks.filter(w=>isWeekLive(w) && weekInCurrentClass(w))
    .sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
  if(pubWeeks.length===0){
    wrap.appendChild(el(`<div class="mmc-empty">${
      S.showAllClasses ? 'No published sets yet.'
        : 'No published sets for '+esc(currentClassLabel())+' yet. Switch to another class, or All classes, to see others.'}</div>`));
    return wrap;
  }
  if(!S.gradebookWeekId || !pubWeeks.some(w=>w.id===S.gradebookWeekId)) S.gradebookWeekId=pubWeeks[0].id;

  const selectRow=el(`<div class="mmc-field" style="max-width:280px;margin-bottom:14px;"><label>Week</label>
    <select id="mmc-gb-week">${pubWeeks.map(w=>`<option value="${w.id}" ${w.id===S.gradebookWeekId?'selected':''}>${esc(w.label)}</option>`).join('')}</select></div>`);
  selectRow.querySelector('select').onchange=(e)=>{ S.gradebookWeekId=e.target.value; S.gradebookDetail=null; render(); };
  wrap.appendChild(selectRow);

  wrap.appendChild(el('<div class="meta" style="margin-bottom:10px;">Click any ✓ or ✗ to see the question and the student\'s answer.</div>'));
  // A bubble pinned over the grid rather than a panel below it. position:fixed is what
  // makes this work: the table wrapper scrolls, so anything inside it gets clipped, and a
  // fixed element is measured against the viewport instead.
  // Rendered outside the normal tree so it can float over the grid, which means a plain
  // re-render never removes it. Cleared explicitly, or they stack up.
  document.querySelectorAll('.mmc-qpop').forEach(x=>x.remove());
  const detail=renderGradebookDetail();
  if(detail && S.gradebookDetail && S.gradebookDetail.type==='week'){
    const a=S.gbAnchor;
    const bubble=el('<div class="mmc-qpop"></div>');
    bubble.appendChild(detail);
    // Inside #mmc, not on document.body. Every colour in this app is a CSS variable
    // declared on #mmc, so an element outside it has no value for --paper and the
    // background silently resolved to nothing. position:fixed still escapes the table's
    // clipping from in here, which was the only reason for using body.
    (document.getElementById('mmc') || document.body).appendChild(bubble);
    setTimeout(()=>{
      if(!a){ bubble.style.cssText='position:fixed;left:50%;top:80px;transform:translateX(-50%);'; return; }
      const bw=bubble.offsetWidth, bh=bubble.offsetHeight;
      // Above the cell by default. Below it if there is no room, which happens on the
      // first few rows.
      const above = a.y - bh - 14 > 8;
      const top = above ? a.y - bh - 12 : a.bottom + 12;
      let left = a.x - bw/2;
      left = Math.max(10, Math.min(left, window.innerWidth - bw - 10));
      bubble.style.left = left+'px';
      bubble.style.top = top+'px';
      bubble.classList.add(above?'up':'down');
      bubble.style.setProperty('--tipx', (a.x-left)+'px');
      bubble.style.opacity='1';
    },0);
    // Clicking away closes it. NOT with {once:true} on any click: clicking a second cell
    // ran the cell's own handler first and this one second, so the new bubble opened and
    // was cancelled in the same breath. That is why it worked only sometimes. A click on
    // another cell is now left alone for that cell to handle.
    const away=(e)=>{
      if(bubble.contains(e.target)) return;
      // Any clickable cell, not just the By Question one. Without this, clicking a second
      // cell ran this handler first, cleared the anchor, and the bubble reopened pinned to
      // nothing, which is why it jumped to the top of the screen after the first click.
      if(e.target.closest && e.target.closest('.mmc-cellbtn, .mmc-qbtn')) return;
      document.removeEventListener('click', away, true);
      S.gradebookDetail=null; S.gbAnchor=null; render();
    };
    setTimeout(()=>document.addEventListener('click', away, true), 0);
  }

  const week = pubWeeks.find(w=>w.id===S.gradebookWeekId);
  const qidToSlot={}; (week.questions||[]).forEach(q=>{ qidToSlot[q.id]=q.slot; });
  const studentUids = classFilteredStudentUids().sort((a,b)=>(S.profiles[a].displayName||'').localeCompare(S.profiles[b].displayName||''));
  if(studentUids.length===0){ wrap.appendChild(el('<div class="mmc-empty">No students yet.</div>')); return wrap; }

  const tableWrap=el('<div class="mmc-ledger-wrap"></div>');
  attachEdgeScroll(tableWrap, 'byweek');
  const table=el('<table class="mmc-ledger"></table>');
  const thead=el('<thead><tr></tr></thead>');
  const trh=thead.querySelector('tr');
  trh.appendChild(el('<th>Student</th>'));
  // Driven by the week's OWN questions, not a hardcoded 20. A 24-question week
  // was silently losing its last four columns. Hidden questions keep their
  // column, greyed, so the class record doesn't quietly change shape.
  const cols = (week.questions||[]).map((q,i)=>({ slot:q.slot||(i+1), title:q.title||('Q'+(i+1)), hidden:isQuestionHidden(week,q), n:i+1 }));
  cols.forEach(c=>trh.appendChild(el(
    `<th title="${esc(c.title)}${c.hidden?' (hidden from students)':''}"${c.hidden?' style="opacity:.4;"':''}>Q${c.n}</th>`)));
  trh.appendChild(el('<th>Overall</th>'));
  table.appendChild(thead);
  const tbody=el('<tbody></tbody>');
  studentUids.forEach(uid=>{
    const rec=S.results.find(r=>r.uid===uid && r.weekId===week.id);
    const tr=el('<tr></tr>');
    tr.appendChild(el(`<td>${esc(S.profiles[uid].displayName||uid)}</td>`));
    const work = answersForWeek(uid, week.id);
    if(!work){
      cols.forEach(c=>tr.appendChild(el(`<td style="color:var(--ink-soft);${c.hidden?'opacity:.4;':''}" title="Not started">-</td>`)));
      tr.appendChild(el('<td style="color:var(--ink-soft);" title="Not started">-</td>'));
    } else {
      // A dash now means one thing only: not started. A question a partway-through child
      // has not reached yet says INC, so a teacher can tell "wrong" from "not there yet".
      const bySlot={}; (work.answers||[]).forEach(a=>{ const slot=qidToSlot[a.qId]; if(slot) bySlot[slot]={correct:a.correct, qId:a.qId}; });
      for(const c of cols){
        const s=c.slot;
        const info=bySlot[s];
        if(!info){
          // A finished set cannot have an unanswered question: Finish is disabled until
          // every one is checked. So a gap here means the question was hidden from
          // students, and saying "not attempted" would blame a child for the teacher's
          // own setting.
          tr.appendChild(el(work.finished
            ? `<td style="color:var(--ink-soft);${c.hidden?'opacity:.4;':''}" title="${c.hidden?'Hidden from students':'Not shown to this student'}">-</td>`
            : `<td class="mmc-inc" title="Not reached yet">INC</td>`));
          continue;
        }
        const td=el('<td></td>');
        const btn=el(`<button type="button" class="mmc-cellbtn" style="background:none;border:none;cursor:pointer;font-weight:800;font-size:16px;color:${info.correct?'var(--correct)':'var(--incorrect)'};">${info.correct?'✓':'✗'}</button>`);
        btn.onclick=()=>{
          const wrapEl=btn.closest('.mmc-ledger-wrap');
          S.gbScrollLeft = wrapEl ? wrapEl.scrollLeft : 0;
          const r=btn.getBoundingClientRect();
          S.gbAnchor={ x:r.left+r.width/2, y:r.top, bottom:r.bottom };
          S.gradebookDetail={type:'week', uid, weekId:week.id, qId:info.qId};
          render();
        };
        td.appendChild(btn);
        tr.appendChild(td);
      }
      // The total column. `rec` only exists for a FINISHED set, and reading it for a
      // partway-through student threw and took the whole page down. A student still
      // working gets their score so far, marked as such rather than presented as a final
      // percentage that will change.
      if(work.finished && work.rec){
        const pct = work.rec.total ? Math.round((work.rec.score/work.rec.total)*100) : 0;
        const cls = pct>=70?'good':(pct>=50?'mid':'low');
        tr.appendChild(el(`<td class="mmc-cellscore ${cls}">${pct}%</td>`));
      } else {
        const right=(work.answers||[]).filter(a=>a.correct).length;
        const done=(work.answers||[]).length;
        tr.appendChild(el(`<td class="mmc-inprog" title="Still working. ${right} right out of ${done} so far">${right}/${done}</td>`));
      }
    }
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  tableWrap.appendChild(table);
  wrap.appendChild(tableWrap);
  return wrap;
}

// One place that decides which band a percentage falls in, so the colours can never
// disagree between the class average row and a student's own cell.
function qBand(pct){ return pct>=80 ? 'hi' : (pct>=50 ? 'mid' : 'lo'); }
// How far a student has got on a set they have not finished. Answers a question a blank
// cell cannot: away, or started and slow?
// Answers so far, finished or not. A half-done set used to contribute nothing at all, so
// ten questions a child had genuinely answered were invisible to their teacher.
function answersForWeek(uid, weekId){
  const rec=(S.results||[]).find(r=>r.uid===uid && r.weekId===weekId);
  if(rec) return { answers:(rec.answers||[]), finished:true, rec };
  const prog=(S.classProgress||[]).find(p=>p.uid===uid && p.weekId===weekId);
  if(!prog || !prog.quiz) return null;
  const answers=Object.keys(prog.quiz)
    .filter(qId=>prog.quiz[qId] && prog.quiz[qId].checked)
    .map(qId=>({ qId, correct:!!prog.quiz[qId].correct, given:prog.quiz[qId].given }));
  return answers.length ? { answers, finished:false, rec:null } : null;
}
function partialProgress(uid, weekId){
  const rec=(S.classProgress||[]).find(p=>p.uid===uid && p.weekId===weekId);
  if(!rec || !rec.quiz) return null;
  const done=Object.values(rec.quiz).filter(q=>q && q.checked).length;
  if(!done) return null;
  return { done, at: rec.updatedAt && rec.updatedAt.seconds ? rec.updatedAt.seconds*1000 : null };
}
// Move the pointer near either edge and the grid rolls that way. Written once so every
// wide table gets it: it only existed on By Question, and By Week is just as wide.
function attachEdgeScroll(tableWrap, key){
  // Remember and restore the sideways position. Every re-render builds a fresh table, so
  // without this a teacher who scrolled to Q23 was thrown back to Q1 by anything that
  // redrew the page, including opening a bubble.
  const k = key || 'default';
  if(!S.gbScroll) S.gbScroll={};
  const restore=()=>{
    const at=S.gbScroll[k];
    // Only once the table is actually wide enough to scroll. Restoring before the rows
    // are laid out silently does nothing, and the attempt is then never repeated.
    if(at && tableWrap.scrollWidth > tableWrap.clientWidth) tableWrap.scrollLeft=at;
  };
  requestAnimationFrame(()=>{ restore(); requestAnimationFrame(restore); });
  tableWrap.addEventListener('scroll', ()=>{
    // Never record a zero from a table that cannot scroll yet, or the first render wipes
    // the position we are trying to put back.
    if(tableWrap.scrollWidth <= tableWrap.clientWidth) return;
    S.gbScroll[k]=tableWrap.scrollLeft;
  }, {passive:true});
  let edgeTimer=null;
  const stopEdge=()=>{ if(edgeTimer){ cancelAnimationFrame(edgeTimer); edgeTimer=null; } };
  tableWrap.addEventListener('mousemove', (e)=>{
    // Frozen while a bubble is open, or the grid slides out from under it.
    if(S.gradebookDetail){ stopEdge(); return; }
    const r=tableWrap.getBoundingClientRect();
    const ZONE=56;
    const dl=e.clientX-r.left, dr=r.right-e.clientX;
    let dir=0, strength=0;
    if(dl<ZONE){ dir=-1; strength=(ZONE-dl)/ZONE; }
    else if(dr<ZONE){ dir=1; strength=(ZONE-dr)/ZONE; }
    stopEdge();
    if(!dir){ tableWrap.classList.remove('edge-l','edge-r'); return; }
    tableWrap.classList.toggle('edge-l', dir<0);
    tableWrap.classList.toggle('edge-r', dir>0);
    const step=()=>{
      // Gentler than before, and it eases in rather than starting at full speed: the
      // first version lurched the moment the pointer crossed the line.
      tableWrap.scrollLeft += dir * (0.4 + strength*strength*4.5);
      edgeTimer=requestAnimationFrame(step);
    };
    step();
  });
  tableWrap.addEventListener('mouseleave', ()=>{ stopEdge(); tableWrap.classList.remove('edge-l','edge-r'); });
}
function renderLedgerByQuestion(){
  const wrap=el('<div></div>');
  wrap.appendChild(el('<div class="meta" style="margin-bottom:12px;">Accuracy per skill, averaged across every published set each student has completed. Hover a column heading to see what the skill is. For a single question and what a student answered, use By Week.</div>'));

  const pubWeeks = S.weeks.filter(w=>isWeekLive(w) && weekInCurrentClass(w));
  const qidToSlotByWeek={};
  // Keyed by SKILL CODE, not slot number. Once Year 3 sets exist alongside Year 4 ones,
  // "Q5" means Factors in one and Addition in the other. The same column would have been
  // averaging two different skills together. Skill codes are stable across years, which is
  // what the registry was built for, and it means a child's Addition history follows them
  // from Year 3 into Year 4 instead of resetting.
  pubWeeks.forEach(w=>{ const m={}; (w.questions||[]).forEach(q=>{ m[q.id]=skillOfQuestion(q); }); qidToSlotByWeek[w.id]=m; });

  const studentUids = classFilteredStudentUids().sort((a,b)=>(S.profiles[a].displayName||'').localeCompare(S.profiles[b].displayName||''));
  if(studentUids.length===0){ wrap.appendChild(el('<div class="mmc-empty">No students yet.</div>')); return wrap; }

  const tableWrap=el('<div class="mmc-ledger-wrap"></div>');
  // Arrow buttons and shift+wheel, because dragging a scrollbar at the bottom of a long
  // table is the least discoverable control on the page.
  const nav=el('<div class="mmc-scrollnav"><button type="button" data-s="-1" title="Earlier questions">&lsaquo;</button><button type="button" data-s="1" title="Later questions">&rsaquo;</button></div>');
  nav.querySelectorAll('button').forEach(b=>{
    b.onclick=()=>{ tableWrap.scrollBy({left:(+b.dataset.s)*320, behavior:'smooth'}); };
  });
  wrap.appendChild(nav);
  attachEdgeScroll(tableWrap, 'byquestion');
  // The wheel is deliberately NOT hijacked. Taking over vertical scrolling over a table
  // is disorienting, and between the edge-hover and the arrow buttons there are already
  // two ways to move sideways.

  const table=el('<table class="mmc-ledger"></table>');
  const thead=el('<thead><tr></tr></thead>');
  const trh=thead.querySelector('tr');
  trh.appendChild(el('<th>Student</th>'));
  // Columns are the skills actually present in these students' sets, in plan order, so a
  // Year 3 class shows 16 columns and a Year 4 class shows 24. Never a grid of dashes for
  // skills that year never sees. A mixed class shows the union.
  const present = new Set();
  pubWeeks.forEach(w=>(w.questions||[]).forEach(q=>{ const c=skillOfQuestion(q); if(c) present.add(c); }));
  const ordered = [];
  [3,4].forEach(y=>planForYear(y).forEach(c=>{ if(present.has(c) && ordered.indexOf(c)===-1) ordered.push(c); }));
  present.forEach(c=>{ if(ordered.indexOf(c)===-1) ordered.push(c); });   // retired skills last
  const COLS = ordered;
  const SLOT_COUNT = COLS.length;
  // The skill name was already on a `title`, but nothing said so and the browser's own
  // tooltip takes about a second to appear. A dotted underline and a help cursor say
  // "there is more here", and the tooltip below shows instantly.
  COLS.forEach((code,i)=> trh.appendChild(el(
    `<th class="mmc-qhead" data-tip="${esc(skillTitle(code))}"><span>Q${i+1}</span></th>`)));
  table.appendChild(thead);
  const tbody=el('<tbody></tbody>');

  const avgRow=el('<tr style="background:var(--bg);font-weight:700;"></tr>');
  avgRow.appendChild(el('<td>Class average</td>'));
  COLS.forEach((code)=>{
    let avgCorrect=0, avgTotal=0;
    S.results.forEach(rec=>{
      const map=qidToSlotByWeek[rec.weekId]; if(!map) return;
      (rec.answers||[]).forEach(a=>{ if(map[a.qId]===code){ avgTotal++; if(a.correct) avgCorrect++; } });
    });
    if(avgTotal===0) avgRow.appendChild(el('<td style="color:var(--ink-soft);">-</td>'));
    else {
      const pct=Math.round((avgCorrect/avgTotal)*100);
      avgRow.appendChild(el(`<td class="mmc-q ${qBand(pct)}" title="${avgCorrect}/${avgTotal} correct across the class">${pct}%</td>`));
    }
  });
  tbody.appendChild(avgRow);

  studentUids.forEach(uid=>{
    const tr=el('<tr></tr>');
    tr.appendChild(el(`<td>${esc(S.profiles[uid].displayName||uid)}</td>`));
    // Finished sets AND the answered part of unfinished ones. A child ten questions into
    // this week's set has genuinely answered those ten, and they counted for nothing.
    const myWork = pubWeeks.map(w=>answersForWeek(uid, w.id) &&
      Object.assign({weekId:w.id}, answersForWeek(uid, w.id))).filter(Boolean);
    COLS.forEach((code,qi)=>{
      let correctCount=0, total=0;
      myWork.forEach(rec=>{
        const map=qidToSlotByWeek[rec.weekId]; if(!map) return;
        (rec.answers||[]).forEach(a=>{ if(map[a.qId]===code){ total++; if(a.correct) correctCount++; } });
      });
      if(total===0){ tr.appendChild(el('<td style="color:var(--ink-soft);">-</td>')); }
      else {
        const pct=Math.round((correctCount/total)*100);
        // NOT clickable. This column is an average across every set the class has ever
        // done, so there is no single question behind it to show. Opening one was
        // meaningful with one set and became nonsense with two. The skill name on the
        // header hover is the useful thing here; the specific question belongs in By Week,
        // where a cell really is one question.
        const td=el(`<td class="mmc-q ${qBand(pct)}"></td>`);
        const btn=el(`<span class="mmc-qbtn static" title="${esc(S.profiles[uid].displayName||uid)} · ${esc(skillTitle(code))} · ${correctCount} of ${total} correct across ${total===1?'1 set':'all sets'}">${pct}%</span>`);
        btn.onclick=()=>{
          // Remember the sideways position AND where on screen the cell is, so the bubble
          // can be pinned to it. Re-rendering used to reset the table to column one, so
          // clicking Q20 scrolled Q20 out of sight and the panel appeared somewhere else
          // entirely, with nothing connecting the two.
          const wrapEl=btn.closest('.mmc-ledger-wrap');
          S.gbScrollLeft = wrapEl ? wrapEl.scrollLeft : 0;
          const r=btn.getBoundingClientRect();
          S.gbAnchor={ x:r.left+r.width/2, y:r.top, bottom:r.bottom };
          // The column number, so the bubble can name what was clicked. This panel is
          // keyed by SKILL rather than slot, so there was no Q number to show and the
          // heading read "Q · Ordering whole numbers".
          S.gradebookDetail={type:'question', uid, skill:code, col:qi+1};
          render();
        };
        td.appendChild(btn);
        tr.appendChild(td);
      }
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  tableWrap.appendChild(table);
  wrap.appendChild(tableWrap);
  return wrap;
}


function exportCSV(pubWeeks, studentUids){
  const header=['Student name','Email', ...pubWeeks.map(w=>w.label), 'Average %'];
  const rows=[header];
  studentUids.forEach(uid=>{
    const row=[S.profiles[uid].displayName||'', S.profiles[uid].email||''];
    let sum=0, cnt=0;
    pubWeeks.forEach(w=>{ const rec=S.results.find(r=>r.uid===uid && r.weekId===w.id);
      if(rec){ row.push(`${rec.score}/${rec.total}`); sum+= rec.total? rec.score/rec.total:0; cnt++; } else row.push(''); });
    row.push(cnt? Math.round((sum/cnt)*100) : '');
    rows.push(row);
  });
  const csv=rows.map(r=>r.map(c=>{ const s=String(c); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='weekly-maths-club-results.csv';
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}

  const tableWrap=el('<div class="mmc-ledger-wrap"></div>');

      const best=at.reduce((b,a)=>a.score>b.score?a:b, at[0]); return `${best.score}/${best.attempted} (${best.accuracy}%)`; };
    const last=mine.slice().sort((a,b)=>(b.submittedAt?.seconds||0)-(a.submittedAt?.seconds||0))[0];
    const lastStr = last && last.submittedAt?.seconds ? new Date(last.submittedAt.seconds*1000).toLocaleDateString() : '-';
    const tier = computeBadgeInfo(mine, S.profiles[uid]).tier;
    const ins = computeTTInsights(mine);
    const top = ins.items[0];
    // Anything recorded before per-question tracking existed carries no detail, so an
    // empty cell means "not measured yet", not "nothing wrong". Say which.
    const focus = top ? esc(ttInsightShort(top))
      : (ins.hasData ? '<span style="color:var(--ink-soft);">nothing flagged</span>'
                     : '<span style="color:var(--ink-soft);">no data yet</span>');
    const tr=el(`<tr style="cursor:pointer;"><td>${esc(S.profiles[uid].displayName||uid)}</td><td>${tier.emoji} ${esc(tier.label)}</td><td>${focus}</td><td>${esc(bestOf('easy'))}</td><td>${esc(bestOf('medium'))}</td><td>${esc(bestOf('hard'))}</td><td>${mine.length}</td><td>${esc(lastStr)}</td></tr>`);
    tr.onclick=()=>{ S.ttDetailUid = (S.ttDetailUid===uid? null : uid); render(); };
    tbody.appendChild(tr);

  });
  table.appendChild(tbody);

  return wrap;
}

function overviewKeyFigures(res, tt, badge){
  const avg = res.length ? Math.round(res.reduce((s,r)=>s+(r.total? r.score/r.total:0),0)/res.length*100) : null;
  const ttAcc = badge.avgAccuracy;
  const last = [...res.map(r=>r.submittedAt?.seconds||0), ...tt.map(a=>a.submittedAt?.seconds||0)].sort((a,b)=>b-a)[0]||0;
  const days = last ? Math.floor((Date.now()/1000-last)/86400) : null;
  return [
    { label:'Sets completed', num:String(res.length), sub:'' },
    { label:'Average score', num: avg==null?'-':avg+'%', sub:'across all sets' },
    { label:'Fast facts', num:String(tt.length), sub:'sessions' },
    { label:'Timed accuracy', num: badge.total? ttAcc+'%' : '-', sub:'challenges only' },
    { label:'Last active', num: days==null?'-':(days<1?'Today':days===1?'Yesterday':days+'d'), sub: days==null?'never':'ago' },
  ];
}

function renderOverviewProfile(uid){
  const p=S.profiles[uid]||{};
  const name=p.displayName||uid;
  const first=String(name).split(/\s+/)[0];
  const res=(S.results||[]).filter(r=>r.uid===uid);
  const tt=(S.ttAttempts||[]).filter(a=>a.uid===uid);
  const badge=computeBadgeInfo(tt,p);
  const stats=computeSkillStats(res, S.weeks, (S.allSkillPracticeRecords||[]).filter(r=>r.uid===uid));
  const {strengths, weaknesses}=pickStrengthsAndWeaknesses(stats);
  const ttIns=computeTTInsights(tt);
  const wrap=el('<div></div>');

  wrap.appendChild(el(`<h3 style="margin:10px 0 2px;">${esc(name)}</h3>
    <div class="meta">${esc(yearLabel(studentYear(p)))}${p.group? ' · '+esc(groupLabel(p.group)):''} · Fast facts rank: ${esc(badge.tier.label)}${badge.pinnedBy? ' (pinned)':''}</div>`));

  const figs=el('<div class="mmc-ov-figs"></div>');
  overviewKeyFigures(res,tt,badge).forEach(f=>figs.appendChild(el(
    `<div class="mmc-ov-fig"><div class="mmc-ov-figlabel">${esc(f.label)}</div><div class="mmc-ov-fignum">${esc(f.num)}</div><div class="mmc-ov-figsub">${esc(f.sub)}</div></div>`)));
  wrap.appendChild(figs);

  // Suggested focus first. It is the reason a teacher opened this page.
  wrap.appendChild(el('<div class="mmc-ov-h">Suggested focus</div>'));
  const actions=[];
  weaknesses.slice(0,2).forEach(w=>actions.push(
    `${first} is at ${Math.round(w.overallAccuracy*100)}% on ${w.title.toLowerCase()} across ${w.total} question${w.total===1?'':'s'}. Set a targeted practice session, or hold that question back next set and teach it first.`));
  ttIns.items.slice(0,1).forEach(it=>actions.push(ttInsightSentence(first,it)+
    (it.kind==='turnaround'? '' : ` They can drill this under "Pick your own" on the Training Ground.`)));
  if(!res.length && !tt.length) actions.push(`${first} has not completed anything yet. Check they can sign in.`);
  if(!actions.length){
    // Say something useful rather than "nothing standing out", which reads as "no data"
    // when it actually means "nothing has crossed a threshold yet".
    const worst = stats.filter(x=>x.total>=1 && !(SKILLS[x.skill]&&SKILLS[x.skill].retired))
                       .sort((a,b)=>a.overallAccuracy-b.overallAccuracy)[0];
    if(worst && worst.overallAccuracy<0.85){
      actions.push(`${first} is working solidly overall. The weakest area so far is ${worst.title.toLowerCase()} at ${Math.round(worst.overallAccuracy*100)}% across ${worst.total} question${worst.total===1?'':'s'}. Worth a closer look once there's more to go on.`);
    } else if(res.length || tt.length){
      actions.push(`${first} is working solidly across the board. Nothing needs attention right now.`);
    }
  }
  actions.forEach(a=>wrap.appendChild(el(`<div class="mmc-ov-action">${esc(a)}</div>`)));

  const cols=el('<div class="mmc-ov-cols"></div>');
  const mkList=(title, rows, emptyMsg)=>{
    const box=el('<div></div>');
    box.appendChild(el(`<div class="mmc-ov-h" style="margin-top:14px;">${esc(title)}</div>`));
    if(!rows.length){ box.appendChild(el(`<div class="meta">${esc(emptyMsg)}</div>`)); return box; }
    const t=el('<table class="mmc-ov-list"><tbody></tbody></table>');
    rows.forEach(r=>t.querySelector('tbody').appendChild(el(
      `<tr><td>${esc(r.title)}</td><td>${esc(r.right)}</td></tr>`)));
    box.appendChild(t); return box;
  };
  // A student with one set completed clears no statistical threshold, so this page used to
  // say "no clear strengths yet" to a teacher looking at a child who had plainly been
  // working. That is technically correct and practically useless. When nothing qualifies,
  // show the best and worst anyway and label it as early. A teacher can weigh a small
  // sample themselves, but they cannot weigh a blank page.
  // Same rule as the student's own dashboard: nothing is claimed until there is enough to
  // claim it. A freshly created student showed "strengths so far" built from a single
  // paper, which is worse than showing nothing. A teacher could act on it.
  const setsDone = new Set((res||[]).map(r=>r.weekId)).size;
  if(setsDone < MIN_SETS_FOR_INSIGHT && tt.length < MIN_TT_FOR_INSIGHT){
    wrap.appendChild(el(`<div class="mmc-empty" style="margin-top:16px;">
      Nothing to report yet. ${esc(first)} has completed ${setsDone} practice set${setsDone===1?'':'s'} and ${tt.length} fast facts session${tt.length===1?'':'s'}. Feedback appears from ${MIN_SETS_FOR_INSIGHT} sets or ${MIN_TT_FOR_INSIGHT} fast facts sessions, so that what it says is worth acting on.</div>`));
    return wrap;
  }
  const withAny = stats.filter(x=>x.total>=1 && !(SKILLS[x.skill] && SKILLS[x.skill].retired));
  const early = strengths.length===0 && weaknesses.length===0 && withAny.length>0;
  const bySkill = withAny.slice().sort((a,b)=>b.overallAccuracy-a.overallAccuracy || b.total-a.total);
  const strengthRows = strengths.length
    ? strengths.map(x=>({title:x.title, right:Math.round(x.overallAccuracy*100)+'% of '+x.total}))
    : bySkill.filter(x=>x.overallAccuracy>=0.8).slice(0,4)
        .map(x=>({title:x.title, right:Math.round(x.overallAccuracy*100)+'% of '+x.total}));
  const growthRows = weaknesses.length
    ? weaknesses.map(x=>({title:x.title, right:Math.round(x.overallAccuracy*100)+'% of '+x.total}))
    : bySkill.slice().reverse().filter(x=>x.overallAccuracy<0.7).slice(0,4)
        .map(x=>({title:x.title, right:Math.round(x.overallAccuracy*100)+'% of '+x.total}));
  if(early) wrap.appendChild(el(`<div class="meta" style="margin-top:14px;">Early days. The figures below come from a small number of questions, so treat them as a first impression rather than a pattern.</div>`));
  cols.appendChild(mkList(early?'Strengths so far':'Strengths', strengthRows,
    'Nothing above 80% yet.'));
  cols.appendChild(mkList(early?'Watch these':'Growth areas', growthRows,
    'Nothing below 70%.'));
  wrap.appendChild(cols);

  // The fast-facts score table and the activity log are gone. A parent does not need to
  // know their child scored 74/91 on 7 August; they need to know what their child is good
  // at and what to help with. The scores are still on the Fast Facts gradebook tab for a
  // teacher who wants them.
  const strongFacts = ttStrongGroups(tt);
  const factWins = strongFacts.slice(0,4).map(g=>({ title:ttGroupLabel(g.op,g.table), right:g.accuracy+'% of '+g.seen }));
  const factWork = ttIns.items.map(it=>({
    title: it.kind==='turnaround' ? `${it.weak} (knows ${it.strong})` : ttGroupLabel(it.op,it.table),
    right: it.kind==='wrong' ? it.accuracy+'% of '+it.seen
         : it.kind==='slow'  ? it.seconds+'s each'
         : 'one way only' }));
  if(factWins.length || factWork.length){
    const cols2=el('<div class="mmc-ov-cols"></div>');
    cols2.appendChild(mkList('Fast facts. Secure', factWins, 'Not enough recorded yet.'));
    cols2.appendChild(mkList('Fast facts. Needs work', factWork, 'Nothing flagged.'));
    wrap.appendChild(cols2);
  } else {
    wrap.appendChild(el('<div class="mmc-ov-h">Fast facts</div>'));
    wrap.appendChild(el(`<div class="meta">${tt.length
      ? `${esc(first)} has done ${tt.length} session${tt.length===1?'':'s'}, but per-question tracking only started recently, so there is no breakdown yet. It will fill in over the next few sessions.`
      : `${esc(first)} has not done any fast facts practice yet.`}</div>`));
  }
  return wrap;
}

function renderTeacherActivity(){
  const wrap=el('<div></div>');
  const head=el('<div class="mmc-row" style="justify-content:flex-end;margin-bottom:12px;"></div>');
  head.appendChild(renderClassPicker());
  wrap.appendChild(head);
  const uids = classFilteredStudentUids();
  const inClass = (u)=>uids.indexOf(u)!==-1;
  const secs = (r)=> (r && r.submittedAt && r.submittedAt.seconds) ? r.submittedAt.seconds : 0;

  const feed = []
    .concat((S.ttAttempts||[]).filter(a=>inClass(a.uid)).map(a=>({
      uid:a.uid, t:secs(a), kind:'Fast facts',
      detail:`${esc(a.level||'')} · ${a.score}/${a.attempted} · ${a.accuracy}%` })))
    .concat((S.results||[]).filter(r=>inClass(r.uid)).map(r=>({
      uid:r.uid, t:secs(r), kind:'Practice set',
      detail:`${esc(r.weekLabel||'')} · ${r.score}/${r.total}` })))
    .concat((S.allSkillPracticeRecords||[]).filter(r=>inClass(r.uid)).map(r=>({
      uid:r.uid, t:secs(r), kind:'Own practice',
      detail:`${r.score}/${r.total}` })))
    .filter(x=>x.t).sort((a,b)=>b.t-a.t);

  if(!uids.length){
    wrap.appendChild(el('<div class="mmc-empty">No students yet. Add some from the Students tab.</div>'));
    return wrap;
  }

  const now=Date.now()/1000, DAY=86400;
  const active7=new Set(feed.filter(x=>now-x.t<=7*DAY).map(x=>x.uid));
  const afterHours=feed.filter(x=>{
    if(now-x.t>7*DAY) return false;
    const d=new Date(x.t*1000), h=d.getHours(), dy=d.getDay();
    return dy===0||dy===6||h<8||h>=16;
  });
  const quiet=uids.filter(u=>!active7.has(u));

  wrap.appendChild(el(`<div class="mmc-card">
    <div class="mmc-row" style="gap:0;align-items:stretch;">
      <div style="flex:1;min-width:120px;padding-right:20px;">
        <div class="meta" style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px;">Active this week</div>
        <div class="mmc-stat-num" style="font-size:27px;">${active7.size}<span style="font-size:16px;color:#8A8880;"> / ${uids.length}</span></div>
      </div>
      <div style="flex:1;min-width:120px;padding:0 20px;border-left:1px solid #EEECE7;">
        <div class="meta" style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px;">Practising at home</div>
        <div class="mmc-stat-num" style="font-size:27px;">${new Set(afterHours.map(x=>x.uid)).size}</div>
      </div>
      <div style="flex:1;min-width:120px;padding-left:20px;border-left:1px solid #EEECE7;">
        <div class="meta" style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px;">Quiet 7 days</div>
        <div class="mmc-stat-num" style="font-size:27px;">${quiet.length}</div>
      </div>
    </div>
  </div>`));

  const lastSeen = {};
  feed.forEach(x=>{ if(!lastSeen[x.uid] || x.t>lastSeen[x.uid]) lastSeen[x.uid]=x.t; });
  const ago=(t)=>{
    if(!t) return 'Never';
    const d=Math.floor((now-t)/DAY);
    return d<1?'Today':d===1?'Yesterday':`${d} days ago`;
  };
  const sorted=uids.slice().sort((a,b)=>(lastSeen[a]||0)-(lastSeen[b]||0));
  wrap.appendChild(el('<h3 style="margin:20px 0 8px;">Who\'s gone quiet</h3>'));
  const lw=el('<div class="mmc-ledger-wrap"></div>');
  const lt=el('<table class="mmc-ledger"><thead><tr><th>Student</th><th>Last seen</th><th>Activities</th><th>Outside school hours</th></tr></thead><tbody></tbody></table>');
  const lb=lt.querySelector('tbody');
  sorted.forEach(u=>{
    const mine=feed.filter(x=>x.uid===u);
    const oh=afterHours.filter(x=>x.uid===u).length;
    const stale=!lastSeen[u] || (now-lastSeen[u])>7*DAY;
    lb.appendChild(el(`<tr><td>${esc((S.profiles[u]&&S.profiles[u].displayName)||u)}</td>
      <td${stale?' style="color:#B3352F;font-weight:700;"':''}>${esc(ago(lastSeen[u]))}</td>
      <td>${mine.length}</td><td>${oh}</td></tr>`));
  });
  lw.appendChild(lt); wrap.appendChild(lw);

  if(feed.length){
    wrap.appendChild(el('<h3 style="margin:20px 0 8px;">Recent activity</h3>'));
    const rw=el('<div class="mmc-ledger-wrap"></div>');
    const rt=el('<table class="mmc-ledger"><thead><tr><th>When</th><th>Student</th><th>What</th><th>Detail</th></tr></thead><tbody></tbody></table>');
    const rb=rt.querySelector('tbody');
    feed.slice(0,60).forEach(x=>{
      rb.appendChild(el(`<tr><td>${esc(new Date(x.t*1000).toLocaleString())}</td>
        <td>${esc((S.profiles[x.uid]&&S.profiles[x.uid].displayName)||x.uid)}</td>
        <td>${esc(x.kind)}</td><td>${x.detail}</td></tr>`));
    });
    rw.appendChild(rt); wrap.appendChild(rw);
  }
  return wrap;
}

function exportTTCSV(studentUids){
  // Extended, not replaced: the best-score columns were already here and teachers may
  // rely on them. The focus columns are appended so an existing sheet still lines up.
  const header=['Student','Best Easy','Best Medium','Best Hard','Total attempts','Focus 1','Focus 2','Focus 3','Detail'];
  const rows=[header];
  studentUids.forEach(uid=>{
    const mine=S.ttAttempts.filter(a=>a.uid===uid);
    const bestOf=(lvl)=>{ const at=mine.filter(a=>a.level===lvl); if(!at.length) return '';
      const best=at.reduce((b,a)=>a.score>b.score?a:b, at[0]); return `${best.score}/${best.attempted} (${best.accuracy}%)`; };
    const name=S.profiles[uid].displayName||uid;
    const first=String(name).split(/\s+/)[0];
    const ins=computeTTInsights(mine);
    const f=[0,1,2].map(i=>ins.items[i]? ttInsightShort(ins.items[i]) : '');
    const detail=ins.items.map(it=>ttInsightSentence(first,it)).join(' ');
    rows.push([name, bestOf('easy'), bestOf('medium'), bestOf('hard'), mine.length, f[0], f[1], f[2], detail]);
  });
  const csv=rows.map(r=>r.map(c=>{ const s=String(c); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='timetable-challenge-results.csv';
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}

async function resetStudentPassword(uid, displayName, btnEl){
  if(!confirm(`Reset the password for ${displayName}? Their old password will stop working immediately.`)) return;
  const originalText = btnEl ? btnEl.textContent : '';
  if(btnEl){ btnEl.disabled=true; btnEl.textContent='Resetting…'; }
  try{
    const call = httpsCallable(functions, 'resetStudentPassword');
    const res = await call({ uid });
    S.resetPasswordResult = { displayName: (res.data&&res.data.displayName)||displayName, username: res.data&&res.data.username, password: res.data&&res.data.password };
    if(S.profiles[uid]) S.profiles[uid].currentPassword = res.data&&res.data.password;
  }catch(e){
    S.toast = 'Could not reset password: '+(e.message||'unknown error')+'make sure the Cloud Function is deployed.';
  }
  if(btnEl){ btnEl.disabled=false; btnEl.textContent=originalText; }

// How much work a student would lose. A typo in a class list is the common case and there
// is nothing to protect; a child with a term of results behind them is a different matter.
function studentWorkCount(uid){
  const n = (S.results||[]).filter(r=>r.uid===uid).length
          + (S.ttAttempts||[]).filter(a=>a.uid===uid).length
          + (S.allSkillPracticeRecords||[]).filter(r=>r.uid===uid).length;
  return n;
}
async function deleteStudentAccount(uid, displayName, btnEl){
  // Typing a name to delete an empty account is friction that protects nothing. The
  // barrier should match what is actually at stake.
  const work = studentWorkCount(uid);
  if(work===0){
    if(!confirm(`Delete ${displayName}?\n\nThey have not done any work yet, so there is nothing to lose. Their login stops working straight away.`)) return;
  } else {
    const typed = prompt(`${displayName} has ${work} recorded result${work===1?'':'s'}. Deleting removes their login AND every one of those records. This cannot be undone.\n\nType their name exactly ("${displayName}") to confirm:`);
    if(typed!==displayName) { if(typed!==null) alert('Name did not match exactly. Nothing was deleted.'); return; }
  }
  const originalText = btnEl ? btnEl.textContent : '';
  if(btnEl){ btnEl.disabled=true; btnEl.textContent='Deleting…'; }
  try{
    const call = httpsCallable(functions, 'deleteStudent');
    await call({ uid });
    if(S.profiles[uid]) delete S.profiles[uid];
  }catch(e){
    S.toast = 'Could not delete student: '+(e.message||'unknown error');
  }
  if(btnEl){ btnEl.disabled=false; btnEl.textContent=originalText; }
  render();
}
